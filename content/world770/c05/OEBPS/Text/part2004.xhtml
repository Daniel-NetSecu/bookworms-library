  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">58</h1>

  <p class="kindle-cn-poem-left1">天神当初就指定我做奴隶，<br/>
  并禁止我限制你享受欢乐，<br/>
  他不让我计较你如何度日：<br/>
  既是奴隶，我只配听你发落。<br/>
  噢，让我在你的支配下忍受<br/>
  被囚的孤独，任你活得自在；<br/>
  我有这耐心，你尽可骂个够，<br/>
  我绝不抱怨，说你把我伤害。<br/>
  你去哪里都行，你有此权利，<br/>
  完全可以凭意志安排时间，<br/>
  做任何事情，无人能责怪你，<br/>
  你所犯的罪，你自己能赦免。<br/>
  　　等待是地狱，但我仍要等待，<br/>
  　　我不谴责你享乐，无论好歹。</p>
