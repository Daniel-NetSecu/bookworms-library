<p class="title1" id="CHP65">LESSON 62</p>
<p class="picture"><img src="../Images/image01610.jpeg.webp" alt="alt"/></p>
<p class="normaltext">Do you see Nell?</p>
<p class="normaltext">Yes, she has a pan with some eggs in it.</p>
<p class="normaltext">Let me have the pan and the eggs, will you, Nell?</p>
<p class="normaltext">Has the black hen left the nest?</p>
<p class="normaltext">I will now run to catch Rab. Will you run, too?</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">你看见内尔了吗？</p>
<p class="normaltext">是的，她拿着一个盘子，里面有些鸡蛋。</p>
<p class="normaltext">把盘子和鸡蛋给我好吗，内尔？</p>
<p class="normaltext">那只黑色的母鸡离开鸡窝了吗？</p>
<p class="normaltext">我现在要跑过去抓住拉波。你也跟我一起去吗？</p>
