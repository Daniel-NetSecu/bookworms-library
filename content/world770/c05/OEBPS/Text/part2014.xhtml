  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">68</h1>

  <p class="kindle-cn-poem-left1">他的脸是地图，绘出了古代，<br/>
  美如花朵，在那里生长、萎枯，<br/>
  那时，美的私生子未出娘胎，<br/>
  更别说在活人头顶上安居；<br/>
  死人头上那一簇簇金卷发，<br/>
  也没被人剪下，没有被移植，<br/>
  任它享受二次生命的光华：<br/>
  坟墓的利益，没有重现天日。<br/>
  但在他脸上，无须半点装饰，<br/>
  就已显示出古代，切切真真，<br/>
  他的夏，不依赖别人的绿色，<br/>
  他的美，用不着再掠夺死人。<br/>
  　　造化收藏他，想叫他当地图，<br/>
  　　好让人认清真美，缅怀过去。</p>
