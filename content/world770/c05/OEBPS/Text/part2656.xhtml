  <title>母山羊的胡须</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">母山羊的胡须</h1>

  <p>应母山羊的要求，朱庇特让她们长了胡须，而公山羊认为这是对他们权力和尊严的无礼侵犯。于是他们派出一个使团前去找朱庇特抗议。而朱庇特却建议他们不要反对。“那一丛毛有什么用？如果她们想要，就让她们要吧。在力量上，她们永远都无法和你们匹敌。”</p>
