<h1 class="title1">内容简介</h1>
<p class="normaltext">1647年，贝弗利家的四个孩子——爱德华、汉弗莱、艾丽斯和小伊迪丝——正藏在新森林里。这时，英国国王被关在狱中，全国各地都在打仗——克伦威尔的人和国王的人打仗。而如果你是支持国王的，你可就极度危险了。</p>
<p class="normaltext">孩子们的父亲为国王作战时牺牲了，他们的母亲也死了，克伦威尔的士兵烧了他们的家，他们没有钱，没有食物，什么都没有了。但是他们有个真正的朋友——老雅各布·阿米蒂奇。所以现在，在雅各布的帮助下，他们必须学会靠土地生活——学习在森林里猎食，学习种菜，学习喂猪养鸡。</p>
<p class="normaltext">但是到处都是克伦威尔的人，孩子们必须学会永远不能说出他们是姓贝弗利……</p>
