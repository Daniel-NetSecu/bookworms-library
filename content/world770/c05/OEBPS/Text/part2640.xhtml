  <title>牧童和狼</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">牧童和狼</h1>

  <p>有一个牧羊人的儿子，在村子附近放牧，觉得假装狼攻击了羊群来骗骗村民应该挺有乐子的，所以便大叫：“狼来了！狼来了！”等人们纷纷跑来，他大肆嘲笑他们白费了一番力气。后来他又故技重演，村民们都发现自己被耍了，因为根本没有狼。后来有一天，狼真的来了，男孩大叫：“狼来了！狼来了！”他费尽力气，叫破了喉咙，而村民却都已经听而不闻，根本没有理会。所以狼一路横行无阻，好整以暇地吃了一只又一只羊。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：骗子讲真话，也不会有人信。</p>
