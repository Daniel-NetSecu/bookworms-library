<p class="title1" id="CHP27">LESSON 24</p>
<p class="picture"><img src="../Images/image01570.jpeg.webp" alt="alt"/></p>
<p class="normaltext">The ship has run on a rock.</p>
<p class="normaltext">Five men are on the ship.</p>
<p class="normaltext">If the boat can not get to them, they will drown.</p>
<p class="normaltext">The boat has brave men in it.</p>
<p class="normaltext">They will save the five men.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">那艘大船触礁了。</p>
<p class="normaltext">船上有五个人。</p>
<p class="normaltext">如果那条小船无法到达那里，大船上的五个人就会被淹死。</p>
<p class="normaltext">小船上的人很勇敢。</p>
<p class="normaltext">他们要救下那五个人。</p>
