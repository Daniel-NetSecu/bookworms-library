<h1 class="title1">内容简介</h1>
<p class="normaltext">是什么使一座城市异于另一座城市呢？是建筑、气候还是人？城市是由人塑造成的，要想了解一个城市，就必须要了解那个城市的人，了解他们的喜与悲以及他们日常生活的点点滴滴。</p>
<p class="normaltext">20世纪初期，在纽约生活的是怎样一群人呢？现在的纽约人和一百年前有没有不同？岁月流逝，城市越来越大，新的建筑拔地而起，旧的建筑倒下，大大小小的汽车取代了马车，时尚也在变化，但人没有变。这些故事里的纽约人各不相同，但不论是流浪者还是律师，他们的希望同样重要；不论是女招待还是女演员，她们的爱情也同样动人。而且我们可以看到，尽管时光飞逝，人们的希望、担忧和梦想并没有改变。</p>
