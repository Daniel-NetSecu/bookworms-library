  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">45</h1>

  <p class="kindle-cn-poem-left">对那些定要离开的客人们，求神帮他们快走，<br/>
  并且扫掉他们所有的足迹。<br/>
  把舒服的、单纯的、亲近的微笑着一起抱在你的怀里。<br/>
  今天是幻影的节日，他们不知道自己的死期。<br/>
  让你的笑声只作为无意义的欢乐，像浪花上的闪光。<br/>
  让你的生命像露珠在叶尖一样，在时间的边缘上轻轻跳舞。<br/>
  在你的琴弦上弹出无定的暂时的音调吧。</p>
