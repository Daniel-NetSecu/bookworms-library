  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">14</h1>

  <p class="kindle-cn-poem-left1">我不凭星象决定我的判断，<br/>
  虽然星象学我也略知粗浅；<br/>
  我不会预言人间时运灾患，<br/>
  包括瘟疫、饥荒和季候变迁；<br/>
  我不会掐算人的分分秒秒，<br/>
  预测不了何时有雷电风雨；<br/>
  我不能凭天上出现的征兆，<br/>
  就妄言帝王们的命运天数。<br/>
  但我从你的眼睛得到启示，<br/>
  你那两颗恒星已经在声明：<br/>
  只要你愿意存储起你自己，<br/>
  真就将与美结盟，蓬勃而生。<br/>
  　　否则，我可以这样宣告未来：<br/>
  　　你一死，真与美将不复存在。</p>
