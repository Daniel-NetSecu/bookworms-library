  <title>鹰、寒鸦和牧羊人</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">鹰、寒鸦和牧羊人</h1>

  <p>有一天，一只寒鸦看到一只老鹰俯冲下去，用爪子抓住一只小羊羔。寒鸦说：“我看哪，我也可以做到。”所以，它也高飞到空中，然后扑扇着翅膀飞向了一头大公羊，它一落下来，爪子便紧紧地抓住了羊毛，但是却什么也做不了，它的爪子被羊毛缠住了，它扇动翅膀，但却越陷越深。最后，牧羊人来了，说：“噢，看看你做了什么！”他抓住了寒鸦，捆住它的翅膀，带回家给孩子们玩。寒鸦的样子看上去很奇怪，孩子们不知道它是什么。“这是什么鸟，爸爸？”爸爸回答说：“这是一只寒鸦，只是一只寒鸦，不过它希望自己被当成一只鹰。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：如果你想做超乎自己能力的事情，你的付出都会白费，结局注定不幸或是荒谬。</p>
