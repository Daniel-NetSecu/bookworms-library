<h1 class="calibre22" id="calibre_pb_206">第四节</h1>

      <p class="x5">这些加工过程的必要性，带来了产品与劳动的交换。</p>

      <p class="x6">同样的动因，既促成了种植不同作物的土地耕种者之间的产品交换，也必定带来了土地耕种者与社会另一部分成员之间产品与劳动的交换，这一部分成员宁可从事农产品的生产加工，也不愿耕种土地。每个人都从这种交换中获益，因为每个人都专注于一种特定的工作，这样就可以做得更好。农夫从他的土地里获得能够产出的最大数量的产品，通过用剩余产品进行交换，他可以更容易获得所有其他想要的东西，比他自己制作要容易得多。鞋匠通过为农夫制作鞋子，可以获得后者收成的一部分。每一个工人都为了满足其他行业工人的需要而劳动，而其他行业的工人也同样为了他的需要而劳动。</p><a id="Section_cn_5"></a>
