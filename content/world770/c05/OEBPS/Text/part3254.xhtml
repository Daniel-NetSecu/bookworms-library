  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">岁月</h1>

  <p class="kindle-cn-poem-left">它们像动物从冬青的外层<br/>
  空间进入，那里的长枝头<br/>
  不是我感兴趣的思想，像瑜伽修行者，<br/>
  但绿色、黑暗如此纯粹<br/>
  它们凝固，它们存在。<br/>
  <br/>
  唉，上帝，我不像你<br/>
  在你空虚的黑色中，<br/>
  星星到处粘住，鲜艳愚蠢的五彩碎纸。<br/>
  我厌倦永恒，<br/>
  我从未想要它。<br/>
  <br/>
  我所爱的是<br/>
  运转中的活塞——<br/>
  我的灵魂死于此前。<br/>
  还有马群的马蹄声，<br/>
  它们无情地翻腾。<br/>
  <br/>
  而你，伟大的停滞——<br/>
  停滞中什么算是伟大！<br/>
  是一只老虎，今年，在门口吼叫？<br/>
  还是救世主，<br/>
  可恶的<br/>
  <br/>
  上帝咬着了他<br/>
  渴望飞翔，与之同归于尽？<br/>
  血红莓子是它们自己，它们非常寂静。<br/>
  马蹄声不会停息，<br/>
  在蓝色的远处，活塞嘶嘶作响。</p>
