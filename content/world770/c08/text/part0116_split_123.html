<h1 class="calibre22" id="calibre_pb_225">第二十三节</h1>

      <p class="x5">随着所谓真正的奴隶制的出现，奴隶被束缚在了土地上。</p>

      <p class="x6">最初进行土地耕种的第一代奴隶的后代，改变了自己的生存状态。国家之间的内部和平，导致没有足够的奴隶供应来满足对奴隶的消费需求，奴隶主不得不更好地关照自己的奴隶。那些在奴隶主家中出生的奴隶，从小就适应了自己的生活状态，很少反抗，他们的主人也就不需要花太多的力气去管束他们。渐渐地，他们耕种的土地变成了他们自己的国家，他们成为了国家的一分子，最终，他们从自己的主人那里感受到了信心和仁慈。</p><a id="Section_cn_24"></a>
