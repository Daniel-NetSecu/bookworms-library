<h1 class="calibre22" id="calibre_pb_251">第四十九节</h1>

      <p class="x5">剩余的年产品积累形成资本。</p>

      <p class="x6">从人类诞生的那天起，他们所拥有的土地财产就确保他们的年收入足以满足所有的需求，而其中有些人因为对于未来感到不安，或者只是出于长远考虑，于是将每年收入的一部分储存起来，或者是为了预防可能发生的意外，或者为了让自己更好地享受。当获得的商品不易储存时，他们就会兑换成持久耐用的物品，这样就不会随着时间而贬值，或者兑换成能够获取利润的物品，获取的利润在弥补贬值带来的损失后还有盈余。</p><a id="Section_cn_50"></a>
