  <title>老鼠、青蛙和鹰</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">老鼠、青蛙和鹰</h1>

  <p>有一只老鼠和一只青蛙成了好朋友，但是他们并不常在一起，因为老鼠完全生活在陆地上，而青蛙是两栖动物，有时候在陆地上安家，有时候居住在水中。为了能够一直在一起，青蛙用一根绳子将自己和老鼠的腿绑在了一起。他们在陆地上时，一切都非常好，而到了池塘边缘的时候，青蛙一跃而入，老鼠被他带下了水。青蛙在水中游来游去，高兴地呱呱叫，而可怜的老鼠很快便被淹死了，漂在水面上，被青蛙拖着。这时，一只鹰看到了老鼠，俯冲下来，将老鼠抓在爪子中。而青蛙却没有办法松开绑住他和老鼠的绳结，于是也被鹰抓走吃掉了。</p>
