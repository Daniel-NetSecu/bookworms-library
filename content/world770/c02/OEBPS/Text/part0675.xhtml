  <h2 class="EB04MainHeadClosedTitle">年迈的狮子</h2>

  <p class="EB03BodyTextIndented">一只狮子，随着年龄的增长变得衰弱无力。他不再能够凭借武力获得食物，便决定用诡计给自己弄点食物。他走到山洞里，躺在那儿，假装病了。每当有动物进去询问他的身体状况时，他就一跃而起，把他们吞入腹中。</p>

  <p class="EB03BodyTextIndented">许多动物都以这种方式丧了命。直到有一天，一只狐狸来到这个山洞。因为怀疑狮子是不是真的病了，所以他并没有走进去，而是站在山洞外，问狮子感觉怎么样。狮子回答说，他感觉很不好。“但是，”他说，“你为什么站在外面呢？请进来吧。”</p>

  <p class="EB03BodyTextIndented">“我本该这么做，”狐狸回答说，“如果我没注意到这些脚印只有进没有出的话。”</p>
