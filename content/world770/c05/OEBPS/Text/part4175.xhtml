  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">95</h1>

  <p>当我刚跨过此生的门槛的时候，我并没有发觉。</p>

  <p>是什么力量使我在这无边的神秘中开放，像一朵嫩蕊，</p>

  <p>中夜在森林里开花！</p>

  <p>早起我看到光明，我立时觉得在这世界里我不是一个生人，</p>

  <p>那不可思议、不可名状的，已以我自己母亲的形象，</p>

  <p>把我抱在怀里。</p>

  <p>就是这样，在死亡里，</p>

  <p>这同一的不可知者又要以我熟识的面目出现。</p>

  <p>因为我爱今生，我知道我也会一样地爱死亡。</p>

  <p>当母亲从婴儿口中拿开右乳的时候，</p>

  <p>他就啼哭，但他立刻又从左乳得到了安慰。</p>
