<h1 class="calibre22" id="calibre_pb_283">第八十一节</h1>

      <p class="x5">节俭精神使资本数量不断增加，而奢侈浪费则不断地消耗资本。</p>

      <p class="x6">任何国家中的节俭精神都会使资本的数量增加，使贷款人的数量增加，而使借款人的数量减少。而奢侈浪费的习惯却起着完全相反的作用，根据前面对于资本在所有企业中的使用所作的论述，不管是在农业、制造业，还是在商业中，我们都可以判断出奢侈浪费会使一个国家更富有，还是更贫穷。</p><a id="Section_cn_82"></a>
