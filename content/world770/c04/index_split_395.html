</p><p class="calibre_"><span class="calibre6">勇斗剑齿虎</span></p><p class="calibre_65"><span class="calibre2">神奇树屋·故事系列·基础版#7</span></p><p class="calibre_12"><span class="calibre2">[美] 玛丽·波·奥斯本/著</span></p><p class="calibre_66"><span class="calibre2">[美] 萨尔·莫多卡/绘</span></p><hr class="calibre7"/><blockquote class="calibre_67"><span class="calibre2"><span class="bold">内容简介:</span></span></blockquote><blockquote class="calibre_68"><span class="calibre2">这一次，兄妹俩乘着神奇树屋来到亚马孙热带雨林，遇见神经兮兮的猴子、凶猛残暴的鳄鱼、顶级猎食者美洲虎还有传说中的吸血蝙蝠… 经历了雨林历险之后，两人能成功找到第二样东西、帮助仙女摩根破解她身上的魔法吗？</span></blockquote><div class="mbp_pagebreak" id="calibre_pb_395"></div>
