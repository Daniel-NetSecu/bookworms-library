  <title>丽达与天鹅</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">丽达与天鹅</h2>

  <p class="EB03BodyTextIndented">猛然一击，巨大的双翼仍拍打着</p>

  <p class="EB03BodyTextIndented">在晃动的女孩上方，她的双腿</p>

  <p class="EB03BodyTextIndented">被黑色的蹼爱抚，她的颈背叼在他的喙里，</p>

  <p class="EB03BodyTextIndented">他用他的胸包裹住她无助的胸脯。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">那些惊吓未定的手指如何</p>

  <p class="EB03BodyTextIndented">将多羽的荣耀推离她松开的双腿？</p>

  <p class="EB03BodyTextIndented">那躺在白色激流中的身体</p>

  <p class="EB03BodyTextIndented">怎能不感到他身下奇异的心跳？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">腰部的一次战栗引发</p>

  <p class="EB03BodyTextIndented">城墙的坍塌、屋顶和塔楼的焚毁，</p>

  <p class="EB03BodyTextIndented">以及阿伽门农的死。</p>

  <p class="EB03BodyTextIndented">　　　　　　　被如此捕捉，</p>

  <p class="EB03BodyTextIndented">被空中野蛮的血如此控制，</p>

  <p class="EB03BodyTextIndented">她是否从他的力量中吸取了他的知识，</p>

  <p class="EB03BodyTextIndented">在那冷漠的喙放开她之前？</p>

  <p class="right">1923年</p>
