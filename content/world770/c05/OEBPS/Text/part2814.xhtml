  <title>蝙蝠、荆棘和海鸥</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">蝙蝠、荆棘和海鸥</h1>

  <p>蝙蝠、荆棘和海鸥成了朋友，决定一起出海旅行。为了这次冒险，蝙蝠借了一些钱，荆棘带上了各种各样的衣服，而海鸥则带了铅锤，然后他们就出门了。结果，没多久，他们遇上了一场暴风雨，他们的船和上面的货物全都沉到了海底。不过三个旅行者挣扎着爬上了岸。从那以后，海鸥便总是在海面上飞来飞去，时不时地潜入水下，想要寻找自己丢了的铅锤。而蝙蝠害怕遇到债主，便总是白天藏起来，夜晚才会出门。荆棘则把每一个过路人的衣服挂住，希望有一天能够重获失去的衣服。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：相比去获得自己所缺少的东西，人们总是更期望重新找回失去的东西。</p>
