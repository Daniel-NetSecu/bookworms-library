  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">70</h1>

  <p>这欢欣的音律不能使你欢欣吗？</p>

  <p>不能使你回旋激荡，消失碎裂在这可怖的快乐旋转之中吗？</p>

  <p>万物急遽地前奔，它们不停留也不回顾，</p>

  <p>任何力量都不能挽住它们，它们急遽地前奔。</p>

  <p>季候应和着这急速不宁的音乐，跳舞着来了又去——</p>

  <p>颜色、声音、香味在这充溢的快乐里，</p>

  <p>汇注成奔流无尽的瀑泉，时时刻刻地在散溅、退落而死亡。</p>
