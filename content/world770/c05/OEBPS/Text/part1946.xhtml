  <p class="kindle-cn-para-align-center"><span class="kindle-cn-specialtext-kaiti">谨将下列之十四行诗<br/>
  献给唯一的促成者<br/>
  W. H.先生<br/>
  祝他<br/>
  幸福无疆，并享有<br/>
  我们不朽的诗人<br/>
  所许诺的<br/>
  千古美名。<br/>
  善意而冒昧的<br/>
  刊行者</span></p>
