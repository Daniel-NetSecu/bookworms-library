  <title>THE LITTLE BOY LOST</title>

  <h2 class="EB04MainHeadClosedTitle">THE LITTLE BOY LOST</h2>

  <p class="EB03BodyTextIndented">‘Father, father, where are you going?</p>

  <p class="EB03BodyTextIndented">O do not walk so fast.</p>

  <p class="EB03BodyTextIndented">Speak, father, speak to your little boy</p>

  <p class="EB03BodyTextIndented">Or else I shall be lost.’</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">The night was dark, no father was there;</p>

  <p class="EB03BodyTextIndented">The child was wet with dew.</p>

  <p class="EB03BodyTextIndented">The mire was deep, &amp; the child did weep</p>

  <p class="EB03BodyTextIndented">And away the vapour flew.</p>
