<p class="title1" id="CHP12">LESSON 9</p>
<p class="picture"><img src="../Images/image01552.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>See the nag!</td>
    <td>瞧，这匹马！</td>
  </tr>
  <tr>
    <td>It is Tom's nag.</td>
    <td>这是汤姆的马。</td>
  </tr>
  <tr>
    <td>Can Tom catch his nag?</td>
    <td>汤姆能追上他的马吗？</td>
  </tr>
  <tr>
    <td>He can not catch him.</td>
    <td>他追不上它。</td>
  </tr>
  <tr>
    <td>The dog ran at the nag,</td>
    <td>狗向那匹马跑去，</td>
  </tr>
  <tr>
    <td>and the nag ran.</td>
    <td>马在奔跑。</td>
  </tr>
</table>
