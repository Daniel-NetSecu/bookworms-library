  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">99<span class="math-super"><a id="a01" href="part2045.xhtml#b01">[1]</a></span></h1>

  <p class="kindle-cn-poem-left1">我如此斥责傲慢的紫罗兰：<br/>
  “若不是偷自我爱人的呼吸，<br/>
  好贼子，你哪来如此的香妍？<br/>
  留驻你嫩颊上的那抹艳丽<br/>
  一定浸染过我爱人的血液。”<br/>
  我还谴责百合盗取你的手，<br/>
  墨角兰已对你的须发行劫；<br/>
  刺茎上的玫瑰在瑟瑟颤抖，<br/>
  红的由于害羞，白的因绝望。<br/>
  不红不白的，贼手伸得更远，<br/>
  而且偷盗了你呼出的气息；<br/>
  正当它蓬勃而生，得意非凡，<br/>
  蛀虫出来报仇，置它于死地。<br/>
  　　世间美艳的鲜花，可谓多多，<br/>
  　　不盗你而具香色，我未见过。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="b01" href="part2045.xhtml#a01">[1]</a> 这首诗有十五行，押韵格式是“ababa cdcd efef gg”。</p>
