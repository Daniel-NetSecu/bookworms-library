  <title>蜜蜂和朱庇特</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">蜜蜂和朱庇特</h1>

  <p>一只哈米特的蜂后带着蜂巢里的新鲜蜂蜜，飞去奥林匹斯山敬献给朱庇特，朱庇特收到礼物十分喜悦，说可以满足蜂后的任何要求。蜂后说，如果朱庇特能够让蜜蜂拥有刺去杀死抢夺他们的蜂蜜的人，她会十分感激。对这个要求，朱庇特大失所望，因为他很喜欢人类。但是他已经许下了诺言，所以便答应蜜蜂他们可以有刺。尽管他给了蜜蜂刺，但是蜜蜂叮完人，刺便会留在人的伤口中，而蜜蜂却会死去。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：恶意自有恶报。</p>
</body></html>
