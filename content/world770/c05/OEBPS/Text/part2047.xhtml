  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">101</h1>

  <p class="kindle-cn-poem-left1">缪斯呀，对浸染于美中的真，<br/>
  你怠慢了，这过错如何补偿？<br/>
  真和美依凭我的爱人而生，<br/>
  你也是，凭他你才显得高尚。<br/>
  说话呀，缪斯！你是不是想说：<br/>
  “真正的本色用不着再装点，<br/>
  美和美中之真，用不着补裰，<br/>
  只要不掺假，至善就是至善”？<br/>
  你的沉默，就因他无须嘉许？<br/>
  别找借口了，因为你有责任<br/>
  使他长寿，超过金砌的陵墓，<br/>
  让他世世代代享有赞美声。<br/>
  　　履行职责吧，缪斯！今之丽质<br/>
  　　如何传之久远，这我可教你。</p>
