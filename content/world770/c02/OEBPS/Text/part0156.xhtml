  <title>羔羊</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">羔羊</h2>

  <p class="EB03BodyTextIndented">　　小羊羔儿，谁造了你？</p>

  <p class="EB03BodyTextIndented">　　你可知道是谁造了你？</p>

  <p class="EB03BodyTextIndented">给了你生命，吩咐你吃草，</p>

  <p class="EB03BodyTextIndented">在流水旁边，遍青青草地；</p>

  <p class="EB03BodyTextIndented">给了你人见人爱的衣裳，</p>

  <p class="EB03BodyTextIndented">茸茸的衣裳，鲜艳又柔软；</p>

  <p class="EB03BodyTextIndented">给了你那么柔和的声音，</p>

  <p class="EB03BodyTextIndented">让所有的溪谷听了都喜欢；</p>

  <p class="EB03BodyTextIndented">　　小羊羔儿，谁造了你？</p>

  <p class="EB03BodyTextIndented">　　你可知道是谁造了你？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">　　小羊羔儿，我来告诉你，</p>

  <p class="EB03BodyTextIndented">　　小羊羔儿，我来告诉你：</p>

  <p class="EB03BodyTextIndented">他的名字和你的一样，</p>

  <p class="EB03BodyTextIndented">因为他叫自己羊羔羔儿；</p>

  <p class="EB03BodyTextIndented">他又柔顺，他又温和，</p>

  <p class="EB03BodyTextIndented">他变成了一个小小孩儿：</p>

  <p class="EB03BodyTextIndented">我是小孩儿，你是羊羔儿，</p>

  <p class="EB03BodyTextIndented">我们全都叫他的名儿。</p>

  <p class="EB03BodyTextIndented">　　小羊羔儿，上帝保佑你。</p>

  <p class="EB03BodyTextIndented">　　小羊羔儿，上帝保佑你。</p>
