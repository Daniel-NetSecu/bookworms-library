  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">123</h1>

  <p class="kindle-cn-poem-left1">时间啊，不要夸口我也在变，<br/>
  你有力量建造新的金字塔，<br/>
  但在我眼中并不稀奇、新鲜，<br/>
  它们不过是旧景披上新褂。<br/>
  只因生命苦短，我们才羡慕<br/>
  你向我们骗售的那些旧货，<br/>
  当它们是我们希望的满足，<br/>
  而不想想先前早有人说过。<br/>
  我藐视你的记载和你自己，<br/>
  现在和将来，都不值得惊叹，<br/>
  你的陈迹与新景，全是无稽，<br/>
  都是你匆忙间造就的虚幻。<br/>
  　　我在此立誓，并信守到永远：<br/>
  　　我要忠诚，无视你和那弯镰。</p>
