  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">34</h1>

  <p>只要我一息尚存，我就称你为我的一切。</p>

  <p>只要我一诚不灭，我就感觉到你在我的四围。</p>

  <p>任何事情我都来请教你，任何时候都把我的爱献上给你。</p>

  <p>只要我一息尚存，我就永不把你藏匿起来。</p>

  <p>只要把我和你的意旨锁在一起的脚镣还留着一小段，</p>

  <p>你的意旨就在我的生命中实现——</p>

  <p>这脚镣就是你的爱。</p>
