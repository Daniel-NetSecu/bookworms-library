  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">27</h1>

  <p>灯火，灯火在哪里呢？</p>

  <p>用熊熊的渴望之火把它点上吧！</p>

  <p>灯在这里，却没有一丝火焰——</p>

  <p>这是你的命运吗？我的心啊！</p>

  <p>你还不如死了好！</p>

  <p>悲哀在你门上敲着，她传话说你的主醒着呢，</p>

  <p>他叫你在夜的黑暗中奔赴爱的约会。</p>

  <p>云雾遮满天空，雨也不停地下。</p>

  <p>我不知道我心里有什么在动荡——</p>

  <p>我不懂得它的意义。</p>

  <p>一霎的电光，在我的视线上抛下一道更深的黑暗。</p>

  <p>我的心摸索着路径，</p>

  <p>寻找那呼唤着我的夜的音乐。</p>

  <p>灯火，灯火在哪里呢？</p>

  <p>用熊熊的渴望之火把它点上吧！</p>

  <p>雷声在响，狂风怒吼着穿过天空。</p>

  <p>夜像黑岩一般的黑。</p>

  <p>不要让时间在黑暗中度过吧。</p>

  <p>用你的生命把爱的灯点上吧。</p>
</body></html>
