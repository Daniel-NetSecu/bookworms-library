  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">84</h1>

  <p class="kindle-cn-poem-left1">谁歌颂得更好？怎样的颂辞<br/>
  能比这更有意义：“你就是你”？<br/>
  有谁具有如此丰赡的美质<br/>
  能与你一比高低，相匹相敌？<br/>
  歌颂某人，却不能为之增光，<br/>
  这样的秃笔实在有些寒碜；<br/>
  但“你就是你”，这话写进文章，<br/>
  秃笔变妙手，败笔也成美文。<br/>
  让他去抄袭你身上的文句，<br/>
  造化的作品不容随意糟蹋，<br/>
  如此效仿将使他闻名卓著，<br/>
  他的诗将被传诵，名满天下。<br/>
  　　你给华美的祝福带来诅咒：<br/>
  　　赞美如不讲分寸，便是荒谬。</p>
