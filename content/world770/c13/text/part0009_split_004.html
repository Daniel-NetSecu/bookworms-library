<h2 class="heading" id="calibre_pb_3">尼克·王尔德</h2>

  <p class="p">尼克·王尔德是一只爱小打小闹、能说会道的狐狸。他长相迷人，头脑敏锐，很会讲笑话。他是个顽固的现实主义者，认为不管人们如何努力都无法摆脱自身的标签而成为他人。在他看来，树懒都很迟缓，鼬鼠都很狡猾，兔子都很木讷。但是，当一只名叫朱迪·霍普斯、带有理想主义色彩的兔子警官比他还机灵时，他在不知不觉中帮助她解决了这个谜团。</p>
