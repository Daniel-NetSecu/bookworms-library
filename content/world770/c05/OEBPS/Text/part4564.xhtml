  <title>情歌</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">情歌</h1>

  <p>有一次，一位诗人写了一首情歌，高妙自不待言。他抄写了几份，分寄给好友与相识，其中男女均有。他也给一位姑娘寄去了一份；他与她只见过一面，她住在山后。</p>

  <p>过了一两天，姑娘差人送来一封信。信中云：“请允许我向你吐露真情，我深深被你写的情歌所打动。请你现在就来，来见我的父母，面商订婚事宜。”</p>

  <p>诗人即刻复信。信云：“朋友，那不过是发自诗人心中的情歌，每个男子都可以唱给每位姑娘听。”</p>

  <p>姑娘又写来一封信。信中说：“花言巧语骗人的坏蛋！从今到死，我将因你而憎恨所有的诗人！”</p>
