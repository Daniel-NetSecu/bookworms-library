  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">153</h1>

  <p class="kindle-cn-poem-left1">丘比特放下火炬睡了过去，<br/>
  让狄安娜的侍女趁此机会<br/>
  悄悄拿走他那把爱情火炬，<br/>
  将它投入山谷中一池寒泉。<br/>
  寒泉受惠于这神圣的爱火，<br/>
  喷涌出永恒的热，终古不息；<br/>
  面对沸腾的温泉，人们都说：<br/>
  这水能治疗百病，灵验无比。<br/>
  爱火又在我爱人眼中燃烧，<br/>
  男孩用火炬轻击我的胸口，<br/>
  我随即患病，需用泉水治疗，<br/>
  于是匆匆上路，沉痛而忧愁。<br/>
  　　但神泉不灵验：唯情人的眼<br/>
  　　能重燃爱的火炬，治我的病。</p>
