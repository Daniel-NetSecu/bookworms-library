  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">精油被榨出：</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">精油被榨出：</p>

  <p class="EB03BodyTextIndented">玫瑰中的花油</p>

  <p class="EB03BodyTextIndented">不只是被太阳榨取，</p>

  <p class="EB03BodyTextIndented">它也是技艺的礼物。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">寻常的玫瑰衰败；</p>

  <p class="EB03BodyTextIndented">可这朵，在女子的抽屉里，</p>

  <p class="EB03BodyTextIndented">创造了夏天，当那女子</p>

  <p class="EB03BodyTextIndented">躺在无尽的玫瑰经颂祷中。</p>
