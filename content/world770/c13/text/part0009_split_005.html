<h2 class="heading" id="calibre_pb_4">Flash</h2>

  <p class="p">Flash is the fastest sloth working at the DMV—of course, that’s not saying much. As a sloth, Flash tends to do everything—like talking—at his own particular pace. He’s as helpful as he can be, and when his pal needs a rush job, Flash springs into action.</p>
