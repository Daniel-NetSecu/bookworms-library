  <title>石榴树、苹果树和荆棘</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">石榴树、苹果树和荆棘</h1>

  <p>有一棵石榴树和一棵苹果树争论他们谁的产量更高，他们都说自己更高产。他们你来我往，滔滔不绝，一场激烈的争吵即将发生。这时一株荆棘从旁边的树丛中探出头来，说：“唉唉，朋友们，够了吧，咱们还是别吵了吧。”</p>
