  <title>贼和公鸡</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">贼和公鸡</h1>

  <p>有一伙贼闯入一个房子，却发现只有一只公鸡值得偷，于是便偷走了。做晚饭的时候，一个贼抓住公鸡，想要扭断他的脖子，公鸡大喊着求饶：“求求你们不要杀我，你们会发现我是最有用的鸡的，每天早晨，我都用自己的鸣叫唤醒诚实的人去工作。”而贼兴奋地回答说：“是啊，我了解你做的事情，你让我们这样的人谋生更难了。你还是下锅里去吧！”</p>
