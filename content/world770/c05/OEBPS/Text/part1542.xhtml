  <h2 class="kindle-cn-heading2">99　哟，当我爱上你时</h2>

  <p class="kindle-cn-signature">豪斯曼<span class="math-super"><a id="noteBack_1" href="part1542.xhtml#note_1">[1]</a></span></p>

  <p class="kindle-cn-poem-left">哟，当我爱上你时，<br/>
  我既潇洒又勇武，<br/>
  方圆几十里的一个传奇：<br/>
  都说我做人规矩。</p>

  <p class="kindle-cn-poem-left">如今幻想破灭，<br/>
  我已一无所有，<br/>
  方圆几十里众口一词：<br/>
  都说我秉性依旧。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1542.xhtml#noteBack_1">[1]</a>阿尔弗莱德·爱德华·豪斯曼（Alfred Edward Houseman，1859—1936），学者，抒情诗人，校勘学家。出生于伍斯特郡的一个律师家庭。曾在牛津大学攻读古希腊罗马文学。毕业后做过伦敦专利局的职员，后任教于伦敦大学和剑桥大学。他的诗多以农村生活为背景，语言简洁、明快。诗集有《希罗普郡的少年》《最后的诗》等。</p>
