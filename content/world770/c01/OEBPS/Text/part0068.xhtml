<p class="title1" id="CHP66">LESSON 63</p>
<p class="picture"><img src="../Images/image01611.jpeg.webp" alt="alt"/></p>
<p class="normaltext">O Ben! let me get in, will you?</p>
<p class="normaltext">Yes, if you will sit still.</p>
<p class="normaltext">Stand still, Jip, and let Ann get in.</p>
<p class="normaltext">Now, Ben, hand me the whip.</p>
<p class="normaltext">Get up, Jip!</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">噢，本！让我上去，好吗？</p>
<p class="normaltext">好的，除非你坐着别动。</p>
<p class="normaltext">站着别动，吉普，让安上来。</p>
<p class="normaltext">好，本，把鞭子给我。</p>
<p class="normaltext">驾，吉普！</p>
