  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">42</h1>

  <p class="kindle-cn-poem-left1">你占有她，我并不十分悲戚，<br/>
  尽管我对她确实一往情深；<br/>
  我痛心疾首的是她占有你，<br/>
  爱的丧失才让我五内俱焚。<br/>
  爱的冒犯者，我为你们开脱：<br/>
  你爱她，因为她是我的情人，<br/>
  因为我的缘故，她才背叛我，<br/>
  并允许我的朋友跟她调情。<br/>
  失去你，你为我的情人所得，<br/>
  失去她，她为我的朋友所获，<br/>
  你们各有所得，我失去两个，<br/>
  为了我，你们都在折磨着我。<br/>
  　　但苦中有乐，因为你我同体；<br/>
  　　甜美的慰藉！我是她的唯一。</p>
