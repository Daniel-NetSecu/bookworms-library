  <div class="chapter" id="chapter">
    <h1 class="kindle-cn-heading-2"><a id="page84"></a><a id="page85"></a>第一场</h1>

    <div class="kindle-cn-para-2em-indent1">
      <p><span class="kaiti">斐迪南手里拿着封已拆开的信冲进门来，一名侍从从另一道门上。</span><br/>
      <br/></p>
    </div>

    <p class="kindle-cn-para-hang"><span class="kindle-cn-bold">斐迪南</span>　侍卫长在这儿吗？</p>

    <p class="kindle-cn-para-hang"><span class="kindle-cn-bold">侍从</span>　少校先生，宰相大人正在找您。</p>

    <p class="kindle-cn-para-hang"><span class="kindle-cn-bold">斐迪南</span>　见鬼！我问你侍卫长来了吗？</p>

    <p class="kindle-cn-para-hang"><span class="kindle-cn-bold">侍从</span>　侍卫长老爷在楼上玩儿牌。</p>

    <p class="kindle-cn-para-hang"><span class="kindle-cn-bold">斐迪南</span>　叫这混蛋赶快下来见我！<span class="kaiti">（侍从下）</span></p>
  </div>
