  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">53</h1>

  <p class="kindle-cn-poem-left1">究竟是什么材料造就了你？<br/>
  为何千万个影子与你同形？<br/>
  一个人通常只有一个形体，<br/>
  偏你一人出租千万个倩影。<br/>
  摹绘阿多尼斯吧，那幅赝品<br/>
  充其量是对你拙劣的模仿；<br/>
  当一切画技用来描绘海伦，<br/>
  那张脸又是你，着希腊衣装。<br/>
  说起一年中春和秋的美景，<br/>
  前者彰显出你外表的风采，<br/>
  后者记录下你德操的丰盈；<br/>
  我们知道：你的美无处不在。<br/>
  　　一切外表的美有你的一份，<br/>
  　　如论内在，唯有你一片赤诚。</p>
