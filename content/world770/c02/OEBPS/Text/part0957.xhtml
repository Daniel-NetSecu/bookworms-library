  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">All the letters I can write</h2>

  <p class="EB03BodyTextIndented">（<i>With a flower</i>）</p>

  <p class="EB03BodyTextIndented">All the letters I can write</p>

  <p class="EB03BodyTextIndented">Are not fair as this,</p>

  <p class="EB03BodyTextIndented">Syllables of velvet,</p>

  <p class="EB03BodyTextIndented">Sentences of plush,</p>

  <p class="EB03BodyTextIndented">Depths of ruby, undrained,</p>

  <p class="EB03BodyTextIndented">Hid, lip, for thee —</p>

  <p class="EB03BodyTextIndented">Play it were a humming bird</p>

  <p class="EB03BodyTextIndented">And just sipped me!</p>
</body></html>
