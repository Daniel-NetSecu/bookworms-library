  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">不像我的心那般沉重的心</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">不像我的心那般沉重的心，</p>

  <p class="EB03BodyTextIndented">悠然晚归，</p>

  <p class="EB03BodyTextIndented">它经过我的窗口</p>

  <p class="EB03BodyTextIndented">给自己吹着一个小曲儿，——</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">漫不经心的一段，一支谣曲，</p>

  <p class="EB03BodyTextIndented">一首街头小调；</p>

  <p class="EB03BodyTextIndented">可是对我恼怒的耳朵来说</p>

  <p class="EB03BodyTextIndented">却是多么甜美的抚慰，</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">就好像一只食米鸟，</p>

  <p class="EB03BodyTextIndented">闲逛到这边，</p>

  <p class="EB03BodyTextIndented">一边欢歌一边沉思接着又欢歌，</p>

  <p class="EB03BodyTextIndented">歌声婉转缓缓消逝。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">那就好像一条潺湲的小溪</p>

  <p class="EB03BodyTextIndented">流过艰辛的路程</p>

  <p class="EB03BodyTextIndented">让流血的双脚跳起小步舞</p>

  <p class="EB03BodyTextIndented">却不知为何。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">明日，夜会再度来临，</p>

  <p class="EB03BodyTextIndented">疲惫，也许，酸痛。</p>

  <p class="EB03BodyTextIndented">啊，号角，在我窗边，</p>

  <p class="EB03BodyTextIndented">恳求你再来溜达。</p>
</body></html>
