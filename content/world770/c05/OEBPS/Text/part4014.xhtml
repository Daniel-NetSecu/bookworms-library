  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">22</h1>

  <p class="kindle-cn-poem-left">当她用急步走过我的身旁，<br/>
  她的裙缘触到了我。<br/>
  从一颗心的无名小岛上忽然吹来一阵春天的温馨。<br/>
  一霎飞触的缭乱扫拂过我，立刻又消失了，<br/>
  像扯落的花瓣在和风中飘扬。<br/>
  它落在我的心上，<br/>
  像她的身躯的叹息和她心灵的低语。</p>
