  <h2 class="kindle-cn-heading2">90　生日</h2>

  <p class="kindle-cn-signature">克里斯蒂娜·罗塞蒂</p>

  <p class="kindle-cn-poem-left">我的心像一只会唱歌的鸟<br/>
  筑巢在临近溪流的树梢，<br/>
  我的心像一棵苹果树，<br/>
  枝头上挂满累累的果实；<br/>
  我的心像一道彩虹<br/>
  悬挂在平静的海空。<br/>
  我的心比这一切幸福得多，<br/>
  因为我的爱人要来找我。</p>

  <p class="kindle-cn-poem-left">请为我用丝绸把高台搭起，<br/>
  上面挂起染成紫色的栗鼠皮；<br/>
  高台上雕以鸽子和石榴花，<br/>
  五十只孔雀的眼睛齐放光华，<br/>
  金色和银色的葡萄四周悬垂，<br/>
  再饰以绿叶和银色的鸢尾，<br/>
  因为我的生日临近，值得庆贺，<br/>
  我的爱人马上要来找我。</p>
