<h1 class="title1" id="CHP5">内容简介</h1>
<p class="normaltext02">大多数人不相信幽灵的存在，直到他们亲眼看到才会相信。在这三个短剧中，理查德、珍妮和布拉德的生活都因为幽灵的出现发生了彻底的变化。</p>
<p class="normaltext02">理查德·利特尔见到已故姐夫的幽灵时，又是吃惊又是害怕。他知道自己必须帮助这个幽灵安息，尽管他这样做会令自己置身险境。</p>
<p class="normaltext02">珍妮·劳森见到自己亡夫的幽灵时，她明白他有一条特别的信息要传达给她——那是他活着的时候没能告诉她的一些事。</p>
<p class="normaltext02">最后，在书名篇短剧中，布拉德·戴维斯遇到了三百年前他曾爱过，而后又抛弃的女孩的幽灵。他将和她厮守让她快乐，还是回到二十世纪的美国？</p>
<p class="normaltext6">（书中剧本为非现实题材作品）</p>
