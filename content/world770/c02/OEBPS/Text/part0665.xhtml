  <h2 class="EB04MainHeadClosedTitle">鼹鼠和妈妈</h2>

  <p class="EB03BodyTextIndented">鼹鼠是一种生下来就没有视力的动物。有一次，他对妈妈说：“我确信我能看见，妈妈！”</p>

  <p class="EB03BodyTextIndented">为了证明他是错的，他的妈妈在他面前摆放了一些乳香，并问他：“这是什么？”</p>

  <p class="EB03BodyTextIndented">小鼹鼠说道：“这是卵石。”</p>

  <p class="EB03BodyTextIndented">他的妈妈惊呼道：“我的儿子，恐怕你不仅看不见，鼻子也不灵了吧。”</p>
