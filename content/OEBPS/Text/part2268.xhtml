<h1 class="title1">内容简介</h1>
<p class="normaltext">克兰福德没有富人，但人们却忌讳谈论贫穷。绝对不能！那样做很俗气，而脱俗在克兰福德很重要。在尊敬的贾米森夫人的晚会上只有抹了黄油的薄面包（昂贵的食物显得俗气），杰西·布朗小姐公开谈论她那当店主的舅舅的时候，德博拉·詹金斯小姐生气极了。做生意的舅舅！多可怕啊！</p>
<p class="normaltext">150年前的社会规则虽然和现在的不同，但人并没有什么两样。克兰福德的女士们和任何时代的人一样，她们会有喜怒哀乐，会骄傲、勇敢、嫉妒——也非常善良。可爱温柔的马蒂小姐遇到困难时，大家都想帮她。虽然马蒂小姐在生活中遇到很多不幸，但也有一个惊喜在等待着她……</p>
