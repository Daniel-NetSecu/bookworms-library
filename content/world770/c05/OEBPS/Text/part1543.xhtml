  <h2 class="kindle-cn-heading2">100　我们走过田野</h2>

  <p class="kindle-cn-signature">豪斯曼</p>

  <p class="kindle-cn-poem-left">我们走过田野，<br/>
  那是一年前，我和我的爱人。<br/>
  篱笆旁，岩石上，<br/>
  有株白杨在自言自语：<br/>
  “哟，是谁路过这里并在亲吻？<br/>
  是一位乡下情郎和他的情侣；<br/>
  两个情人打算配对成双，<br/>
  时间老人将把他们推上婚床。<br/>
  但她将躺下，泥土盖在上面，<br/>
  他则睡在另一个女人身边。”</p>

  <p class="kindle-cn-poem-left">千真万确，此时树底下，<br/>
  行走着我和另一个情人，<br/>
  头顶的白杨摇摇晃晃，<br/>
  雨后的银叶哗哗作响；<br/>
  我不理解嘈杂声的含义，<br/>
  也许它们是说我身边的姑娘。<br/>
  它们谈论的是不久后的事，<br/>
  拿她来解释倒也顺理成章，<br/>
  到时候我将与野草共眠，<br/>
  她则睡在另一个男人身边。</p>
