<h2 class="heading" id="calibre_pb_5">怒怒</h2>

  <p class="p4">● 怒怒一直在试图保持平静，但是却很难做到，因为这个世界存有那么多不公平的事情。自从莱莉满两岁后，怒怒就一直在与各种事情发脾气作斗争，如“不想系安全带”“索要更多的饼干”等。这是一份艰难的工作，但总得有人做才行。</p>
