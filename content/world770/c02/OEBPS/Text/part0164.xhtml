  <title>至上的形象</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">至上的形象</h2>

  <p class="EB03BodyTextIndented">向仁慈、和平、怜悯与爱，</p>

  <p class="EB03BodyTextIndented">所有忧伤者恳切祈祷，</p>

  <p class="EB03BodyTextIndented">对这些蕴含着欢乐的美德，</p>

  <p class="EB03BodyTextIndented">他们以感激予以回报。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">因仁慈、和平、怜悯与爱，</p>

  <p class="EB03BodyTextIndented">是上帝，我们亲爱的父，</p>

  <p class="EB03BodyTextIndented">仁慈、和平、怜悯与爱，</p>

  <p class="EB03BodyTextIndented">也是人——他的孩子和关注。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">因为仁慈有一颗人心，</p>

  <p class="EB03BodyTextIndented">怜悯，有一张人的脸庞，</p>

  <p class="EB03BodyTextIndented">爱，有着至上的人形，</p>

  <p class="EB03BodyTextIndented">和平，有一套人的服装。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">所以每一块地方每一个</p>

  <p class="EB03BodyTextIndented">处于忧伤之中的祈祷者，</p>

  <p class="EB03BodyTextIndented">都向至上的人形祈求</p>

  <p class="EB03BodyTextIndented">爱与仁慈与怜悯与和平。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">所有人都应爱人的形象，</p>

  <p class="EB03BodyTextIndented">爱犹太人，土耳其人，土著，</p>

  <p class="EB03BodyTextIndented">它寓有仁慈与爱与怜悯，</p>

  <p class="EB03BodyTextIndented">上帝也在其中居住。</p>
