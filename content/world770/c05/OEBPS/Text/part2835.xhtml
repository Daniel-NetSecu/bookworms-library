  <title>狡猾的狮子</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">狡猾的狮子</h1>

  <p>狮子看到一只肥肥的公牛在草地上吃草，觉得那正可以成为自己的盘中餐，看着看着便流下了口水，但是他却又不敢攻击公牛，害怕他尖锐的牛角。然而，由于饥肠辘辘，他不得不采取行动，既然武力不一定有用，他决定运用诡计。他假装友好地走到公牛身边，对公牛说：“我情不自禁地来表达对您这样的健美体形的景仰之情。你的头长得多好啊！你的肩膀和大腿多有力量啊！但是我的朋友，到底为什么要长着这么丑陋的犄角呢？你肯定觉得既不好看又笨拙。相信我，如果没有犄角，你肯定会好得多的。”公牛十分蠢，相信了这番话，于是把牛角给砍掉了，因此失去了唯一能够自卫的武器，被狮子轻而易举就给抓住了。</p>
