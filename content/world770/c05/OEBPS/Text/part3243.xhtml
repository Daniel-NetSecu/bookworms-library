  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">对手</h1>

  <p class="kindle-cn-poem-left">如果月亮笑过，她会像你。<br/>
  你留下对美丽之物<br/>
  同样的印象，但在消失中。<br/>
  你俩都是光的伟大借用者。<br/>
  她那圆嘴感时伤事；你却无动于衷，<br/>
  <br/>
  你的第一天赋是用石块创造一切。<br/>
  我醒来看到陵墓；你在这里，<br/>
  你的手指在大理石桌上轻敲，寻找着香烟，<br/>
  如女人般怀有恶意，但没有焦虑，<br/>
  渴望说些无可争辩的话。<br/>
  <br/>
  月亮，也在，贬低她的臣民，<br/>
  而在白天，她是可笑的。<br/>
  你的各种不满意，另一方面，<br/>
  穿过邮箱槽口，有规律地抵达，<br/>
  白色又空虚，如一氧化碳般弥散。<br/>
  <br/>
  每天有你的消息，才会感到安全。<br/>
  也许漫步于非洲，却思念着我。</p>
