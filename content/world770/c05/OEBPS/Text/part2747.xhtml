  <title>农夫和鹳</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">农夫和鹳</h1>

  <p>有一个农夫，在刚刚耕种完的田地里面设置了一些陷阱，想要捉获来偷吃种子的鹤。等他来查看陷阱的时候，发现已经捉住了好几只鹤，其中有一只向他求饶，求他放了自己。“你不应该杀我，我不是鹤，而是一只鹳，你看我的羽毛，很显然，我是最诚实最无害的鸟类。”农夫说：“对我来说，你是什么并不重要，我发现你和这些破坏我的庄稼的鹤在一起，而且长得和他们很像，你就得受到惩罚。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：如果你选择与坏人为伍，没有人会相信你是好人。</p>
</body></html>
