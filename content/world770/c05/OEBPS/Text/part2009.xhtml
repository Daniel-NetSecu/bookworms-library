  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">63</h1>

  <p class="kindle-cn-poem-left1">我担心爱友会像我现在这般<br/>
  被时间的毒手肆意折磨、毁损；<br/>
  那时，岁月会将他的血抽干，<br/>
  使他的额头布满斑斑皱纹，<br/>
  青春之晨踏进暮年的险夜，<br/>
  一切的爱，今天奉他为圣君，<br/>
  那时都将隐退，或渐次凋谢，<br/>
  春天的宝藏从此丧失殆尽。<br/>
  为防不测，我应该加固工事，<br/>
  以防御岁月那无情的戕害，<br/>
  纵然他能置我爱友于死地，<br/>
  却砍不去爱友遗世的丰采。<br/>
  　　他的美就在这诗行里纷呈，<br/>
  　　这诗长在，诗中人也将长青。</p>
