<h1 class="title1">内容简介</h1>
<p class="normaltext2a">哪里都有漂亮的姑娘，笑容迷人的小伙子也不稀奇。每一座大城小镇都有年轻男女在一瞥一笑间互相吸引。他们就这样相遇，相识，畅谈，欢笑……多么美妙的日日夜夜，这就是爱的魔力。</p>
<p class="normaltext2a">威尔看见了安娜，她是个漂亮的姑娘，他想认识她，可是要怎么做呢？他能听到她的吉他声，却找不到她的身影。</p>
<p class="normaltext2a">安娜看见了威尔，她也想认识他，但是他在哪里？她能闻到他留在电梯里的玫瑰花香，可是他去了哪里？</p>
<p class="normaltext2a">安娜的朋友薇姬想帮她。威尔的奶奶也想帮他。可是一切的努力都没有结果。安娜和威尔能再次相遇吗？让他们互相吸引的是爱吗？</p>
