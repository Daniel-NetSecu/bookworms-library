  <h2 class="EB04MainHeadClosedTitle">预言家</h2>

  <p class="EB03BodyTextIndented">一位预言家坐在集市里，给那些想要一探究竟的人算命。</p>

  <p class="EB03BodyTextIndented">突然来了一个人告诉他，他家里遭贼了。他们把所有能找到的东西都抢走了。预言家立即跳起来，冲了出去，扯着自己的头发，诅咒那些恶棍。</p>

  <p class="EB03BodyTextIndented">路人们都被逗笑了，其中一个人说道：“我们的朋友自称能够预测他人的命运，但他似乎还没聪明到能预测自己的未来呀。”</p>
