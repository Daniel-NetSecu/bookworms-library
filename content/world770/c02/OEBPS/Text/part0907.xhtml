  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">它来了——毫不迟延的造物</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">它来了——毫不迟延的造物，</p>

  <p class="EB03BodyTextIndented">它获得街区现在又获得了大门，</p>

  <p class="EB03BodyTextIndented">从所有其他的栓扣中挑选了它的门闩，</p>

  <p class="EB03BodyTextIndented">进来，说——“你认识我吗，先生？”</p>

  <p class="EB03BodyTextIndented">简单的问候和确然相认，</p>

  <p class="EB03BodyTextIndented">要是敌人便无畏——要是朋友便简洁，</p>

  <p class="EB03BodyTextIndented">用薄饼和冰溜装扮每座房子，</p>

  <p class="EB03BodyTextIndented">并且拿出去一座送给上帝。</p>
</body></html>
