  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">43</h1>

  <p>那天我没有准备好来等候你，</p>

  <p>我的国王，你就像一个素不相识的平凡的人，</p>

  <p>自动地进到我的心里，</p>

  <p>在我生命的许多流逝的时光中，盖上了永生的印记。</p>

  <p>今天我偶然照见了你的签印，</p>

  <p>我发现它们和我遗忘了日常哀乐的回忆，杂乱地散掷在尘埃里。</p>

  <p>你不曾鄙夷地避开我童年时代在尘土中的游戏，</p>

  <p>我在游戏室里听见的足音，和在群星中的回响是相同的。</p>
