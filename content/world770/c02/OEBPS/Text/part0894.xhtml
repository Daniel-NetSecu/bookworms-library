  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">我感觉大脑里有一场葬礼</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我感觉大脑里有一场葬礼，</p>

  <p class="EB03BodyTextIndented">送葬者，来来去去，</p>

  <p class="EB03BodyTextIndented">不停地踩踏，踩踏，直到似乎</p>

  <p class="EB03BodyTextIndented">感知挣脱而出。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">当他们都坐下来，</p>

  <p class="EB03BodyTextIndented">一场仪式像一面鼓</p>

  <p class="EB03BodyTextIndented">不停地敲啊敲，直到我以为</p>

  <p class="EB03BodyTextIndented">我的意识变得麻木。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">然后我听到他们举起一个棺材，</p>

  <p class="EB03BodyTextIndented">又一次，踩着那铅做的靴子，</p>

  <p class="EB03BodyTextIndented">嘎吱嘎吱穿过我的灵魂，</p>

  <p class="EB03BodyTextIndented">而后空间开始鸣响，</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">仿佛整个天穹是一口钟，</p>

  <p class="EB03BodyTextIndented">而存在只是一只耳朵，</p>

  <p class="EB03BodyTextIndented">我和沉默是某种奇怪的种类，</p>

  <p class="EB03BodyTextIndented">遇难，孤独，就在这儿。</p>
