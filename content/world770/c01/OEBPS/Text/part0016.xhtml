<p class="title1" id="CHP14">LESSON 11</p>
<p class="picture"><img src="../Images/image01555.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>This is a fat hen.</td>
    <td>这是一只肥母鸡。</td>
  </tr>
  <tr>
    <td>The hen has a nest in the box.</td>
    <td>母鸡在盒子里安了个窝。</td>
  </tr>
  <tr>
    <td>She has eggs in the nest.</td>
    <td>它在窝里下蛋。</td>
  </tr>
  <tr>
    <td>A cat sees the nest,</td>
    <td>一只猫看见了鸡窝，</td>
  </tr>
  <tr>
    <td>and can get the eggs.</td>
    <td>它可能会拿走鸡蛋。</td>
  </tr>
</table>
