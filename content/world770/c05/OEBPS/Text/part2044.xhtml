  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">98</h1>

  <p class="kindle-cn-poem-left1">你离开我的时节正值阳春，<br/>
  那时，艳丽的四月梳妆打扮，<br/>
  给万物注入了青春的魂灵，<br/>
  连阴沉的土星也跟着狂欢。<br/>
  然而，无论是鸟儿们的歌吟，<br/>
  还是各色鲜花扑鼻的香泽，<br/>
  都不能让我谈起夏的光景，<br/>
  或从丰美的裙兜将花采摘。<br/>
  雪白的百合花不令我诧异，<br/>
  殷红的玫瑰也难让我赞赏，<br/>
  它们确实香美，但其形其姿<br/>
  都从你而来，是对你的模仿。<br/>
  　　只要你不在，春天就是冬天，<br/>
  　　我赏花，是在与你的影交欢。</p>
