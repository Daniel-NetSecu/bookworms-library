<h1 class="calibre22" id="calibre_pb_215">第十三节</h1>

      <p class="x5">这种不平等的后果是耕种者从土地所有者中分离出来。</p>

      <p class="x6">这样，土地财产就可以购买和出售了。挥霍浪费或遭遇不幸的土地所有者失去的土地，增加了比较幸运或勤奋的土地所有者的土地；这种所有权无穷无尽地变化，只会导致相当多的土地所有者必定拥有超出他们耕种能力的土地。另外，富人很自然地想要安静地享受他的地产带来的收益，因此，他更愿意用自己的一部分剩余产品换取别人来为他工作，而不想再把自己的所有时间都用于辛苦的劳作。</p><a id="Section_cn_14"></a>
