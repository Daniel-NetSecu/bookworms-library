<h1 class="title01"><span class="xt">10</span>．摇　晃</h1>
<p class="picture"><img src="../Images/image08340.jpeg" alt="alt"/></p>
<p class="normaltext">她说着，便把红方王后从桌上拿起来，用力地前后摇晃起来。</p>
<p class="normaltext">红方王后并没有试图自卫或逃跑……但她的脸变得很小，眼睛变大变绿……爱丽丝不停地摇晃着，她又变得更矮——更胖——更软——更丰满——更……</p>
