  <title>老鼠和公牛</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">老鼠和公牛</h1>

  <p>有一只公牛的鼻子被老鼠咬了，他追着老鼠不放，但老鼠动作灵敏，溜进了墙上的一个洞中。公牛狂怒，一次次地撞击那堵墙，直到筋疲力尽，瘫倒在地上。一切平静之后，老鼠又出来了，又咬了他。公牛愤怒得发狂了，他站起来，但是老鼠又躲进了洞里，公牛除了因无助而愤怒地咆哮之外，什么都做不了。过了一会儿，他听到一个尖细的小声音从墙里面传出来：“你这个大家伙也不能总是为所欲为，有时候我们小家伙更能来去自如。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：并非强者就能获胜。</p>
</body></html>
