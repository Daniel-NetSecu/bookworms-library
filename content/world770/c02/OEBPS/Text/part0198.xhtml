  <title>古代吟游诗人之声</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">古代吟游诗人之声</h2>

  <p class="EB03BodyTextIndented">到这里来吧，快乐的年轻人，</p>

  <p class="EB03BodyTextIndented">看这展布着的黎明，</p>

  <p class="EB03BodyTextIndented">真理新生的象征。</p>

  <p class="EB03BodyTextIndented">疑惑消失了，及理性的阴影，</p>

  <p class="EB03BodyTextIndented">及无知的争辩和狡猾的戏弄。</p>

  <p class="EB03BodyTextIndented">愚蠢是一条无尽的迷途，</p>

  <p class="EB03BodyTextIndented">纠结的根蔓困着她的路，</p>

  <p class="EB03BodyTextIndented">多少人在那里绊倒！</p>

  <p class="EB03BodyTextIndented">他们整夜在尸骨上跌踬，</p>

  <p class="EB03BodyTextIndented">却自认为想知道的无不知晓，</p>

  <p class="EB03BodyTextIndented">他们需要引导，却好为人师。</p>
</body></html>
