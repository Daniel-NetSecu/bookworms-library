<h2 class="heading" id="calibre_pb_5">郝刻薄院长</h2>

  <p class="p">她是一只形似母龙的怪兽，有着暗红色的身体、成百上千条腿和一双蝙蝠般的红色翅膀。她是怪兽大学惊吓学院的院长。郝刻薄院长虽远不至于被称为“邪恶”，但电影里的她是麦克和毛怪的主要对手，故将其看作“第一反派”也不为过。</p>
