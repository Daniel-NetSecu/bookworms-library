  <title>公牛和青蛙</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">公牛和青蛙</h1>

  <p>有两只小青蛙在池塘边玩耍，这时一只公牛到池塘边饮水，一不小心踩到了一只青蛙身上，把他给踩死了。青蛙妈妈发现孩子不见了，问活下来的青蛙他的兄弟去了哪里。小青蛙说：“妈妈，他死了。今天早晨，一个有四条腿的庞然大物来我们池塘，把他踩到了烂泥里。”“庞然大物？他有这么大吗？”青蛙妈妈说着把自己的身体鼓起来，鼓到尽量大。结果得到的回答是：“比这可大多了。”青蛙妈妈又让自己鼓胀了一些。“他有这么大吗？”她问。“哦！有的，有的，妈妈，比这大多了！”小青蛙回答。青蛙妈妈一次次地让自己鼓胀起来，直到她圆得像个球一样。“有这么大……”她开口问道，然后她便爆裂了。</p>
