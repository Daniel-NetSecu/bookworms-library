  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">我的火山上长了青草</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我的火山上长了青草，——</p>

  <p class="EB03BodyTextIndented">一个沉思的地点，</p>

  <p class="EB03BodyTextIndented">一只鸟儿会去挑选的地方</p>

  <p class="EB03BodyTextIndented">将是通常的想法。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">火在下面熏烧得多红，</p>

  <p class="EB03BodyTextIndented">草皮多不安全——</p>

  <p class="EB03BodyTextIndented">我透露了吗，我的孤独</p>

  <p class="EB03BodyTextIndented">将充满敬畏。</p>
