  <title>蚱蜢和猫头鹰</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">蚱蜢和猫头鹰</h1>

  <p>有一只猫头鹰，住在一棵树的树洞里，她每天晚上出来觅食，白天睡觉，但是她的睡眠受到了一只住在树枝上的蚱蜢的叫声的严重干扰。猫头鹰一次次地恳求蚱蜢为她考虑一下，但是蚱蜢却唱得更大声了。最后，猫头鹰再也忍受不了了，决定要设法除掉这只害虫。她以最令人愉快的方式对蚱蜢说：“你的歌声令我无法安睡，那对我来说就如同阿波罗的竖琴弹奏的音符一样甜美，所以我想要喝些花蜜，密涅瓦前几天刚好送了我一些。你想过来一起品尝吗？”蚱蜢听到自己的歌声受到夸赞，十分开心，而听到有美味的东西喝，他已经流出了口水，于是他说他很乐意。他一走进猫头鹰居住的树洞，猫头鹰就扑过去将他吃掉了。</p>
