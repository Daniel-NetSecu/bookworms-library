  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">128</h1>

  <p class="kindle-cn-poem-left1">我的音乐啊，当蒙恩的琴键<br/>
  受你纤纤玉指的轻抚柔击，<br/>
  奏出美妙音乐，金属的和声<br/>
  阵阵入耳，听得我意乱神迷，<br/>
  我是何等羡慕那边跳边吻<br/>
  你细嫩的指心的一台键盘！<br/>
  抱憾的嘴唇只能站在一边，<br/>
  羞红着脸观看键木的放浪。<br/>
  你的纤指，纷旋着碎步轻盈，<br/>
  与那死木片一道翩翩起舞，<br/>
  逗引得活的嘴唇痒灼难忍，<br/>
  真想换个角色，做一段死木！<br/>
  　　好吧，鲁莽的键木如此荣幸，<br/>
  　　就让它吻手，我吻你的嘴唇。</p>
