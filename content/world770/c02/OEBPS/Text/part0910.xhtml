  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">渴望就像种子</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">渴望就像种子</p>

  <p class="EB03BodyTextIndented">在地里努力，</p>

  <p class="EB03BodyTextIndented">相信如果它求情</p>

  <p class="EB03BodyTextIndented">最终会被发现。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">时辰和区域</p>

  <p class="EB03BodyTextIndented">每个情境都不清楚，</p>

  <p class="EB03BodyTextIndented">必须达到何种恒心，</p>

  <p class="EB03BodyTextIndented">在它终见太阳之前！</p>
