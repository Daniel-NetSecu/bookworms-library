<h2 class="heading" id="calibre_pb_5">多莉</h2>

  <p class="p">● 多莉是一条非常乐观、善良、神经兮兮但很健忘的鱼。她患有短暂失忆症，这也是让她的朋友和家人感到挫败从而离开她的原因。但是她有着一颗金子般的心，她对马林倾囊相助，以帮助他找回他的儿子尼莫。</p>
