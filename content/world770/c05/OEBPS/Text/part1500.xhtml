  <h2 class="kindle-cn-heading2">57　病玫瑰</h2>

  <p class="kindle-cn-signature">布莱克<span class="math-super"><a id="noteBack_1" href="part1500.xhtml#note_1">[1]</a></span></p>

  <p class="kindle-cn-poem-left">哟，玫瑰，你病了，<br/>
  看不见的小虫<br/>
  在黑夜中飞行，<br/>
  在狂啸的暴雨中。</p>

  <p class="kindle-cn-poem-left">发现了你的床榻，<br/>
  以求猩红的欢情，<br/>
  他阴沉而诡秘的爱<br/>
  摧残了你的生命。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1500.xhtml#noteBack_1">[1]</a>威廉·布莱克（William Blake，1757—1827），诗人。生于伦敦的一个袜商家庭。没有受过正规教育，年轻时在一家雕版作坊当学徒，凭自学开始写诗。后自办印刷厂，印出自己的诗集。主要作品有《天真之歌》《经验之歌》《伐拉，或四天神》等。人称“纯幻想的诗人”（a poet of pure fancy）。</p>
