<h2 class="heading" id="calibre_pb_11">兵兵</h2>

  <p class="p4">● 兵兵是莱莉想象出来的朋友，自从莱莉满了四岁，他就再也没有在她的脑海中出现过了。他由棉花糖构成，身体一部分是猫，一部分是大象，还有一部分是海豚。兵兵的目标就是让莱莉能想起他，然后两个人可以继续玩想象出来的游戏，比如乘坐以歌声为动力的火箭去月球。</p>
