  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">110</h1>

  <p class="kindle-cn-poem-left1">哎呀，我确实曾经四处奔走，<br/>
  让自己扮作小丑，供人赏玩，<br/>
  伤害自身，将瑰宝低价出售，<br/>
  用新的情感冒犯旧的情感。<br/>
  毋庸置疑，我曾经斜着眼睛，<br/>
  看待你的忠贞！如今我发誓：<br/>
  这教训让我的心重回青春，<br/>
  经风雨方知你的爱最真挚。<br/>
  俱逝矣，请接受我无尽的爱，<br/>
  从此我不再激励我的贪心，<br/>
  去结交新友，而将旧友伤害；<br/>
  我要约束自己，视你为神明。<br/>
  　　欢迎我吧，我的第二个天国，<br/>
  　　最纯最亲的怀抱，请接受我！</p>
