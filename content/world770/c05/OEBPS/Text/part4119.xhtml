  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">39</h1>

  <p>在我的心坚硬焦躁的时候，请洒我以慈霖。</p>

  <p>当生命失去恩宠的时候，请赐我以欢歌。</p>

  <p>当烦躁的工作在四围喧闹，使我和外界隔绝的时候，</p>

  <p>我的宁静的主，请带着你的和平与安息来临。</p>

  <p>当我乞丐似的心，蹲闭在屋角的时候，</p>

  <p>我的国王，请你以王者的威仪破户而入。</p>

  <p>当欲念以诱惑与尘埃来迷蒙我的心眼的时候，</p>

  <p>啊，圣者，你是清醒的，请你和你的雷电一同降临。</p>
