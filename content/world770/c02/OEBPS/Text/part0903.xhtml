  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">厄运是没有大门的房子</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">厄运是没有大门的房子——</p>

  <p class="EB03BodyTextIndented">它从太阳那儿进来，</p>

  <p class="EB03BodyTextIndented">然后梯子被扔掉</p>

  <p class="EB03BodyTextIndented">因为逃跑没戏。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">外面它们都在干什么</p>

  <p class="EB03BodyTextIndented">在梦里情景各异，</p>

  <p class="EB03BodyTextIndented">当松鼠玩耍，野莓死掉——</p>

  <p class="EB03BodyTextIndented">万物向上帝躬身致意。</p>
