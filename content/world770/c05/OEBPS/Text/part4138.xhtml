  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">58</h1>

  <p>让一切欢乐的歌调都融和在我最后的歌中——</p>

  <p>那使大地草海欢呼摇动的快乐，那使生和死两个孪生兄弟，</p>

  <p>在广大的世界上跳舞的快乐，</p>

  <p>那含泪默坐在盛开的痛苦的红莲上的快乐，</p>

  <p>那不知所谓，把一切所有抛掷于尘埃中的快乐。</p>
</body></html>
