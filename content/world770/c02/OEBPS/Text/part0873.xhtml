  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">在我把我的眼睛弄瞎前</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">在我把我的眼睛弄瞎前，</p>

  <p class="EB03BodyTextIndented">我不妨也像其他</p>

  <p class="EB03BodyTextIndented">有眼睛的生命一样看，</p>

  <p class="EB03BodyTextIndented">不晓得还有其他办法。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">可要是告诉我，就今天，</p>

  <p class="EB03BodyTextIndented">我也许能自个儿拥有</p>

  <p class="EB03BodyTextIndented">整个天空，我告诉你我的心</p>

  <p class="EB03BodyTextIndented">就我的那么大小，会裂开。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">草地是我的，山脉是我的，——</p>

  <p class="EB03BodyTextIndented">所有的森林，无止尽的星星，</p>

  <p class="EB03BodyTextIndented">在我有限的双眼之间</p>

  <p class="EB03BodyTextIndented">我所能尽取的正午。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">点水的鸟儿的动作，</p>

  <p class="EB03BodyTextIndented">闪电连接的道路，</p>

  <p class="EB03BodyTextIndented">要喜欢尽由我的眼睛去看，——</p>

  <p class="EB03BodyTextIndented">这消息会让我呆若木鸡！</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">那么，安全点，仅以我搁在</p>

  <p class="EB03BodyTextIndented">窗台上的灵魂猜想</p>

  <p class="EB03BodyTextIndented">其他生命的眼睛也看着那儿，</p>

  <p class="EB03BodyTextIndented">而对太阳毫无戒备。</p>
