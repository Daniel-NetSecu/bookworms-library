  <title>爱的花园</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">爱的花园</h2>

  <p class="EB03BodyTextIndented">我来到爱的花园里面，</p>

  <p class="EB03BodyTextIndented">看到我从未见过的情形：</p>

  <p class="EB03BodyTextIndented">一座小教堂建在中央，</p>

  <p class="EB03BodyTextIndented">那儿原是我游戏的草坪。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">这座小教堂大门紧闭，</p>

  <p class="EB03BodyTextIndented">门上写着“不许”的字样，</p>

  <p class="EB03BodyTextIndented">我于是转向爱的花园，</p>

  <p class="EB03BodyTextIndented">许多花曾在那儿吐送芬芳。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">现在我看到的却是坟丘，</p>

  <p class="EB03BodyTextIndented">墓碑取代了昔日的花朵；</p>

  <p class="EB03BodyTextIndented">穿黑袍的神父来回转悠，</p>

  <p class="EB03BodyTextIndented">用刺蔷薇捆我的情欲和欢乐。</p>
</body></html>
