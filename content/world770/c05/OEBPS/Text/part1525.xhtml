  <h2 class="kindle-cn-heading2">82　爱</h2>

  <p class="kindle-cn-signature">勃朗宁</p>

  <p class="kindle-cn-poem-left">一年的时光就如此消逝！<br/>
  （爱我吧，永远！）<br/>
  整个三月忙忙碌碌，<br/>
  都在为四月的事操劳，<br/>
  五月有鲜花把我环抱，<br/>
  但六月就得分道扬镳。<br/>
  如今大雪在我身边飞扬，<br/>
  六月的热情早已消亡——<br/>
  （爱我吧，永远！）</p>
