<p class="title1" id="CHP29">LESSON 26</p>
<p class="picture"><img src="../Images/image01571.jpeg.webp" alt="alt"/></p>
<p class="normaltext">The boys are on the ice with their skates.</p>
<p class="normaltext">There is a stone on the ice.</p>
<p class="normaltext">One boy did not see it, and has had a fall.</p>
<p class="normaltext">But he is a brave boy, and will not cry.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">男孩们穿着溜冰鞋在滑冰。</p>
<p class="normaltext">冰上有块石头。</p>
<p class="normaltext">有个男孩没看见，摔了一跤。</p>
<p class="normaltext">但他是个勇敢的孩子，他不哭。</p>
