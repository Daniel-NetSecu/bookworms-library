  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">105</h1>

  <p class="kindle-cn-poem-left1">别把我的爱当作偶像崇拜，<br/>
  也别把我的爱人叫作偶像，<br/>
  因为我的诗歌和赞美向来<br/>
  只给一人，现在、将来都这样。<br/>
  我爱人今天温存，明天温存，<br/>
  他奇妙的美德将永远不变，<br/>
  我的诗也永远歌颂这坚贞，<br/>
  永远只写一件事，决不更换。<br/>
  “真善美”，就是我全部的主题，<br/>
  “真善美”，由此写出不同的诗，<br/>
  我的创造力就运用在这里，<br/>
  三者合一，描出风景的瑰奇。<br/>
  　　真善美，通常都是各自为政，<br/>
  　　我这里，三者同体，共存共生。</p>
