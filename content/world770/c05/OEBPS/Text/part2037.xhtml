  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">91</h1>

  <p class="kindle-cn-poem-left1">有些人爱炫耀门第或技艺，<br/>
  有些人好夸示财富或身躯，<br/>
  也有人不顾款式，吹嘘新衣，<br/>
  更有人得意于鹰犬或马驹。<br/>
  每一性情都有各自的乐趣，<br/>
  百乐之中，又有各自的最爱。<br/>
  但这都不是我心中的金曲，<br/>
  唯有一种欢乐，我独钟于怀，<br/>
  那就是你的爱，在我的眼里，<br/>
  它胜过门第、财富，贵过锦绣，<br/>
  比鹰犬和骏马更让我欢喜，<br/>
  有了你，人间至宝为我拥有。<br/>
  　　唯一担忧的是，它被你取走，<br/>
  　　那时我最穷酸，苦难无尽头。</p>
