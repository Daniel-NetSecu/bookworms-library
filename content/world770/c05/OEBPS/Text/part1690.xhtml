  <h2 class="kindle-cn-heading2">99. Oh, When I Was in Love with You</h2>

  <p class="kindle-cn-signature">——A. E. Housman</p>

  <p class="kindle-cn-poem-left">Oh, when I was in love with you,<br/>
  Then I was clean and brave,<br/>
  And miles around the wonder grew<br/>
  How well did I behave.</p>

  <p class="kindle-cn-poem-left">And now the fancy passes by,<br/>
  And nothing will remain,<br/>
  And miles around they'll say that I<br/>
  Am quite myself again.</p>
