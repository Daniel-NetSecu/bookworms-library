      <title>美国语文读本．1：汉英对照</title>

<p class="title1" id="CHP52">LESSON 49</p>
<p class="picture"><img src="../Images/image01596.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>I love my dear puss,</td>
    <td>我爱宝贝小猫咪，</td>
  </tr>
  <tr>
    <td>Her fur is so warm;</td>
    <td>她的毛发暖呼呼。</td>
  </tr>
  <tr>
    <td>And, if I don't hurt her,</td>
    <td>如果我不伤害她，</td>
  </tr>
  <tr>
    <td>She'll do me no harm.</td>
    <td>她也不会伤害我。</td>
  </tr>
</table>
<p class="normaltext"><br/></p>
<table class="table1">
  <tr>
    <td>I'll pat my dear puss,</td>
    <td>轻拍宝贝小猫咪，</td>
  </tr>
  <tr>
    <td>And then she will pur,</td>
    <td>它就喵喵喵地叫，</td>
  </tr>
  <tr>
    <td>And show me her thanks</td>
    <td>向我表达其谢意，</td>
  </tr>
  <tr>
    <td>For my kind deeds to her.</td>
    <td>因为对她很友好。</td>
  </tr>
</table>
</body></html>
