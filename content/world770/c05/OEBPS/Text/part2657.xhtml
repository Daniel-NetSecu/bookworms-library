  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">老狮子</h1>

  <p>有一只狮子，年老体衰，再也没有办法依靠力量去捕猎获得食物，于是便决定依靠狡诈来填饱肚子。他来到一个洞穴，躺在里面，假装生病了，如果有其他动物过来问候他，他便一跃而起，扑过去将他们吞下。大部分动物都因此丧生。有一天，一只狐狸来到山洞，问他身体怎样了。他说自己很不好。“你为什么站在外面呢？请你进来吧。”“我可能已经进去了，”狐狸回答，“如果我没有看到所有的脚印都是向着山洞的，却没有出来的。”</p>
