  <h2 class="kindle-cn-heading2">134　花园</h2>

  <p class="kindle-cn-signature">庞德</p>

  <p class="kindle-cn-ref">穿着节日的盛装。</p>

  <p class="kindle-cn-signature">——萨曼</p>

  <p class="kindle-cn-poem-left">像一团松散的丝吹到墙上，<br/>
  在肯辛顿花园，<br/>
  她沿着围栏行走，<br/>
  她的情绪十分低落，<br/>
  正一步步走向死亡。</p>

  <p class="kindle-cn-poem-left">她的周围有一群<br/>
  污秽的、强健的、生命力顽强的穷孩子。<br/>
  他们将继承这个世界。</p>

  <p class="kindle-cn-poem-left">她的生命已到尽头。<br/>
  她已极度地、超常地厌倦，<br/>
  她想跟什么人说说话，<br/>
  几乎有点惶惶不安，<br/>
  唯恐我会冒昧地与她交谈。</p>
