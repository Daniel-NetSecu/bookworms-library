  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">33</h1>

  <p class="kindle-cn-poem-left1">在无数明媚的早晨，我看见<br/>
  威严的太阳向众山峦献媚，<br/>
  金色的脸亲吻翠绿的草甸，<br/>
  天上的点金术点红了溪水；<br/>
  但倏忽间，他让卑贱的云霭<br/>
  以丑陋的形貌亵渎了圣颜，<br/>
  使寂寞的人间难睹其神采，<br/>
  带着羞愧，他只有遁避西山。<br/>
  我的太阳也如此：某日凌晨，<br/>
  还以万丈光芒照我的前额，<br/>
  但好光景仅维持一个时辰，<br/>
  天上的乌云已将我们分隔。<br/>
  　　为了爱，我不会因此而言弃，<br/>
  　　天日易蒙污，人间的也如是。</p>
