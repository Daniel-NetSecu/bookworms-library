  <title>百灵鸟和农夫</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">百灵鸟和农夫</h1>

  <p>百灵鸟在一片玉米地里面筑巢栖息，她把雏鸟藏在成熟的谷物下面，小鸟的翅膀还没有长好。有一天农民过来检查庄稼，看到穗子都黄了，便说：“我得尽快叫邻居过来帮忙收庄稼了。”其中一只小鸟听到了他的话恐惧不已，便问妈妈他们是否应该立刻搬家。“不用着急，”百灵鸟说，“一个总是找人来帮忙的人，根本不会把自己的时间当回事。”过了几天，那农夫又来了，看到庄稼已经熟透了，有的粮食都从穗子中脱落掉到了地上。他说：“我真是不能再拖了，今天我就雇人让他们立刻开始工作。”百灵鸟听到他的话，对孩子们说：“来吧，孩子们，我们必须得走了，他已经不再说朋友了，而是自己来处理事情了。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：自助是最好的帮助。</p>
