  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">黄鼠狼与人</h1>

  <p>有一个人抓住了一只黄鼠狼，那只黄鼠狼一直在他家房子周围窥探。这人想把黄鼠狼压入水盆中淹死，黄鼠狼向人求情道：“你要把我杀死，还有没有良心啊？你想想我有多大用处啊，把在你房子里面捣蛋的老鼠和蜥蜴都替你清理干净了，你应该饶了我的命，来报答我。”“我承认你的确不是一无是处，但是谁把鸡给杀了的？是谁偷了肉的？不，不！你的害处比好处大多了，你必须得死！”</p>
