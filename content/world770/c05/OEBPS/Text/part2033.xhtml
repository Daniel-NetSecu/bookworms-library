  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">87</h1>

  <p class="kindle-cn-poem-left1">再见！你太珍贵，我不配拥有，<br/>
  你好像也知道自己的价值；<br/>
  你有特权，可随意与我分手，<br/>
  我们间的盟约，就至此终止。<br/>
  我得到你，怎能不经你首肯？<br/>
  我何才何能，获取这笔资产？<br/>
  这份礼，我没有享受的福分，<br/>
  只能选择放弃，将原物奉还。<br/>
  你爱过我，因你未认识自身，<br/>
  或者认错了人，才将爱送出；<br/>
  这份厚礼就在误会中生成，<br/>
  如今明断是非，终于归原主。<br/>
  　　我曾经拥有你，就像一场梦，<br/>
  　　我在梦中称王，醒来一场空。</p>
