<p class="title1">内容简介</p>
<p class="normaltext2">你是一位著名的科学家，正在和你的助手乔一起在实验室工作。你在对一朵小花进行实验。这朵花很特别，它可以帮助人们在黑暗中看到东西。</p>
<p class="normaltext2">但是有人拿走了这朵特别的花，你也找不到乔了。他就是小偷吗，还是另有其人？你接下来会怎么做呢？你会去乔的房间，还是在实验室里寻找，又或者打电话给你的老板呢？注意——只有一种方法可以重新找回这朵特别的花。但是你要迅速行动——时间不多了。</p>
