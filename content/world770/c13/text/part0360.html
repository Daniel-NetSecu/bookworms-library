  <p class="para-center3">Alice, you cannot live your life to please others.</p>

  <p class="para-center3">The choice must be yours because when you step out to face that creature, you will step out alone.</p>

  <p class="para-center3">爱丽丝，你不需要为了取悦别人而活。</p>

  <p class="para-center3">你必须自己做出选择，因为当你站出来面对那个怪物时，你将是孤军奋战。</p>
