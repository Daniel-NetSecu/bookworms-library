  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">84</h1>

  <p class="kindle-cn-poem-left">黄绿的稻田上掠过秋云的阴影，后面是狂追的太阳。<br/>
  蜜蜂被光明所陶醉，忘了吸蜜，只痴呆地飞翔嗡唱。<br/>
  河里岛上的鸭群，无缘无故地欢乐地吵闹。<br/>
  我们都不回家吧，兄弟们，今天早晨我们都不去工作。<br/>
  让我们以狂风暴雨之势占领青天，让我们飞奔着抢夺空间吧。<br/>
  笑声飘浮在空气上，像洪水上的泡沫。<br/>
  弟兄们，让我们把清晨浪费在无用的歌曲上面吧。</p>
