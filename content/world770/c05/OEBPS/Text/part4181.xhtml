  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">101</h1>

  <p>我这一生永远以诗歌来寻求你。</p>

  <p>它们领我从这门走到那门，我和它们一同摸索、寻求着，</p>

  <p>接触着我的世界。</p>

  <p>我所学过的功课，都是诗歌教给我的；</p>

  <p>它们把捷径指示给我，</p>

  <p>它们把我心里地平线上的许多星辰，</p>

  <p>带到我的眼前。</p>

  <p>它们整天地带领我走向苦痛和快乐的神秘之国，</p>

  <p>最后，在我旅程终点的黄昏，</p>

  <p>它们要把我带到哪一座宫殿的门首呢？</p>
