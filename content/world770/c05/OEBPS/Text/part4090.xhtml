  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">10</h1>

  <p>这是你的脚凳，你在最贫最贱最失所的人群中歇足。</p>

  <p>我想向你鞠躬，我的敬礼不能达到你歇足地方的深处——</p>

  <p>那最贫最贱最失所的人群中。</p>

  <p>你穿着破敝的衣服，在最贫最贱最失所的人群中行走，</p>

  <p>骄傲永远不能走近这个地方。</p>

  <p>你和那最贫最贱最失所的人们当中没有朋友的人做伴，</p>

  <p>我的心永远找不到那个地方。</p>
