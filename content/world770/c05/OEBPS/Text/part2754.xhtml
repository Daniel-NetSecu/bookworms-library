  <title>驴、公鸡和狮子</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">驴、公鸡和狮子</h1>

  <p>有一只驴和一只公鸡一起住在畜栏里。过了一段时间，有一只饿了好几天的狮子来到这里，他要攻击驴，想把驴吃掉，公鸡便飞到最高处，猛烈地拍打翅膀，大声叫唤。而狮子唯一害怕的事情就是公鸡打鸣，他一听到公鸡的叫声便逃走了。驴兴高采烈，精神高涨，觉得狮子既然都不敢面对公鸡，那要对抗驴便更不可能。所以他跑出去追狮子。等他们两个走得远了，他们再也看不见听不见公鸡的时候，狮子便突然转身向驴发动攻击，将他吃掉了。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：盲目的自信通常会导致灾祸。</p>
</body></html>
