  <title>北风和太阳</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">北风和太阳</h1>

  <p>北风和太阳之间起了争执，他们都认为自己比对方强大。最后，他们两个决定比一比，看谁能让一个走路的人更快脱掉斗篷。北风先开始，他聚集起所有的力量发动攻击，呼啸着袭向那个人，想凭借一己之力将他的斗篷扯下来。但是他越是用力，那个人把斗篷裹得越紧。然后轮到太阳出手了。起初他只是柔和地照着路人，路人很快松开了斗篷，任斗篷松松垮垮地搭在肩上。最后太阳开始发威，光芒四射，路人没走几步便将斗篷脱了下来，轻装上路。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：劝说比武力更有效。</p>
</body></html>
