  <h2 class="kindle-cn-heading2">61　昏睡封闭起我的神志</h2>

  <p class="kindle-cn-signature">华兹华斯</p>

  <p class="kindle-cn-poem-left">昏睡封闭起我的神志，<br/>
  我没有了人类的恐惧：<br/>
  她好像变成了一件物体，<br/>
  感觉不到岁月的触须。</p>

  <p class="kindle-cn-poem-left">她如今静止不动，气力丧失；<br/>
  既不能听，也不能看；<br/>
  每天与岩石、树木一起<br/>
  随地球不停地旋转。</p>
