<h1 class="title1" id="CHP4">内容简介</h1>
<p class="normaltext2">人们常说，有情人终成眷属。然而，通往爱的道路常常是艰难的。人们会说错话、做错事、措辞不当、犯错误、误解对方……</p>
<p class="normaltext2">第一个故事中，卢克和杰玛在讨论一个爱的计划。然而，是谁在做计划？又是为了谁做的计划？这是一个怎样的计划？你能为假期、坐火车旅行或是一项工作做计划，但是你真的能为爱做计划吗？</p>
<p class="normaltext2">第二个故事中，萨姆在向日葵咖啡店为女友露西筹备了一份大惊喜。萨姆做了美味的蛋糕，而且那份大惊喜的构思也很好。不过，露西是怎么想的？</p>
<p class="normaltext2">最后一个故事中，阿尔玛回到自己阔别六年的家乡。她感到很难过，因为她无法忘掉尼娜和德拉甘的故事。尼娜是阿尔玛的妹妹，她曾和一位名叫德拉甘的年轻男子相爱……</p>
