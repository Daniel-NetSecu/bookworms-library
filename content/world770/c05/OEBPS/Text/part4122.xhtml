  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">42</h1>

  <p>在清晓的密语中，我们约定了同去泛舟。</p>

  <p>世界上没有一个人知道我们这无目的、无终止的遨游。</p>

  <p>在无边的海洋上，在你静听的微笑中，</p>

  <p>我的歌唱抑扬成调，像海波一般地自由，不受字句的束缚。</p>

  <p>时间还没有到吗？</p>

  <p>你还有工作要做吗？</p>

  <p>看吧，暮色已经笼罩海岸，苍茫里海鸟已群飞归巢。</p>

  <p>谁知道什么时候可以解开链索，</p>

  <p>这只船会像落日的余光，消融在黑夜之中呢？</p>
