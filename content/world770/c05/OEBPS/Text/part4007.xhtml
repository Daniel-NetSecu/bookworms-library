  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">15</h1>

  <p class="kindle-cn-poem-left">我像麝鹿一样在林荫中奔走，<br/>
  为着自己的香气而发狂。<br/>
  夜晚是五月正中的夜晚，<br/>
  清风是南国的清风。<br/>
  我迷了路，我游荡着，<br/>
  我寻求那得不到的东西，<br/>
  我得到我所没有寻求的东西。<br/>
  我自己的愿望的形象从我心中走出，<br/>
  跳起舞来。<br/>
  这闪光的形象飞掠过去。<br/>
  我想把它紧紧捉住，<br/>
  它躲开了又引着我飞走下去。<br/>
  我寻求那得不到的东西，<br/>
  我得到我所没有寻求的东西。</p>
