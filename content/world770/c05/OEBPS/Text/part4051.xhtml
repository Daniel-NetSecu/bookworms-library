  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">59</h1>

  <p class="kindle-cn-poem-left">啊，女人，你不但是神的，而且是人的手工艺品，<br/>
  他们永远从心里用美来打扮你。<br/>
  诗人用比喻的金线替你织网，<br/>
  画家们给你的身形以永新的不朽。<br/>
  海献上珍珠，矿献上金子，夏日的花园献上花朵来装扮你，<br/>
  覆盖你，使你更加美妙。<br/>
  人类心中的愿望，在你的青春上洒上光荣。<br/>
  你一半是女人，一半是梦。</p>
