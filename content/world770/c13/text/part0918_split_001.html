<h2 class="heading" id="calibre_pb_0">Mike Wazowski</h2>

  <p class="p">He is a bright green, spherical monster with one large green eye, two small horns on his head, and thin arms and legs attached to either side of his torso. He is funny, smart, brave, but can sometimes fail to see the obvious in a situation. He also has a big ego.</p>
