  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">97</h1>

  <p class="kindle-cn-poem-left1">与你的别离，就像严冬降临，<br/>
  飞逝的岁月里失去了欢乐！<br/>
  我感到寒冷，目睹天日晦暝，<br/>
  无处不是腊月隆冬的萧瑟！<br/>
  当初与你分别，正好是夏季，<br/>
  多产的秋天，因果实而丰满，<br/>
  像死了丈夫的寡妇，子宫里<br/>
  承载着春天纵情后的负担。<br/>
  然而，对于我，这丰赡的果实<br/>
  只是一个孤儿，生来就无父：<br/>
  夏天和欢乐都忙于伺候你，<br/>
  你不在时，鸟儿也沉默无语。<br/>
  　　鸟儿即使歌唱，也唱得低沉，<br/>
  　　树叶为之枯萎，怕冬天降临。</p>
