  <title>下金蛋的鹅</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">下金蛋的鹅</h1>

  <p>一对夫妻非常走运，他们有一只会下金蛋的鹅，这只鹅每天都能下一个金蛋。尽管如此走运，但没多久他们就开始觉得他们富裕起来的速度不够快，于是猜测那只鹅的身体里肯定也全都是金子，于是他们决定把鹅杀了，一次性地将里面的财宝都拿到。但是当他们把鹅开膛破肚，却发现那只鹅和普通的鹅没有什么区别。因此，他们没有像他们所期望的那样一下子变成有钱人，而且再也无法享受到财富每天都有所增加的幸福了。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：贪得无厌者满盘皆输。</p>
</body></html>
