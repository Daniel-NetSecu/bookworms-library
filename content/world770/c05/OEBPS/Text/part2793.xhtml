  <title>驮驴和野驴</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">驮驴和野驴</h1>

  <p>一只四处闲逛的野驴有一天碰到了一只驮驴，驮驴平躺在地上晒着太阳，看上去十分享受。他走上前去，说：“你可真是个好命的牲口啊！你的皮毛光滑，说明你生活得很好，我真是嫉妒你啊！”没多久，野驴又看到了驮驴，这次驮驴运载着沉重的货物，赶驴的人跟在后面，拿一根粗棍子打着他。野驴说：“啊呀，我的朋友，我再也不嫉妒你了，你为了享受舒适付出的代价可是很昂贵的。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：付出高昂代价换来的好处很难说是福分。</p>
</body></html>
