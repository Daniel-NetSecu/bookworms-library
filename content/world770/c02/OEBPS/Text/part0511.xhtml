  <title>冰冷的天穹</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">冰冷的天穹</h2>

  <p class="EB03BodyTextIndented">突然我看见令乌鸦愉悦的寒冷的天穹，</p>

  <p class="EB03BodyTextIndented">像是焚烧的冰，但不过是更多的冰，</p>

  <p class="EB03BodyTextIndented">因此，想象和心被牵引得</p>

  <p class="EB03BodyTextIndented">如此狂野，以至于种种随意的想法</p>

  <p class="EB03BodyTextIndented">消失了，只剩记忆，而那应当消失，</p>

  <p class="EB03BodyTextIndented">随青春的热血，以及很久以前受挫的爱；</p>

  <p class="EB03BodyTextIndented">我丧失所有的情感和理智去承担责备，</p>

  <p class="EB03BodyTextIndented">直到我呼喊，颤抖，来回摇晃，</p>

  <p class="EB03BodyTextIndented">被光线击穿得千疮百孔。啊！当鬼魂开始复活，</p>

  <p class="EB03BodyTextIndented">临终之床的混乱结束，它是否</p>

  <p class="EB03BodyTextIndented">被赤裸地派到街上，像书里说的，</p>

  <p class="EB03BodyTextIndented">遭受天空不公正的袭击，以示惩戒？</p>
</body></html>
