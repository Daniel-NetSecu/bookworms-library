  <title>父亲和女儿</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">父亲和女儿</h1>

  <p>一个男人有两个女儿，他把其中一个嫁给了一个园丁，另一个嫁给了一个制陶工人。一段时间之后，他想他应该去看看两个女儿过得怎么样了。他先去看了园丁的妻子，问她过得如何，和丈夫好不好。她说他们大体上都挺好的。“只是我真希望能够下上一场大雨，花园很缺水。”然后他又去看了制陶工的妻子，问了她同样的问题。她回答她和丈夫也都没有什么要抱怨的。“只是，我真希望天能干燥些，这样陶器才能变干。”父亲的脸上浮现出好笑的表情。“你想要干燥的天气，而你姐姐却希望能下雨。我本来想帮你姐姐祈祷，但现在看来，我还是别提这件事情了。”</p>
