  <h2 class="kindle-cn-heading2">68. A Song</h2>

  <p class="kindle-cn-signature">——P. B. Shelley</p>

  <p class="kindle-cn-poem-left">A widow bird sate mourning for her love<br/>
  Upon a wintry bough;<br/>
  The frozen wind crept on above<br/>
  The freezing stream below.</p>

  <p class="kindle-cn-poem-left">There was no leaf upon the forest bare,<br/>
  No flower upon the ground,<br/>
  And little motion in the air<br/>
  Except the mill-wheel's sound.</p>
