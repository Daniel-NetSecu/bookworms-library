<h1 class="title1">内容简介</h1>
<p class="normaltext">世界书林中不乏著名的侦探——洛杉矶的菲利普·马洛、芝加哥的维克·沃肖斯基、牛津的莫尔斯巡官，当然，还有来自伦敦的神奇的舍洛克·福尔摩斯。然而出现在所有这些名探之前的是巴黎的奥古斯特·杜邦先生。</p>
<p class="normaltext">他并非警官，也不是一个真正的侦探。他是一个性格温和酷爱书籍和阅读的年轻人。但是他聪明至极，理解能力高人一等。他对莫尔格街发生的可怕的凶杀案产生了浓厚的兴趣，因为它是一个未解之谜。是谁杀害了老太太和她的女儿？这场凶杀案为何如此粗暴凶残？凶手又是如何逃出房子的？有众多谜团——却没有谜底。</p>
<p class="normaltext">“诀窍，”奥古斯特·杜邦说，“在于问<span class="xx">恰当</span>的问题。然后就可以找到谜底……”</p>
