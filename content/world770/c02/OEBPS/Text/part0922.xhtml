  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">Is Heaven a physician?</h2>

  <p class="EB03BodyTextIndented">Is Heaven a physician?</p>

  <p class="EB03BodyTextIndented">They say that He can heal;</p>

  <p class="EB03BodyTextIndented">But medicine posthumous</p>

  <p class="EB03BodyTextIndented">Is unavailable.</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">Is Heaven an exchequer?</p>

  <p class="EB03BodyTextIndented">They speak of what we owe;</p>

  <p class="EB03BodyTextIndented">But that negotiation</p>

  <p class="EB03BodyTextIndented">I’m not a party to.</p>
