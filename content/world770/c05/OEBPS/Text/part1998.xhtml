  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">52</h1>

  <p class="kindle-cn-poem-left1">我像个富翁，有一把宝钥匙，<br/>
  可用它来打开锁着的宝藏；<br/>
  我不会时时日日将它开启，<br/>
  怕的是迟钝了享乐的锋芒。<br/>
  同理，盛大的节日也不多见，<br/>
  漫长的一年中只有三两次，<br/>
  就像珍贵的宝石少有镶嵌，<br/>
  项链上的珠宝排列得稀疏。<br/>
  时间是我的宝库，珍藏着你，<br/>
  或者像衣橱，藏着锦缎华服，<br/>
  囚禁的荣耀一旦适时开释，<br/>
  那一刻便是你特殊的幸福。<br/>
  　　你有福，因为你的美德无限，<br/>
  　　见到你，我狂喜；不见时，思念。</p>
