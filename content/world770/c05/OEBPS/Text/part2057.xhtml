  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">111</h1>

  <p class="kindle-cn-poem-left1">哟，你得为我谴责命运女神，<br/>
  我行为不端，她应为此负责，<br/>
  她未提供好职业让我谋生，<br/>
  只让我登台亮相，看人眼色。<br/>
  我的名字由此打上了烙印，<br/>
  我的本性也只好委曲求全，<br/>
  一如染工，只好让颜料沾身。<br/>
  怜悯我吧，愿我能回归本原，<br/>
  像病人治病，我甘愿去吞服<br/>
  一剂苦药，以治疗我的重症；<br/>
  不管这药多苦，我不当它苦，<br/>
  为悔过，我甘受加倍的严惩。<br/>
  　　怜悯我吧，爱友，你可以相信，<br/>
  　　你的怜悯就能治好我的病。</p>
