  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">缄默的火山藏着</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">缄默的火山藏着</p>

  <p class="EB03BodyTextIndented">他永不休眠的计划；</p>

  <p class="EB03BodyTextIndented">不向任何靠不住的人</p>

  <p class="EB03BodyTextIndented">吐露他粉色的规划。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">如果自然不讲</p>

  <p class="EB03BodyTextIndented">耶和华告诉她的故事，</p>

  <p class="EB03BodyTextIndented">难道没有一个倾听者</p>

  <p class="EB03BodyTextIndented">人性就不能够幸存？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">被她紧扣的双唇告诫</p>

  <p class="EB03BodyTextIndented">让多嘴的人随便。</p>

  <p class="EB03BodyTextIndented">人所藏着的唯一秘密</p>

  <p class="EB03BodyTextIndented">是不朽。</p>
</body></html>
