  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">78</h1>

  <p class="kindle-cn-poem-left1">我常常召唤你做我的缪斯，<br/>
  在我的诗里得到你的惠顾，<br/>
  别的文人也从我获得启示，<br/>
  受你的庇护发表他的诗赋。<br/>
  你的眼能教哑巴放声高唱，<br/>
  能让笨拙的愚顽飞翔天空，<br/>
  你用羽毛装饰学人的翅膀，<br/>
  赋予温良雅士双倍的雍容。<br/>
  请为我而自豪吧，我写的诗<br/>
  全凭你的感召，为你而抒发；<br/>
  别人的作品，你只在意润饰，<br/>
  给他们的诗艺附染些优雅；<br/>
  　　但你是我的全部，我的愚钝<br/>
  　　经过你的点拨，升华为学问。</p>
