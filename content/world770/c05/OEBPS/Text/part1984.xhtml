  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">38</h1>

  <p class="kindle-cn-poem-left1">怎能说我的缪斯缺乏题材？<br/>
  你活着，你就将甜美的意趣<br/>
  注入我的诗行中，别出心裁，<br/>
  任何凡庸之徒都无法描述。<br/>
  如果我写下的值得你一看，<br/>
  应该感谢的人还是你自己：<br/>
  正是你赋予我创作的灵感；<br/>
  不知赞美的人，与哑巴无异。<br/>
  你是第十位缪斯，那前九位<br/>
  虽能激发诗情，但你强十倍；<br/>
  拜访你的诗人受你的恩惠，<br/>
  写出的诗能传之千秋万辈。<br/>
  　　如果我的微才能取悦时世，<br/>
  　　那我付出辛劳，你获得赞词。</p>
