  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1" title="仁慈">仁慈<span class="math-super"><a id="noteBack_1" href="part3262.xhtml#note_1">[1]</a></span></h1>

  <p class="kindle-cn-poem-left">仁慈弥漫在我房子周围。<br/>
  仁慈夫人，她如此善良！<br/>
  戒指上的红蓝珠宝光泽弥散<br/>
  在窗户里，多重镜子<br/>
  正装满微笑。<br/>
  <br/>
  什么与孩子的哭声一样真实？<br/>
  兔子的叫喊也许更狂野<br/>
  但它没有灵魂。<br/>
  蔗糖可以治愈一切，仁慈说。<br/>
  蔗糖是必备的流质，<br/>
  <br/>
  它的颗颗晶体似敷药。<br/>
  哟，仁慈，仁慈<br/>
  亲切地捡起那些碎片！<br/>
  我的日本丝绸，绝望的蝴蝶，<br/>
  可能随时被钉住，被麻醉。<br/>
  <br/>
  然后你来了，带着一杯茶<br/>
  蒸汽缭绕。<br/>
  诗是血的喷涌，<br/>
  根本无法停止。<br/>
  你交给我两个孩子，两朵玫瑰。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part3262.xhtml#noteBack_1">[1]</a>这首诗的汉译最早发表在《译林》2015年第3期。</p>
