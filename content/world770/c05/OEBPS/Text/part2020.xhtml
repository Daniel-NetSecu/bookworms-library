  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">74</h1>

  <p class="kindle-cn-poem-left1">当那凶残的狱吏将我带走，<br/>
  且保释无望，但你仍可心安：<br/>
  我的生命已在这诗中保留，<br/>
  作为纪念物，永留在你身边。<br/>
  你将看到——只要你重读这诗，<br/>
  我向你献出的是我的灵魂。<br/>
  泥土得到泥土，乃天经地义，<br/>
  我占有精神，那最美的部分。<br/>
  你失去的只是生命的渣滓——<br/>
  蛆虫的猎物，我已死的肉体，<br/>
  恶徒屠刀征服的懦弱竖子，<br/>
  它太低贱，不值得你去铭记。<br/>
  　　身之所值，全在于它的内涵，<br/>
  　　这内涵就是诗，与你长相伴。</p>
