<h1 class="title1" id="CHP3">内容简介</h1>
<p class="normaltext2">埃迪是臭名昭著的“红面具团伙”中的一员银行劫匪。上一次抢劫银行后，他自觉成了富人。他在山中美丽的蓝湖木屋山庄租下了一座木屋。一天，埃迪开车出去兜风。雨中的山路十分危险。</p>
<p class="normaltext2">突然，埃迪的汽车冲出了公路。</p>
<p class="normaltext2">“啊，不好！”埃迪叫道。</p>
<p class="normaltext2">然而，一切都太迟了。他无法把车停下。</p>
<p class="normaltext2">埃迪死了。但他留下了从银行抢来的三千美元。</p>
<p class="normaltext2">作家卡尔·德克斯特发现了这笔钱。起初，他很兴奋。</p>
<p class="normaltext2">但没过多久就有人来找这笔钱，而且来人很危险……</p>
