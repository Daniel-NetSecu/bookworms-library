  <title>驴和主人</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">驴和主人</h1>

  <p>有一个园丁有一只驴，他对驴非常不好，食物不足，负担沉重，还经常殴打他。因此，驴恳求朱庇特能让他离开园丁，换一个主人。于是朱庇特派墨丘利去见园丁，说服他将驴卖掉，园丁照办了。但是驴依然不满，因为他现在要干的活儿比过去更多了，所以他又去求朱庇特，朱庇特欣然同意，驴被卖给了一个制革工人。但是当驴看到新主人的行当后，绝望地哭了。“为什么我要对过去的主人不满呢？尽管我需要干活，受到的待遇也不好，但等我死了他们会将我体面地埋了，而现在呢，我却会变成皮瓮了。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：仆人在遇到更坏的主人前，不知道自己的主人是好的。</p>
</body></html>
