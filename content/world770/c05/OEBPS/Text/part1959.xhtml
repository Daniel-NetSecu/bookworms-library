  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">13</h1>

  <p class="kindle-cn-poem-left1">哟，但愿你是你自己！我的爱，<br/>
  要成为自己，你得活在世上；<br/>
  你该准备对抗末日的到来，<br/>
  可爱的仪容得交他人收藏。<br/>
  只有这样，你租赁所得的美<br/>
  才不会终结，你可爱的儿孙<br/>
  将拥有你无比俊秀的体态，<br/>
  那时你才真正拥有你自身。<br/>
  谁甘心这华美的屋宇倒塌，<br/>
  而不想勤勉维护，以便抵抗<br/>
  冬天狂风暴雨的猛吹乱打<br/>
  以及死神摧毁一切的凶狂？<br/>
  　　我的爱，那种人是不肖之徒！<br/>
  　　你有令尊，你的儿子应有父。</p>
