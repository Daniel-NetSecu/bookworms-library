  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">96</h1>

  <p class="kindle-cn-poem-left1">有人说你放荡，过错在年轻，<br/>
  有人说你浪漫，年轻是优点，<br/>
  无论优点缺点，都见爱于人，<br/>
  你给常犯的过错镶上金边。<br/>
  最贱的宝石也会倍增价值，<br/>
  只要它戴在皇后的手指上；<br/>
  那些出现在你身上的过失，<br/>
  也这样由假变真，受到颂扬。<br/>
  如果恶狼穿上羔羊的外衣，<br/>
  不知有多少羔羊将被凌辱；<br/>
  只要你愿意，滥施你的魅力，<br/>
  该有多少仰慕者被你俘虏！<br/>
  　　别一意孤行了，我深爱着你，<br/>
  　　你的就是我的，那名誉也是。</p>
