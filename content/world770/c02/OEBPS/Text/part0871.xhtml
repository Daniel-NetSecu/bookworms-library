  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">老天是个医生吗？</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">老天是个医生吗？</p>

  <p class="EB03BodyTextIndented">他们说他能治病；</p>

  <p class="EB03BodyTextIndented">可是死后的药</p>

  <p class="EB03BodyTextIndented">不可得。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">老天是座金库吗？</p>

  <p class="EB03BodyTextIndented">他们谈论我们所拥有的；</p>

  <p class="EB03BodyTextIndented">可是那种磋商</p>

  <p class="EB03BodyTextIndented">我不是加入其中的一员。</p>
