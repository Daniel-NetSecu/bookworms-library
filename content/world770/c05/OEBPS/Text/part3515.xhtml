  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">9</h1>

  <p>于是白鲁因熊走近国王面前，说道——</p>

  <p>“慈悯的主，我的王，请你代我报仇，惩罚那个狡兽列那，我因为致你的使命，被他弄得如此。我的两只前足，我的双颊，我的双耳，都因他的奸谋而失去了。”</p>

  <p>国王说道：“这个伪贼列那怎么敢如此？我对你说，白鲁因，我立誓要为你报仇。”</p>

  <p>他召集大臣们，商议怎样处置列那。会议的结果是再叫人去召他来听审。他们想，特保猫奉行这个使命最适宜的，因为他很聪明。国王也以为是。</p>
