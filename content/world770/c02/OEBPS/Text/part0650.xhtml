  <h2 class="EB04MainHeadClosedTitle">核桃树</h2>

  <p class="EB03BodyTextIndented">一棵长在路边的核桃树结出了许多核桃。为了得到核桃，路过的人们用木棍或石头击打它的枝干。核桃树哀怨道：“哦！可怜的我！我用果实取悦那些人，他们却用疼痛来回报我！”</p>
