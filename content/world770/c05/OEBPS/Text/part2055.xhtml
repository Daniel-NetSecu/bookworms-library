  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">109</h1>

  <p class="kindle-cn-poem-left1">别离后，我的热情似有减弱，<br/>
  但千万别把我当作负心汉，<br/>
  我恨自己不能将肉身摆脱，<br/>
  像灵魂那样留驻在你心坎！<br/>
  你的心就是我的爱的家园，<br/>
  我如漫游过，也是浪子回头，<br/>
  准时而归，爱心未因时而变：<br/>
  我自备净水，可洗我的污垢。<br/>
  虽然世人常有的那些弱点，<br/>
  我天性中也有，但请你牢记：<br/>
  我决不至于那样荒唐鄙贱，<br/>
  无缘无故把你这瑰宝抛弃。<br/>
  　　这浩瀚的天宇，我视为无物，<br/>
  　　唯你是我的玫瑰，我的全部。</p>
