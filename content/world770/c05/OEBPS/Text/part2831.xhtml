  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">蛇和朱庇特</h1>

  <p>蛇受够了总是被人类和兽类践踏，认为这种命运是因为自己长得太长了，而且他没有办法抬高身体。于是，他找到朱庇特，向他抱怨这种风险。朱庇特却不同情他。“我得说，如果你从一开始就把踩了你的人咬上一口，那以后的人就会仔细研究一下在何处落脚了。”</p>
