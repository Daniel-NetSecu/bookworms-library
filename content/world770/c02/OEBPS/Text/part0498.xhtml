  <title>当你老了</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">当你老了</h2>

  <p class="EB03BodyTextIndented">当你老了，头发灰白，满是睡意，</p>

  <p class="EB03BodyTextIndented">在炉火旁打盹，请取下这本书，</p>

  <p class="EB03BodyTextIndented">慢慢读着，怀想你的双眼</p>

  <p class="EB03BodyTextIndented">曾有过的神情柔和，以及阴影深沉；</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">多少人爱你绚烂优雅的时刻，</p>

  <p class="EB03BodyTextIndented">爱你的美丽，带着假意或真心，</p>

  <p class="EB03BodyTextIndented">但有一人爱你朝圣者的灵魂，</p>

  <p class="EB03BodyTextIndented">爱你容颜变换的忧伤。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">垂下头，在闪光的炉栅旁，</p>

  <p class="EB03BodyTextIndented">怀着一丝悲伤，轻声诉说</p>

  <p class="EB03BodyTextIndented">爱如何消逝，如何步入头顶的群山</p>

  <p class="EB03BodyTextIndented">将他的脸庞掩藏在星辰之间。</p>
</body></html>
