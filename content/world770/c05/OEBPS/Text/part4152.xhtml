  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">72</h1>

  <p>就是他，那最深奥的，用他深隐的摩触使我清醒。</p>

  <p>就是他把神符放在我的眼上，</p>

  <p>又快乐地在我心弦上弹弄出种种哀乐的调子。</p>

  <p>就是他用金、银、青、绿的灵幻的色丝，</p>

  <p>织起幻境的披纱。他的脚趾从衣褶中外露。</p>

  <p>在他的摩触之下，我忘却了自己。</p>

  <p>日来年往，就是他永远以种种名字、种种姿态、</p>

  <p>种种的深悲和极乐，来打动我的心。</p>
