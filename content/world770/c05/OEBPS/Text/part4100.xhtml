  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">20</h1>

  <p>莲花开放的那天，唉，我不自觉地心魂飘荡。</p>

  <p>我的花篮空着，花儿我也没有去理睬。</p>

  <p>不时地有一段的幽愁来袭击我。</p>

  <p>我从梦中惊起，觉得南风里有一阵奇香的芳踪。</p>

  <p>这迷茫的温馨，使我向往得心痛，</p>

  <p>我觉得这仿佛是夏天渴望的气息，寻求圆满。</p>

  <p>我那时不晓得它离我是那么近，</p>

  <p>而且是我的，这完美的温馨，</p>

  <p>还是在我自己心灵的深处开放。</p>
