  <h2 class="kindle-cn-heading2">27　别再哭泣</h2>

  <p class="kindle-cn-signature">弗莱彻<span class="math-super"><a id="noteBack_1" href="part1470.xhtml#note_1">[1]</a></span></p>

  <p class="kindle-cn-poem-left">别再哭泣，别再叹息，别再呻吟，<br/>
  悲伤唤不回已经消逝的时间：<br/>
  紫罗兰一旦摘下，最甘美的雨<br/>
  也无法使它复活，生长如故。<br/>
  理好你的头发，显得快活一点；<br/>
  命运所隐藏的企图，眼睛看不见。<br/>
  欢乐像长翅膀的梦很快飞逝，<br/>
  为何偏偏要将悲伤久久留住？<br/>
  忧愁只是痛苦的一个创伤，<br/>
  温柔的美人呀，别再惆怅。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1470.xhtml#noteBack_1">[1]</a>约翰·弗莱彻（John Fletcher，1579—1625），剧作家、诗人。生于名门望族，其父曾任伦敦主教。在剑桥的圣体学院接受教育。曾与鲍蒙特、梅辛格、莎士比亚等人合作写过多部戏剧。与莎士比亚合作写的两部剧目是《两个高贵的亲戚》《亨利八世》。</p>
