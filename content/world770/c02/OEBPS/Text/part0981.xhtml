  <h3 class="EB04MainHead2" title="泪水">泪水<sup><a id="z27" href="part0989.xhtml#bz27">[27]</a></sup></h3>

  <p class="EB03BodyTextIndented">泪水！泪水！泪水！</p>

  <p class="EB03BodyTextIndented">黑夜里，孤独时，泪水，</p>

  <p class="EB03BodyTextIndented">在白色海岸上滴落，滴落，被沙滩吮干，</p>

  <p class="EB03BodyTextIndented">泪水，一颗星星也不闪，处处幽暗而荒凉，</p>

  <p class="EB03BodyTextIndented">从蒙头人的眼睛里流出潮湿的泪水；</p>

  <p class="EB03BodyTextIndented">啊，那幽灵是谁？那幽暗中流泪的影子是谁？</p>

  <p class="EB03BodyTextIndented">那不成形状的一团，弯着腰，蹲在沙滩上的是什么？</p>

  <p class="EB03BodyTextIndented">涌流的泪水，抽泣的泪水，挣扎，间杂着喘气的放声号哭；</p>

  <p class="EB03BodyTextIndented">啊，暴风雨，凝聚了，升腾了，在海滩一带横冲直撞！</p>

  <p class="EB03BodyTextIndented">啊，狂野阴森的黑夜暴雨，挟着风—啊，狠狠地喷射！</p>

  <p class="EB03BodyTextIndented">啊，白天里那么文静有礼的幽灵，面容平和，步子沉稳，</p>

  <p class="EB03BodyTextIndented">但在无人看见的黑夜，你肆意地飞驰—啊，海洋也搅乱，</p>

  <p class="EB03BodyTextIndented">迸裂出泪水！泪水！泪水！</p>
