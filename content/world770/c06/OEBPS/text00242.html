<p class="normaltext3b" id="CHP12">·1623年，历史上第一部《莎士比亚全集》——著名的第一对开本（First Folio）由莎士比亚的演员同僚们结集出版。</p>
<p class="normaltext"><br/>
</p>
<p class="normaltext3b">·2007年，英国皇家莎士比亚剧团（Royal Shakespeare Company）邀约当今世界顶级莎学专家乔纳森·贝特（Jonathan Bate）和埃里克·拉斯姆森（Eric Rasmussen）对第一对开本进行了三百多年来的首次全面修订，推出了新版《莎士比亚全集》。</p>
<p class="normaltext"><br/>
</p>
<p class="normaltext3b">·2015年，外语教学与研究出版社以上述新版《莎士比亚全集》为蓝本，特邀当今华语翻译界和莎学界知名学者，将流传下来的莎士比亚全部作品进行全新重译，遂有此集。</p>
