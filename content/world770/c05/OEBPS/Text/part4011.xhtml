  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">19</h1>

  <p class="kindle-cn-poem-left">你腰间搂着灌满的水瓶，在河边路上行走。<br/>
  你为什么急遽地回头，<br/>
  从飘扬的面纱里偷偷地看我？<br/>
  这个从黑暗中向我送来的闪视，<br/>
  像凉风在粼粼的微波上掠过，<br/>
  一阵震颤直到阴荫的岸边。<br/>
  它向我飞来，<br/>
  像夜中的小鸟急遽地穿过无灯的屋子的两边洞开的窗户，<br/>
  又在黑夜中消失了。<br/>
  你像一颗隐在山后的星星，我是路上的行人。<br/>
  但是你为什么站了一会儿，<br/>
  从面纱中瞥视我的脸，<br/>
  当你腰间搂着灌满的水瓶在河边路上行走的时候？</p>
