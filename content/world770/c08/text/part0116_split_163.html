<h1 class="calibre22" id="calibre_pb_265">第六十三节</h1>

      <p class="x5">资本家和农业企业家之间的竞争确定了地租的现时价格。</p>

      <p class="x6">富有的农业企业家之间的竞争确定了地租的现时价格，一般是根据土地的肥沃程度和土地产品的出售价格，而土地产品的出售价格总是根据农民在考虑自己的支出和应该从垫付中获得的利润后所做的计算来确定。他们不能付给土地所有者超出剩余产品以外的东西。但是，当他们之间的竞争非常激烈时，他们有时候会把全部剩余产品都交给土地所有者，而土地所有者只把土地租给租金报价最高的人。</p><a id="Section_cn_64"></a>
