  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">早上好，午夜！</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">早上好，午夜！</p>

  <p class="EB03BodyTextIndented">我就回家，</p>

  <p class="EB03BodyTextIndented">白天厌倦了我——</p>

  <p class="EB03BodyTextIndented">可我怎能厌倦他？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">阳光照耀之处是可爱的地方，</p>

  <p class="EB03BodyTextIndented">我喜欢逗留——</p>

  <p class="EB03BodyTextIndented">可是现在——早晨不想要我——</p>

  <p class="EB03BodyTextIndented">那么晚安，白天！</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我能看，不能吗？</p>

  <p class="EB03BodyTextIndented">当东方变红的时候？</p>

  <p class="EB03BodyTextIndented">那时，山峦有它们的办法，</p>

  <p class="EB03BodyTextIndented">让心游历海外。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">你没有那么美，午夜——</p>

  <p class="EB03BodyTextIndented">我选择白天，</p>

  <p class="EB03BodyTextIndented">可接受一个小女孩吧</p>

  <p class="EB03BodyTextIndented">他却转过身去！</p>
</body></html>
