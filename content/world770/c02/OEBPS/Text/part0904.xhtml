  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">我栖居于可能性中</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我栖居于可能性中，</p>

  <p class="EB03BodyTextIndented">比散文更漂亮的一座房子，</p>

  <p class="EB03BodyTextIndented">有更多窗户，</p>

  <p class="EB03BodyTextIndented">比门高级。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">房间，是雪松木的——</p>

  <p class="EB03BodyTextIndented">眼睛不能穿透；</p>

  <p class="EB03BodyTextIndented">而经久的房顶</p>

  <p class="EB03BodyTextIndented">是天空的复折屋顶<sup><a id="z12" href="part0904.xhtml#bz12">[12]</a></sup>。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">让最漂亮的客人——</p>

  <p class="EB03BodyTextIndented">拥有——这个——</p>

  <p class="EB03BodyTextIndented">我窄小的双手展开的广阔</p>

  <p class="EB03BodyTextIndented">好收集乐园。</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="bz12" href="part0904.xhtml#z12">[12]</a>这个版本中第二节第四行的“gambels”（三角墙）是1933年版本中手稿辨识中辨认为错误的词语，严重影响这首诗的准确和人们的理解。正确的词语应当是“gambrels”（复折屋顶）。</p>
