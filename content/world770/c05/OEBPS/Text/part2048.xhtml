  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">102</h1>

  <p class="kindle-cn-poem-left1">我的爱貌似减弱，其实加强，<br/>
  爱的表达少了，但真情如故；<br/>
  倘若爱被相爱者到处传扬，<br/>
  爱就成了买卖，与商品无殊。<br/>
  我们初次相爱，正好在阳春，<br/>
  我喜欢用我的歌将爱颂扬，<br/>
  就像夜莺在初夏时节长吟，<br/>
  到晚夏就停止了她的歌唱——<br/>
  并非此时的夏天风光不美，<br/>
  远不及她长夜哀声的夏初，<br/>
  而是群鸟聒噪使枝头受累，<br/>
  美蕙变得庸俗，失去了欢愉。<br/>
  　　我因此要学夜莺不再歌唱，<br/>
  　　免得唱得太多，反惹你心烦。</p>
