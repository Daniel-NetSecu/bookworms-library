  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">21</h1>

  <p>我必须撑出我的船去。</p>

  <p>时光都在岸边挨延消磨了——</p>

  <p>不堪的我啊！</p>

  <p>春天把花开过就告别了。</p>

  <p>如今落红遍地，我却等待而又流连。</p>

  <p>潮声渐喧，河岸的荫滩上黄叶飘落。</p>

  <p>你凝望着的是何等的空虚！</p>

  <p>你不觉得有一阵惊喜和对岸遥远的歌声从天空中一同飘来吗？</p>
