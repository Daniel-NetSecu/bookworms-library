  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">9</h1>

  <p class="kindle-cn-poem-left">当我在夜里独赴幽会的时候，鸟儿不叫，<br/>
  风儿不吹，街道两旁的房屋沉默地站立着。<br/>
  是我自己的脚镯越走越响使我羞怯。<br/>
  当我站在凉台上倾听他的足音，树叶不摇，<br/>
  河水静止像熟睡的哨兵膝上的刀剑。<br/>
  是我自己的心在狂跳——我不知道怎样使它宁静。<br/>
  当我爱来了，坐在我身旁，<br/>
  当我的身躯震颤，我的眼睫下垂，<br/>
  夜更深了，风吹灯灭，云片在繁星上曳过轻纱。<br/>
  是我自己胸前的珍宝放出光明。<br/>
  我不知道怎样把它遮起。</p>
