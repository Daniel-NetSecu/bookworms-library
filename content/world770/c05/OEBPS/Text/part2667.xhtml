  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">两个袋子</h1>

  <p>每个人身上都带着两个袋子，一个在前，一个在后，其中装满了错误。前面的袋子装的是邻人的错，后面的袋子装的是自己的错。所以，人从来都看不到自己的错，却从来不放过他人的错。</p>
