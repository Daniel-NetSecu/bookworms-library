  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">129</h1>

  <p class="kindle-cn-poem-left1">损耗着精气，还伴随着耻辱，<br/>
  这就是宣泄情欲；宣泄之前，<br/>
  情欲即为伪证、凶杀和血污，<br/>
  还有残暴、无信、野蛮和极端；<br/>
  快乐刚过去，旋即产生厌腻；<br/>
  丧智的追求，但追求一得手，<br/>
  便是丧智的恨，像吞了诱饵，<br/>
  只怪人家下套，害他昏了头。<br/>
  追求时疯狂，占有时也疯狂，<br/>
  分不清今天明天，贪无止境，<br/>
  云雨时上天堂，云雨后懊丧，<br/>
  期待着大欢喜，事后一场梦。<br/>
  　　情欲是引人下地狱的天堂，<br/>
  　　道理世人皆知，却无人避防。</p>
