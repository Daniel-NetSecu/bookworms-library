  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">30</h1>

  <p class="kindle-cn-poem-left">你是一朵夜云，在我梦幻中的天空浮泛。<br/>
  我永远用爱恋的渴想来描画你。<br/>
  你是我一个人的，我一个人的，<br/>
  我无尽的梦幻中的居住者！<br/>
  你的双脚被我心切望的热光染得绯红，<br/>
  我的落日之歌的搜集者！<br/>
  我的痛苦之酒使你的唇儿苦甜。<br/>
  你是我一个人的，我一个人的，<br/>
  我寂寥的梦幻中的居住者！<br/>
  我用热情的浓影染黑了你的眼睛，<br/>
  我的凝视深处的祟魂！<br/>
  我捉住了你，缠住了你，我爱，在我音乐的罗网里。<br/>
  你是我一个人的，我一个人的，<br/>
  我永生的梦幻中的居住者！</p>
