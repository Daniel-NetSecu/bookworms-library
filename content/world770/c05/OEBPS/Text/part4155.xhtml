  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">75</h1>

  <p>你赐给我们世人的礼物，满足了我们一切的需要，</p>

  <p>可是它们又毫未减少地返回到你那里。</p>

  <p>河水有它每天的工作，匆忙地穿过田野和村庄；</p>

  <p>但它的不绝的水流，又曲折地回来洗你的双脚。</p>

  <p>花朵以芬芳熏香了空气；</p>

  <p>但它最终的任务，是把自己献上给你。</p>

  <p>对你供献不会使世界穷困。</p>

  <p>人们从诗人的字句里，选取自己心爱的意义；</p>

  <p>但是诗句的最终意义是指向着你。</p>
