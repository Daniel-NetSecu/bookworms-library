  <title>花之歌</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">花之歌</h1>

  <p>我是大自然说出的话语；旋即大自然又将之收回，隐藏在自己的心里，然后又将其讲出。我是星斗，由蓝色帐篷落到绿地毯上。</p>

  <p>我是冬天孕育的各种成分的女儿；春天将我生下，夏天将我养大，秋天哄我入睡。</p>

  <p>我是情侣俩的礼物，我是婚礼上的花环，我是生者送给死者的最后一件赠礼。</p>

  <p>清晨，我与微风合作宣布光明的到来；夜晚，我与百鸟一同与光明告别。</p>

  <p>我在平原上摇曳晃动，将平原装饰一新；我在风中呼吸，使空气里充满芳香。我睡下时，夜晚的无数只眼睛盯着我；我醒时，用白日的单只眼睛观察。</p>

  <p>我喝着露酒，听着鸟唱歌，和着青草的掌声起舞。我经常向高空仰望，以便看到光明，不看自己的幻影。这就是人尚未学到的哲理。</p>
