<p class="title1" id="CHP7">LESSON 4</p>
<p class="picture"><img src="../Images/image01546.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>A man and a lad.</td>
    <td>男人和少年。</td>
  </tr>
  <tr>
    <td>The man sat; the lad ran.</td>
    <td>男人坐，少年跑。</td>
  </tr>
  <tr>
    <td>The man has a hat.</td>
    <td>男人有顶圆边帽，</td>
  </tr>
  <tr>
    <td>The lad has a cap.</td>
    <td>少年有顶鸭舌帽。</td>
  </tr>
