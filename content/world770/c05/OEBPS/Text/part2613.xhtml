  <title>狮子和老鼠</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">狮子和老鼠</h1>

  <p>狮子正在自己的巢穴中睡觉，一只老鼠从他脸上爬过，把他惊醒了。狮子勃然大怒，伸出爪子一把抓住老鼠，准备杀了他。老鼠万分惊恐，可怜兮兮地恳求狮子饶他一命。“放我走吧，”老鼠说，“总有一天我会报答你的大恩大德的。”这么个小不点，居然说能为他做事，狮子觉得好笑极了，但还是心情愉悦地把老鼠放了。而老鼠所说的那一天终于还是来到了。一天，狮子被猎人设下的网给困住了，老鼠听到声音，认出是那头狮子的怒吼，于是跑了过去。他二话没说，便开始咬啮绳子，没用多久便成功将狮子放了出来。“看！”老鼠说，“我承诺会报答你的时候你还笑我呢，现在看来，老鼠尽管小，也是能够帮助狮子的。”</p>
