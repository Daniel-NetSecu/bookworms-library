  <h2 class="EB04MainHeadClosedTitle">妻子和醉酒的丈夫</h2>

  <p class="EB03BodyTextIndented">一个女人一直忍受着她酗酒的丈夫带来的屈辱。有一次，当她丈夫喝得烂醉时，她把他送进了存尸房。当她估摸着丈夫应该是时候恢复知觉时，她走开了，然后又回来敲门。</p>

  <p class="EB03BodyTextIndented">“谁在那儿？”酒徒说。</p>

  <p class="EB03BodyTextIndented">“一个给死人送肉的人。”女人说。</p>

  <p class="EB03BodyTextIndented">“朋友，”他说，“还是给我来点酒吧。我想任何认识我的人给我别的东西时，也不会忘了给我酒。”</p>

  <p class="EB03BodyTextIndented">“好吧，”她说，“这种我所察觉到的情绪已经完全控制了他，成了他的恶习，他已经没救了。”</p>

  <p class="EB01BodyTextLineSpace">养成的恶习会成为我们的天性，就好像我们被撕成碎片，然后重新被拼接在一起，仿若被修补过一样。</p>
