  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">20</h1>

  <p class="kindle-cn-poem-left1">你有一张女人脸，造化所描，<br/>
  你是我挚爱的情男兼情女，<br/>
  你有女性的温柔，不会取巧，<br/>
  那是虚伪女人玩弄的玄虚；<br/>
  你那双眼睛更明亮，更真诚，<br/>
  美目所触之物都涂了金箔；<br/>
  你的神采较之万众而优胜，<br/>
  令男儿羡慕，摄女子之魂魄。<br/>
  造化原本想把你塑成女身，<br/>
  但在创造中对你徒生痴迷，<br/>
  便剥夺我的权利，为你添增<br/>
  一件东西，它于我一无价值。<br/>
  　　她创造你，为了让女人陶醉，<br/>
  　　这爱归我，她们享用那宝贝。</p>
