  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">70</h1>

  <p class="kindle-cn-poem-left1">你受人责备，并非你的过失，<br/>
  美艳向来就是诽谤的标靶，<br/>
  世人的猜忌，是美人的装饰，<br/>
  一如碧空中有飞翔的乌鸦。<br/>
  只要拥有善，诽谤只能证明<br/>
  你更其高尚，更被世人珍惜，<br/>
  因为恶虫都在蓓蕾里寄生，<br/>
  纯洁无瑕的你，也正值花季。<br/>
  你已安全避过青春的伏击，<br/>
  没有受伤害，或已得胜而归：<br/>
  不过，这样的赞美于你无益，<br/>
  因为它堵不住嫉妒的大嘴。<br/>
  　　如没有猜忌蒙蔽你的美貌，<br/>
  　　被你独占的心国该有多少！</p>
