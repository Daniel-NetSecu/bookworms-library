  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1" title="十月的虞美人">十月的虞美人<span class="math-super"><a id="noteBack_1" href="part3231.xhtml#note_1">[1]</a></span></h1>

  <p class="kindle-cn-poem-left">即使今天的朝霞也无奈这些似裙的花朵。<br/>
  救护车里的女人也是无奈<br/>
  鲜红的血从心脏涌出渗透大衣，令人惊骇——<br/>
  <br/>
  这礼物，爱的礼物<br/>
  天空完全没有<br/>
  想要<br/>
  <br/>
  天空苍白而耀眼<br/>
  燃烧着一氧化碳，圆顶<br/>
  帽子下的双眼呆滞了。<br/>
  <br/>
  哦，我的上帝，我算什么<br/>
  迟开的花朵张大嘴叫喊<br/>
  结霜的树林，矢车菊盛开之初。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part3231.xhtml#noteBack_1">[1]</a>Poppy：虞美人，一种红色的花，在英国用于纪念死者，比如英国国殇日11月11日人们为悼念两次世界大战的死难者而佩戴。</p>
