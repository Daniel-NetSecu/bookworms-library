  <title>THE BLOSSOM</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">THE BLOSSOM</h2>

  <p class="EB03BodyTextIndented">Merry Merry Sparrow</p>

  <p class="EB03BodyTextIndented">Under leaves so green</p>

  <p class="EB03BodyTextIndented">A happy Blossom</p>

  <p class="EB03BodyTextIndented">Sees you swift as arrow</p>

  <p class="EB03BodyTextIndented">Seek your cradle narrow</p>

  <p class="EB03BodyTextIndented">Near my Bosom.</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">Pretty Pretty Robin</p>

  <p class="EB03BodyTextIndented">Under leaves so green</p>

  <p class="EB03BodyTextIndented">A happy Blossom</p>

  <p class="EB03BodyTextIndented">Hears you sobbing sobbing</p>

  <p class="EB03BodyTextIndented">Pretty Pretty Robin</p>

  <p class="EB03BodyTextIndented">Near my Bosom.</p>
</body></html>
