  <h2 class="kindle-cn-heading2">70　致——</h2>

  <p class="kindle-cn-signature">雪莱</p>

  <p class="kindle-cn-poem-left">当柔和的歌声停止，<br/>
  音符仍震颤于记忆——<br/>
  当甜美的紫罗兰凋零，<br/>
  芳香仍在意识中留存。</p>

  <p class="kindle-cn-poem-left">玫瑰的花朵一旦枯灭，<br/>
  叶子堆成恋人的枕席；<br/>
  思想也如此，当你死亡，<br/>
  爱情将入睡，留在梦乡。</p>
