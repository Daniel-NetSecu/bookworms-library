  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">133</h1>

  <p class="kindle-cn-poem-left1">使我伤心的那心该受诅咒，<br/>
  它让我和朋友都受了重创；<br/>
  难道折磨我一人还嫌不够，<br/>
  偏要将我爱友当奴仆使唤？<br/>
  你残忍的眼睛已将我劫持，<br/>
  随后又要将第二个我霸占，<br/>
  我已被他、我自己和你遗弃——<br/>
  我所蒙受的是三重的苦难！<br/>
  请把我的心关进你的铁窗，<br/>
  让我用它保释出朋友的心，<br/>
  无论谁囚我，我为朋友守望，<br/>
  在我的牢狱中，别实施暴行。<br/>
  　　但我知道，你不会就此罢休，<br/>
  　　因我是囚徒，一切归你所有。</p>
