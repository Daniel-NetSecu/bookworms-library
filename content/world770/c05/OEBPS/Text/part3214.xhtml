  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">镇静剂</h1>

  <p class="kindle-cn-poem-left">哦，半个月亮——<br/>
  <br/>
  半个大脑，发光体——<br/>
  黑人，戴着面具像白人，<br/>
  <br/>
  你的黑色<br/>
  截肢爬行，令人恐惧<br/>
  <br/>
  ——蜘蛛般，不安全。<br/>
  怎样的手套<br/>
  <br/>
  怎样的皮料<br/>
  可以保护我<br/>
  <br/>
  避开那黑影——<br/>
  不可去除的萌芽，<br/>
  <br/>
  肩胛骨与臂交接处<br/>
  那一张张脸<br/>
  <br/>
  推搡出现，拖着<br/>
  被剪断的<br/>
  <br/>
  虚无的带血胎膜。<br/>
  整夜我为给我的东西<br/>
  <br/>
  做一个空间，<br/>
  所爱之物<br/>
  <br/>
  两只湿润的眼睛，一声尖叫。<br/>
  白色唾沫<br/>
  <br/>
  无动于衷！<br/>
  黑色的水果旋转，跌落。<br/>
  <br/>
  玻璃杯破裂穿过<br/>
  那意象<br/>
  <br/>
  逃走，终止，如跌落的水银。</p>
