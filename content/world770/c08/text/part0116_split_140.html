<h1 class="calibre22" id="calibre_pb_242">第四十节</h1>

      <p class="x5">反过来说，所有货币本质上都是商品。</p>

      <p class="x6">我们只能使用本身具有一定价值的商品作为衡量价值的标准尺度，也只能使用在商业中被接受的商品去换取其他财产；除了具有同等价值的物品外，没有通用的价值的代表性象征物。因此，本位货币是不可能存在的。</p><a id="Section_cn_41"></a>
