<h2 class="heading" id="calibre_pb_5">帕斯考</h2>

  <p class="calibre7">变色龙帕斯考既是乐佩公主的宠物，也是她的知心密友。除了高瑟妈妈，他是乐佩公主在高塔里唯一的朋友。虽然无法用言语沟通，但是他一直鼓励乐佩，使她意识到她需要走出高塔。帕斯考通过变换身体的颜色来表达情感。</p>
