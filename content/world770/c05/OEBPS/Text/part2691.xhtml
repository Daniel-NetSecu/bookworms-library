  <title>孔雀和朱诺</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">孔雀和朱诺</h1>

  <p>孔雀因为自己的声音不如夜莺好听而非常不满，便去向朱诺抱怨。“夜莺的歌声令所有鸟都妒忌，而我只要一发声，就立刻沦为笑柄。”女神试图安慰他：“你的确没有动听的歌声，但你的美丽远胜其他鸟，你的脖子如祖母绿般闪耀，你多彩的尾羽缤纷琳琅，简直就是奇迹。”但是孔雀却不满意：“我这样的声音，有那么美丽又有什么用？”朱诺再开口时声音中透着严厉：“命运赐予众生各自的天赋，给了你美丽，给了鹰力量，给了夜莺歌声，每人都有各自的份额，但是你却不满意自己分得的财富。不要再抱怨了。如果满足了你现在的愿望，你很快便会生出其他不满来的。”</p>
