  <title>天使</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">天使</h2>

  <p class="EB03BodyTextIndented">我做了个梦，它什么意思？</p>

  <p class="EB03BodyTextIndented">在梦中我是个未婚女王，</p>

  <p class="EB03BodyTextIndented">由一个温柔的天使守护：</p>

  <p class="EB03BodyTextIndented">愚蠢的悲哀，怎么也止不住！——</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我日日夜夜不停地哭泣，</p>

  <p class="EB03BodyTextIndented">天使他替我擦去泪滴，</p>

  <p class="EB03BodyTextIndented">日日夜夜我不停地哭泣，</p>

  <p class="EB03BodyTextIndented">躲开他我才心中欢喜。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">天使他拍起翅膀消失了，</p>

  <p class="EB03BodyTextIndented">黎明呈现出了玫瑰红，</p>

  <p class="EB03BodyTextIndented">我擦干眼泪，用十万盾矛</p>

  <p class="EB03BodyTextIndented">来压住我的惶惑惊恐。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">不久，我的天使又来了，</p>

  <p class="EB03BodyTextIndented">我戒备着，他白来一趟——</p>

  <p class="EB03BodyTextIndented">我的青春已经消逝，</p>

  <p class="EB03BodyTextIndented">头上已是白发苍苍。</p>
</body></html>
