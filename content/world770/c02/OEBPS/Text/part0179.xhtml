  <title>扫烟囱的孩子</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">扫烟囱的孩子</h2>

  <p class="EB03BodyTextIndented">雪地里一个小黑点，</p>

  <p class="EB03BodyTextIndented">哭着“扫，扫”，叫人怜！</p>

  <p class="EB03BodyTextIndented">“你的爹妈在哪儿？说呀！”</p>

  <p class="EB03BodyTextIndented">“他们都去礼拜堂祈祷啦。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“我在荒野里曾经很快乐，</p>

  <p class="EB03BodyTextIndented">还在冬天的雪里欢笑，</p>

  <p class="EB03BodyTextIndented">他们就让我穿上黑衣，</p>

  <p class="EB03BodyTextIndented">叫我唱起悲伤的小调。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“我还是快乐，又跳又唱，</p>

  <p class="EB03BodyTextIndented">爹妈就以为没把我害够，</p>

  <p class="EB03BodyTextIndented">就去赞美上帝、神父和国王——</p>

  <p class="EB03BodyTextIndented">是他们在我们的苦难上建起天堂。”</p>
</body></html>
