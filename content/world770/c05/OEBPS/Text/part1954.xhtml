  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">8</h1>

  <p class="kindle-cn-poem-left1">你犹如音乐，为何闻乐悲怀？<br/>
  甜不与甜对峙，笑乐在笑中，<br/>
  招你不快之物，你因何而爱？<br/>
  你因何乐意接受你的哀痛？<br/>
  如果各种音符配合在一起，<br/>
  构成和谐，反而让你不快活，<br/>
  这音符定会对你婉言指斥，<br/>
  怪你因独身而将职分推脱。<br/>
  一根弦与另一根，犹如夫妻，<br/>
  听，它们应和时何等的谐和；<br/>
  父亲、孩子和母亲，也是如此，<br/>
  三者合为一体，才唱出好歌。<br/>
  　　他们无词的歌都异口同声<br/>
  　　对你唱：“独身只会断绝生命。”</p>
