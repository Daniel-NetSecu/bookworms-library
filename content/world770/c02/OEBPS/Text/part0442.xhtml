  <title>诗行</title>

  <h2 class="EB04MainHeadClosedTitle">诗行</h2>

  <p class="EB03BodyTextIndented">我不会哭泣，若你要离去，</p>

  <p class="EB03BodyTextIndented">　　这里本就谈不上什么美好；</p>

  <p class="EB03BodyTextIndented">黑暗的世界将加重我的悲戚，</p>

  <p class="EB03BodyTextIndented">　　当你的心在那里忍受煎熬。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我不会哭泣，因为绚烂的夏日</p>

  <p class="EB03BodyTextIndented">　　终有一天会归于颓丧；</p>

  <p class="EB03BodyTextIndented">因为无论如何，再幸福的故事——</p>

  <p class="EB03BodyTextIndented">　　最终都会以坟墓收场！</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我已厌倦那痛苦的滋味，</p>

  <p class="EB03BodyTextIndented">　　它只让寒冬更加难捱；</p>

  <p class="EB03BodyTextIndented">也不愿再看那灵魂枯萎，</p>

  <p class="EB03BodyTextIndented">　　长年陷于死一般绝望的悲哀。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">所以，当你死去，</p>

  <p class="EB03BodyTextIndented">　　若我碰巧落下一颗泪滴，</p>

  <p class="EB03BodyTextIndented">那只是我的灵魂在叹息，</p>

  <p class="EB03BodyTextIndented">　　想与你同去，长眠不起。</p>
</body></html>
