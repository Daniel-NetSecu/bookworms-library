  <h2 class="kindle-cn-heading2">91　有爱就足够</h2>

  <p class="kindle-cn-signature">莫里斯<span class="math-super"><a id="noteBack_1" href="part1534.xhtml#note_1">[1]</a></span></p>

  <p class="kindle-cn-poem-left">有爱就足够，尽管这世界正在衰亡，<br/>
  森林里除了怨言听不见其他声响。<br/>
  尽管天空一片黑暗，模糊的双目<br/>
  很难发现地上的金杯和盛开的雏菊；<br/>
  山上阴影幢幢，大海只是黑雾一团。<br/>
  今天给昨天的一切盖上一层屏障，<br/>
  但他们的手不会颤抖，腿也不摇晃，<br/>
  空虚不会使他们厌倦，恐惧也难变换<br/>
  他们的话题，转移相爱者的目光。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1534.xhtml#noteBack_1">[1]</a>威廉·莫里斯（William Morris，1834—1896），作家、诗人，出生于富有的商人家庭。毕业于牛津大学埃克塞特学院。主编过宣扬激进思想的刊物。对装帧艺术有较大的贡献。诗歌代表作有《伊阿宋的生与死》《地上乐园》等。</p>
