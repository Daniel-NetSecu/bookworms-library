  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">77</h1>

  <p>我知道你是我的上帝，却远立在一边——</p>

  <p>我不知道你是属于我的，就走近你。</p>

  <p>我知道你是我的父亲，就在你脚前俯伏——</p>

  <p>我没有像和朋友握手那样地紧握你的手。</p>

  <p>我没有在你降临的地方，站立等候，</p>

  <p>把你抱在胸前，当你作同道，把你占有。</p>

  <p>你是我兄弟的兄弟，但是我不理他们，</p>

  <p>不把我赚得的和他们平分，我以为这样做，</p>

  <p>才能和你分享我的一切。</p>

  <p>在快乐和痛苦里，我都没有站在人类的一边，</p>

  <p>我以为这样做，才能和你站在一起。</p>

  <p>我畏缩着不肯舍生，因此我没有跳入生命的伟大的海洋里。</p>
</body></html>
