  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">65</h1>

  <p class="kindle-cn-poem-left">又是你呼唤我吗？<br/>
  夜来到了，<br/>
  困乏像爱的恳求用双臂围抱住我。<br/>
  你叫我了吗？<br/>
  我已把整天的工夫给了你，残忍的主妇，<br/>
  你还定要掠夺我的夜晚吗？<br/>
  万事都有个终结，黑暗的静寂是个人独有的。<br/>
  你的声音定要穿透黑暗来刺激我吗？<br/>
  难道你门前的夜晚没有音乐和睡眠吗？<br/>
  难道那翅翼不响的星辰，<br/>
  从来不攀登你的不仁之塔的上空吗？<br/>
  难道你园中的花朵，永不在绵软的死亡中堕地吗？<br/>
  你定要叫我吗，你这不安静的人？<br/>
  那就让爱的愁眼，徒然地因着盼望而流泪。<br/>
  让灯盏在空屋里点着。<br/>
  让渡船载那些困乏的工人回家。<br/>
  我把梦想丢下，来奔赴你的召唤。</p>
