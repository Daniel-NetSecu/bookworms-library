  <h2 class="kindle-cn-heading2">123　歌唱树和我的主人</h2>

  <p class="kindle-cn-signature">拉尼尔</p>

  <p class="kindle-cn-poem-left">我的主人进入这片树林，<br/>
  他已筋疲力尽，筋疲力尽。<br/>
  我的主人来到这片树林，<br/>
  他因爱而筋疲力尽，羞愧满心。<br/>
  但橄榄树对他没有闭上眼睛，<br/>
  灰白的小树叶对他很多情，<br/>
  多刺的灌木对他很用心，<br/>
  当他来到这片树林。</p>

  <p class="kindle-cn-poem-left">我的主人走出这片树林，<br/>
  他感到十分如意称心。<br/>
  我的主人走出这片树林，<br/>
  他为死亡和羞辱而高兴。<br/>
  当死亡和羞辱向他求婚，<br/>
  它们把他拖出这片树林：<br/>
  最后让他死在一棵树上，<br/>
  当他走出这片树林。</p>
