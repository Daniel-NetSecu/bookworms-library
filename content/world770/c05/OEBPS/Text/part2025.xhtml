  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">79</h1>

  <p class="kindle-cn-poem-left1">先前，都是我单独向你求助，<br/>
  我的诗因此独得你的恩惠；<br/>
  但优雅的诗句如今已陈腐，<br/>
  我的缪斯病倒了，只好让位；<br/>
  我承认，你这个可爱的主题<br/>
  值得更有文采的笔来描述，<br/>
  但不管这诗人如何赞美你，<br/>
  他都是掠夺你后奉还原物。<br/>
  他向你出租德，这德就源于<br/>
  你自己的品行；他送给你美，<br/>
  美就在你脸上；没有你所赋，<br/>
  他便不具备歌颂你的诗才。<br/>
  　　既然他给的原是你的东西，<br/>
  　　你就不必为此而表示谢意。</p>
