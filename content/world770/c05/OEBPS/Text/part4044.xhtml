  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">52</h1>

  <p class="kindle-cn-poem-left">灯为什么熄了呢？<br/>
  我用斗篷遮住它怕它被风吹灭，因此灯熄了。<br/>
  花为什么谢了呢？<br/>
  我的热恋的爱把它紧压在我的心上，因此花谢了。<br/>
  泉为什么干了呢？<br/>
  我筑起一道堤把它拦起给我使用，因此泉干了。<br/>
  琴弦为什么断了呢？<br/>
  我强弹一个它力不能胜的音节，因此琴弦断了。</p>
