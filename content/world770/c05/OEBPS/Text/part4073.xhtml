  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">81</h1>

  <p class="kindle-cn-poem-left">你为什么这样低声地对我耳语，<br/>
  啊，“死亡”，我的“死亡”？<br/>
  当花儿晚谢，牛儿归棚，<br/>
  你偷偷地走到我身边，说出我不了解的话语。<br/>
  难道你必须用昏沉的微语和冰冷的接吻来向我求爱，<br/>
  来赢得我心吗，<br/>
  啊，“死亡”，我的“死亡”？<br/>
  我们的婚礼不会有铺张的仪式吗？<br/>
  在你褐黄的鬈发上不系上花串吗？<br/>
  在你前面没有举旗的人吗？<br/>
  你也没有通红的火炬，使黑夜像着火一样地明亮吗，<br/>
  啊，“死亡”，我的“死亡”？<br/>
  你吹着法螺来吧，在无眠之夜来吧。<br/>
  给我穿上红衣，紧握我的手把我娶走吧。<br/>
  让你的驾着急躁嘶叫的马的车辇，准备好等在我门前吧。<br/>
  揭开我的面纱骄傲地看我的脸吧，<br/>
  啊，“死亡”，我的“死亡”。</p>
