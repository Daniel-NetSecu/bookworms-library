  <title>外衣</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">外衣</h2>

  <p class="EB03BodyTextIndented">我把我的歌制成外衣，</p>

  <p class="EB03BodyTextIndented">从头到脚，</p>

  <p class="EB03BodyTextIndented">缀满了来自古老</p>

  <p class="EB03BodyTextIndented">神话中的刺绣；</p>

  <p class="EB03BodyTextIndented">但蠢人拿走了它，</p>

  <p class="EB03BodyTextIndented">在世人眼前穿着，</p>

  <p class="EB03BodyTextIndented">仿佛是他们造的。</p>

  <p class="EB03BodyTextIndented">歌，就让他们拿去吧，</p>

  <p class="EB03BodyTextIndented">因为裸身走路，</p>

  <p class="EB03BodyTextIndented">需要更多的雄心。</p>
</body></html>
