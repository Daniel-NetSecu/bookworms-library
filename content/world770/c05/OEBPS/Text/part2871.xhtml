  <title>鹰、鸢和鸽子</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">鹰、鸢和鸽子</h1>

  <p>有一处鸽巢里的鸽子饱受一只鸢的迫害，这只鸢总是时不时地冲下来，夺去一些鸽子的性命。所以，鸽子便邀请了一只鹰来，帮助他们对抗仇敌。但他们很快便后悔自己的愚蠢：这只鹰杀死的鸽子比那只鸢要多得多。</p>
