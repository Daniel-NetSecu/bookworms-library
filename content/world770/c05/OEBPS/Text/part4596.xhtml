  <title>罗丝太太</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">罗丝太太</h1>

  <p>一次，三人遥见远处的绿色山丘上有一座孤零零的白房子，其中一个说：“那是罗丝太太的家。她是一位老巫婆。”</p>

  <p>第二个人说：“你错了！罗丝太太是位漂亮的女子，整日沉醉于自己的梦乡。”</p>

  <p>第三个人说：“你俩皆错！罗丝太太是这一大片土地的主人，靠吮吸在这里干活的奴隶们的血生活。”</p>

  <p>他们边走边争论。</p>

  <p>来到岔路口，遇见一位老者，其中一个人问道：“你能将住在丘上那座白房子里的罗丝太太的情况告诉我们吗？”</p>

  <p>老者抬起头，微微一笑，说：“我现年九旬，我还是小时候听说过罗丝太太。罗丝太太去世已八十年了，那座房子是空的，只有猫头鹰在里面鸣叫；人们有时也说，那里面还住着别的什么东西。”</p>
