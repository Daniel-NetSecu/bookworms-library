  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">86</h1>

  <p class="kindle-cn-poem-left1">他的诗篇是否扬起了满帆<br/>
  要去掠劫你这座稀世宝藏，<br/>
  以致我的思想在脑中流产，<br/>
  它的子宫反而变成了坟场？<br/>
  抑或他的灵府受精灵教授，<br/>
  欲创神品，故而置我于死地？<br/>
  不，他和他那班夜间的助手<br/>
  都不能将我的诗吓成呆滞。<br/>
  他，加上那位出没于黑夜，<br/>
  用智慧误导他的多事精灵，<br/>
  都不是致我沉默的胜利者；<br/>
  我缄口无语，决非出于受惊。<br/>
  　　然而，当你的美做他的诗神，<br/>
  　　我便无言以对，且一蹶不振。</p>
