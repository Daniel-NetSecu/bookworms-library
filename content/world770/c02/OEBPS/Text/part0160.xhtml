  <title>男童之失</title>

  <h2 class="EB04MainHeadClosedTitle">男童之失</h2>

  <p class="EB03BodyTextIndented">“爸爸，爸爸，你去哪儿呀？</p>

  <p class="EB03BodyTextIndented">你别走这么快啊。</p>

  <p class="EB03BodyTextIndented">讲话呀爸爸，和你的儿讲话，</p>

  <p class="EB03BodyTextIndented">不然我会迷失啦。”</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">天黑了，哪里有什么爸爸。</p>

  <p class="EB03BodyTextIndented">孩子被露水沾湿了。</p>

  <p class="EB03BodyTextIndented">泥泞很深，孩子哭起来，</p>

  <p class="EB03BodyTextIndented">幻象也跟着消失了。</p>
