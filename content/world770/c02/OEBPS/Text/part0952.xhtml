  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">On my volcano grows the grass —</h2>

  <p class="EB03BodyTextIndented">On my volcano grows the grass, —</p>

  <p class="EB03BodyTextIndented">A meditative spot,</p>

  <p class="EB03BodyTextIndented">An area for a bird to choose</p>

  <p class="EB03BodyTextIndented">Would be the general thought.</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">How red the fire reeks below,</p>

  <p class="EB03BodyTextIndented">How insecure the sod —</p>

  <p class="EB03BodyTextIndented">Did I disclose, would populate</p>

  <p class="EB03BodyTextIndented">With awe my solitude.</p>
