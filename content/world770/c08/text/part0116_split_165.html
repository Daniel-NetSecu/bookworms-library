<h1 class="calibre22" id="calibre_pb_267">第六十五节</h1>

      <p class="x5">土地耕种者阶级细分为两个阶层，一个是企业家或农场主，另一个是雇佣工人、仆人和日工。</p>

      <p class="x6">因此，像制造业者一样，土地耕种者阶级被细分为两个阶层，一个是企业家或资本家，他们提供垫付，另一个是普通的薪酬工人。导致的结果也一样，那就是只有资本能够形成并支撑大的农业企业，只有资本能够赋予土地一种不变的价值，如果我可以这样说的话，也只有资本能够保证土地所有者获得一份稳定的、尽可能多的收入。</p><a id="Section_cn_66"></a>
