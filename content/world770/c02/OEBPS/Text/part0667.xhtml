  <h2 class="EB04MainHeadClosedTitle">骗子/</h2>

  <p class="EB03BodyTextIndented">一个人生病了，病入膏肓。他发誓，如果众神能够让他重获健康，他一定会为他们献上一百头牛。众神想知道他会如何履行诺言，就立即让他痊愈了。</p>

  <p class="EB03BodyTextIndented">现在，他一头牛都没有，于是他用牛油做了一百头小牛，并把它们供奉在祭坛上。他说道：“众神啊，我请你们见证，我信守了我的诺言。”</p>

  <p class="EB03BodyTextIndented">众神决定报复他一下，于是他们给他托了个梦。在梦中，他被吩咐去海边，去拿回他在那儿发现的一百克朗。醒来之后，他兴奋地跑到海边，却落入了一群强盗手中。他们捉住了他并把他卖为奴隶：卖得的钱刚好是他想要找的一百克朗。</p>

  <p class="EB01BodyTextLineSpace">别许下那些自己做不到的承诺。</p>
