<h2 class="heading" id="calibre_pb_0">Woody</h2>

  <p class="p4">● Even though his owner, Andy, is now grown, Woody the cowboy maintains an unflagging belief that Andy still cares about his toys. The other toys think Woody’s devotion borders on delusional. Woody maintains his faith, however, and is ultimately vindicated–though not in the way he expects.</p>
