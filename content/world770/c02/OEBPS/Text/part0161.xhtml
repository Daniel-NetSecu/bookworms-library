  <title>男童之得</title>

  <h2 class="EB04MainHeadClosedTitle">男童之得</h2>

  <p class="EB03BodyTextIndented">小男孩迷失在孤寂的沼泽里，</p>

  <p class="EB03BodyTextIndented">向摇曳的灯光走去，</p>

  <p class="EB03BodyTextIndented">他哭着，但永在的上帝出现了，</p>

  <p class="EB03BodyTextIndented">像父亲，穿着白衣。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">他吻了孩子，搀着他的手，</p>

  <p class="EB03BodyTextIndented">带领他去妈妈那里：</p>

  <p class="EB03BodyTextIndented">她正愁苦地在孤寂的山谷中</p>

  <p class="EB03BodyTextIndented">哭泣着找她的孩子。</p>
</body></html>
