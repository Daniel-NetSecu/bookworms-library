  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">35</h1>

  <p class="kindle-cn-poem-left">只恐我太容易地认得你，你对我耍花招。<br/>
  你用欢笑的闪光使我目盲来掩盖你的眼泪。<br/>
  我知道，我知道你的妙计，<br/>
  你从来不说出你所要说的话。<br/>
  只恐我不珍爱你，你千方百计地闪避我。<br/>
  只恐我把你和大家混在一起，你独自站在一边。<br/>
  我知道，我知道你的妙计，<br/>
  你从来不走你所要走的路。<br/>
  你的要求比别人的都多，因此你才静默。<br/>
  你用嬉笑的无心来回避我的赠予。<br/>
  我知道，我知道你的妙计，<br/>
  你从来不肯接受你想接受的东西。</p>
