<p class="title1" id="CHP9">LESSON 6</p>
<p class="picture"><img src="../Images/image01549.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>Has the lad a dog?</td>
    <td>那个少年有狗吗？</td>
  </tr>
  <tr>
    <td>The lad has a fat dog.</td>
    <td>那个少年有条胖狗。</td>
  </tr>
  <tr>
    <td>The dog has Nat's cap.</td>
    <td>狗叼了奈特的鸭舌帽。</td>
  </tr>
  <tr>
    <td>Nat and Rab ran.</td>
    <td>奈特和拉波在跑。</td>
  </tr>
  <tr>
    <td>Rab ran at a cat.</td>
    <td>拉波向猫跑去。</td>
  </tr>
</table>
