  <title>农夫和苹果树</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">农夫和苹果树</h1>

  <p>有一个农夫的果园里有一棵苹果树，不结果子，只能让麻雀和蚂蚱躲躲阴凉，让他们坐在他的树枝上唱歌。因为果树不长果子，农夫很失望，便决定将他砍倒，于是便去取了斧子。麻雀们和蚂蚱们看到了，便恳求他不要砍树：“如果你把树砍了，我们就要去别的地方寻找阴凉了，到时候你在果园中劳作的时候就再也听不到我们歌唱了。”但是农夫没有听他们的建议，开始了砍树的工作。砍了几下之后，他发现树其实已经空了，里面有一大窝蜜蜂和很多蜂蜜。他十分惊喜，将斧头扔到一边，说：“看样子这棵老树还是值得留着的。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：有用才是财富。</p>
