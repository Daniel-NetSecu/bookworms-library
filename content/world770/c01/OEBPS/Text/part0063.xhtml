<p class="title1" id="CHP61">LESSON 58</p>
<p class="picture"><img src="../Images/image01605.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>Ann can catch Rab.</td>
    <td>安能够追上拉波。</td>
  </tr>
  <tr>
    <td>See! She has the hat.</td>
    <td>瞧！她拿到了那顶帽子。</td>
  </tr>
  <tr>
    <td>Now Ann can pat Rab.</td>
    <td>现在，安可以拍拍拉波。</td>
  </tr>
  <tr>
    <td>Let me pat Rab, too.</td>
    <td>也让我拍拍拉波吧。</td>
  </tr>
</table>
