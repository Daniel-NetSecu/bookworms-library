  <div class="chapter" id="chapter">
    <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">THREE LITTLE MICE</h1>

    <p>Three little mice sat down to spin.</p>

    <p>Pussy passed by and she peeped in.</p>

    <p>“What are you at my fine little men?”</p>

    <p>“Making coats for gentlemen.”</p>

    <p>“Shall I come in and cut off your threads?”</p>

    <p>“Oh no! Miss Pussy, you'd bite off our heads!”</p>
