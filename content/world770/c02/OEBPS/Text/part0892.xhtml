  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">死亡像那虫子</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">死亡像那虫子</p>

  <p class="EB03BodyTextIndented">威胁着树，</p>

  <p class="EB03BodyTextIndented">足能杀死它，</p>

  <p class="EB03BodyTextIndented">但可能被引诱。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">用香脂诱惑它，</p>

  <p class="EB03BodyTextIndented">用刀子寻找它，</p>

  <p class="EB03BodyTextIndented">思量，它是否让你付出</p>

  <p class="EB03BodyTextIndented">生命中的一切。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">如果它已经钻出</p>

  <p class="EB03BodyTextIndented">技艺所及之处，</p>

  <p class="EB03BodyTextIndented">敲响大树并离开它，——</p>

  <p class="EB03BodyTextIndented">这是害虫的意愿。</p>
</body></html>
