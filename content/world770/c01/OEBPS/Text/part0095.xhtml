<p class="title1" id="CHP93">LESSON 90</p>
<p class="picture"><img src="../Images/image01640.jpeg.webp" alt="alt"/></p>
<p class="normaltext">James has been to market with his mamma.</p>
<p class="normaltext">She has bought some bread, some meat, and some tea, which are in the basket on her arm.</p>
<p class="normaltext">James is trying to tell his mamma what he has seen in the market.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">詹姆斯和妈妈来到了市场。</p>
<p class="normaltext">妈妈买了些面包、肉和茶，并把它们放进胳膊上挎着的篮子里。</p>
<p class="normaltext">詹姆斯正想告诉妈妈他在市场上都看到了什么。</p>
