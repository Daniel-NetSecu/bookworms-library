  <title>石榴</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">石榴</h1>

  <p>先前，一个人的果园里有许多石榴树。几乎每年秋天，他总把石榴放在银盘里，置于门外，盘上插着标牌，亲手写上：“欢迎自取，分文不收。”</p>

  <p>然而打银盘旁经过的人，谁都不拿石榴。</p>

  <p>他经过一番思考，当下一个秋天来临，没把满盛石榴的银盘置于户外，只是插了一个标牌，上写：“我有上等石榴，以高出其他石榴的价格出售。”</p>

  <p>临近的男男女女，都来争相抢购。</p>
