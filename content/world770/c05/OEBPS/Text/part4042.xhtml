  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">50</h1>

  <p class="kindle-cn-poem-left">爱，我的心日夜向往和你相见——<br/>
  那像吞灭一切的死亡一样的会见。<br/>
  像一阵风暴把我卷走，把我的一切都拿去；<br/>
  劈开我的睡眠抢走我的梦，剥夺了我的世界。<br/>
  在这毁灭里，在精神的全部赤露里，<br/>
  让我们在美中合一吧。<br/>
  我的空想是可怜的！<br/>
  除了在你里面，哪有这合一的希望呢，我的神？</p>
