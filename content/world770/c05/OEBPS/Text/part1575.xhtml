  <h2 class="kindle-cn-heading2">131　影子</h2>

  <p class="kindle-cn-signature">庞德</p>

  <p class="kindle-cn-poem-left">为什么那位脸蛋长长的、说不清年纪的女人<br/>
  沿着隆加里大街走着，无声地背诵斯文本？<span class="math-super"><a id="noteBack_1" href="part1575.xhtml#note_1">[1]</a></span><br/>
  为什么穿着貌似白色的脏皮衣的稚童<br/>
  在葡萄架下那条黑色的阴沟里爬行？<br/>
  为什么萨克维大街那位绝色的美女向我走近，<br/>
  但不因我显然衣着背时而停止不前？</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1575.xhtml#noteBack_1">[1]</a>斯文本，英国唯美主义诗人。</p>
