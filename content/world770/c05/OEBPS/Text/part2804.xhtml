  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">牧羊人和山羊</h1>

  <p>有一天，有一个牧羊人赶齐了自己的羊，准备回家，这时一只山羊离群而去，不愿意加入队伍。牧羊人花费了很大工夫，又是吹哨又是呼叫，想把羊哄回来，但是这只山羊不理不睬。最后，牧羊人丢出了一块石头，却砸坏了山羊的角。牧羊人万分沮丧，恳求山羊不要把这件事告诉主人。山羊答道：“你这傻瓜，就算我不说，犄角也在那明摆着啊。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：想要隐藏不能隐藏之物毫无意义。</p>
