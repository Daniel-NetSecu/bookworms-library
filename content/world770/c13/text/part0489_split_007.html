<h2 class="heading" id="calibre_pb_6">Stepmother</h2>

  <p class="p3"><span class="txt-c">●</span> Though she represents herself as a refined and elegant woman, her true nature is bitter, manipulative and conniving. She married Ella’s father for financial security and treats Ella with severe cruelty.</p>
