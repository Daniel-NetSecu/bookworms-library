  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">17</h1>

  <p>我只在等候着爱，要最终把我交在他手里。</p>

  <p>这是我延误的原因，我对这延误负咎。</p>

  <p>他们要用法律和规章来紧紧地约束我，</p>

  <p>但是我总是躲着他们，</p>

  <p>因为我只等候着爱，要最终把我交在他手里。</p>

  <p>人们责备我，说我不理会人；</p>

  <p>我也知道他们的责备是有道理的。</p>

  <p>市集已过，忙人的工作都已完毕。</p>

  <p>叫我不应的人都已含怒回去。</p>

  <p>我只等候着爱，要最终把我交在他手里。</p>
