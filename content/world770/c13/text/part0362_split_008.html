<h2 class="heading" id="calibre_pb_7">白皇后</h2>

  <p class="p">红皇后的妹妹。娇小纤弱，人见人爱。</p>

  <p class="p">白皇后曾一度统治地下世界，直到她丢失了屠龙剑。她能够施行治愈之术，且发下誓言不去伤害任何生物。</p>

  <p class="p">她引导爱丽丝进行自我发现。</p>
