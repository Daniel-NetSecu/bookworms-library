  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">11</h1>

  <p>把礼赞的数珠撇在一边吧！</p>

  <p>你在门窗紧闭、幽暗孤寂的殿角里，向谁礼拜呢？</p>

  <p>睁开眼你看，上帝不在你的面前！</p>

  <p>他是在锄着枯地的农夫那里，</p>

  <p>在敲石的造路工人那里。</p>

  <p>太阳下，阴雨里，</p>

  <p>他和他们同在，衣袍上蒙着尘土。</p>

  <p>脱掉你的圣袍，甚至像他一样地下到泥土里去吧！</p>

  <p>超脱吗？从哪里找超脱呢？</p>

  <p>我们的主已经高高兴兴地把创造的锁链戴起；</p>

  <p>他和我们大家永远连接在一起。</p>

  <p>从静坐里走出来吧，丢开供养的香花！</p>

  <p>你的衣服污损了又何妨呢？</p>

  <p>去迎接他，在劳动里，流汗里，和他站在一起吧。</p>
