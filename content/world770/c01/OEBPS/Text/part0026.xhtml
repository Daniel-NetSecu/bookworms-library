<p class="title1" id="CHP24">LESSON 21</p>
<p class="picture"><img src="../Images/image01567.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>What bird is this?</td>
    <td>这是什么鸟？</td>
  </tr>
  <tr>
    <td>It is an owl.</td>
    <td>是只猫头鹰。</td>
  </tr>
  <tr>
    <td>What big eyes it has!</td>
    <td>它的眼睛好大呀！</td>
  </tr>
  <tr>
    <td>Yes, but it can not see well by day.</td>
    <td>是的，但它白天看不清楚。</td>
  </tr>
  <tr>
    <td>The owl can see best at night.</td>
    <td>猫头鹰晚上看东西最清楚。</td>
  </tr>
  <tr>
    <td>Nat Pond has a pet owl.</td>
    <td>奈特·庞德养了只宠物猫头鹰。</td>
  </tr>
</table>
