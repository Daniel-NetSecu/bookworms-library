  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">135</h1>

  <p class="kindle-cn-poem-left1">女人都有心愿，你充满欲望<span class="math-super"><a id="a01" href="part2081.xhtml#b01">[1]</a></span>，<br/>
  你的欲已经太多，已嫌过剩；<br/>
  我也有过量的欲惹你心烦，<br/>
  总想为你的欲海添一加仑。<br/>
  你的欲海如此广阔而浩荡，<br/>
  为何不许我驶入一叶小舟？<br/>
  难道别人的欲求正正堂堂，<br/>
  偏我的欲求不值得你垂受？<br/>
  苍茫的大海仍接纳着雨露，<br/>
  为的是它的贮藏丰满充裕，<br/>
  你的欲本来富足，添我区区，<br/>
  能为你增彩，扩大你的疆域。<br/>
  　　别扼杀我的爱，别那般无情，<br/>
  　　万欲归一，专情于我这情种。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="b01" href="part2081.xhtml#a01">[1]</a> 原文will一词有多种含义：意志；欲念；男女生殖器；威廉·莎士比亚的昵称。</p>
