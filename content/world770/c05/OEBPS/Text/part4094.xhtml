  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">14</h1>

  <p>我的欲望很多，我的哭泣也很可怜，</p>

  <p>但你永远用坚决的拒绝来拯救我；</p>

  <p>这刚强的慈悲已经紧密地交织在我的生命里。</p>

  <p>你使我一天一天地更配领受你自动的、简单伟大的赐予——</p>

  <p>这天空和光明。这躯体和生命与心灵——</p>

  <p>把我从极欲的危险中拯救了出来。</p>

  <p>有时候我懈怠地挨延，有时候我急忙警觉寻找我的路向；</p>

  <p>但是你却忍心地躲藏起来。</p>

  <p>你不断地拒绝我，</p>

  <p>从软弱动摇的欲望的危险中拯救了我，</p>

  <p>使我一天一天地更配受你完全的接纳。</p>
</body></html>
