<h2 class="heading" id="calibre_pb_9">运儿</h2>

  <p class="p">运儿是一头游泳技术欠佳的鲸鲨，不过她有着一颗巨大的心。实际上，她身上的一切都很巨大——鲸鲨是海洋中最大的鱼。运儿居住在海洋生物研究所。</p>
