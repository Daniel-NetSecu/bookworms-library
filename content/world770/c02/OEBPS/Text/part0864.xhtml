  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">一只受伤的鹿跳得最高</h2>

  <p class="EB03BodyTextIndented">❧<sup><a id="z1" href="part0864.xhtml#bz1">[1]</a></sup></p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">一只受伤的鹿跳得最高，</p>

  <p class="EB03BodyTextIndented">我听那猎人讲：</p>

  <p class="EB03BodyTextIndented">那不过是死的惊恐，</p>

  <p class="EB03BodyTextIndented">然后矮树丛寂然不动。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">被重击的岩石迸涌，</p>

  <p class="EB03BodyTextIndented">被践踏的钢铁涌流：</p>

  <p class="EB03BodyTextIndented">面颊总是骤然绯红</p>

  <p class="EB03BodyTextIndented">当一阵潮热激刺！</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">欢乐是苦痛的铠甲，</p>

  <p class="EB03BodyTextIndented">在内里它小心武装，</p>

  <p class="EB03BodyTextIndented">以免任何人察觉血迹</p>

  <p class="EB03BodyTextIndented">而惊呼“你受伤了”！</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="bz1" href="part0864.xhtml#z1">[1]</a>狄金森原诗均无标题，为查阅方便，目录取每首诗首句为标题。——编者注</p>
