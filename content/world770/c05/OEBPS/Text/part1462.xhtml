  <h2 class="kindle-cn-heading2">19　听！听！云雀<span class="math-super"><a id="noteBack_1" href="part1462.xhtml#note_1">[1]</a></span></h2>

  <p class="kindle-cn-signature">莎士比亚</p>

  <p class="kindle-cn-poem-left">听！听！云雀在天门歌吟，<br/>
  福玻斯已经起驾，<br/>
  在鲜花盛开的泉边<br/>
  正饮他驾驭的骏马。<br/>
  晶莹闪烁的金盏花，<br/>
  睁开金色的眼睛，<br/>
  美好的事物都已苏醒，<br/>
  醒醒吧，我的美人，<br/>
  醒醒，醒醒！</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1462.xhtml#noteBack_1">[1]</a>见于《辛白林》第二幕第三场。</p>
