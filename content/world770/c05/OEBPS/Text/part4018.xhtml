  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">26</h1>

  <p class="kindle-cn-poem-left">“从你慷慨的手里所付与的，我都接受。我别无所求。”<br/>
  “是了，是了，我懂得你，<br/>
  谦卑的乞丐，你是乞求一个人的所有。”<br/>
  “若是你给我一朵残花，我也要把它戴在心上。”<br/>
  “若是那花上有刺呢？”<br/>
  “我就忍受着。”<br/>
  “是了，是了，我懂得你，谦卑的乞丐，<br/>
  你是乞求一个人的所有。”<br/>
  “如果你只在我脸上瞥来一次爱怜的眼光，<br/>
  就会使我的生命直到死后还是甜蜜的。”<br/>
  “假如那只是残酷的眼色呢？”<br/>
  “我要让它永远穿刺我的心。”<br/>
  “是了，是了，我懂得你，谦卑的乞丐，<br/>
  你是乞求一个人的所有。”</p>
