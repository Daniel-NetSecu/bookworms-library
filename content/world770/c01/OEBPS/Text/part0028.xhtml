<p class="title1" id="CHP26">LESSON 23</p>
<p class="picture"><img src="../Images/image01569.jpeg.webp" alt="alt"/></p>
<p class="normaltext">The sun will soon set.</p>
<p class="normaltext">The cows are on their way to the barn.</p>
<p class="normaltext">One old cow has a bell on her neck. She sees our dog, but she will not run.</p>
<p class="normaltext">Our dog is kind to the cows.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">太阳很快就要落山了。</p>
<p class="normaltext">一群母牛正在回牛棚的路上。</p>
<p class="normaltext">一只老母牛脖子上挂了个铃铛。它看见了我们的狗，但不会跑开。</p>
<p class="normaltext">我们的狗对牛很友好。</p>
