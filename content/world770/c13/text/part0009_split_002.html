<h2 class="heading" id="calibre_pb_1">朱迪·霍普斯</h2>

  <p class="p">朱迪·霍普斯是一只心思缜密、具有理想主义色彩、忠诚坚定的兔子。她认为动物城的动物无所不能，而她最大的理想则是在动物城警察局当一名警官。然而，在搬到这座大城市之后，她发现做警察局有史以来第一位兔子警官并非易事。为了证明自己的实力，朱迪欣然接受了一个破案的机会，即便那意味着要与油嘴滑舌、诡计多端的狐尼克一起来破解这个谜团。</p>
