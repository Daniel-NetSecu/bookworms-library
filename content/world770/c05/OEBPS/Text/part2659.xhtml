  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">青蛙医生</h1>

  <p>从前有一只青蛙，他离开在沼泽中的家，向众人宣布，他是个精通医术的医生，擅长用药，包治百病。有只狐狸大声喊道：“你，医生？哎呀，你连自己那瘸腿和起皱的皮都治不好，怎么还能治好别人的病呢？”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：医人者，先自医。</p>
