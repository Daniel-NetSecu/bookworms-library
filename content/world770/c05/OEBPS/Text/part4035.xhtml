  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">43</h1>

  <p class="kindle-cn-poem-left">不，我的朋友，我永不会做一个苦行者，<br/>
  随便你怎么说。<br/>
  我将永不做一个苦行者，<br/>
  假如她不和我一同受戒。<br/>
  这是我坚定的决心，<br/>
  如果我找不到一个阴凉的住处和一个忏悔的伴侣，<br/>
  我将永远不会变成一个苦行者。<br/>
  不，我的朋友，我将永不离开我的炉火与家庭，<br/>
  去退隐到深林里面。<br/>
  如果在林荫中没有欢笑的回响；<br/>
  如果没有郁金色的衣裙在风中飘扬；<br/>
  如果它的幽静不因有轻柔的微语而加深。<br/>
  我将永不会做一个苦行者。</p>
