<h1 class="title1">内容简介</h1>
<p class="normaltext2a">2030年，纽约。未来的这个时候会有什么不一样呢？嗯，有新式飞机、飞行汽车，有很多高楼大厦，而且宇航员能去火星旅行了。但有些事情和今天并没太大区别……</p>
<p class="normaltext2a">人们还在收看电视新闻和泡网吧，也还有电脑，使用电子邮件。未来并非对每个人都是那么美好——在美国还是有很多填不饱肚子的穷人……其实全世界也都一个样儿。就连杀人的事儿也还有。</p>
<p class="normaltext2a">“电脑通”想改变现状，为所有人创造更好的未来。但怎样去帮助人们，让他们开心呢？要做到这点，有好办法，也有坏办法。做正确的事并不总是那么容易。</p>
