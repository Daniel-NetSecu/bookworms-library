  <title>赫拉克勒斯和普路托斯</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">赫拉克勒斯和普路托斯</h1>

  <p>赫拉克勒斯受到朱庇特的邀请，和诸神一起参加宴会，他对所有的神都很有礼貌，只是对财神普路托斯不礼貌。普路托斯走到他旁边，他就眼睛盯着地面，或扭头假装没看见对方。朱庇特很惊奇，问他为什么和其他神都如此友好，却对普路托斯如此。赫拉克勒斯回答：“陛下，我不喜欢普路托斯，我会跟您说明原因。因为我们都在人间的时候，我总是看到他和恶棍为友。”</p>
