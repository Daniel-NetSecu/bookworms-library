  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">熠然铄金，熄灭于紫色</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">熠然铄金，熄灭于紫色，</p>

  <p class="EB03BodyTextIndented">猎豹般跃向天空，</p>

  <p class="EB03BodyTextIndented">而后在古老的地平线</p>

  <p class="EB03BodyTextIndented">俯下她斑驳的脸，去死；</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">倾身低俯与厨房窗户般高，</p>

  <p class="EB03BodyTextIndented">触摸屋顶，微染谷仓，</p>

  <p class="EB03BodyTextIndented">对着草地飞吻她的女帽，——</p>

  <p class="EB03BodyTextIndented">白日的魔术师走了！</p>
