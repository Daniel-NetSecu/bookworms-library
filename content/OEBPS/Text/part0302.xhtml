<h1 class="title1" id="CHP3">内容简介</h1>
<p class="normaltext2">1607年，汤姆·克里克的海盗船“黑星号”沉入了海底，汤姆·克里克失去了他所有的财宝。就在船沉入海底的时候，他喊道：“这是我的财宝，不是别人的。我诅咒这些财宝——永远诅咒！”</p>
<p class="normaltext"><br/></p>
<p class="normaltext2">许多年过去了。许多人试图得到那些财宝。许多人因此而丧生。</p>
<p class="normaltext"><br/></p>
<p class="normaltext2">2009年，又有一行人踏上了寻找“黑星号”的征程。这艘船叫作“沙丁鱼号”。约翰·韦斯特和他的妻子梅以及他们的朋友们想要找到财宝，他们并不害怕汤姆·克里克的诅咒，有的人甚至认为根本没有什么诅咒。</p>
<p class="normaltext"><br/></p>
<p class="normaltext2">他们这么想，究竟是对了，还是疯了？</p>
