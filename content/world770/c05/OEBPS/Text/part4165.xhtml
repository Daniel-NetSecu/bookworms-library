  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">85</h1>

  <p>当战士们从他们主公的明堂里刚走出来，</p>

  <p>他们的武力藏在哪里呢？他们的甲胄和干戈藏在哪里呢？</p>

  <p>他们显得无助、可怜，当他们从他们主公的明堂走出的那一天，</p>

  <p>如雨的箭矢向着他们飞射。</p>

  <p>当战士们整队走回他们主公的明堂里的时候，</p>

  <p>他们的武力藏在哪里呢？</p>

  <p>他们放下了刀剑和弓矢；</p>

  <p>和平在他们的额上放光。</p>

  <p>当他们整队走回他们主公的明堂的那一天，</p>

  <p>他们把他们生命的果实留在后面了。</p>
