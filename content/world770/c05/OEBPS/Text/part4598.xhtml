  <title>诅咒</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">诅咒</h1>

  <p>一次，一位老水手对我说：“三十年前，那个水手抢走了我的女儿，带着我的女儿逃跑了。我开始在心里诅咒他俩，因为在这个世界上，除了我的女儿，我不喜欢任何人。</p>

  <p>“时隔不久，那个水手连同船一起沉入大海，我可爱的女儿也与他一起葬身海底。</p>

  <p>“现在，你瞧瞧我这个害死了小伙子和姑娘的人！是我诅咒毁灭了他俩。如今我将要入土，求上帝宽恕我的罪过。”</p>

  <p>老者这样说，然而他的语调里却充满自负与豪迈，好像仍在炫耀他那咒语的力量。</p>
