  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">120</h1>

  <p class="kindle-cn-poem-left1">我从你往昔的薄情中获益：<br/>
  只要想起我经受过的悲伤，<br/>
  我不得不悔恨自己的过失，<br/>
  否则我就是那铁石的心肠。<br/>
  如你曾因我的薄情而痛心，<br/>
  那你我都游历了地狱一趟；<br/>
  我是暴君，居然不及时反省，<br/>
  将你对我的伤害仔细掂量。<br/>
  哟，那伤心的一晚必然记得：<br/>
  我的悲哀如何触及了心髓！<br/>
  我们随即又相互道歉自责，<br/>
  用谦恭的药膏将伤口抚慰。<br/>
  　　但你的罪如今成了赔偿费，<br/>
  　　我赎你的，你也该把我赎回。</p>
