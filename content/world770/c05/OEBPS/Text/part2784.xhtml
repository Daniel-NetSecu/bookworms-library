  <title>驴和买家</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">驴和买家</h1>

  <p>有一个人想要买一头驴，便去了市场。他碰到了一头看上去还不错的牲口，于是便和驴的主人达成协议，他可以把驴牵回家试用，看看到底怎样。到家后，他把驴放进自己的畜栏中，和其他驴放在一起。这新来的驴环顾四周，立刻选择了畜栏中最懒惰、最贪婪的牲口旁边的位置。买主看到，便马上给他套上笼头，牵着他还给了主人。主人很好奇他怎么这么快就回来了。“你是说你已经测试过他了？”“我不想让他再做任何测试了，”买主回答说，“我从他给自己选择的朋友就可以看出他是什么样的牲口。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：一个人有什么样的朋友，就能说明他是什么样的人。</p>
