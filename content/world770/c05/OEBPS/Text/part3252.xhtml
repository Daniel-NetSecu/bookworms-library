  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">玛丽之歌</h1>

  <p class="kindle-cn-poem-left">周日烤羔羊在脂肪中爆裂。<br/>
  那脂肪<br/>
  献祭了模糊一片……。<br/>
  <br/>
  一扇窗，神圣的金黄。<br/>
  火使它变得珍贵，<br/>
  相同的火<br/>
  <br/>
  烧融了涂了油脂的异教徒，<br/>
  驱逐那些犹太人。<br/>
  他们浓重的烟雾飘浮<br/>
  <br/>
  覆盖在波兰的瘢痕上，烧毁了的<br/>
  德国。<br/>
  他们并没有死。<br/>
  <br/>
  灰色的鸟群使我心神不宁，<br/>
  满嘴的灰，满眼的灰。<br/>
  它们降落。在高高的<br/>
  <br/>
  悬崖上<br/>
  将一位男子清空在空旷中<br/>
  烤炉像天堂那样发光，灼热。<br/>
  <br/>
  这是一颗心，<br/>
  我走进这次大屠杀，<br/>
  哦，金色孩子，这世界将杀而食之。</p>
