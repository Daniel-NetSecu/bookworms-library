  <h2 class="kindle-cn-heading2">72　致玛丽：这会儿是黄昏<span class="math-super"><a id="noteBack_1" href="part1515.xhtml#note_1">[1]</a></span></h2>

  <p class="kindle-cn-signature">克莱</p>

  <p class="kindle-cn-poem-left">这会儿是黄昏，<br/>
  万籁俱寂：<br/>
  新月在银河夜空<br/>
  露出她的脸。<br/>
  长满菖蒲、明澈如镜的湖<br/>
  静卧在我们走过的路边。</p>

  <p class="kindle-cn-poem-left">我爱她的幽灵，<br/>
  当我悠悠而行，<br/>
  时而停下脚步，摘取<br/>
  寂静中生长的鲜艳花朵，<br/>
  它向我窃窃低语，叙说甜美的故事，<br/>
  我们要把花带回家，连同晶莹的露珠。</p>

  <p class="kindle-cn-poem-left">玛丽，或干脆称呼你可爱的幽灵，<br/>
  当明天灿烂的太阳照耀，<br/>
  你乌黑的双眸将看见<br/>
  我在忧伤中采摘的这些花朵，<br/>
  当我静下心来，独自走进<br/>
  深沉的午夜——我仍希望与你一起漫步。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1515.xhtml#noteBack_1">[1]</a>诗中的玛丽是诗人的初恋情人，但他们最终没有结合。这段情感经历苦恼了诗人许久。</p>
