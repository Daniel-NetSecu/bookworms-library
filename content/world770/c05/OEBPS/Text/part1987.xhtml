  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">41</h1>

  <p class="kindle-cn-poem-left1">有时候，我会离开你的心扉，<br/>
  你便放荡不羁，做出风流事，<br/>
  这情有可原，因你年轻貌美，<br/>
  始终有诱惑紧紧追随着你。<br/>
  你性情温和，难免讨人欢喜，<br/>
  你长得英俊，难免惹人爱怜；<br/>
  当女子向你献媚，哪有男子<br/>
  如此乖张，居然坐怀不动心？<br/>
  哎呀，你不该侵占我的位置，<br/>
  你应申斥美与迷失的青春，<br/>
  是它们教你学会放浪形迹，<br/>
  并迫使你违背双重的誓盟：<br/>
  　　于她，你的美使她朝三暮四，<br/>
  　　于我，你的美让你有失诚实。</p>
