  <h2 class="kindle-cn-heading2">22　十四行诗第154首</h2>

  <p class="kindle-cn-signature">莎士比亚</p>

  <p class="kindle-cn-poem-left">有一天，小爱神正昏睡沉沉，<br/>
  点燃爱情的火炬搁在一边；<br/>
  恪守贞操的山林水泽女神<br/>
  款款而至；那位最美的女仙<br/>
  举起火炬，用她纯洁的手<br/>
  解除了爱神的武装；这火炬<br/>
  曾让无数情人获得爱的温柔；<br/>
  爱情的统帅，此时睡得正熟。<br/>
  仙女将火炬熄灭在冷泉中，<br/>
  泉水从此获得恒爱的热力，<br/>
  变成温泉，治人间各种病痛。<br/>
  而我呢，我这个爱情的奴隶<br/>
  也去那里求治，由此我明白：<br/>
  爱烧热泉水，水冷却不了爱。</p>
