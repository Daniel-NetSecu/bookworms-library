  <title>河和大海</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">河和大海</h1>

  <p>有一回，所有的河都联合起来，抗议大海把它们的水都变成了咸的。它们对大海说：“我们来找你的时候，全都甘甜可口，但是一和你合到一起，我们的水就变得像你一样又咸又涩，难以下咽。”大海的回答很简单：“离我远点，你们自然能保持甘甜。”</p>
