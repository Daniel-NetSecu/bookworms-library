  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">9</h1>

  <p class="kindle-cn-poem-left1">你因害怕见到寡妇的泪滴<br/>
  才以独身消耗自己的生命？<br/>
  哎呀呀，如果你无后而离世，<br/>
  世界将像未亡人为你哭灵；<br/>
  丧偶的世界会哀哀地泣诉，<br/>
  抱怨你没有留下你的形象，<br/>
  而别的寡妇凭孩子的明目<br/>
  就能将她的丈夫记得端详。<br/>
  你看看，浪子在世挥霍金钱，<br/>
  钱财换主人，世界依然无损；<br/>
  但美的消费却规定着期限，<br/>
  你留着不用，就毁在你本人。<br/>
  　　对自己尚且做可耻的戕害，<br/>
  　　如此胸襟对他人不会有爱。</p>
