  <title>在柳园</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">在柳园<a id="w1"></a><a href="part0496.xhtml#m1"><sup>[1]</sup></a>旁</h2>

  <p class="EB03BodyTextIndented">在柳园旁，我与我的爱人相遇；</p>

  <p class="EB03BodyTextIndented">她雪白的小脚，走过柳园。</p>

  <p class="EB03BodyTextIndented">她要我爱得放松，像绿叶长在树上；</p>

  <p class="EB03BodyTextIndented">但我，年轻又无知，没能认同。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">在河边草地，我和我的爱人站着；</p>

  <p class="EB03BodyTextIndented">她雪白的手，放在我微倾的肩上。</p>

  <p class="EB03BodyTextIndented">她要我爱得放松，像青草长在堤岸上；</p>

  <p class="EB03BodyTextIndented">但我年轻又无知，而现在满是泪水。</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="m1"></a><a href="part0496.xhtml#w1">[1]</a> 柳园（Salley Gardens），位于爱尔兰斯莱果郡一条小河边。“salley”源自爱尔兰语“saileach”，有“柳树”的意思。此处是年轻恋人约会的地方。（说明：本书脚注均为译者注。）</p>
</body></html>
