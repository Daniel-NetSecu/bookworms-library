  <h2 class="kindle-cn-heading2">98　爽约</h2>

  <p class="kindle-cn-signature">哈代</p>

  <p class="kindle-cn-poem-left">你没有赴约，<br/>
  时间在逼近，我的知觉变得麻木。<br/>
  但比你的缺席更糟的是：<br/>
  我由此发现你缺乏高贵的同情；<br/>
  仅仅为了证明你有仁爱之心，<br/>
  你也该勉力而为，践约前来。<br/>
  当希望的钟声最终沉寂，我痛心<br/>
  你没有赴约。</p>

  <p class="kindle-cn-poem-left">你不爱我，<br/>
  唯有爱能催生出你的忠诚；<br/>
  ——这我自始至终懂得。然而，<br/>
  在人类实至名归的神圣懿行中，<br/>
  难道不值得你花有限的一小时<br/>
  再添一件善事：你，一个女人，<br/>
  安慰一下受时间折磨的男人，即便<br/>
  你真不爱我？</p>
