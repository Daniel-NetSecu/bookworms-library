  <h2 class="EB04MainHeadClosedTitle">两个死对头</h2>

  <p class="EB03BodyTextIndented">两个互为死敌的男人乘坐同一艘船航行。为了能够离对方足够远，他们一个坐在船尾，一个坐在船头。</p>

  <p class="EB03BodyTextIndented">一场猛烈的暴风雨来临，船有沉没的危险。在船尾的那个人问领航员，船的哪头会先沉没。领航员回答说船头可能先沉下去。这个人说：“我不会觉得死亡是件悲伤的事情，只要我能看到我的敌人比我先死。”</p>
