  <h3 class="EB04MainHead2">在船上的舵轮旁</h3>

  <p class="EB03BodyTextIndented">在船上的舵轮旁，</p>

  <p class="EB03BodyTextIndented">一个年轻舵手小心地操纵航向。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">透过浓雾，海岸上哀哀响彻着</p>

  <p class="EB03BodyTextIndented">一口海洋钟—啊，是波浪摇动的一口警钟。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">啊，你给了很好的提醒，你这口钟在暗礁旁鸣响，</p>

  <p class="EB03BodyTextIndented">鸣响，鸣响，警告船只不要误撞翻沉。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">因为舵手啊，警惕的你在意那响亮的告诫，</p>

  <p class="EB03BodyTextIndented">拨转了船头，满载的货船张着灰色船帆顺应风向，加速离去，</p>

  <p class="EB03BodyTextIndented">雍容美丽的船带着她所有的珍宝加速离去，欢快又安全。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">但是那只船，不朽的船啊！船上的船啊！</p>

  <p class="EB03BodyTextIndented">肉体的船，灵魂的船，一直航行，航行，航行。</p>
