<h2 class="heading" id="calibre_pb_5">红皇后</h2>

  <p class="p">地下世界的残酷统治者。她将所有与她意见不合的人砍头。</p>

  <p class="p">她始终对她美丽的妹妹白皇后嫉妒万分，并对黑骑士怀有好感。在得知辉煌日一事后，红皇后下令将爱丽丝逮捕，以保护她的炸脖龙。比起为人所爱，她宁愿为人所惧。她没什么耐心，火气却很大。</p>
