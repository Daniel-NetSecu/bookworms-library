  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">信使</h1>

  <p class="kindle-cn-poem-left">蜗牛之词在叶形的盘子上？<br/>
  这不是我的。不要接受它。<br/>
  <br/>
  密封罐里的醋酸？<br/>
  不要接受它。它不真实。<br/>
  <br/>
  刻有太阳图案的一枚金戒？<br/>
  谎言。各种谎言，一种悲伤。<br/>
  <br/>
  树叶上的霜，完美无瑕的<br/>
  大锅，自言自语，噼啪作响<br/>
  <br/>
  将所有这一切送至阿尔卑斯<br/>
  九个黑色的山峰。<br/>
  <br/>
  多重镜子中的混乱，<br/>
  灰色大海正在破碎——<br/>
  <br/>
  爱情，爱情，我的季节。</p>
