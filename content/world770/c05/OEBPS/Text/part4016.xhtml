  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">24</h1>

  <p class="kindle-cn-poem-left">不要把你心的秘密藏起，我的朋友！<br/>
  对我说吧，秘密地对我一个人说吧。<br/>
  你这个笑得这样温柔、说得这样轻软的人，<br/>
  我的心将听着你的语言，不是我的耳朵。<br/>
  夜深沉，庭宁静，鸟巢也被睡眠笼罩着。<br/>
  从踌躇的眼泪里，从沉吟的微笑里，<br/>
  从甜柔的羞怯和痛苦里，把你心的秘密告诉我吧！</p>
