  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">25</h1>

  <p class="kindle-cn-poem-left">“到我们这里来吧，<br/>
  青年人，老实告诉我们，<br/>
  为什么你眼里带着疯癫？”<br/>
  “我不知道我喝了什么野罂粟花酒，<br/>
  使我的眼里带着疯癫。”<br/>
  “啊，多难为情！”<br/>
  “好吧，有的人聪明有的人愚拙，<br/>
  有的人细心有的人马虎。<br/>
  有的眼睛会笑，有的眼睛会哭——<br/>
  我的眼睛是带着疯癫的。”<br/>
  “青年人，你为什么这样凝立在树影下呢？”<br/>
  “我的脚被我沉重的心压得疲倦了，<br/>
  我就在树影下凝立着。”<br/>
  “啊，多难为情！”<br/>
  “好吧，有人一直行进，有人到处流连，<br/>
  有的人是自由的，有的人是锁住的——<br/>
  我的脚被我沉重的心压得疲倦了。</p>
