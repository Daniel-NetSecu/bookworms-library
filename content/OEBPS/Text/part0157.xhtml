<p class="title1">内容简介</p>
<p class="normaltext2">格雷格在纽约的谢普顿酒店工作。酒店对面有一家咖啡馆，每天下班后，格雷格都要去那里喝上一杯咖啡。他每天都会在那里看见一个女子，她有一双漂亮的绿色眼睛。有一天，格雷格坐到那女子的旁边。她说自己叫凯茜，并且请求他的帮助。</p>
<p class="normaltext2">凯茜告诉格雷格自己是一名画家。她说她的继父拿走了她的写生簿，她想把它们拿回来。她还说她的继父现在就住在谢普顿酒店里。格雷格答应帮忙。</p>
<p class="normaltext2">格雷格拿到了写生簿并把它们交给了凯茜。他很高兴，凯茜也很开心。</p>
<p class="normaltext2">但是，紧接着格雷格的朋友迈克找到了他，说他有麻烦了。警察要找他谈话，并且就在格雷格的公寓里等候着。</p>
<p class="normaltext2">到底出了什么岔子？为什么警察要找格雷格谈话？</p>
