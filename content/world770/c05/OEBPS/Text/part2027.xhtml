  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">81</h1>

  <p class="kindle-cn-poem-left1">要么我活着写你的墓志铭，<br/>
  要么你活着，我在地下腐烂，<br/>
  虽然我被遗忘得一干二净，<br/>
  死神无碍世人对你的怀念。<br/>
  你的名字享受永恒的生命，<br/>
  而我，一旦死去，就永离人寰；<br/>
  大地给予我的是一座荒坟，<br/>
  你却在世人的眼睛中长眠。<br/>
  你的纪念碑就是我的诗词，<br/>
  专供未来的眼睛细细观瞻，<br/>
  即便现今活着的人全去世，<br/>
  后来者仍将传诵你的华诞。<br/>
  　　你将永生——我的笔有此神力，<br/>
  　　让你活在人的气息和嘴里。</p>
