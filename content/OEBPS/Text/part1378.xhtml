<h1 class="title1">内容简介</h1>
<p class="normaltext">她5岁零3个月，穿着白色的长睡裙，有一头金发，大大的眼睛像意大利夏日的天空一样湛蓝，声音温柔而甜美。她想要阿德里安带她去找远方的妈妈。</p>
<p class="normaltext">阿德里安放假了，正与父母一同在意大利旅行。一天晚上，他们来到亨德森庄园，决定在此过夜。深夜醒来，阿德里安发现房间里有一个小女孩，她叫阿利格拉，长着蓝色的大眼睛，小手冰凉。阿德里安先是大吃一惊，然后他记起来女主人基娅拉·亨德森说过自己有一个小女儿。可阿利格拉为什么说她妈妈在很远的地方呢？而且阿德里安卧室的门是锁着的，阿利格拉是怎么进来的呢？</p>
<p class="normaltext">阿德里安疑惑不解，决定第二天一早去向阿利格拉的母亲问个究竟，可是，等待他的却是更大的谜团……</p>
