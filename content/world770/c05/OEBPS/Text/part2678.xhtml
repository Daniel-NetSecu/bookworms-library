  <title>徒劳的寒鸦</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">徒劳的寒鸦</h1>

  <p>朱庇特宣布，他要任命一个鸟类之王，召集众鸟在指定日期来见他，到时候他会挑选出最漂亮的鸟来做他们的统治者。为了呈现出最好的样子，鸟儿们成群结队地来到一条小溪边，对着水梳洗打扮，整理羽毛。寒鸦也在其中，他意识到自己的羽毛实在丑陋，肯定不会被选中，于是他等到所有的鸟都走了，把他们落下的羽毛中最花哨的收集在一起，粘在了自己身上，这样他看上去就比其他鸟都好看了。到了指定日期，鸟儿们都集合在朱庇特的宝座之前。朱庇特检阅过众鸟之后，准备选寒鸦为王，但其他的鸟对此非常不满，群起攻击这位候选的鸟王，把他伪造的羽毛都扯了下来，让他露出了本来面目。</p>
