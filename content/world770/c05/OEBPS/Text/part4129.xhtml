  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">49</h1>

  <p>你从宝座上下来，站在我草舍门前。</p>

  <p>我正在屋角独唱，歌声被你听到了。</p>

  <p>你下来站在我草舍门前。</p>

  <p>在你的广厅里有许多名家，一天到晚都有歌曲在唱。</p>

  <p>但是这初学的简单的音乐，却得到了你的赏识。</p>

  <p>一支忧郁的小调，和世界的伟大音乐融合了。</p>

  <p>你还带了花朵作为奖赏，下了宝座，停留在我的草舍门前。</p>
