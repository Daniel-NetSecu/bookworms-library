  <title>弓箭手和狮子</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">弓箭手和狮子</h1>

  <p>有一个弓箭手带着弓箭进山打猎，所有的动物一看到他就都跑了，只有狮子留在最后，向人发起挑战。弓箭手把一支箭射向狮子，射中了他。弓箭手说：“看到我的信使能做什么了吧。等一下我亲自来处理你。”尽管箭伤很痛，但是狮子还是用尽全力飞速逃跑。狐狸看到了，对狮子说：“别做胆小鬼，你为什么不留下来大战一场呢？”但是狮子回答：“你别想让我留下来，你不可以的。哎呀，那人派了个这样的信使来，他本人肯定是个更难对付的可怕家伙。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：对能远攻者，要更敬而远之。</p>
</body></html>
