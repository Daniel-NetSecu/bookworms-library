<h1 class="calibre22" id="calibre_pb_249">第四十七节</h1>

      <p class="x5">使用货币进行支付的做法使卖方和买方产生了区别。</p>

      <p class="x6">随着人类越来越习惯使用白银衡量所有东西、把所有剩余商品都兑换成白银以及只用这种货币换取当时对他们有用或他们喜欢的东西，他们也开始习惯从不同的角度考虑商业交换。他们开始区分两种人，即买家和买家：卖家是指那些用商品换取货币的人；而买家是指那些用货币换取商品的人。</p><a id="Section_cn_48"></a>
