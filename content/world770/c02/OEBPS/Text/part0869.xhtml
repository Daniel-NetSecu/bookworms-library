  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">我能涉水蹚过</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我能涉水蹚过，</p>

  <p class="EB03BodyTextIndented">整池的悲伤，——</p>

  <p class="EB03BodyTextIndented">我习惯了。</p>

  <p class="EB03BodyTextIndented">可是快乐微微一推</p>

  <p class="EB03BodyTextIndented">就折断了我的脚，</p>

  <p class="EB03BodyTextIndented">我歪倒——醉了。</p>

  <p class="EB03BodyTextIndented">别让哪颗石子笑，</p>

  <p class="EB03BodyTextIndented">那是新酒，——</p>

  <p class="EB03BodyTextIndented">那是一切！</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">力量只是痛苦，</p>

  <p class="EB03BodyTextIndented">通过自律，拧成股，</p>

  <p class="EB03BodyTextIndented">直到沉重都挂起。</p>

  <p class="EB03BodyTextIndented">把没药<sup><a id="z4" href="part0869.xhtml#bz4">[4]</a></sup>给巨人们</p>

  <p class="EB03BodyTextIndented">他们会萎靡，就像常人。</p>

  <p class="EB03BodyTextIndented">给他们喜马拉雅山，——</p>

  <p class="EB03BodyTextIndented">他们会扛着他！</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="bz4" href="part0869.xhtml#z4">[4]</a>没药，中药名，为橄榄科植物地丁树的干燥树脂。——编者注</p>
</body></html>
