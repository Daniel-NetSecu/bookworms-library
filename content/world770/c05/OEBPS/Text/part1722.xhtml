  <h2 class="kindle-cn-heading2">130. A Girl</h2>

  <p class="kindle-cn-signature">——E. Pound</p>

  <p class="kindle-cn-poem-left">The tree has entered my hands,<br/>
  The sap has ascended my arms,<br/>
  The tree has grown in my breast——<br/>
  Downward,<br/>
  The branches grow out of me, like arms.</p>

  <p class="kindle-cn-poem-left">Tree you are,<br/>
  Moss you are,<br/>
  You are violets with wind above them.<br/>
  A child——so high——you are,<br/>
  And all this is folly to the world.</p>
