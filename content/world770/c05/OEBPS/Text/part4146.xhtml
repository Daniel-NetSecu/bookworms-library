  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">66</h1>

  <p>那在神光离合之中，潜藏在我生命深处的她，</p>

  <p>那在晨光中永远不肯揭开面纱的她，</p>

  <p>我的上帝，我要用最后的一首歌把她包裹起来，</p>

  <p>作为我给你的最后的献礼。</p>

  <p>无数求爱的话，都已说过，但还没有赢得她的心；</p>

  <p>劝诱向她伸出渴望的臂，也是枉然。</p>

  <p>我把她深藏在心里，到处漫游，</p>

  <p>我生命的荣枯围绕她起落。</p>

  <p>她统治着我的思想、行动和睡梦，她却自己独居索处。</p>

  <p>许多的人叩我的门来访问她，都失望地回去。</p>

  <p>在这世界上从没有人和她面对过面，</p>

  <p>她在孤守着静待你的赏识。</p>
