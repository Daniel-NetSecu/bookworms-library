  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">3</h1>

  <p>我不知道你怎样地唱，我的主人！</p>

  <p>我总在惊奇地静听。</p>

  <p>你的音乐的光辉照亮了世界。</p>

  <p>你的音乐的气息透彻诸天。</p>

  <p>你的音乐的圣泉冲过一切阻挡的岩石，向前奔涌。</p>

  <p>我的心渴望和你合唱，而挣扎不出一点声音。</p>

  <p>我想说话，但是言语不成歌曲，我叫不出来。</p>

  <p>啊，你使我的心变成了你的音乐的漫天大网中的俘虏，我的主人！</p>
