  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">28</h1>

  <p class="kindle-cn-poem-left1">既然休息的好处已被剥夺，<br/>
  黑夜压迫着白天，一刻不停，<br/>
  日日夜夜都在无眠中度过，<br/>
  让我如何再有愉快的心境？<br/>
  白天与黑夜，本是天生仇冤，<br/>
  为了折磨我，居然联手一起，<br/>
  一个劳我筋骨，一个在抱怨，<br/>
  说我操劳无益，你我永疏离。<br/>
  为取悦白天，我说你真璀璨，<br/>
  蔽日的乌云无损你的恩泽，<br/>
  我奉承黑夜，当星光变暗淡，<br/>
  你仍给黑夜涂上一层金色。<br/>
  　　但白天日日延长我的愁绪，<br/>
  　　那黑夜也夜夜使悲痛加剧。</p>
