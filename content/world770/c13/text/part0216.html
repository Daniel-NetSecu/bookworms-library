  <h1 class="heading1" id="calibre_pb_0">第 28 章</h1>

  <p class="calibre7">在能俯瞰整个旧金山湾的风力涡轮发电机上面，六个因机缘巧合成为超级英雄的伙伴正俯瞰着这座他们坚守的城市。</p>

  <p class="calibre7">“我们没打算要做超级英雄。可有时候生活轨迹会与计划不符。”小宏说道，“好的一点就是，我哥哥想要帮助很多很多的人，这也正是我们要做的。我们是谁？”</p>

  <p class="calibre7">答案显而易见，他们齐声说道：“超能陆战队！”</p>
