<p class="title1" id="a1">内容简介</p>
<p class="normaltext2">你有手机吗？你会用手机给谁打电话？谁会给你打电话？你的生活离得开手机吗？</p>
<p class="normaltext2">生活忙碌的萨莉有一部手机。她会接到很多电话，大部分是她的男朋友安德鲁打来的。安德鲁喜欢指点萨莉该做什么，该穿什么。</p>
<p class="normaltext2">萨莉和安德鲁今晚要参加一个派对。“穿上你的蓝裙子。”安德鲁说。但是萨莉不能穿蓝裙子，因为那条蓝裙子脏了，所以她不得不去买一条新的。</p>
<p class="normaltext2">但是萨莉购物的时候，她不只是买到了一条新裙子——她还遇到了一件改变她人生轨迹的事。</p>
