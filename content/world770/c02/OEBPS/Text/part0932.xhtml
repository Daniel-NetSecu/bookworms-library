  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">A route of evanescence</h2>

  <p class="EB03BodyTextIndented">A route of evanescence</p>

  <p class="EB03BodyTextIndented">With a revolving wheel;</p>

  <p class="EB03BodyTextIndented">A resonance of emerald,</p>

  <p class="EB03BodyTextIndented">A rush of cochineal;</p>

  <p class="EB03BodyTextIndented">And every blossom on the bush</p>

  <p class="EB03BodyTextIndented">Adjusts its tumbled head, —</p>

  <p class="EB03BodyTextIndented">The mail from Tunis, probably,</p>

  <p class="EB03BodyTextIndented">An easy morning’s ride.</p>
