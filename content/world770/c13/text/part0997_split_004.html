<h2 class="heading" id="calibre_pb_3">费林·雷德</h2>

  <p class="calibre7">费林因为偷了失踪的公主的皇冠，被宫廷卫兵队追击。他误打误撞遇见了美丽的乐佩。他带着乐佩一起寻找梦想，一起战胜邪恶。他被乐佩的美丽和善良本性所打动。为了不让乐佩失去自由，他宁愿放弃自己的生命。乐佩金色的眼泪让他起死回生。他和乐佩一起进入皇宫，从此过上了幸福的生活。</p>
