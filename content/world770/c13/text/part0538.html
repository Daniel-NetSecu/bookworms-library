  <body class="calibre5">
  <p class="p">亲爱的读者：</p>

  <p class="calibre7">现在你知道我为什么最喜欢这个故事了吗？这个故事令我非常骄傲，因为我也身处其中。它确实是个简单的故事。它最核心的内容就是因为爱而封闭起来的心灵又因为爱而打开。这是个关于美的故事，里面有南瓜、马和水晶鞋。但最重要的是，它是个关于善良和勇气的故事。尽管我不大愿意承认世界上还有比魔法更强大的力量，但我还是想让你记住：一颗善良的心才是世界上最强大的魔杖。</p>

  <p class="calibre7">现在我要走了。仙女教母的工作可永远也做不完。</p>

  <p class="para-center3">（全书完）</p>
