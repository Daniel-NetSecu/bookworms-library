  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">68</h1>

  <p>你的阳光射到我的地上，整天地伸臂站在我门前，</p>

  <p>把我的眼泪、叹息和歌曲变成的云彩，带回放在你的足边。</p>

  <p>你喜爱地将这云带缠围在你的星胸之上，</p>

  <p>绕成无数的形式和褶纹，还染上变幻无穷的色彩。</p>

  <p>它是那样的轻柔，那样的飘扬、温软，含泪而黯淡，</p>

  <p>因此你就爱惜它。啊，你这庄严无瑕者。</p>

  <p>这就是为什么它能够以它可怜的阴聚遮掩你的可畏的白光。</p>
