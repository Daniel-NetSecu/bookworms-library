  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">6</h1>

  <p>摘下这朵花来，拿了去吧，不要迟延！</p>

  <p>我怕它会萎谢了，掉在尘土里。</p>

  <p>它也许配不上你的花冠，</p>

  <p>但请你采折它，以你手采折的痛苦来给它光宠。</p>

  <p>我怕在我警觉之先，日光已逝，供献的时间过了。</p>

  <p>虽然它颜色不深，香气很淡，请仍用这花来礼拜。</p>

  <p>趁着还有时间，就采折吧。</p>
