<h2 class="heading" id="calibre_pb_7">雷霆</h2>

  <p class="p">雷霆是一只恶毒的翼手龙，拥有巨型翅膀，以小动物为食。他喜欢欺负弱小，曾欺压过阿乐两次。最终，他被阿乐响亮的怒吼声吓走了。</p>
