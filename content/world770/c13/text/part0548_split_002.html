<h2 class="heading" id="calibre_pb_1">乐乐</h2>

  <p class="p4">● 乐乐是莱莉的主控情绪小人。她喜欢大笑，喜欢巧克力蛋糕，喜欢旋转。她将生活中的挑战视为机遇，将忧伤视为通往美好事物的小低潮。她希望莱莉能够一直开心，为此她付出了更多的努力。毕竟，这不就是她存在的意义吗？</p>
