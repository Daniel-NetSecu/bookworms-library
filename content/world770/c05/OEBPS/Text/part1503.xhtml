  <h2 class="kindle-cn-heading2">60　她居住在杳无人烟的地方<span class="math-super"><a id="noteBack_1" href="part1503.xhtml#note_1">[1]</a></span></h2>

  <p class="kindle-cn-signature">华兹华斯</p>

  <p class="kindle-cn-poem-left">她居住在杳无人烟的地方，<br/>
  达芙泉就在附近，<br/>
  她是一个无人赞美的女郎，<br/>
  更无人与她说爱谈情。</p>

  <p class="kindle-cn-poem-left">她是岩石下一朵紫罗兰，<br/>
  青苔将它半遮半掩：<br/>
  ——当夜空中只有一颗星星闪亮，<br/>
  那颗星与她一样耀眼！</p>

  <p class="kindle-cn-poem-left">她默默无闻地活着，没有人<br/>
  知道露西何时停止了呼吸；<br/>
  如今她已在墓中长眠，哎呀，<br/>
  唯有我是她的知己！</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1503.xhtml#noteBack_1">[1]</a>此诗为悼念诗人的妹妹多勒赛而作。多勒赛终身未嫁，一直在诗人身边照顾他的饮食起居，有好事者因此怀疑华兹华斯与他的妹妹有不伦之爱，并将此诗作为爱情诗的名篇。</p>
