  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">20</h1>

  <p class="kindle-cn-poem-left">他天天来了又走了。<br/>
  去吧，把我头上的花朵送去给他吧，我的朋友。<br/>
  假如他问赠花的人是谁，<br/>
  我请你不要把我的名字告诉他——因为他来了又要走的。<br/>
  他坐在树下的地上。<br/>
  用繁花密叶给他敷设一个座位吧，我的朋友。<br/>
  他的眼神是忧郁的，它把忧郁带到我的心中。<br/>
  他没有说出他的心事；他只是来了又走了。</p>
