  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">45</h1>

  <p>你没有听见他静悄的脚步声吗？</p>

  <p>他正在走来，走来，一直不停地走来。</p>

  <p>每一个时间，每一个年代，每日每夜，</p>

  <p>他总在走来，走来，一直不停地走来。</p>

  <p>在许多不同的心情里，我唱过许多歌曲，</p>

  <p>但在这些歌调里，我总在宣告说：</p>

  <p>“他正在走来，走来，一直不停地走来。”</p>

  <p>四月芬芳的晴天里，</p>

  <p>他从林径中走来，走来，一直不停地走来。</p>

  <p>七月阴暗的雨夜中，</p>

  <p>他坐着隆隆的云辇，前来，前来，一直不停地前来。</p>

  <p>愁闷相继之中，</p>

  <p>是他的脚步踏在我的心上，</p>

  <p>是他的双脚的黄金般的接触，使我的快乐发出光辉。</p>
