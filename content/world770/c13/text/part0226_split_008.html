<h2 class="heading" id="calibre_pb_7">布鲁斯</h2>

  <p class="p">● 布鲁斯是一条友善、讨人喜欢的鲨鱼。他很欢乐、悠闲，还很爱开玩笑。同时，他还非常诚实善良。然而，当他的天性被激发时，他的这些性格特征就都不见了，他变成了一条没有头脑只知道找鱼吃的鲨鱼（当然，这只是暂时的）。</p>
