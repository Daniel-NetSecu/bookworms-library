  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">53</h1>

  <p class="kindle-cn-poem-left">为什么盯着我使我羞愧呢？<br/>
  我不是来求乞的。<br/>
  只为要消磨时光，我才来站在你院边的篱外。<br/>
  为什么盯着我使我羞愧呢？<br/>
  我没有从你园里采走一朵玫瑰，没有摘下一颗果子。<br/>
  我谦卑地在任何生客都可站立的路边棚下，找个荫蔽。<br/>
  我没有采走一朵玫瑰。<br/>
  是的，我的脚疲乏了，骤雨又落了下来。<br/>
  风在摇曳的竹林中呼叫。<br/>
  云阵像败退似的跑过天空。<br/>
  我的脚疲乏了。<br/>
  我不知道你怎样看待我，或是你在门口等什么人。<br/>
  闪电昏眩了你看望的目光。<br/>
  我怎能知道你会看到站在黑暗中的我呢？<br/>
  我不知道你怎样看待我。<br/>
  白日过尽，雨势暂停。<br/>
  我离开你园畔的树荫和草地上的座位。<br/>
  日光已暗；关上你的门户吧；我走我的路。<br/>
  白日过尽了。</p>
