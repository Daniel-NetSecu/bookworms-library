  <title>权杖</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">权杖</h1>

  <p>国王对王后说：“夫人，你算不上真正的王后！你十分平庸无礼，不配当我的终生伴侣！”</p>

  <p>王后说：“你自认为是国王，其实不过是前人可怜的回声！”</p>

  <p>这话激怒了国王，只见他抄起权杖，金把手直打在王后的前额上。</p>

  <p>这时太监走了进来，说：“怎么啦？这权杖出自王国伟大的艺术家之手，真可惜呀！有那么一天，陛下和王后会被人忘却，而这权杖作为珍贵艺术品，将一代一代传下去。现在，它沾上了王后殿下头上的血，它将变得更有价值，更有纪念意义。”</p>
