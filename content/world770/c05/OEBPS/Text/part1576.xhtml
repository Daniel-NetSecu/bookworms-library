  <h2 class="kindle-cn-heading2">132　黑色的拖鞋：贝罗蒂</h2>

  <p class="kindle-cn-signature">庞德</p>

  <p class="kindle-cn-poem-left">在我们对面的桌子旁，<br/>
  她脱下一双小山羊皮拖鞋，<br/>
  两只穿白袜子的脚<br/>
  用餐巾垫着，小心翼翼地搁在地上，<br/>
  她说：</p>

  <p class="kindle-cn-poem-left">“你们知道奥斯坦德吗？”</p>

  <p class="kindle-cn-poem-left">餐馆的另一端，一位意大利妇女咯咯笑着，<br/>
  以某种傲慢的神态回答她，<br/>
  而我则耐心地等待，<br/>
  想看看那天青石如何塞回拖鞋。<br/>
  她塞了回去，发出一声呻吟。</p>
