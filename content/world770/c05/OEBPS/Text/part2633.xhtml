  <title>跳蚤和人</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">跳蚤和人</h1>

  <p>有一只跳蚤叮了人一口，然后又叮了一口，后来一次接着一次地叮，人最后无法忍受了，于是便全身检查，最终抓到了跳蚤。他将跳蚤捏在拇指和食指间，说——确切地说应该是喊，因为他实在很愤怒：“你到底是谁啊，你这个卑鄙的小东西，就这么在我身上为所欲为？”跳蚤害怕了，啜泣着，用微弱的声音说：“噢，先生啊，求求你放了我吧，千万不要杀我！我就是这么个小东西而已，根本不会给你造成什么伤害。”但是人笑着说：“我就是要立刻杀了你：恶有恶报，不管他造成的是多么小的伤害。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：不要虚掷同情在坏蛋身上。</p>
