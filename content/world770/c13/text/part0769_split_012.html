<h2 class="heading" id="calibre_pb_11">纳什</h2>

  <p class="p">纳什是一只充满热情的年轻霸王龙。他为冒险而活，喜欢牧牛过程中出现的一些打破常规的事情。他不是牧牛的最佳选手，因为只有他可以把整个牛群都弄丢了，但是他的淘气、他的无拘无束以及他的积极向上却让他成为牧牛的好搭档。</p>
