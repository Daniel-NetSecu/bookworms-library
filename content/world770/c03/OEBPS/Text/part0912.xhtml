  <h3><i>VI</i></h3>

  <p class="dx1">The spirit of the valley never dies.</p>

  <p class="dx1">This is called the mysterious female.</p>

  <p class="dx1">The gateway of the mysterious female</p>

  <p class="dx1">Is called the root of heaven and earth.</p>

  <p class="dx1">Dimly visible, it seems as if it were there,</p>

  <p class="dx1">Yet use will never drain it.</p>
