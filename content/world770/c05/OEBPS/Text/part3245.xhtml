  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">你是</h1>

  <p class="kindle-cn-poem-left">小丑似的，你挥舞着双手最幸福，<br/>
  双脚蹬向星星，月亮般的脑袋，<br/>
  像除去了内脏的鱼。凭直觉<br/>
  拇指朝下，像渡渡鸟移动。<br/>
  将自己包裹起来，像卷轴，<br/>
  遮住你的黑暗，像猫头鹰。<br/>
  从七月四日至愚人节，<br/>
  你不说话像大头菜<br/>
  哦，早起的人，我的小面包。<br/>
  <br/>
  模糊如雾，像邮件在寻找。<br/>
  比澳大利亚更遥远。<br/>
  弯腰像地图册，我们的旅行明虾。<br/>
  偎依如蓓蕾，舒适<br/>
  像泡菜缸里的鲱鱼。<br/>
  一篮子鳗鱼，满是皱纹。<br/>
  一惊一乍像颗墨西哥豆。<br/>
  好，如同计算好的总数。<br/>
  清洁的石板，你的脸映在上面。</p>
