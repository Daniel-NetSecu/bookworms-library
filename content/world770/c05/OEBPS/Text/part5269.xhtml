  <div class="chapter" id="chapter">
    <h1 class="kindle-cn-heading-1">说明</h1>

    <p><span class="kaiti">这部书里使用了好几种方言：密苏里州的黑人方言；西南部边远地区极端俚俗的方言；“派克郡”的普通方言；还有最末这一种方言的四个变种。这些方言色彩上有细微差别，不是偶尔随意，或凭猜测揣度造成的，而是煞费苦心，以作者个人熟悉这几种专门语言作为可信的指靠所致。</span></p>

    <p><span class="kaiti">我之所以作出这一说明，是出于以下原因：要是不作说明，许多读者就会以为这些人物想要说同样的话，而又说不好似的。</span><br/>
    <br/></p>

    <p class="kindle-cn-signature"><span class="kaiti">马克·吐温</span></p>
