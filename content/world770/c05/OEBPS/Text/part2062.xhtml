  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">116</h1>

  <p class="kindle-cn-poem-left1">我不敢想象真爱被人阻挠，<br/>
  姻缘受挫。如果爱人变了心，<br/>
  你也跟着变，或者爱人动摇，<br/>
  你也动摇，爱就难为爱正名。<br/>
  啊，决不！爱是灯塔，永远固定，<br/>
  面对狂风暴雨而傲立岿然；<br/>
  爱是星斗，为船只指引航程，<br/>
  它的高度可测，价值不可量。<br/>
  红颜朱唇难免被时间芟夷，<br/>
  但爱不是时间掌中的玩偶，<br/>
  不会随短暂的韶华而更替，<br/>
  它特立独行，直至世界尽头。<br/>
  　　如果这话有错，我成了旁证，<br/>
  　　算我没写过诗，人间无爱情。</p>
