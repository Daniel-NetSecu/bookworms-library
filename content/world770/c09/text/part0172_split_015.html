<h2 class="calibre8" id="calibre_pb_41">SCENE IV.——FROSINE, HARPAGON.  </h2>

    <h2 class="calibre9">第四场——弗罗辛娜，阿巴贡。  </h2>
  </div>

  <div class="calibre4">
    <div class="en">
      Fro.: Sir.
    </div>

    <div class="en">
      弗罗辛娜：先生。
    </div>
  </div>

  <div class="calibre4">
    <div class="en">
      Har.: Wait a moment, I will come back and speak to you. (Aside) I had better go and see a little after my money.
    </div>

    <div class="en">
      阿巴贡：请等一下，我马上就回来，再跟你说话。（旁白）我最好先去瞧瞧我的钱。
    </div>
  </div>

  <p class="calibre10" id="calibre_pb_42"></p>
