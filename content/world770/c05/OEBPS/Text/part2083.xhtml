  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">137</h1>

  <p class="kindle-cn-poem-left1">瞎眼的爱神啊，你意欲何为？<br/>
  为何让我的眼睛屡屡出错？<br/>
  它们明知何为美，何处有美，<br/>
  却偏将至善之物当作至恶。<br/>
  既然昏花的眼睛受了蒙蔽，<br/>
  停泊于人人都光顾的港湾，<br/>
  你为何还让昏眼造出锚钩，<br/>
  用来困住我心的明睿判断？<br/>
  我的心明知那是一块公地，<br/>
  为何又要当它是私有地产？<br/>
  我的眼明明见到不美之体，<br/>
  你为何将黄脸婆认作娇娘？<br/>
  　　我的心和眼只会颠倒黑白，<br/>
  　　如今染上了瘟疫，也是活该！</p>
