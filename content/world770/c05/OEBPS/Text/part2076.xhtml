  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">130</h1>

  <p class="kindle-cn-poem-left1">我情人的眼睛比不得太阳，<br/>
  嘴唇也不是珊瑚那般红透，<br/>
  如雪算白，灰褐是她的乳房，<br/>
  发如丝线，那她是黑线盘头。<br/>
  我曾见过红白相间的玫瑰，<br/>
  她的脸没有玫瑰那样娇靡，<br/>
  有些香料闻之能让人陶醉，<br/>
  我情人嘴里吐不出这气息。<br/>
  我喜欢听她说话，但我清楚，<br/>
  音乐比她的嗓音更其悠扬，<br/>
  我承认从没见过女神赶路，<br/>
  但我情人的脚踩在泥地上。<br/>
  　　倘若真有美人儿倾国倾城，<br/>
  　　老天作证，她们中有我情人。</p>
