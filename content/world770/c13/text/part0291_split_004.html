<h2 class="heading" id="calibre_pb_3">汉克</h2>

  <p class="p">汉克是一只章鱼。准确地说，是“七爪”。在生命的旅途中，他不幸失去了一只触角。不过汉克与他的八爪同胞们一样厉害。他是一位有着高超伪装术的逃跑艺术家。</p>
