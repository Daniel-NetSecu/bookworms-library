  <title>狗、公鸡和狐狸</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">狗、公鸡和狐狸</h1>

  <p>一只狗和一只公鸡成了朋友，两个人结伴去旅行。到了晚上，公鸡飞到一棵树的树枝上休息，而狗则钻进了树干上的树洞里。第二天早晨，公鸡醒来，如同平常一样开始打鸣。狐狸听到了，准备把公鸡抓去当早餐，于是来到树下，哄公鸡下来。“我特别想和嗓音这么动听的动物交朋友。”公鸡回答说：“那你能不能去叫醒我的门房呢？他就睡在树根那里，他会把门给你打开放你进来的。”狐狸听了，便敲了敲树干，狗从树洞里钻出来，将他撕成了碎片。</p>
