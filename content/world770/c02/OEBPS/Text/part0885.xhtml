  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">老鼠是最节俭的房客。</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">老鼠是最节俭的房客。</p>

  <p class="EB03BodyTextIndented">他不付房租，——</p>

  <p class="EB03BodyTextIndented">否认义务，</p>

  <p class="EB03BodyTextIndented">蓄意如此。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">让我们的聪明受挫、</p>

  <p class="EB03BodyTextIndented">探测或绕行，</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">恨无法伤害</p>

  <p class="EB03BodyTextIndented">这般悄悄的敌人。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">法令</p>

  <p class="EB03BodyTextIndented">也不禁止他，</p>

  <p class="EB03BodyTextIndented">合法得</p>

  <p class="EB03BodyTextIndented">如同公正。</p>
</body></html>
