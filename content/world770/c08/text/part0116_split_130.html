<h1 class="calibre22" id="calibre_pb_232">第三十节</h1>

      <p class="x5">金、银在商业中的使用。</p>

      <p class="x6">金和银是两种商品，与其他商品一样，而且不如很多其他商品贵重，因为它们对实际的生活需求毫无用处。要解释这两种金属如何成为了各种财富的代表物、它们如何影响商业市场以及它们如何成为财富的组成部分，我们有必要再次回顾最初的那些原则。</p><a id="Section_cn_31"></a>
