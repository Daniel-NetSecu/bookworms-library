  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">5</h1>

  <p>请容我懈怠一会，来坐在你的身旁。</p>

  <p>我手边的工作等一下子再去完成。</p>

  <p>不在你的面前，我的心就不知道什么是安逸和休息，</p>

  <p>我的工作变成了无边劳役海中的无尽劳役。</p>

  <p>今天，炎暑来到我的窗前，轻嘘微语；</p>

  <p>群蜂在花树的宫廷中尽情弹唱。</p>

  <p>这正是应该静坐的时光，和你相对，</p>

  <p>在这静寂和无边的闲暇里唱出生命的献歌。</p>
