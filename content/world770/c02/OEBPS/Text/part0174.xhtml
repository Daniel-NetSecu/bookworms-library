  <title>地母的回答</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">地母的回答</h2>

  <p class="EB03BodyTextIndented">地母抬起了她的头，</p>

  <p class="EB03BodyTextIndented">从可怕而阴郁的黑暗之上。</p>

  <p class="EB03BodyTextIndented">她的光逃隐，</p>

  <p class="EB03BodyTextIndented">恐怖得寒心！</p>

  <p class="EB03BodyTextIndented">她的头发上是灰色的绝望。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“我囚于潮湿的海岸，</p>

  <p class="EB03BodyTextIndented">繁星的嫉妒使我的脏巢</p>

  <p class="EB03BodyTextIndented">寒冷又霉烂，</p>

  <p class="EB03BodyTextIndented">我泪水哭干</p>

  <p class="EB03BodyTextIndented">才听到古人的父亲<a id="w1"></a><a href="part0174.xhtml#m1"><sup>[1]</sup></a>来到，</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“因自私而善妒，胆怯，</p>

  <p class="EB03BodyTextIndented">人类的这个自私的父亲哟，</p>

  <p class="EB03BodyTextIndented">你用黑夜</p>

  <p class="EB03BodyTextIndented">链住欢悦，</p>

  <p class="EB03BodyTextIndented">少女和黎明怎能忍受？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“春天藏起了欢乐吗，</p>

  <p class="EB03BodyTextIndented">在蓓蕾和鲜花生长的时候？</p>

  <p class="EB03BodyTextIndented">播种者在夜间</p>

  <p class="EB03BodyTextIndented">播种的吗？</p>

  <p class="EB03BodyTextIndented">耕犁者在暗中耕犁的吗？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“砸碎这沉重的锁链！</p>

  <p class="EB03BodyTextIndented">它僵住了我周身的筋骨，</p>

  <p class="EB03BodyTextIndented">自私！愚蠢！</p>

  <p class="EB03BodyTextIndented">永恒的毒根！</p>

  <p class="EB03BodyTextIndented">用奴役把自由的爱捆住。”</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="m1"></a><a href="part0174.xhtml#w1">[1]</a> 指上帝。</p>
</body></html>
