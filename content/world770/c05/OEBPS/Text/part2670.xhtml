  <title>青蛙求国王</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">青蛙求国王</h1>

  <p>从前，青蛙们发现自己的族群没有统治者，很不满，于是他们便派了一个使团去见朱庇特，让他给他们一个国王。朱庇特很看不起他们的愚蠢要求，于是投了一根木头到青蛙生活的池塘，说那便是他们的国王。青蛙起初被木头溅起的水花吓了一跳，都躲进了池塘深处。但过了一会儿，他们看到木头一动不动，便一个个地回到了水面上。他们胆子越来越大，很快便看不起那木头，甚至坐到了木头上。他们觉得这样的国王是对他们尊严的侮辱，便又去见朱庇特，求他把这没有精神的国王弄走，给他们一个更好的。他们这样纠缠不休令朱庇特很恼怒，于是他便派了一只鹳去管理青蛙，鹳一到青蛙中间，便开始用它最快的速度捕食青蛙。</p>
