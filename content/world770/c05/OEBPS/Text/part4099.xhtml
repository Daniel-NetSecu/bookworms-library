  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">19</h1>

  <p>若是你不说话，我就含忍着，</p>

  <p>以你的沉默来填满我的心。</p>

  <p>我要沉静地等候。</p>

  <p>像黑夜在星光中无眠，忍耐地低首。</p>

  <p>清晨一定会来，黑暗也要消隐，</p>

  <p>你的声音将划破天空，从金泉中下注。</p>

  <p>那时你的话语，要在我的每一鸟巢中生翼发声；</p>

  <p>你的音乐，要在我丛林繁花中盛开怒放。</p>
