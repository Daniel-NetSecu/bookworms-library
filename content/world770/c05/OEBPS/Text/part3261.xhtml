  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">七月的虞美人</h1>

  <p class="kindle-cn-poem-left">小小虞美人，小小的地狱火焰，<br/>
  你不会伤人吧？<br/>
  <br/>
  你闪烁。我不会碰你。<br/>
  我将双手放在这些火焰中。没有烧伤。<br/>
  <br/>
  看着你，让我精疲力竭<br/>
  看着你闪烁，鲜红又起皱，仿佛嘴上的皮。<br/>
  <br/>
  刚流血的一张嘴。<br/>
  小小的血红衬裙。<br/>
  <br/>
  我不能碰那些烟雾。<br/>
  你的麻醉品、那些讨厌的胶囊在哪里？<br/>
  <br/>
  但愿我会流血，或睡眠！——<br/>
  但愿我的嘴与那样的伤口结合！<br/>
  <br/>
  或许你的烈性酒渗漏给我，用这个玻璃胶囊，<br/>
  变得呆滞，死气沉沉。<br/>
  <br/>
  但没有颜色。没有颜色。</p>
