  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">114</h1>

  <p class="kindle-cn-poem-left1">是我的心因你而妄自尊大，<br/>
  患上帝王自我奉承的瘟疫？<br/>
  还是我的眼睛说出了真话：<br/>
  你的爱教它学会了点金术，<br/>
  奇形怪状的东西一经点化，<br/>
  便变成小天使，与你同模样——<br/>
  万物一旦聚集在这目光下，<br/>
  丑陋的即刻拥有完美形状？<br/>
  啊，是前者，正是眼睛在奉承，<br/>
  我这颗雄心把它一饮而尽：<br/>
  我的眼睛早知道心的脾性，<br/>
  便备下这杯子送到它嘴边。<br/>
  　　如果杯中有毒，罪恶也轻微，<br/>
  　　因为我的眼爱它，已先品味。</p>
