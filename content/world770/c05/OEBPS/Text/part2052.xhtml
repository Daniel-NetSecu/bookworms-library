  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">106</h1>

  <p class="kindle-cn-poem-left1">我在逝去的岁月的记载里，<br/>
  看到关于绝世佳人的描述，<br/>
  他们赞美淑女和风流骑士，<br/>
  用美的语言写下美的诗赋。<br/>
  他们着力美化美人的美艳，<br/>
  包括手、足、嘴唇、眼睛和眉毛；<br/>
  我发现，古人的笔都想表现<br/>
  你现在所具备的这份美貌。<br/>
  其实，他们的赞美只是预言——<br/>
  预言我们这时代，预言了你。<br/>
  他们只能凭眼睛私下推断，<br/>
  却未能唱出你真正的价值。<br/>
  　　我们呢，当这一切来到眼前，<br/>
  　　虽有眼惊讶，却无舌头称羡。</p>
