  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">16</h1>

  <p>我接到这世界节日的请柬，我的生命受了祝福。</p>

  <p>我的眼睛看见了美丽的景象，我的耳朵也听见了醉人的音乐。</p>

  <p>在这宴会中，我的任务是奏乐，我也尽力演奏了。</p>

  <p>现在，我问：那时间终于来到了吗？</p>

  <p>我可以进去瞻仰你的容颜，并献上我静默的献礼吗？</p>
