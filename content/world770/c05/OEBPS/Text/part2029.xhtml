  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">83</h1>

  <p class="kindle-cn-poem-left1">我从不觉得你需敷粉画眉，<br/>
  因此对你的美貌不再装点；<br/>
  我发现——心想已发现——你的美<br/>
  远远超过诗人空泛的谀言，<br/>
  我故而惰怠了对你的推许，<br/>
  就因你自己是最好的证明：<br/>
  普通的羽管笔不足以描述<br/>
  体现在你身上的美德高行。<br/>
  你将沉默当作我犯下的罪，<br/>
  其实，这沉默正是我的荣誉，<br/>
  因为不开口，我无损你的美，<br/>
  给你生命，其实是给你坟墓。<br/>
  　　比起两位诗人刻意的颂扬，<br/>
  　　你眼里有着更多生命之光。</p>
