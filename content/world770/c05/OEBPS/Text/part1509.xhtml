  <h2 class="kindle-cn-heading2">66　我们将不再游荡</h2>

  <p class="kindle-cn-signature">拜伦</p>

  <p class="kindle-cn-poem-left">我们将不再游荡<br/>
  在那迟迟的深夜，<br/>
  尽管爱仍留在心上，<br/>
  月光依旧那般皎洁。</p>

  <p class="kindle-cn-poem-left">因为剑会将剑鞘穿破，<br/>
  灵魂会累垮胸腔，<br/>
  心儿必须歇息调养，<br/>
  爱情也需要休养。</p>

  <p class="kindle-cn-poem-left">虽然爱向来以夜为家，<br/>
  白昼转眼就要回返，<br/>
  但在那皎洁的月光下，<br/>
  我们将不再游荡。</p>
