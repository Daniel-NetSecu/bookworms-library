<h2 class="heading" id="calibre_pb_3">忧忧</h2>

  <p class="p4">● 忧忧一直是悲观的情绪小人。她希望能更加乐观，可在这个拥有这么多不幸的世界很难保持乐观向上：她见证了三条金鱼的去世，紫色巨魔娃娃的丢失，冰激凌勺无故掉落在地上……有时候，莱莉的生活是如此糟糕，以至于只能陷在悲伤中无法自拔。这是一份非常痛苦的工作，但是忧忧一直坚持不懈。</p>
