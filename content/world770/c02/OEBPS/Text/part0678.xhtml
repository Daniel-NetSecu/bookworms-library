  <h2 class="EB04MainHeadClosedTitle">音乐家</h2>

  <p class="EB03BodyTextIndented">一位嗓音嘶哑的人，有着一间很棒的音乐室。他在那个小房间里练声，回音使他觉得自己的声音很美。他十分骄傲，并想着要在剧院展示一番。但他唱得实在太糟糕了，人们将他轰下了舞台，还朝他扔石头。</p>

  <p class="EB01BodyTextLineSpace">一个人可能会很喜欢自己镜中的样子，但公共场合中的世人却无法爱上他。事实上，我们对自己情况的了解很片面，除了从别人的眼中解读自己之外，我们没有其他方式。</p>
