  <title>十六个死者</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">十六个死者</h2>

  <p class="EB03BodyTextIndented">哦，我们只是谈了很多，</p>

  <p class="EB03BodyTextIndented">在这十六人被射杀之前，</p>

  <p class="EB03BodyTextIndented">但谁又能谈论取舍，</p>

  <p class="EB03BodyTextIndented">什么该存在什么不该，</p>

  <p class="EB03BodyTextIndented">当那些死者还在徘徊，</p>

  <p class="EB03BodyTextIndented">搅动着沸腾的锅？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">你说我们应保持国土平静，</p>

  <p class="EB03BodyTextIndented">直到德国人的征服；</p>

  <p class="EB03BodyTextIndented">但谁还在那儿争论，</p>

  <p class="EB03BodyTextIndented">既然皮尔斯已聋了瞎了？</p>

  <p class="EB03BodyTextIndented">而他们的逻辑能压倒</p>

  <p class="EB03BodyTextIndented">麦克唐纳精瘦的拇指？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">你怎能梦想他们会听，</p>

  <p class="EB03BodyTextIndented">他们的一只耳朵只对</p>

  <p class="EB03BodyTextIndented">他们找到的新同伴敞开，</p>

  <p class="EB03BodyTextIndented">爱德华勋爵和沃尔夫·托尼，</p>

  <p class="EB03BodyTextIndented">或者那些骨与骨的交谈</p>

  <p class="EB03BodyTextIndented">会干预我们的取舍？</p>
</body></html>
