  <title>雄鹿和葡萄藤</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">雄鹿和葡萄藤</h1>

  <p>一只雄鹿被猎人追捕，于是藏身在厚厚的葡萄藤下。猎人失去了雄鹿的踪迹，他们从他藏身的地方经过，却根本没有发现他就躲在那里。发现危险已经过去，雄鹿便开始吃那藤上的叶子。这动静吸引了回来的猎人，其中一个认为肯定有动物躲在那里，便向着叶子当中射了一箭，正中不幸的雄鹿的心脏。雄鹿断气的时候说：“我如此对待保护了我的叶子，的确是罪有应得。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：忘恩负义者的行为有时便会给其带来惩罚。</p>
</body></html>
