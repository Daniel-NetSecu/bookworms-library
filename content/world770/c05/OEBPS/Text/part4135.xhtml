  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">55</h1>

  <p>乏倦压在你的心上，你眼中尚有睡意。</p>

  <p>你没有得到消息说荆棘丛中花朵正在盛开吗？</p>

  <p>醒来吧，啊，醒来，不要让光阴虚度了！</p>

  <p>在石径的尽头，在幽静无人的田野里，我的朋友在独坐着。</p>

  <p>不要欺骗他吧。醒来，啊，醒来吧！</p>

  <p>即使正午的骄阳使天空喘息摇颤——</p>

  <p>即使灼热的沙地展布开它干渴的巾衣——</p>

  <p>在你心的深处难道没有快乐吗？</p>

  <p>你的每一个足音，不会使道路的琴弦迸出痛苦的柔音吗？</p>
