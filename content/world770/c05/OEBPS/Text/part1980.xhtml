  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">34</h1>

  <p class="kindle-cn-poem-left1">你为何向我承诺天气晴朗，<br/>
  害得我不带斗篷就出远门，<br/>
  结果中途被卑贱的云赶上，<br/>
  任凭毒雾把你的光辉遮掩？<br/>
  我被雨淋，即便你冲破云层，<br/>
  晒干我脸上的水珠也无补：<br/>
  没有人会稀罕这样的药引，<br/>
  因为它只治外伤，不治心痼。<br/>
  你的羞愧也难治我的辛悲，<br/>
  你可以悔恨，但我伤心如故，<br/>
  冒犯者的忧伤带不来安慰，<br/>
  只因被犯之痛已铭于肺腑。<br/>
  　　但你从爱而流的泪是珍珠，<br/>
  　　它们足以将你的过失尽赎。</p>
