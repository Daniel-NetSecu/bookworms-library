  <title>保姆之歌</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">保姆之歌</h2>

  <p class="EB03BodyTextIndented">当孩子们的声音从草坪传来，</p>

  <p class="EB03BodyTextIndented">欢笑声声飘荡在山冈，</p>

  <p class="EB03BodyTextIndented">我的心中就一片安宁，</p>

  <p class="EB03BodyTextIndented">周身都觉得宁静安详。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“该回来了，我的孩子，太阳下山了，</p>

  <p class="EB03BodyTextIndented">夜间的露水也已经出来；</p>

  <p class="EB03BodyTextIndented">得了，得了，快走吧，别玩了，</p>

  <p class="EB03BodyTextIndented">到明天天亮再来。”</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“不，不，让我们玩嘛，还是白天呐，</p>

  <p class="EB03BodyTextIndented">我们一点也不想上床；</p>

  <p class="EB03BodyTextIndented">还有，小鸟儿还在天上飞翔，</p>

  <p class="EB03BodyTextIndented">满山遍野布满了绵羊。”</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“唉，唉，去玩吧，玩到看不见了，</p>

  <p class="EB03BodyTextIndented">你们再回家睡觉去。”</p>

  <p class="EB03BodyTextIndented">小家伙跳啊，叫啊，笑啊，</p>

  <p class="EB03BodyTextIndented">山丘间回音四起。</p>
</body></html>
