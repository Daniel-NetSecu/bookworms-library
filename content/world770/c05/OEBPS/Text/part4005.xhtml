  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">13</h1>

  <p class="kindle-cn-poem-left">我一无所求，只站在林边树后。<br/>
  倦意还逗留在黎明的眼上，露润在空气里。<br/>
  湿草的懒味悬垂在地面的薄雾中。<br/>
  在榕树下你用乳油般柔嫩的手挤着牛奶。<br/>
  我沉静地站立着。<br/>
  我没有说出一个字。<br/>
  那是藏起的鸟儿在密叶中歌唱。<br/>
  芒果树在村径上撒着繁花，<br/>
  蜜蜂一只一只地嗡嗡飞来。<br/>
  池塘边湿婆天的庙门开了，朝拜者开始诵经。<br/>
  你把罐儿放在膝上挤着牛奶。<br/>
  我提着空桶站立着。<br/>
  我没有走近你。<br/>
  天空和庙里的锣声一同醒起。<br/>
  街尘在驱走的牛蹄下飞扬。<br/>
  把汩汩发响的水瓶搂在腰上，女人们从河边走来。<br/>
  你的钏镯叮当，乳沫溢出罐沿。<br/>
  晨光渐逝而我没有走近你。</p>
