  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">71</h1>

  <p>我应当自己发扬光大，四周放射，</p>

  <p>投映彩影于你的光辉之中——这便是你的幻境。</p>

  <p>你在你自身里立起隔栏，用无数不同的音调来呼唤你的分身。</p>

  <p>你这分身已在我体内形成。</p>

  <p>高亢的歌声响彻诸天，在多彩的眼泪与微笑、</p>

  <p>震惊与希望中回应着；</p>

  <p>波起复落，梦破又圆。</p>

  <p>在我里面是你自身的破灭。</p>

  <p>你卷起的那重帘幕，是用昼和夜的画笔，绘出了无数的花样。</p>

  <p>幕后的你的座位，是用奇妙神秘的曲线织成，</p>

  <p>抛弃了一切无聊的笔直的线条。</p>

  <p>你我组成的伟丽的行列，布满了天空。</p>

  <p>因着你我的歌声，太空都在震颤，</p>

  <p>一切时代都在你我捉迷藏中度过了。</p>
