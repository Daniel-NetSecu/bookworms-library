<h1 class="calibre22" id="calibre_pb_222">第二十节</h1>

      <p class="x5">第一种方式是利用靠工资生活的劳动者进行耕种。</p>

      <p class="x6">首先，他们可以通过日付或年付的方式雇佣他人耕种土地，而全部产出归自己所有；这包括一个前提，即在收获之前，土地所有者垫付所有种子的费用和工人的工资。但是，这种方式需要土地所有者付出大量心血，能够独自一人指导工人劳动，确保他们合理利用时间，并监督他们的忠诚度，确保他们不会带走任何产品。他确实可以雇佣一个更有知识、值得信任的人，这个人要具备管理者和指挥者的能力，可以指导工人劳动，并且能够记录产品的数量；但是，他总会面临受欺骗的危险。另外，这种方式极其昂贵，除非人口众多或者其他种类的劳动缺少工作机会，从而迫使工人接受非常低的薪水。</p><a id="Section_cn_21"></a>
