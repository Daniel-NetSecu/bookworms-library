  <title>政治</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">政治</h2>

  <blockquote>
    <p class="EB03BodyTextIndented">在我们的时代，人的命运</p>

    <p class="EB03BodyTextIndented">在政治范畴内呈现其意义。</p>

    <p class="right">——托马斯·曼</p>
  </blockquote>

  <p class="EB03BodyTextIndented">女孩站着那儿，我怎能</p>

  <p class="EB03BodyTextIndented">将心思集中</p>

  <p class="EB03BodyTextIndented">在罗马或俄罗斯</p>

  <p class="EB03BodyTextIndented">或西班牙的政治上？</p>

  <p class="EB03BodyTextIndented">但这儿有位阅遍世事的人，</p>

  <p class="EB03BodyTextIndented">他知道他谈论的是什么，</p>

  <p class="EB03BodyTextIndented">那儿有个政治家，</p>

  <p class="EB03BodyTextIndented">既博学又多思，</p>

  <p class="EB03BodyTextIndented">也许他们说的是真的</p>

  <p class="EB03BodyTextIndented">有关战争和战争预警，</p>

  <p class="EB03BodyTextIndented">但是啊，如果我再次年轻，</p>

  <p class="EB03BodyTextIndented">会将她拥入怀中。</p>
</body></html>
