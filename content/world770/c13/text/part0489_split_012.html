<h2 class="heading" id="calibre_pb_11">安泰西亚</h2>

  <p class="p3"><span class="txt-c">●</span> 安泰西亚是一个愚蠢的自恋者，她极其自负并认为自己的美貌无人能敌。与她姐姐一样，她也追求物质享受且举止毫无优雅可言。</p>
