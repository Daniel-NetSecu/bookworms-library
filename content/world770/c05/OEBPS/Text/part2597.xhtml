  <title>猫和老鼠</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">猫和老鼠</h1>

  <p>从前有一栋房子，里面老鼠成灾。有一只猫听说了，便想：“这个地方适合我去。”于是，她出发去房子里面安家，将老鼠一个个地抓住吃掉。最后，老鼠们无法忍受了，决定待在洞里不再出去。“真麻烦，”猫自言自语，“现在只能设个陷阱引他们出来了。”所以，她思考了一阵子，然后爬到墙上，后腿从木桩上垂下来，在那里装死。没过多久，有一只老鼠从洞里往外看，发现猫挂在那里。“啊哈！”它叫道，“你可真聪明啊，猫女士，毫无疑问，但是你就算把自己装成一袋子肉挂在那里，你也根本不可能引得我们走近你的身边。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：聪明的人不会被那些证实很危险的东西露出来的安全假象蒙蔽。</p>
