  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">36</h1>

  <p>然而狐又转念道：“我还有些好机会。他的前足的爪已经没有了，他的足还痛楚着，因我之故，把他的靴脱下，现在创伤还未好呢。他比前是衰弱些了。”</p>

  <p>于是狐说道：“谁说我是一个奸臣、一个杀人犯的，我说他是说谎。依赛格林，特别是你！你要与我决斗，这是我所希望的。我要以力自卫，辩明你说的话是假的。”</p>

  <p>国王于是允许了他们二人决斗，叫他们各指定两个证人。于是熊与猫做了狼的证人；格令巴与皮特洛做了狐的证人。</p>
