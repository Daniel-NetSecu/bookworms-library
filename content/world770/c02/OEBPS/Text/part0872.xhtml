  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">我手中紧握我的力量</h2>

  <p class="EB03BodyTextIndented">❧<sup><a id="z8" href="part0872.xhtml#bz8">[8]</a></sup></p>

  <p class="EB03BodyTextIndented">我手中紧握我的力量</p>

  <p class="EB03BodyTextIndented">和世界作对；</p>

  <p class="EB03BodyTextIndented">没有大卫拥有的那么多力量，</p>

  <p class="EB03BodyTextIndented">可我双倍勇敢。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我的石子投中了，可我自己</p>

  <p class="EB03BodyTextIndented">是那唯一栽倒的人。</p>

  <p class="EB03BodyTextIndented">难道歌利亚太巨大，</p>

  <p class="EB03BodyTextIndented">还是我太小？</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="bz8" href="part0872.xhtml#z8">[8]</a>本诗可参见圣经故事：大卫与歌利亚之战。</p>
</body></html>
