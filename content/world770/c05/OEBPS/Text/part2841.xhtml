  <title>捕鸟人、山鹑和公鸡</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">捕鸟人、山鹑和公鸡</h1>

  <p>有一个捕鸟人家中余粮不足，一个客人却不期而至，储藏室里空空如也，捕鸟人便去抓了一只驯养来作为捕鸟时的诱饵的山鹑，想要把它杀了。山鹑哭着问：“你肯定不想杀我的吧？哎呀，要是没了我，你下次去捕鸟，该怎么办呢？你该怎么吸引鸟走到你的陷阱里呢？”听到这话，他便把山鹑给放了，进了鸡舍，他在那里养了一只肥肥的小公鸡。小公鸡也为自己的性命求情，说：“如果你杀了我，你怎么知道夜里的时辰呢？没有我，谁在早晨叫你起来工作呢？”然而捕鸟人回答说：“的确，我知道你能报时，但是我不能让我的朋友饿着肚子上床。”然后他便抓住公鸡拧断了鸡脖子。</p>
