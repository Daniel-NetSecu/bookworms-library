  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">夏天开始有了样子</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">夏天开始有了样子，</p>

  <p class="EB03BodyTextIndented">迷人大书的穷究者</p>

  <p class="EB03BodyTextIndented">不情愿，可的确察觉——</p>

  <p class="EB03BodyTextIndented">姗姗来迟的树叶上新的收获。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">秋天开始得以暗示</p>

  <p class="EB03BodyTextIndented">从云朵的女帽那儿，</p>

  <p class="EB03BodyTextIndented">或是萦绕永在的山峦的</p>

  <p class="EB03BodyTextIndented">那条披肩上深沉的颜色。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">眼睛开始贪得无厌，</p>

  <p class="EB03BodyTextIndented">冥想精练了言辞，</p>

  <p class="EB03BodyTextIndented">一株远树的染匠</p>

  <p class="EB03BodyTextIndented">重拾他绚艳的活计。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">结束是一切的归程，</p>

  <p class="EB03BodyTextIndented">几乎是终年常在，</p>

  <p class="EB03BodyTextIndented">然后逃脱了稳定，</p>

  <p class="EB03BodyTextIndented">召回到不朽。</p>
</body></html>
