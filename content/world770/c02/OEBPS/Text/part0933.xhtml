  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">Who robbed the woods</h2>

  <p class="EB03BodyTextIndented">Who robbed the woods,</p>

  <p class="EB03BodyTextIndented">The trusting woods?</p>

  <p class="EB03BodyTextIndented">The unsuspecting trees</p>

  <p class="EB03BodyTextIndented">Brought out their burrs and mosses</p>

  <p class="EB03BodyTextIndented">His fantasy to please.</p>

  <p class="EB03BodyTextIndented">He scanned their trinkets, curious,</p>

  <p class="EB03BodyTextIndented">He grasped, he bore away.</p>

  <p class="EB03BodyTextIndented">What will the solemn hemlock,</p>

  <p class="EB03BodyTextIndented">What will the fir‑tree say?</p>
