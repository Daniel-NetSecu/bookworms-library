<p class="title1" id="CHP76">LESSON 73</p>
<p class="picture"><img src="../Images/image01620.jpeg.webp" alt="alt"/></p>
<p class="normaltext">O Fanny, what a pretty ball!</p>
<p class="normaltext">Yes; can you catch it, Ann?</p>
<p class="normaltext">Toss it to me, and see.</p>
<p class="normaltext">I will not let it fall.</p>
<p class="normaltext">That was well done.</p>
<p class="normaltext">Now, Fanny, toss it to the top of the wall, if you can.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">噢，范妮，好漂亮的球呀！</p>
<p class="normaltext">是的，你能接住吗，安？</p>
<p class="normaltext">扔给我看看。</p>
<p class="normaltext">我不会让它掉在地上的。</p>
<p class="normaltext">太好了！</p>
<p class="normaltext">现在，范妮，如果可能，把球扔到墙顶上。</p>
