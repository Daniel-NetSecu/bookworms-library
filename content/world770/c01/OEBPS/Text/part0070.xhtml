<p class="title1" id="CHP68">LESSON 65</p>
<p class="picture"><img src="../Images/image01613.jpeg.webp" alt="alt"/></p>
<p class="normaltext">Look at Tom and his dog. The dog has a black spot on his back. Do you think he is a good dog?</p>
<p class="normaltext">Tom has a big top, too. It is on the box with Kitty's doll.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">瞧，汤姆和他的狗。狗的背上有一块黑色的斑点。你认为它是一只听话的狗吗？</p>
<p class="normaltext">汤姆还有一只大陀螺。陀螺和凯蒂的娃娃一起放在盒子上。</p>
