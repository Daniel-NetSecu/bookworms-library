  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">78</h1>

  <p>当鸿蒙初辟，繁星第一次射出灿烂的光辉，</p>

  <p>众神在天上集会，唱着：“啊，完美的图画，完全的快乐！”</p>

  <p>有一位神忽然叫起来了：“光链里仿佛断了一环，一颗星星走失了。”</p>

  <p>他们金琴的弦子猛然折断了，他们的歌声停止了，</p>

  <p>惊惶地叫着：“对了。</p>

  <p>那颗走失的星星是最美的，她是诸天的光荣！”</p>

  <p>从那天起，他们不住地寻找她，</p>

  <p>众口相传地说，因为她丢了，世界失去了一种快乐。</p>

  <p>只在严静的夜里，众星微笑着互相低语说：</p>

  <p>“寻找是无用的，无缺的完美正笼盖着一切！”</p>
