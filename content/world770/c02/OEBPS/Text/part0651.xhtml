  <h2 class="EB04MainHeadClosedTitle">小虫子和公牛</h2>

  <p class="EB03BodyTextIndented">一只小虫子飞落在公牛的一只角上，在那儿待了很长时间。当他准备飞走的时候，弄出了嗡嗡的响动，想以此来问询公牛是否介意他离开。公牛回应道：“你来的时候，我都没注意到；你走的时候，我自然也不会留恋你。”</p>

  <p class="EB01BodyTextLineSpace">有些人总是把自己看得比在旁人眼中重要得多。</p>
