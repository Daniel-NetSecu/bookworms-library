  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">人和神像</h1>

  <p>有一个穷人，他有一尊木头神像，他每天都向神像祈祷，希望自己能富裕起来。他坚持了很长一段时间，可是依然一贫如洗，有一天，他恼恨地抓起神像，用尽力气砸向了墙壁。这一下猛击，将神像的头给砸开了，很多金币从里面滚出来落在地板上。那人贪婪地将金币收集起来，说：“哎呀，你这个老骗子！我敬你的时候，你什么好处都不给我，可是我一以羞辱、暴力待你，你便让我做了有钱人。”</p>
