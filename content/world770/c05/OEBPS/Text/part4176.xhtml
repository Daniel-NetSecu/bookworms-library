  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">96</h1>

  <p>当我走的时候，让这个作我的话别吧，</p>

  <p>就是说我所看过的是卓绝无比的。</p>

  <p>我曾尝过在光明海上开放的莲花里的隐蜜，</p>

  <p>因此我受了祝福——让这个作我的话别吧。</p>

  <p>在这形象万千的游戏室里，我已经游玩过，</p>

  <p>在这里我已经瞥见了那无形象的他。</p>

  <p>我浑身上下因着那无从接触的他的摩抚而喜颤；</p>

  <p>假如死亡在这里来临，就让它来好了——让这个作我的话别吧。</p>
