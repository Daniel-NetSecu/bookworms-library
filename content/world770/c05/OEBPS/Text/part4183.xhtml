  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">103</h1>

  <p>在我向你合十膜拜之中，我的上帝，</p>

  <p>让我一切的感知都舒展在你的脚下，接触这个世界。</p>

  <p>像七月的湿云，带着未落的雨点沉沉下垂，</p>

  <p>在我向你合十膜拜之中，让我的全副心灵在你的门前俯伏。</p>

  <p>让我所有的诗歌，聚集起不同的调子，</p>

  <p>在我向你合十膜拜之中，成为一股洪流，倾注入静寂的大海。</p>

  <p>像一群思乡的鹤鸟，日夜飞向它们的山巢，</p>

  <p>在我向你合十膜拜之中，让我全部的生命，</p>

  <p>启程回到它永久的家乡。</p>
