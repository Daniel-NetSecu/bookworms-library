  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">88</h1>

  <p>破庙里的神啊！七弦琴的断弦不再弹唱赞美你的诗歌。</p>

  <p>晚钟也不再宣告礼拜你的时间。你周围的空气是寂静的。</p>

  <p>流荡的春风来到你荒凉的居所。它带来了香花的消息——</p>

  <p>就是那素来供养你的香花，现在却无人来呈献了。</p>

  <p>你往昔的礼拜者，漂泊流浪，永远在企望那还未得到的恩典。</p>

  <p>黄昏来到，灯光明灭于尘影之中，</p>

  <p>他困乏地带着饥饿的心回到这破庙里来。</p>

  <p>对你来说，许多佳节都在静默中来到，破庙的神啊。</p>

  <p>许多礼拜之夜，也在无火无灯中度过了。</p>

  <p>精巧的艺术家，造了许多新的神像，</p>

  <p>当他们的末日来到了，便被抛入遗忘的圣河里。</p>

  <p>只有破庙的神遗留在无人礼拜的、不死的冷淡之中。</p>
