  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">3</h1>

  <p class="kindle-cn-poem-left1">请仔细端详你镜中的自己，<br/>
  如今你应该铸造一个替身，<br/>
  如果你不打算将自己复制，<br/>
  那就是欺世，绝人母之天伦！<br/>
  哪有这般不通情理的娇娘，<br/>
  会拒绝你耕耘她的处女地？<br/>
  哪有如此愚昧无知的俊郎，<br/>
  爱恋着坟墓，甘愿断绝子嗣？<br/>
  你是令堂的镜子，从你身上，<br/>
  能召回春光明媚的四月天，<br/>
  虽有皱纹，但透过年龄之窗，<br/>
  你黄金般的岁月将会再现。<br/>
  　　你活着，又不想让世人记起，<br/>
  　　就独自死吧，让美与你同逝。</p>
