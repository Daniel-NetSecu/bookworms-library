<h1 class="calibre22" id="calibre_pb_289">第八十七节</h1>

      <p class="x5">将货币投入到农业、制造业或商业中所产生的收入应该高于用于借贷所获得的利息。</p>

      <p class="x6">由于同样的原因，将货币投入到农业、制造业或商业中所产生的利润应该比用于购买土地或贷款取息的同等资本带来的收入高得多；因为这些企业，除了垫付资本，需要大量的照管和劳动，如果它们不能带来更多的收益，那就不如确保一份可能不需要劳动就可以获得的同等的收入。所以，除了资本利息外，企业家有必要每年抽取一定的利润来补偿他在照管、劳动和才智等方面的付出和他所承担的风险，并用来弥补那一部分不得不投入的、用于防范伤害和各种意外事件的资本的损耗。</p><a id="Section_cn_88"></a>
