  <h2 class="kindle-cn-heading2">39　砍樱桃枝</h2>

  <p class="kindle-cn-signature">赫里克</p>

  <p class="kindle-cn-poem-left">你允许我亲吻，<br/>
  你允许我求婚；<br/>
  你通过种种手段，<br/>
  使我相信你的爱情。</p>

  <p class="kindle-cn-poem-left">但是，我永远不会忘记，<br/>
  我为了使你高兴，<br/>
  遵命去砍樱桃枝，但是——<br/>
  樱桃却落在别人手里。</p>
