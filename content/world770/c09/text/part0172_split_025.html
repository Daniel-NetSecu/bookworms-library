<h2 class="calibre8" id="calibre_pb_69">SCENE VII.——MARIANNE, FROSINE, MASTER JACQUES.  </h2>

    <h2 class="calibre9">第七场——玛丽安娜，弗罗辛娜，雅克师傅。  </h2>
  </div>

  <div class="calibre4">
    <div class="en">
      Fro.: Do you know if your master is at home?
    </div>

    <div class="en">
      弗罗辛娜：你的主人在家吗？
    </div>
  </div>

  <div class="calibre4">
    <div class="en">
      Jac.: Yes, he is indeed; I know it but too well.
    </div>

    <div class="en">
      雅克师傅：在，当然在家，我非常清楚。
    </div>
  </div>

  <div class="calibre4">
    <div class="en">
      Fro.: Tell him, please, that we are here.
    </div>

    <div class="en">
      弗罗辛娜：那请通报他一声，我们到了。
    </div>
  </div>

  <p class="calibre10" id="calibre_pb_70"></p>
