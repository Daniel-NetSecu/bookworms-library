  <h2 class="kindle-cn-heading2">50　尽管她不忠于我，不忠于爱情</h2>

  <p class="kindle-cn-signature">康格里夫<span class="math-super"><a id="noteBack_1" href="part1493.xhtml#note_1">[1]</a></span></p>

  <p class="kindle-cn-poem-left">尽管她不忠于我，不忠于爱情，<br/>
  但我决不图谋报复；<br/>
  尽管我痛恨她的变心，<br/>
  但我对她痴心如故。</p>

  <p class="kindle-cn-poem-left">我们常常幸福地相聚，<br/>
  但美好的时光不能持久；<br/>
  虽然我抱憾目前的境遇，<br/>
  我对过去的感激依旧。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1493.xhtml#noteBack_1">[1]</a>威廉·康格里夫（William Congreve，1670—1729），小说家、戏剧家，出生于利兹附近的巴特赛，父亲是约尔卫戍部队的司令官。就读于都柏林的三一学院。传世之作有小说《英康格尼达》、喜剧《老单身汉》《为爱而爱》、悲剧《悼亡的新娘》等。</p>
