  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">89</h1>

  <p>我不再高谈阔论了——这是我主的意旨。</p>

  <p>从那时起我轻声细语。</p>

  <p>我心里的话要用歌曲低唱出来。</p>

  <p>人们急急忙忙到国王的市场上去，买卖的人都在那里。</p>

  <p>但在工作正忙的正午，我就早早地离开。</p>

  <p>那就让花朵在我的园中开放，虽然花时未到；</p>

  <p>让蜜蜂在中午奏起它们慵懒的嗡鸣的乐曲。</p>

  <p>我曾把充分的时间用在理欲交战里，</p>

  <p>但如今是我暇日游旅的雅兴把我的心拉到他那里去；</p>

  <p>我也不知道，这忽然的召唤会引到什么无用的结局。</p>
</body></html>
