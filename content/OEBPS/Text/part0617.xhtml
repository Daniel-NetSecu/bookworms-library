<p class="title1">内容简介</p>
<p class="normaltext">一个好警察总是在问问题。发生了什么？为什么会发生？谁干的？什么时候？在哪儿？为什么？一个好警察也知道哪些回答是正确的，哪些是错误的。</p>
<p class="normaltext">费利克斯是个好警察。警长要他去抓一个谋杀犯，一个很重要的谋杀犯——他谋杀了总统。费利克斯必须迅速地找到凶手，并把他带回来——不论是死是活。他夜以继日地工作，开着车在这个国家来回奔波，也问了很多问题。</p>
<p class="normaltext">但是有些问题是很危险的，最好不要知道答案。而死人，当然了，既不会问问题，也不能回答问题……</p>
