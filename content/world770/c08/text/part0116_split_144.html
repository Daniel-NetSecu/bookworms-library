<h1 class="calibre22" id="calibre_pb_246">第四十四节</h1>

      <p class="x5">使用其他金属实现这些用途只是次要手段。</p>

      <p class="x6">所有金属都能够用来充当货币。但是，那些过于普通的金属，由于体积大而价值小，不便于在商业中使用。铜、白银和黄金是经常被使用的仅有的几种金属。除了那些通过采矿和商业还不能提供足够数量黄金和白银的民族外，甚至连铜也仅仅用于很小的价值交换。</p><a id="Section_cn_45"></a>
