  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">80</h1>

  <p class="kindle-cn-poem-left">用一转的秋波，你能从诗人的琴弦上夺去一切诗歌的财富，<br/>
  美妙的女人！<br/>
  但是你不愿听他们的赞扬，因此我来颂赞你。<br/>
  你能使世界上最骄傲的头在你脚前俯伏。<br/>
  但是你愿意崇拜的是你所爱的没有名望的人们，<br/>
  因此我崇拜你。<br/>
  你的完美的双臂的接触，能在帝王的荣光上加上光荣。<br/>
  但你却用你的手臂去扫除尘土，<br/>
  使你微贱的家庭整洁，因此我心中充满了钦敬。</p>
