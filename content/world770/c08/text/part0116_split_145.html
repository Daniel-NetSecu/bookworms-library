<h1 class="calibre22" id="calibre_pb_247">第四十五节</h1>

      <p class="x5">金银作为货币，增加了它们作为物质本身的价值。</p>

      <p class="x6">虽然金银本身的价值不可能改变，但人们想方设法将自己的剩余商品兑换成黄金和白银，而不愿兑换成任何其他商品，这必然会增加两种物质在商业中的价值。这样只会使金银更适合用来作代币或标准尺度。</p><a id="Section_cn_46"></a>
