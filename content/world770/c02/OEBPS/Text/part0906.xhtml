  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">所有我能写的信</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">（用一朵花）</p>

  <p class="EB03BodyTextIndented">所有我能写的信</p>

  <p class="EB03BodyTextIndented">都没有这一封漂亮，</p>

  <p class="EB03BodyTextIndented">丝绒的音节，</p>

  <p class="EB03BodyTextIndented">长毛绒的句子，</p>

  <p class="EB03BodyTextIndented">红宝石的深度，深不见底，</p>

  <p class="EB03BodyTextIndented">藏起，轻诉，为你——</p>

  <p class="EB03BodyTextIndented">是一只蜂鸟演唱它</p>

  <p class="EB03BodyTextIndented">它刚刚啜饮了我！</p>
