<h1 class="calibre22" id="calibre_pb_253">第五十一节</h1>

      <p class="x5">流动财富是所有盈利行业必不可少的条件。</p>

      <p class="x6">在任何贸易中，工人或雇主都甚至有必要事先储备好一定数量的流动财富。在我们讨论完不同职业的分工以及资本所有者用资本获得价值的不同方式之后，我们不得不再次回顾一些之前只是暗示过的事情；否则的话，要合理地解释这些事情，就会打断我们的思路。</p><a id="Section_cn_52"></a>
