  <h1 class="bodycontent-first-title">献给雷昂·维尔特</h1>

  <p class="bodycontent-text_yinwen">我请求小读者们原谅我把这本书献给了一个成年人。我有一个正当的理由，该得到大家的谅解，因为这人是我在世界上最要好的朋友。我还有另一个理由，那就是这人善解一切，甚至善解专为儿童写的书。我的第三个理由则是，这人就住在法国，过着饥寒交迫的生活，需要得到安慰。如果这几条理由还不充足的话，那我就愿意把这本书献给已经长大成人的这个孩子。所有的成年人本来都是儿童，可惜很少有成年人还记得这一点。因此，我不妨把我的题词改为：</p>

  <p class="bodycontent-text_center">献给雷昂·维尔特</p>

  <p class="bodycontent-text_center">当他还是一个小男孩的时候</p>
