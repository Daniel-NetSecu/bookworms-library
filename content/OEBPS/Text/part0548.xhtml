<p class="subtitle1">内容简介</p>
<p class="normaltext">“女孩儿突然用手捧住尼克的脸，吻了他的嘴唇。‘开车小心点儿，好莱坞先生。再见！’女孩儿带着甜甜的微笑说，然后转过身迅速离去了。”</p>
<p class="normaltext">尼克·洛茨感到莫名其妙。仅仅十分钟前，女孩来到咖啡馆坐在了他旁边，尼克这才认识她的。可她离去时为什么吻了他？她为什么叫他“好莱坞先生”？在开车去温哥华的路上他一直思考着这些问题，可始终找不到答案。其实，这里还有一件事尼克不知道。</p>
<p class="normaltext">当女孩对尼克说再见时有人在旁边正听着呢——这个人对“好莱坞先生”这个称呼很感兴趣。在温哥华，尼克很快便得知那个人的兴趣于己不利……</p>
