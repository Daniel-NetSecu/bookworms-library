  <h2 class="kindle-cn-heading2">41　致不忠的情人</h2>

  <p class="kindle-cn-signature">卡鲁</p>

  <p class="kindle-cn-poem-left">可怜的人，爱情的一切欢娱<br/>
  都离你而去，你还将看见<br/>
  我凭自己的忠诚不渝<br/>
  将获得厚报和灿烂的前程，<br/>
  那时你只有埋怨自己的薄情。</p>

  <p class="kindle-cn-poem-left">一双比你更美的手将治愈<br/>
  你的伪誓给我带来的创伤，<br/>
  爱神将一颗比你更纯洁的心<br/>
  与我的心紧紧相连，<br/>
  共沐那荣耀的甘霖。</p>

  <p class="kindle-cn-poem-left">你只能像我先前所做的那样<br/>
  向爱神哭泣、哀求、抱怨，<br/>
  像我那样白白地把泪水流干，<br/>
  由于你既虚伪又不忠诚，<br/>
  你将永远受到诅咒！</p>
