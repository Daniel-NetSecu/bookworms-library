  <h2 class="kindle-cn-heading2">80　无论如何，我不会妒忌</h2>

  <p class="kindle-cn-signature">丁尼生</p>

  <p class="kindle-cn-poem-left">无论如何，我不会妒忌<br/>
  缺乏义愤之火的俘虏，<br/>
  红雀一经牢笼的养育，<br/>
  不知夏日丛林的瑰丽。</p>

  <p class="kindle-cn-poem-left">我不妒忌野兽的任性纵情，<br/>
  它们在时间的天地作恶，<br/>
  无拘无束，不知恶为何物，<br/>
  心中的天良从未觉醒。</p>

  <p class="kindle-cn-poem-left">我不妒忌不受盟约的心，<br/>
  有人会把它视为福音，<br/>
  但它只会在慵懒中消沉；<br/>
  我也不妒忌逃避中的安宁。</p>

  <p class="kindle-cn-poem-left">我相信，不管发生何事；<br/>
  我觉得，即便忧心惨切；<br/>
  与其从来没有爱过，<br/>
  不如爱过，而后失去。</p>
