  <title>至上的形象</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">至上的形象</h2>

  <p class="EB03BodyTextIndented">残忍据有人的心灵；</p>

  <p class="EB03BodyTextIndented">嫉妒据有人的脸庞；</p>

  <p class="EB03BodyTextIndented">恐怖据有至上的人形，</p>

  <p class="EB03BodyTextIndented">隐秘据有人的服装。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">人的服装是锻过的铁器，</p>

  <p class="EB03BodyTextIndented">人的外形是熊熊的锻炉，</p>

  <p class="EB03BodyTextIndented">人的脸庞是封闭的熔炉，</p>

  <p class="EB03BodyTextIndented">人心是它的饥饿的胃部。</p>
</body></html>
