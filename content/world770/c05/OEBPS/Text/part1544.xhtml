  <h2 class="kindle-cn-heading2">101　道路漫漫伸展在月光下</h2>

  <p class="kindle-cn-signature">豪斯曼</p>

  <p class="kindle-cn-poem-left">道路漫漫伸展在月光下，<br/>
  苍白的月亮头顶高挂；<br/>
  道路漫漫伸展在月光下，<br/>
  指引我离开爱人的家。</p>

  <p class="kindle-cn-poem-left">寂静的树篱不挂一丝风，<br/>
  更寂静的还有树的投影；<br/>
  我的脚印留在月照的黄尘，<br/>
  沿着那不见尽头的小径。</p>

  <p class="kindle-cn-poem-left">小径笔直地向前方延伸，<br/>
  旅行家都说地球呈圆形，<br/>
  只要你不停地走，不畏艰辛，<br/>
  就能顺利返回自己的家园。</p>

  <p class="kindle-cn-poem-left">兜这个大圈子回家以前，<br/>
  这条路一定十分的遥远：<br/>
  道路漫漫伸展在月光下，<br/>
  指引我离开爱人的家。</p>
