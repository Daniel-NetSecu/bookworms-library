  <h2 class="kindle-cn-heading2">69　爱的哲学</h2>

  <p class="kindle-cn-signature">雪莱</p>

  <p class="kindle-cn-poem-left">泉水流入江河，<br/>
  江河汇入海洋；<br/>
  风在天堂吹拂，<br/>
  永远拌和着甜美的情感。<br/>
  世上没有孤立的事物，<br/>
  万物都按神圣的法度<br/>
  交汇、融合成一个整体，<br/>
  我为何不能与你合二为一？</p>

  <p class="kindle-cn-poem-left">你看，高山亲吻蓝天，<br/>
  海浪相拥在一起，<br/>
  没有哪朵雌花情有可原，<br/>
  如果它把自己的兄弟蔑视。<br/>
  阳光依偎大地，<br/>
  月光亲吻海洋，<br/>
  如果你不亲吻我，<br/>
  美好的事物还有什么意义？</p>
