  <h2 class="EB04MainHeadClosedTitle">跳蚤和男人</h2>

  <p class="EB03BodyTextIndented">一个男人被一只跳蚤惹烦了，最终捉到了他。男人说道：“你怎么如此大胆，不但敢咬我，还让我费了这么大劲才捉住你？”</p>

  <p class="EB03BodyTextIndented">跳蚤回答道：“哦，我亲爱的先生，求求你放我走吧，别杀我，我不可能对你造成很大伤害的。”</p>

  <p class="EB03BodyTextIndented">这个男人笑着回答道：“我现在就要亲手杀了你。因为邪恶是不应被容忍的，无论这邪恶是大是小。”</p>
