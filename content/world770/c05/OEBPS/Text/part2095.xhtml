  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">149</h1>

  <p class="kindle-cn-poem-left1">残忍啊，你怎能说我不爱你？<br/>
  我已与你联手，反对我自身！<br/>
  暴君啊，谁说我心中没有你？<br/>
  为了你，我已经忘记我本人！<br/>
  憎恨你的，我何曾视为朋友？<br/>
  你讨厌的，我何曾刻意巴结？<br/>
  一看见你对我皱起了眉头，<br/>
  我何曾不叹息着训斥自己！<br/>
  当我受控于你的秋波流盼，<br/>
  死心塌地崇拜起你的缺陷，<br/>
  我何曾将自己的美德礼赞？<br/>
  何曾疏忽过侍奉你的职分？<br/>
  　　爱人，恨下去吧，我懂你的心：<br/>
  　　你爱有眼睛的，而我瞎了眼。</p>
