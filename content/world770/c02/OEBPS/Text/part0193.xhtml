  <title>有毒的树</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">有毒的树</h2>

  <p class="EB03BodyTextIndented">我对朋友愤怒，</p>

  <p class="EB03BodyTextIndented">我表明愤怒，怒气就没了；</p>

  <p class="EB03BodyTextIndented">我对敌人愤怒，</p>

  <p class="EB03BodyTextIndented">我不予表露，这怒气长着。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我提心吊胆将它浇灌，</p>

  <p class="EB03BodyTextIndented">日夜浇灌着泪滴；</p>

  <p class="EB03BodyTextIndented">我用微笑来将它照耀，</p>

  <p class="EB03BodyTextIndented">用软软的狡诈的诡计。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">它日日夜夜地生长，</p>

  <p class="EB03BodyTextIndented">终于结出了鲜亮的苹果；</p>

  <p class="EB03BodyTextIndented">我的敌人看到它闪光，</p>

  <p class="EB03BodyTextIndented">他知道那苹果属于我。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">当夜色将树身遮掩，</p>

  <p class="EB03BodyTextIndented">他就溜进园子里偷食：</p>

  <p class="EB03BodyTextIndented">早晨我高兴地看到</p>

  <p class="EB03BodyTextIndented">我的敌人在树下挺尸。</p>
</body></html>
