  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">不孕的女人</h1>

  <p class="kindle-cn-poem-left">空空的，最轻的脚步声也会在我身上回响，<br/>
  没有雕像的博物馆，宏伟的圆柱，门廊，圆形大厅。<br/>
  我的庭院里，喷泉喷涌而上，飞溅而下，<br/>
  修女的心肠却漠视这世界。大理石般的百合<br/>
  散发出馨香的苍白。<br/>
  <br/>
  我想象自己与伟大的公众人物在一起，<br/>
  白色女神奈基<span class="math-super"><a id="noteBack_1" href="part3216.xhtml#note_1">[1]</a></span>和几个凸眼阿波罗<span class="math-super"><a id="noteBack_2" href="part3216.xhtml#note_2">[2]</a></span>之母。<br/>
  然而，亡者的殷勤伤害我，没发生什么事。<br/>
  月亮放一只手在我的前额<br/>
  茫然的表情，沉默如保育员。<br/></p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part3216.xhtml#noteBack_1">[1]</a>Nike：奈基，希腊神话中的胜利女神。</p>

  <p class="kindle-cn-kai"><a id="note_2" href="part3216.xhtml#noteBack_2">[2]</a>Apollo：希腊罗马神话中的阿波罗，太阳神。</p>
