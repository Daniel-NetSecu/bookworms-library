  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">The leaves, like women, interchange</h2>

  <p class="EB03BodyTextIndented">The leaves, like women, interchange</p>

  <p class="EB03BodyTextIndented">Sagacious confidence;</p>

  <p class="EB03BodyTextIndented">Somewhat of nods, and somewhat of</p>

  <p class="EB03BodyTextIndented">Portentous inference,</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">The parties in both cases</p>

  <p class="EB03BodyTextIndented">Enjoining secrecy, —</p>

  <p class="EB03BodyTextIndented">Inviolable compact</p>

  <p class="EB03BodyTextIndented">To notoriety.</p>
