  <div class="chapter" id="chapter">
    <h1 class="kindle-cn-heading-2"><a id="page74"></a>第五场</h1>

    <div class="kindle-cn-para-2em-indent1">
      <p><span class="kaiti">露意丝独自一人。</span></p>
    </div>

    <div class="kindle-cn-para-2em-indent1">
      <p><span class="kaiti">她一动不动地、默默无声在圈椅里斜躺了好一会儿，终于站起来。走到舞台前部，惶惶然四处张望。</span><br/>
      <br/></p>
    </div>

    <p class="kindle-cn-para-hang"><span class="kindle-cn-bold">露意丝</span>　爸爸妈妈怎么还不回来？——爸爸说只出去几分钟，现在已过了整整五个可怕的钟点——他要是出了事——我该怎么好啊？——我为什么呼吸这样急促紧张？<span class="kaiti">（这时候伍尔穆进了房间，站在里侧，没被察觉）</span>没有什么事儿——纯粹是头脑发烧，疑神疑鬼——一旦我们的心灵受到过度惊吓，眼睛便会在任何一个墙旮旯看见魔鬼。</p>
  </div>
