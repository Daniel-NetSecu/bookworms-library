  <title>婴儿的悲伤</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">婴儿的悲伤</h2>

  <p class="EB03BodyTextIndented">我妈妈呻吟！我爸爸哭泣，</p>

  <p class="EB03BodyTextIndented">我跳进了这个危险世界里。</p>

  <p class="EB03BodyTextIndented">赤条条无力自助，哭嚎着，</p>

  <p class="EB03BodyTextIndented">像魔鬼藏在一片阴影里。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">在我爸爸手中挣扎着，</p>

  <p class="EB03BodyTextIndented">跟我的襁褓拼命反抗着，</p>

  <p class="EB03BodyTextIndented">又被裹着，又累，我只想</p>

  <p class="EB03BodyTextIndented">在我妈妈的乳房上解气。</p>
</body></html>
