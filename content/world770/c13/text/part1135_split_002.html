<h2 class="heading" id="calibre_pb_1">莫阿娜</h2>

  <p class="p">莫图鲁尼岛酋长图伊之女，年仅十六，却勇敢、聪慧且具有冒险精神。她被大海选中，是天生的航海家。在将特菲提之心归位的途中，她智斗各方怪兽，唤醒迷失自我的特菲提，拯救了世界，同时也找到了方向，明白了自己的使命。</p>
