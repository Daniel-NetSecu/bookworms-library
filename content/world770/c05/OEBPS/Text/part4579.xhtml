  <title>雕像</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">雕像</h1>

  <p>山上住着一个人，他有一尊雕像，系古代某位大师所作。他把雕像丢在门前的地上，压根儿不去看它一眼。</p>

  <p>一天，一个城里人路经山上人家门。那城里人见多识广，一看见雕像，便对主人表示想买下来。</p>

  <p>主人笑道：“这是一块没人要的脏石头，你还想给它找个买主？”</p>

  <p>城里人说：“我给你一块银币买下它。”</p>

  <p>山上人又惊又喜。</p>

  <p>雕像被一头大象驮运到城里。几个月之后，山上人进城，正游逛大街时，见一个店铺门口人山人海，其中一个人大声喊叫道：“都来瞧，都来看，这里有一尊世间完美的雕像，仅仅两个银币，便可一睹雕塑大师的传世杰作。”</p>

  <p>这时，山上人付了两个银币，走进店铺观看……原来那就是他以一块银币卖出的那尊雕像！</p>
