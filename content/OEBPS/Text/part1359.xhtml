<p class="title1">内容简介</p>
<p class="normaltext">你有兄弟或姐妹吗？他们有时会给你的生活带来很多烦心事。要是他们比你年纪小的话，他们就总是会惹麻烦，要你来帮忙。</p>
<p class="normaltext">如果你知道了一个人的缺点，便会难以忘掉。俗话说：“一日为贼，终生为贼。”但真的是这样吗？一次错误会使一个人永远是一个坏人吗？人们就不能有所改变吗？</p>
<p class="normaltext">珍妮弗·沃尔顿是一名护士，她是个文静、细心而又通情达理的人，却有一个既不细心也不通情达理的弟弟，名叫理查德。他总是向人借钱，干任何工作都没有长性，并且和警方扯上了麻烦。珍妮弗对他非常担心。一天，当警察前来询问有关他的情况时，珍妮弗想到了最坏的可能。</p>
