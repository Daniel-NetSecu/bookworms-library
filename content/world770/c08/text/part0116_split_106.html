<h1 class="calibre22" id="calibre_pb_208">第六节</h1>

      <p class="x5">工人的工资受制于那些为生存而工作的工人之间的竞争。他的所得只能维持生计。</p>

      <p class="x6">仅仅依靠自己的双手和辛勤劳作的纯粹的工人，除了能将自己的一部分劳动出卖给他人，其他的一无所有。他将自己的劳动以低价或高价出售；但是，价格的高低并不完全由他自己决定，而是取决于他与雇佣者所达成的协议。后者会尽可能压低价格，因为有大量的工人任其挑选，他会优先选用出价最低的工人。因此，为了与其他人竞争，工人们不得不降低自身的价格。在各个行业中，工人的工资只限于维持生存，而且实际情况也的确如此。</p><a id="Section_cn_7"></a>
