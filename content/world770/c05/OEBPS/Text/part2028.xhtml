  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">82</h1>

  <p class="kindle-cn-poem-left1">我承认，你未联姻我的缪斯，<br/>
  因此，你有足够的理由惠顾<br/>
  别的作家为你写下的献诗：<br/>
  你是诗的主题，你理应垂睹。<br/>
  你有与容貌相比美的学养，<br/>
  发现我欠缺颂扬你的才力，<br/>
  只好找寻时尚者粉墨登场，<br/>
  让他们为你刻下新的表记。<br/>
  这样也行，我的爱，但请留意：<br/>
  他们只讲究修辞，笔调浮夸；<br/>
  你的真美只在真话中显示，<br/>
  朋友能说真话，它朴实无华。<br/>
  　　只有贫血者才需艳抹浓妆，<br/>
  　　他们如此装扮你，有失允当。</p>
