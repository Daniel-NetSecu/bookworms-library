  <h2 class="EB04MainHeadClosedTitle">男人和狮子</h2>

  <p class="EB03BodyTextIndented">一个人和一只狮子结伴旅行。在谈话的过程中，他们开始吹嘘自己勇猛无敌，并声称自己无论在力量还是勇气方面都胜过对方。他们正在热烈地争论时，刚巧途经一个十字路口，这里摆放着一个人勒着狮子的雕塑。</p>

  <p class="EB03BodyTextIndented">“那儿！”人耀武扬威地说道，“看那个！这不正证明了我比你强吗？”</p>

  <p class="EB03BodyTextIndented">“别这么快地下结论，我的朋友，”狮子说，“这只是你看这个问题的角度。如果我们狮子也能够制作雕塑的话，你应该会看到大多数雕塑都是人在下面。”</p>

  <p class="EB01BodyTextLineSpace">每个问题都有两个角度。</p>
