  <title>帕丁</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">帕丁<a id="w1"></a><a href="part0509.xhtml#m1"><sup>[1]</sup></a></h2>

  <p class="EB03BodyTextIndented">在他的商店里，愤慨于笨拙的智慧，</p>

  <p class="EB03BodyTextIndented">我们老帕丁模糊的恶意，我盲目地</p>

  <p class="EB03BodyTextIndented">在石堆和荆棘丛中蹒跚而行，在晨光之下；</p>

  <p class="EB03BodyTextIndented">直到一只麻鹬呼叫，另一只麻鹬</p>

  <p class="EB03BodyTextIndented">在明亮的风中回应；我突然因此想到，</p>

  <p class="EB03BodyTextIndented">在寂寞的高处，所有一切都在上帝的眼中，</p>

  <p class="EB03BodyTextIndented">那里，我们声音中的混乱被遗忘，没有一个</p>

  <p class="EB03BodyTextIndented">单独的灵魂还缺乏甜美的水晶般的叫声。</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="m1"></a><a href="part0509.xhtml#w1">[1]</a> 帕丁（Paudeen），爱尔兰常见的名字Patrick的昵称，可泛指一般的市民大众。</p>
</body></html>
