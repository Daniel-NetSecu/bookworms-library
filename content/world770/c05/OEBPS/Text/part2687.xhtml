  <title>水塘边的雄鹿</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">水塘边的雄鹿</h1>

  <p>有一只很渴的雄鹿来到一个水塘边喝水。他弯下身子，看到自己在水中的倒影，对自己头上好看的角欣赏不已，同时却非常讨厌自己细长的瘦腿。他站在那里，看着自己的倒影，就在这时，有一只狮子攻击了他，一场追逐就此展开，但是雄鹿很快便甩开了狮子，一路领先，从空地一直跑到了树林里。可他的角却被树枝给挂住了，于是最终落入了狮子的口中。他用最后一口气呐喊道：“我可真可怜啊！我讨厌自己的腿，可是它们却能够保住我的命；我夸耀自己的角，可它们却害得我没了命。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：值钱的东西往往没用。</p>
</body></html>
