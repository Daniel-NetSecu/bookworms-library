  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">102</h1>

  <p>我在人前夸说我认得你。在我的作品中，他们看到了你的画像。</p>

  <p>他们走来问我：“他是谁？”我不知道怎么回答。</p>

  <p>我说：“真的，我说不出来。”</p>

  <p>他们斥责我，轻蔑地走开了。你却坐在那里微笑。</p>

  <p>我把你的事迹编成不朽的诗歌。</p>

  <p>秘密从我心中涌出。</p>

  <p>他们走来对我说：“把所有的意思都告诉我们吧。”</p>

  <p>我不知道怎样回答。</p>

  <p>我说：“啊，谁知道那是什么意思！”</p>

  <p>他们哂笑了，鄙夷之极地走开。</p>

  <p>你却坐在那里微笑。</p>
