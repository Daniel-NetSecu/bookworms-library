<h1 class="calibre22" id="calibre_pb_212">第十节</h1>

      <p class="x5">社会进步了；所有土地都有了主人。</p>

      <p class="x6">后来，土地上开始有人居住，而且越来越多的土地被开垦。随着时间的推移，最好的土地都被人占有了。对于那些后来者，只剩下早先的占有者舍弃不要的贫瘠的土地。但是，每一片土地最终都有了一个主人，而没有得到土地的人别无选择，只能从事薪资阶级的工作，用自己的亲手劳动换取从事耕种的土地所有者手中的剩余产品。</p><a id="Section_cn_11"></a>
