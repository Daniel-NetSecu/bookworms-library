<h2 class="heading" id="calibre_pb_0">Arlo</h2>

  <p class="p">The youngest child of the Apatosaurus family, who is characterized with timidity. He is guilty for father’s death and wants to prove himself. One day, he starts an adventured journey and makes friends with a cave boy. Eventually he overcomes his fear and completes his self-transformation.</p>
