  <title>法律与立法</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">法律与立法</h1>

  <p>古时候，有位伟大的国王。这位国王英明，想为臣民制定法律。国王召来选自一千个部落的千位贤人，要他们制定在幅员辽阔的王国通行之法。</p>

  <p>书写在羊皮纸上的千条法律被呈于国王面前，国王过目后痛哭流涕，因其不曾知道，王国之内，罪恶形式竟达千种。</p>

  <p>之后，国王召来书记官，亲自口授法律，双唇含着微笑，最后法律成文仅仅七条。</p>

  <p>千位贤人怒而离去，带着他们制定的千条法律回到部落中。每一个部落都开始采用千位贤人制定的法律。</p>

  <p>因此，直到今天，他们有千条法律。</p>

  <p>那是个大国家，境内有千座监狱，这些监狱中充满触犯法律的男男女女。</p>

  <p>那的确是个大国。然而国民都是千位立法者和一位英明的国王的后裔。</p>
