  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">I felt a cleavage in my mind</h2>

  <p class="EB03BodyTextIndented">I felt a cleavage in my mind</p>

  <p class="EB03BodyTextIndented">As if my brain had split;</p>

  <p class="EB03BodyTextIndented">I tried to match it, seam by seam,</p>

  <p class="EB03BodyTextIndented">But could not make them fit.</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">The thought behind I strove to join</p>

  <p class="EB03BodyTextIndented">Unto the thought before,</p>

  <p class="EB03BodyTextIndented">But sequence ravelled out of reach</p>

  <p class="EB03BodyTextIndented">Like balls upon a floor.</p>
