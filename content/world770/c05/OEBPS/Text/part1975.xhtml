  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">29</h1>

  <p class="kindle-cn-poem-left1">当我命途多舛并遭人白眼，<br/>
  我便独自哀悼自己的不幸，<br/>
  徒劳地诉苦，向聋耳的苍天；<br/>
  我打量着自己，诅咒着命运，<br/>
  渴望像别人那样前程无量，<br/>
  拥有堂堂仪表，或众多知己，<br/>
  或拥有彼得才华，约翰人望，<br/>
  但最称心的，最不让人满意。<br/>
  如此的思索令我颇感自卑，<br/>
  这时忽然想到你，我的心灵<br/>
  便像凌晨的云雀冲天而飞，<br/>
  离开阴沉大地，歌唱在天门。<br/>
  　　你甜美的爱，就是无价宝藏，<br/>
  　　有了它，王冠也不值得稀罕。</p>
