  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">71</h1>

  <p class="kindle-cn-poem-left1">请不要伤心，当你听见丧钟<br/>
  为我而悲鸣，通告这个世界：<br/>
  我已离开这片恶浊的苍穹，<br/>
  与那更其可恶的蛆虫同穴。<br/>
  当你读到这里的诗，别缅怀<br/>
  写作它的手，因为我深爱你，<br/>
  假如思念会招致你的悲哀，<br/>
  我宁愿你把我整个儿忘记！<br/>
  啊，我是说，当你读到这诗篇，<br/>
  那时我已腐朽，已化作尘泥，<br/>
  请你千万别把我的名叨念，<br/>
  让你的爱与我的生命同殪！<br/>
  　　我担心世人探究你的悲痛，<br/>
  　　我死后，会利用我将你嘲讽。</p>
