  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">11</h1>

  <p class="kindle-cn-poem-left1">你即使很快衰竭，与世诀别，<br/>
  也能很快成长在子孙身上；<br/>
  青春不在时，你青春的精血<br/>
  已在另一个自我身上流淌。<br/>
  有子孙就有智慧、美和富庶，<br/>
  否则只有愚昧、衰老和腐朽，<br/>
  如果人人像你，时代就停步，<br/>
  再过六十年，世界化为乌有。<br/>
  有些东西，造化本无意储存，<br/>
  就不妨任其粗陋，无果而逝；<br/>
  得天独厚者，她便加倍赐恩，<br/>
  她给你的厚礼，你应该珍惜。<br/>
  　　造化把你雕琢成她的印章，<br/>
  　　你应多盖戳，以免绝版消亡。</p>
