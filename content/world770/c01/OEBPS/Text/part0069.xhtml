<p class="title1" id="CHP67">LESSON 64</p>
<p class="picture"><img src="../Images/image01612.jpeg.webp" alt="alt"/></p>
<p class="normaltext">Kitty has a nice pet. It can sing a sweet song.</p>
<p class="normaltext">She has just fed it.</p>
<p class="normaltext">She will now put it in the cage, and hang the cage up. Then the cat can not catch it.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">凯蒂有只可爱的宠物。它会唱甜美的歌。</p>
<p class="normaltext">凯蒂刚喂过它了。</p>
<p class="normaltext">现在她要把宠物放到笼子里，把笼子挂起来。这样猫就够不着它了。</p>
