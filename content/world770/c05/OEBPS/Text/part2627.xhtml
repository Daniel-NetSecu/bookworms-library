  <title>枞树和荆棘</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">枞树和荆棘</h1>

  <p>一棵枞树跟一株荆棘吹嘘自己，语气中满是轻蔑：“你这可怜的东西，没有半点用。看看我，我用处多大，特别是盖房子的时候，人们根本离不开我。”但是荆棘却回复：“哎呀，那的确是好，不过等到他们拿着斧子、锯子来把你砍倒的时候，你就会宁愿自己是荆棘而不是枞树了。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：无忧无虑的贫穷胜过担着诸多责任的富有。</p>
</body></html>
