  <title>LXXI</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h3><i>LXXI</i></h3>

  <p class="dx1">To know yet to think that one does not know is best;</p>

  <p class="dx1">Not to know yet to think that one knows will lead to difficulty.</p>

  <p class="noindent">It is by being alive to difficulty that one can avoid it. The sage meets with no difficulty. It is because he is alive to it that he meets with no difficulty.</p>
</body></html>
