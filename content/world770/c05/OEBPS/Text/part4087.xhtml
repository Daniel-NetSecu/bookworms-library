  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">7</h1>

  <p>我的歌曲把她的装饰卸掉。</p>

  <p>她没有了衣饰的骄奢。</p>

  <p>装饰会成为我们合一之玷；</p>

  <p>它们会横阻在我们之间，</p>

  <p>它们叮当的声音会淹没你的细语。</p>

  <p>我的诗人的虚荣心，在你的容光中羞死。</p>

  <p>啊，诗圣，我已经拜倒在你的脚前。</p>

  <p>只让我的生命简单正直像一支苇笛，让你来吹出音乐。</p>
