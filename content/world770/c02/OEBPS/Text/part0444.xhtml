  <title>年老的禁欲者</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">年老的禁欲者</h2>

  <p class="EB03BodyTextIndented">我对财富毫不崇敬；</p>

  <p class="EB03BodyTextIndented">　　我对爱情鄙薄耻笑；</p>

  <p class="EB03BodyTextIndented">追名逐利不过一场梦境，</p>

  <p class="EB03BodyTextIndented">　　黎明到来便云散烟消。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">若要祈祷，那么世间仅剩</p>

  <p class="EB03BodyTextIndented">　　一句祷词尚能让我开口，</p>

  <p class="EB03BodyTextIndented">那便是：“让我清净，</p>

  <p class="EB03BodyTextIndented">　　给我自由！”</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">是的，当我飞逝的年华已近黄昏，</p>

  <p class="EB03BodyTextIndented">　　这便是我唯一所求；</p>

  <p class="EB03BodyTextIndented">愿我拥有无拘无束的灵魂，</p>

  <p class="EB03BodyTextIndented">　　无论生死，勇敢承受。</p>
</body></html>
