  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">92</h1>

  <p class="kindle-cn-poem-left1">你尽可以发狠心悄然溜走，<br/>
  我的生命原本就取决于你，<br/>
  没有爱，它无法在人间滞留，<br/>
  它全凭爱而生存，由爱维系。<br/>
  既然你的冷漠能夺我性命，<br/>
  我就无须畏惧严厉的一击；<br/>
  我知道，死恰恰是一个佳境，<br/>
  胜过看你的脸色苟活人世。<br/>
  我的生命如因背叛而幻灭，<br/>
  就无须苦恼你的反复无常；<br/>
  啊，这是何等幸福的境地：<br/>
  幸福地拥有爱，幸福地死亡！<br/>
  　　但不惧污损的完美在哪里？<br/>
  　　也许你已变心，我一概不知。</p>
