  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">48</h1>

  <p class="kindle-cn-poem-left1">出门以前，我不敢懈怠无忧，<br/>
  总要将各种细软锁进库房，<br/>
  让它们逃过阴险者的贼手，<br/>
  以便日后需要时派上用场。<br/>
  但那些宝贝哪及你的无价，<br/>
  我的安慰啊，如今的大忧愁！<br/>
  我最亲的人，我唯一的牵挂，<br/>
  贼眼都盯着你，想把你盗走。<br/>
  我没有把你锁进任何箱柜，<br/>
  只用温柔的胸膛将你围住，<br/>
  你不在那里，但我感觉你在，<br/>
  你可以即兴而来，即兴而去。<br/>
  　　在那里，我仍担心你会被盗，<br/>
  　　你太珍贵，连君子也不可靠。</p>
