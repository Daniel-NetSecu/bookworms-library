  <title>青蛙怨日</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">青蛙怨日</h1>

  <p>从前有一回，太阳想要娶个妻子，青蛙们都惊恐不安，提高了声音向天空鸣叫，朱庇特听到了这噪音，就问他们为什么叫唤。他们回答说：“太阳单身的时候已经够恶毒了，总是把我们的沼泽烤干。如果他结了婚生了小太阳我们会如何呢？”</p>
