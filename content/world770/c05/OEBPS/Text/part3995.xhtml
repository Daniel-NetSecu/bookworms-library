  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">3</h1>

  <p class="kindle-cn-poem-left">早晨我把网撒在海里。<br/>
  我从沉黑的深渊拉出奇形奇美的东西——<br/>
  有些微笑般地发亮，<br/>
  有些眼泪般地闪光，<br/>
  有的晕红得像新娘的双颊。<br/>
  当我携带着这一天的担负回到家里的时候，<br/>
  我爱正坐在园里悠闲地扯着花叶。<br/>
  我沉吟了一会儿，<br/>
  就把我捞得的一切放在她的脚前，沉默地站着。<br/>
  她瞥了一眼说：“这是些什么怪东西？<br/>
  我不知道这些东西有什么用处！”<br/>
  我羞愧得低了头，心想：<br/>
  “我并没有为这些东西去奋斗，<br/>
  也不是从市场里买来的；<br/>
  这不是一些配送给她的礼物。”<br/>
  整夜的工夫我把这些东西一件一件地丢到街上。<br/>
  早晨行路的人来了；<br/>
  他们把这些拾起带到远方去了。</p>
