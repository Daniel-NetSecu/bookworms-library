<p class="title1" id="CHP10">LESSON 7</p>
<p class="picture"><img src="../Images/image01550.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>See the frog on a log.</td>
    <td>瞧，原木上有只青蛙。</td>
  </tr>
  <tr>
    <td>Rab sees the frog.</td>
    <td>拉波看见了青蛙。</td>
  </tr>
  <tr>
    <td>Can the frog see Rab?</td>
    <td>青蛙能看见拉波吗？</td>
  </tr>
  <tr>
    <td>The frog can see the dog.</td>
    <td>青蛙能看见那条狗。</td>
  </tr>
  <tr>
    <td>Rab ran at the frog.</td>
    <td>拉波向那只青蛙跑去。</td>
  </tr>
</table>
