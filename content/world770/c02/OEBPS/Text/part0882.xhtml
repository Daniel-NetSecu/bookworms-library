  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">谁劫掠了树林</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">谁劫掠了树林，</p>

  <p class="EB03BodyTextIndented">不知提防的树林？</p>

  <p class="EB03BodyTextIndented">毫无疑心的树木</p>

  <p class="EB03BodyTextIndented">拿出他们的荚壳和青苔</p>

  <p class="EB03BodyTextIndented">取悦他的幻想。</p>

  <p class="EB03BodyTextIndented">他好奇，浏览他们的小饰物，</p>

  <p class="EB03BodyTextIndented">他抓取，他夺走。</p>

  <p class="EB03BodyTextIndented">一本正经的铁杉，</p>

  <p class="EB03BodyTextIndented">还有枞树会说什么？</p>
