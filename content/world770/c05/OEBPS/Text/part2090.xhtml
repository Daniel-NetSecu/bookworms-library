  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">144</h1>

  <p class="kindle-cn-poem-left1">我有两个情人：安慰和绝望，<br/>
  他们像精灵对我不断劝诱；<br/>
  好精灵是个男子，相貌堂堂，<br/>
  坏精灵是个女子，肤色丑陋。<br/>
  这女鬼一心想骗我下地狱，<br/>
  还诱惑好精灵离开我身边，<br/>
  她想将我的天使变为鬼蜮，<br/>
  用她的丑恶掠夺他的纯真。<br/>
  我的天使是否真的变妖魔，<br/>
  这只是凭猜测，我无法断定；<br/>
  但他们已离开我，形同知交，<br/>
  我估计我的天使已经沉沦。<br/>
  　　这都是猜想，真相无以奉告，<br/>
  　　除非恶鬼用火将好鬼吓跑。</p>
