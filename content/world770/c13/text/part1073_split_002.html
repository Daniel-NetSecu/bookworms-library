<h2 class="heading" id="calibre_pb_1">爱洛</h2>

    <p class="p">爱洛公主是一位好奇心强、喜欢思考的女孩。她对自然有着非同寻常的亲和力，这一点只有玛琳菲森可与之相提并论。长大后，她卷入了一场森林王国和人类王国的纷争中，一边是她热爱的土地，另一边却是她的至亲。</p>
