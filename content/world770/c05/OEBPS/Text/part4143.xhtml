  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">63</h1>

  <p>你使不相识的朋友认识了我。</p>

  <p>你在别人家里给我准备了座位。</p>

  <p>你缩短了距离，你把生人变成弟兄。</p>

  <p>在我必须离开故居的时候，我心里不安，</p>

  <p>我忘了是旧人迁入新居，而且你也住在那里。</p>

  <p>通过生和死，今生和来世，无论你带领我到哪里，</p>

  <p>都是你，仍是你，我的无穷生命中的唯一伴侣，</p>

  <p>永远用欢乐的系链，把我的心和陌生人联系在一起。</p>

  <p>人一认识了你，世上就没有陌生的人，</p>

  <p>也没有了紧闭的门户。</p>

  <p>啊，请允许我的祈求，</p>

  <p>使我在与众生游戏之中，</p>

  <p>永不失去和你单独接触的福祉。</p>
