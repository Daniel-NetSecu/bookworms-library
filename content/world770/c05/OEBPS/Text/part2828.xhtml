  <title>人、马、公牛和狗</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">人、马、公牛和狗</h1>

  <p>有一个冬天，遇到了一场猛烈的暴风雪，一匹马、一头公牛和一只狗到了一户人家恳求能进屋去避一避。人很热情地请他们进去，由于他们又冷又湿，便点起火来让他们舒服一些。他给马提供了燕麦，给公牛提供了干草，把自己晚饭剩下的东西给了狗吃。等暴风雪渐渐变弱，他们准备离开，决定要报答人的恩情。他们将人的一生划分成几段，各自根据自己所长，负责其中一部分。马负责照顾青年，因为年轻人精神饱满，不愿受束缚；公牛负责中年，因为人在中年脚踏实地，认真工作；狗则负责晚年，因为老人脾气暴躁，就像狗一样，喜欢依赖那些让他们舒服的人，对那些陌生的或是他们讨厌的人则撕咬不停。</p>
