  <title>胡桃树</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">胡桃树</h1>

  <p>有一棵胡桃树长在路边，每年都会结很多果子。路过的人都会用棍子或是石子击打他的树枝，想要把果子打下来。胡桃树为此受了很多苦，他哭诉道：“这太不公平了，那些享用我果实的人，应该奖励我，而不是这么羞辱、殴打我。”</p>
