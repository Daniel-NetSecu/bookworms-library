  <title>土块和卵石</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">土块和卵石</h2>

  <p class="EB03BodyTextIndented">“爱不图自己满意欢喜，</p>

  <p class="EB03BodyTextIndented">也不为自己小心留意，</p>

  <p class="EB03BodyTextIndented">却为了他人献出安逸，</p>

  <p class="EB03BodyTextIndented">在地狱的绝望中将天堂建起。”</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">一个小黏土块这样唱着，</p>

  <p class="EB03BodyTextIndented">被粘在牛脚上踏着踩着，</p>

  <p class="EB03BodyTextIndented">与一块溪中的卵石相遇，</p>

  <p class="EB03BodyTextIndented">它婉转地唱出这些韵律：</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“爱只图自己满意欢喜，</p>

  <p class="EB03BodyTextIndented">强求于别人自己惬意，</p>

  <p class="EB03BodyTextIndented">取乐于他人失去安逸，</p>

  <p class="EB03BodyTextIndented">在天堂的憎恶中将地狱建起。”</p>

  <p class="EB03BodyTextIndented"><br/></p>
</body></html>
