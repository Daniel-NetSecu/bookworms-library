  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">54</h1>

  <p class="kindle-cn-poem-left1">啊，如果有真作为美的装饰，<br/>
  那么，美一定显得更具光辉！<br/>
  玫瑰是美的，但我们还觉得<br/>
  更美的是蕴含其中的香味。<br/>
  若论颜色，那无香的野蔷薇<br/>
  与芬芳的玫瑰花并无二致，<br/>
  当夏日的暖风吹开了蓓蕾，<br/>
  它也枝头高挂，也玩得肆意；<br/>
  但外表的美已是它的全部，<br/>
  它活着，无人问津，无人爱怜，<br/>
  直至死灭。但玫瑰不是如此：<br/>
  它即便死了，还提炼出香精。<br/>
  　　你也如此，我可爱的美少年：<br/>
  　　当美消亡，你的真由诗提炼。</p>
