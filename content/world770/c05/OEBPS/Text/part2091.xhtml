  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">145<span class="math-super"><a id="a01" href="part2091.xhtml#b01">[1]</a></span></h1>

  <p class="kindle-cn-poem-left1">因为她，我已日渐消沉，<br/>
  爱神亲手造的那张嘴<br/>
  对我说出两个字：“我恨”；<br/>
  但她发现我满怀伤悲，<br/>
  随即又对我产生怜悯，<br/>
  斥责起惯说蜜语甜言、<br/>
  发布温良消息的嘴唇，<br/>
  要它将其中含义更新。<br/>
  她在“我恨”后面添词语，<br/>
  这一添犹如明朗白天<br/>
  紧跟黑夜，后者像魔鬼<br/>
  从天堂摔入地狱深渊。<br/>
  　　她从“我恨”中摒弃了恨，<br/>
  　　“不是你”一语成我救星。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="b01" href="part2091.xhtml#a01">[1]</a> 这首诗每行只有八个音节，故以九字句译之。</p>
