  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">墨丘利和商贩</h1>

  <p>在朱庇特造人的时候，他让墨丘利加入了一些谎言，来作为制造商人的原料。墨丘利遵命照办，挨个儿给所有的商人分配了相同的比例，牛油商、菜贩、服装商……全都处理完了。最后，他遇到了名单上的最后一个，马贩子，发现还剩下一些谎言，于是就都放到了马贩子身上。所以，所有的商贩都会或多或少地撒些谎，但是却没有像马贩子这样会撒谎。</p>
