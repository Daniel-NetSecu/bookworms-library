  <title>狼和狗</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">狼和狗</h1>

  <p>狼对狗说：“我们为什么要做敌人呢？你们在很多方面和我们都是一样的，我们之间最主要的不同就是你们是被驯养的，而我们是自由长大的，因此你们受人类奴役，他们打你，给你们的脖子上戴上沉重的项圈，驱使你们帮他们看顾牧群，而最可恶的是，他们除了给你们骨头吃再也不给你们别的。别过这种日子了，把牧群交给我们吧，我们可以都养尊处优，一起享受。”狗被他们说服了，便随着狼去了狼窝，但是一进去，狼就扑向了他们，将他们撕成了碎片。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：叛徒的命运纯属罪有应得。</p>
