<h1 class="calibre22" id="calibre_pb_292">第九十节</h1>

      <p class="x5">货币利率对所有盈利企业的影响。</p>

      <p class="x6">利息的价格可以被看作是一种确保所有劳动、农业、工业或商业正常运转的标准。它就像大国之中一片辽阔的海洋；山峰露出水面，形成肥沃、耕种过的岛屿。如果这片海洋恰好退潮，随着水位逐渐下降，先是倾斜的地面，然后是平原和山谷，便会慢慢显露出来，上面长满各种各样的作物。海水只要上涨一英尺，就足以淹没无限广阔的土地，海水只要下降一英尺，就可以使无限广阔的土地上恢复农业。使企业充满活力的是充足的资本；而低利既是资本充足的结果，也是资本充足的证明。</p><a id="Section_cn_91"></a>
