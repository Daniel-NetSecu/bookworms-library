  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">59</h1>

  <p class="kindle-cn-poem-left1">如果世上的万物一如既往，<br/>
  别无新意，那我们已经上当：<br/>
  我们用尽心思，本想有所创，<br/>
  生下的婴儿早已活在世上！<br/>
  哟，但愿这历史能转身回望，<br/>
  追溯太阳五百年前的轨迹，<br/>
  并在古籍中显示你的形象，<br/>
  说说思想如何见于文字，<br/>
  从而让我知道：古代的人们<br/>
  如何描述你——这世界的奇观：<br/>
  他们谁更好，今人还是古人？<br/>
  世界是革新，还是一味循环？<br/>
  　　哟，我断言，古代的英才贤士<br/>
  　　赞美过的人，没一个比得上你。</p>
