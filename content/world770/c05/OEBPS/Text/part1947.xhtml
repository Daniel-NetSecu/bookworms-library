  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">1</h1>

  <p class="kindle-cn-poem-left1">我们渴望绝美的生命繁殖，<br/>
  娇艳的玫瑰永远不会凋亡，<br/>
  但万物成熟后即随时入寂，<br/>
  唯柔嫩的子嗣将美质承扬。<br/>
  你只知与自己的美目联姻，<br/>
  自身做燃料，徒烧你的光彩，<br/>
  你这是将富饶变成了饥馑，<br/>
  自身做了仇敌，把自己残害。<br/>
  如今你是人间别致的装饰，<br/>
  只有你能召唤烂漫的春光，<br/>
  你却让自己在蓓蕾中夭折，<br/>
  温柔的暴徒，在节俭中铺张。<br/>
  　　请怜悯这世界，别暴殄珍异，<br/>
  　　莫让天物被你和坟墓吞噬。</p>
