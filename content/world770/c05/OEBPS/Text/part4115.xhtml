  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">35</h1>

  <p>在那里，心是无畏的，头也抬得高昂；</p>

  <p>在那里，知识是自由的；</p>

  <p>在那里，世界还没有被狭小的家园的墙隔成片段；</p>

  <p>在那里，话是从真理的深处说出；</p>

  <p>在那里，不懈的努力向着“完美”伸臂；</p>

  <p>在那里，理智的清泉没有沉没在积雪的荒漠之中；</p>

  <p>在那里，心灵是受你的指引，</p>

  <p>走向那不断放宽的思想与行为——</p>

  <p>进入那自由的天国，我的父啊，让我的国家觉醒起来吧。</p>
