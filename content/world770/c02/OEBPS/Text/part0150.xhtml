  <title>我看见一座全金的教堂</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">我看见一座全金的教堂</h2>

  <p class="EB03BodyTextIndented">我看见一座全金的教堂，</p>

  <p class="EB03BodyTextIndented">谁也没有胆量进去，</p>

  <p class="EB03BodyTextIndented">许多人悲叹着站在外面，</p>

  <p class="EB03BodyTextIndented">悲叹，哀哭，膜拜顶礼。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我看见一条巨蛇出现</p>

  <p class="EB03BodyTextIndented">在那些白色门柱中间，</p>

  <p class="EB03BodyTextIndented">他用力挤呀挤呀挤呀，</p>

  <p class="EB03BodyTextIndented">终于挤落了黄金的铰链。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">沿着可爱的，铺满珍珠</p>

  <p class="EB03BodyTextIndented">以及灿灿宝石的通道，</p>

  <p class="EB03BodyTextIndented">他伸直他那黏滑的蛇身，</p>

  <p class="EB03BodyTextIndented">直伸到白色的祭坛上面。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">他向外喷射出他的毒液，</p>

  <p class="EB03BodyTextIndented">喷在面包和啤酒上面，</p>

  <p class="EB03BodyTextIndented">于是我折进了一个猪圈，</p>

  <p class="EB03BodyTextIndented">躺在那些猪猡中间。</p>
