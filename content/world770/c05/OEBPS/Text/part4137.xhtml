  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">57</h1>

  <p>光明，我的光明，充满世界的光明，</p>

  <p>吻着眼目的光明，甜沁心腑的光明！</p>

  <p>啊，我的宝贝，光明在我生命的一角跳舞；</p>

  <p>我的宝贝，光明在勾拨我爱的心弦；</p>

  <p>天开了，大风狂奔，笑声响彻大地。</p>

  <p>蝴蝶在光明海上展开翅帆。</p>

  <p>百合与茉莉在光波的浪花上翻涌。</p>

  <p>我的宝贝，光明在每朵云彩上散映成金，</p>

  <p>它撒下无量的珠宝。</p>

  <p>我的宝贝，快乐在树叶间伸展，欢喜无边。</p>

  <p>天河的堤岸淹没了，欢乐的洪水在四散奔流。</p>
