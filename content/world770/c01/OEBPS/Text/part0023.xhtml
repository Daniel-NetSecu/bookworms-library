<p class="title1" id="CHP21">LESSON 18</p>
<p class="picture"><img src="../Images/image01563.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>This is a pet bird.</td>
    <td>这是一只宠物鸟。</td>
  </tr>
  <tr>
    <td>It lives in a new cage.</td>
    <td>它住在一个新笼子里。</td>
  </tr>
  <tr>
    <td>It will stand on Sue's hand and sing.</td>
    <td>它将站在苏的手上唱歌。</td>
  </tr>
  <tr>
    <td>Sue loves her pet bird.</td>
    <td>苏喜欢她的宠物鸟。</td>
  </tr>
  <tr>
    <td>So do I love it.</td>
    <td>我也喜欢它。</td>
  </tr>
</table>
