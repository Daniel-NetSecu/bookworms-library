  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">60</h1>

  <p class="kindle-cn-poem-left1">就像撞击卵石海滩的浪涛，<br/>
  我们的光阴急急奔向终点，<br/>
  后一秒钟总要替代前一秒，<br/>
  时光就在互相倾轧中向前。<br/>
  初生的婴儿一旦见到阳光，<br/>
  便缓缓走向成熟，到达峰顶，<br/>
  这以后晦运便跟荣耀开仗，<br/>
  时间也捣毁了送出的礼品。<br/>
  时间将刺穿那青春的华饰，<br/>
  在美人的额头犁出了沟槽，<br/>
  自然的奇珍异宝都被蚕食，<br/>
  万物逃不脱他收割的镰刀。<br/>
  　　但我的诗有望与时间同寿，<br/>
  　　它称颂你的美，无视其毒手。</p>
