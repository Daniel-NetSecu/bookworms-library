  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">55</h1>

  <p class="kindle-cn-poem-left">正午的时候你走了。<br/>
  烈日当空。<br/>
  当你走的时候，我已做完了工作，坐在凉台上。<br/>
  不定的风吹来，含带着许多远野的香气。<br/>
  鸽子在树荫中不停地叫唤，<br/>
  一只蜜蜂在我屋里飞着，嗡出许多远野的消息。<br/>
  村庄在午热中入睡了。路上无人。<br/>
  树叶的声音时起时息。<br/>
  我凝望天空，把一个我知道的人的名字织在蔚蓝里，<br/>
  当村庄在午热中入睡的时候。<br/>
  我忘记把头发编起。困倦的风在我颊上和它嬉戏。<br/>
  河水在荫岸下平静地流着。<br/>
  懒散的白云动也不动。<br/>
  我忘了编起我的头发。<br/>
  正午的时候你走了。<br/>
  路上尘土灼热，田野在喘息。<br/>
  鸽子在密叶中呼唤。<br/>
  我独坐在凉台上，当你走的时候。</p>
