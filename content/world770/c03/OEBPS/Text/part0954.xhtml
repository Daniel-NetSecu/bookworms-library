  <title>XLVII</title>

  <h3><i>XLVII</i></h3>

  <p class="dx1">Without stirring abroad</p>

  <p class="dx1">One can know the whole world;</p>

  <p class="dx1">Without looking out of the window</p>

  <p class="dx1">One can see the way of heaven.</p>

  <p class="dx1">The further one goes</p>

  <p class="dx1">The less one knows.</p>

  <p class="dx1">Therefore the sage knows without having to stir,</p>

  <p class="dx1">Identifies without having to see,</p>

  <p class="dx1">Accomplishes without having to act.</p>
</body></html>
