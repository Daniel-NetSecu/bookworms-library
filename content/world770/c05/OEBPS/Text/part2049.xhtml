  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">103</h1>

  <p class="kindle-cn-poem-left1">唉，我的缪斯本可大展才艺，<br/>
  但她带来的礼物何其简朴！<br/>
  天然的主题居然更有价值，<br/>
  竟使我的赞美反成了蛇足。<br/>
  如果我不再写诗，别责备我！<br/>
  照照镜子吧，那里有一张脸<br/>
  远胜过我写的笨拙的诗作，<br/>
  使它很无趣，使我丢人现眼。<br/>
  原本完美的，根本无须修饰，<br/>
  执意去玷污，这岂不是犯罪！<br/>
  我的诗本来没有其他目的，<br/>
  只为颂扬你的天赋，你的美。<br/>
  　　当你照镜，镜中所示最丰赡，<br/>
  　　远非我写的诗句所能容涵。</p>
