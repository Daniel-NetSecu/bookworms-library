<h2 class="heading" id="calibre_pb_3">詹姆士·P. 苏利文（毛怪）</h2>

  <p class="p">他是个大块头的怪兽，蓝色的身体毛茸茸的，点缀着紫色斑点，头上同样有一对小角，还拖着一条长长的尾巴。在怪兽大学出场时，毛怪既傲慢又友好，认为自己的家族出身和与生俱来的天赋足以使自己进入惊吓行业。</p>
