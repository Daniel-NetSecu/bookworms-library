  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">86</h1>

  <p>死亡，你的仆人来到我的门前，</p>

  <p>他渡过不可知的海洋临到我家，来传达你的召令。</p>

  <p>夜色沉黑，我心中畏惧——</p>

  <p>但是我要端起灯来，开起门来，鞠躬欢迎他。</p>

  <p>因为站在我门前的是你的使者。</p>

  <p>我要含泪地合掌礼拜他。</p>

  <p>我要把我心中的财产，放在他脚前，来礼拜他。</p>

  <p>他的使命完成了就要回去，在我的晨光中留下了阴影；</p>

  <p>在我萧条的家里，只剩下孤独的我，作为最后献礼的祭品。</p>
