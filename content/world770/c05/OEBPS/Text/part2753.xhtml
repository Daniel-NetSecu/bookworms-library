  <title>改行做医生的修鞋匠</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">改行做医生的修鞋匠</h1>

  <p>有一个技术很不好的修鞋匠，发现自己没有办法依靠修鞋为生，便不再修鞋，改行做了医生。他声称自己有一种能解百毒的解毒剂，由于他吹嘘自己的能力，赚了很多钱。但是有一天，他自己生了重病，国王觉得应该测试一下他的灵药，于是让人倒出一剂解毒剂，假装混了毒药在里面，实际上只是加了一些水，然后便命令他喝下去。修鞋匠害怕被毒死，便承认自己对医药一无所知，他的解毒剂一钱不值。然后国王召集臣民，发布演说：“还有比你们更傻的傻瓜吗？都没有人送靴子去让这个修鞋匠修，你们却还毫不犹豫地把命交托到他手里。”</p>
