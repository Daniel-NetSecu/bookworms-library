  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">76</h1>

  <p class="kindle-cn-poem-left1">我的诗为何缺乏新鲜花样？<br/>
  为何如此呆板，缺乏新变化？<br/>
  我为何不求时尚，不去模仿<br/>
  新的诗律，以及奇异的文法？<br/>
  我为何总是写得千篇一体，<br/>
  总是让创造披上旧的衣装，<br/>
  每个字都将我的姓名昭示，<br/>
  说出了此字的出身和去向？<br/>
  哟，爱人啊，要知道我在写你，<br/>
  我的主题始终是你和爱情，<br/>
  我要努力从旧词写出新意，<br/>
  我要让过去的事一再翻新。<br/>
  　　就像太阳每天都新旧交替，<br/>
  　　同理，我的爱总是旧情重提。</p>
