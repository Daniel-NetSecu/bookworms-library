<p class="title1">内容简介</p>
<p class="normaltext">拉尔夫·克鲁和他的小女儿萨拉一起生活在印度。他是个有钱人，于是当他把萨拉带到伦敦明钦小姐的学校时，明钦小姐非常高兴。她喜欢父亲有钱的女孩子，这样对她的学校有好处。克鲁先生非常爱萨拉，给她买了许多漂亮的衣服、书还有洋娃娃。明钦小姐笑了，可她对她的姐姐说：“萨拉看起来就像个小公主一样，不像学生！”</p>
<p class="normaltext">克鲁先生回印度继续工作去了，而萨拉也开始了她新的学校生活。她是个善良、和气的女孩子，每个人都很喜欢她，很快她就交了很多朋友。</p>
<p class="normaltext">可要知道，当你富有时，每个人都是你的朋友。萨拉11岁生日那天，从印度传来了可怕的消息。可怜的萨拉非常伤心，而她也很快地知道了谁才是她真正的朋友……</p>
