  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">小羊和狼</h1>

  <p>有一只小羊离了羊群，被一只狼追赶。他发现自己肯定会被抓到，便转身对狼说：“先生，我知道我肯定没有办法逃脱被你吃掉的命运，我的生命注定如此短暂，我求你尽可能仁慈一些，你能不能吹支曲子，让我在死前跳支舞啊？”狼觉得在吃饭前听点音乐也没有什么不好，于是拿出笛子，开始吹奏，而小羊在他面前跳起了舞。没多久，守护羊群的诸神路过这里，听到声音过来看是怎么回事。他们一看到羊，便将狼驱赶走了，狼一边跑，一边回头对小羊说：“我可真是活该，我的行当是屠夫，可不该变成吹笛人来哄你开心。”</p>
