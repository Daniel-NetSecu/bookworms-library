<p class="title1" id="CHP15">LESSON 12</p>
<p class="picture"><img src="../Images/image01556.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>Can this old fox catch the hen?</td>
    <td>这只老狐狸能捉住那只母鸡吗？</td>
  </tr>
  <tr>
    <td>The fox can catch the hen,</td>
    <td>狐狸能捉住母鸡，</td>
  </tr>
  <tr>
    <td>and get the eggs in the nest.</td>
    <td>并且拿走窝里的鸡蛋。</td>
  </tr>
  <tr>
    <td>Run, Rab, and catch the fox.</td>
    <td>快跑，拉波！捉住那只狐狸。</td>
  </tr>
</table>
<p class="picture"><img src="../Images/image01557.jpeg.webp" alt="alt"/></p>
<p class="picture"><img src="../Images/image01558.jpeg.webp" alt="alt"/></p>
<p class="normaltext3">This nest has eggs in it.</p>
<p class="normaltext3">这个窝里有鸡蛋。</p>
