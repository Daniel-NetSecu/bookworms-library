<h2 class="heading" id="calibre_pb_9">查尔斯·蒙兹</h2>

  <p class="p">一位受人敬爱的航空先驱。他乘坐“探险精神号”飞船周游世界，后返回南美洲，数十年来都在寻找天堂瀑布的怪物，人也因此变得疯狂，最终被卡尔一行人打败。</p>
