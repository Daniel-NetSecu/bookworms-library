<p class="title1" id="CHP16">LESSON 13</p>
<p class="picture"><img src="../Images/image01559.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>Nell is by the pond.</td>
    <td>内尔在池塘边。</td>
  </tr>
  <tr>
    <td>I see ducks on the pond.</td>
    <td>我看见池塘里有鸭子。</td>
  </tr>
  <tr>
    <td>Nell sees the ducks,</td>
    <td>内尔看见了鸭子，</td>
  </tr>
  <tr>
    <td>and will feed them.</td>
    <td>想喂它们。</td>
  </tr>
  <tr>
    <td>She can not get the ducks.</td>
    <td>她捉不到这些鸭子。</td>
  </tr>
</table>
