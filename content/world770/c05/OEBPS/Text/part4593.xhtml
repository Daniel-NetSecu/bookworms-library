  <title>出家的先知</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">出家的先知</h1>

  <p>过去有两位出家的先知，每月三次离开禅房进城，在集市上号召人们助人为乐，分担他人重担。先知口齿伶俐，能言善辩，颇能说服人，因此名声远扬，国人皆知。</p>

  <p>一天，三个男子来到先知的禅房，先知热情接待他们。他们对先知说：“你一直劝告人们施舍行善，互助协作，意在教育那些富有的人周济穷人。我们怀疑你的名声给你带来大批财富。如今，我们饥馑难忍，就请你给我们一些钱财吧！”</p>

  <p>先知答道：“朋友们，我仅有这张床、这床被子和这把壶；如果你们需要，就拿去吧！我既无银，又无金。”</p>

  <p>三个人蔑视地望了望先知，走在后面的一个人，在门口站了片刻，说：“噢，你在撒谎，你在行骗！你张口劝教别人，却从不以身作则！”</p>
