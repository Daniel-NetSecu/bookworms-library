<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#184e40"><title>书虫 · 双语阅读书房</title><link rel="stylesheet" href="style.css?v=8"></head>
<body><header><a class="brand" href="#">书虫<span>OXFORD · 双语阅读书房</span></a><button id="theme" aria-label="切换夜间模式">☾ 夜间</button><button id="menu" aria-expanded="false" aria-controls="sidebar">☰ 目录</button><a id="resume" href="#" hidden>继续阅读 ↗</a></header>
<div class="layout"><aside id="sidebar"><div class="shelf-content"><div class="aside-title">我的书架 <span id="total">正在加载</span></div><label for="search">搜索书名或章节</label><input id="search" type="search" placeholder="试试：简爱、福尔摩斯…" autocomplete="off"><nav id="tree" aria-label="分级书籍目录"></nav></div></aside><div id="shelfResize" role="separator" tabindex="0" aria-label="左右拖动调整书架宽度" aria-controls="sidebar" aria-orientation="vertical" title="按住 ↔ 左右拖动调整宽度；双击恢复默认"><span aria-hidden="true">↔</span></div>
<main><section id="home"><div class="eyebrow">A LITTLE ENGLISH, EVERY DAY</div><h1>让每一本好故事，<br>成为英语的开始。</h1><p class="intro">分级读物、英文名著与世界双语经典。<br>英文原著、中译本与双语故事，都在这里。</p><div class="stats"><span><b id="statTotal">…</b> 个书目</span><span><b id="statWorld">…</b> 个新增双语书目</span><span>分级读物 · 双语经典</span></div><div id="filters" aria-label="按级别筛选"></div><div class="shelf-tools"><button id="favorites" aria-pressed="false">☆ 只看收藏</button><label>排序 <select id="sort"><option value="default">目录顺序</option><option value="recent">最近阅读</option><option value="title">书名排序</option></select></label></div><div class="shelf-heading"><h2 id="shelfTitle">全部读物</h2><span id="count" aria-live="polite"></span></div><div id="books"></div><p id="empty" hidden>没有找到相关读物，请换个关键词。</p></section>
<section id="reader" hidden><div id="readerTools" role="region" aria-label="阅读工具" hidden><div class="reader-top"><a href="#">← 返回书架</a><span id="breadcrumb"></span></div><h1 id="bookTitle"></h1><div class="reader-actions"><button id="focus">⛶ 专注阅读</button><button id="bookmark">☆ 收藏本书</button><a id="original" target="_blank" rel="noopener">打开原文件 ↗</a><span id="position"></span></div><div class="controls"><label>章节 <select id="chapters"></select></label><button id="prev">← 上一节</button><button id="next">下一节 →</button><button id="smaller" aria-label="缩小字号">A−</button><button id="larger" aria-label="放大字号">A＋</button></div><p id="readStatus" role="status"></p><p class="reader-note"><span id="readingHint">英文、参考译文与练习按原书目录保留。</span></p></div><iframe id="page" title="书籍正文" sandbox="allow-same-origin"></iframe><nav class="page-turner" aria-label="阅读翻页"><div id="pageNumbers" aria-label="当前章节页码"></div><button id="pageMore" aria-expanded="false" aria-controls="pageJump">更多</button><button id="screenPrev">上一页</button><button id="screenNext">下一页</button><span id="screenPosition" class="sr-only" aria-live="polite"></span><button id="toolsToggle" aria-label="展开阅读工具" aria-expanded="false" aria-controls="readerTools" title="章节与字号">⋯</button></nav><form id="pageJump" hidden><label for="jumpNumber">跳至本节页码 <span id="jumpTotal"></span></label><div><input id="jumpNumber" type="number" min="1" step="1" required inputmode="numeric"><button type="submit">前往</button><button id="jumpClose" type="button" aria-label="关闭页码跳转">×</button></div></form></section>
