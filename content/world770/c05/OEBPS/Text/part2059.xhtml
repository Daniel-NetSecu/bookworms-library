  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">113</h1>

  <p class="kindle-cn-poem-left1">别离后，我的眼睛迁住心里，<br/>
  它平时为我引路，指明方向，<br/>
  而今玩忽职守，成了半瞎子，<br/>
  似乎在视物，其实一片迷茫。<br/>
  它不给心传达所见的一切，<br/>
  不告诉它花鸟的形态本相，<br/>
  世间的万物，心都无缘见识，<br/>
  连眼睛自身，也留不住映象。<br/>
  只因它无论见到什么物体，<br/>
  粗犷的，温柔的，美丑俱不论，<br/>
  山和水，昼与夜，乌鸦或鸽子，<br/>
  全都变了形，幻化成你的影。<br/>
  　　眼睛里全是你，再不见其他，<br/>
  　　就这样，真爱为我造就虚假。</p>
