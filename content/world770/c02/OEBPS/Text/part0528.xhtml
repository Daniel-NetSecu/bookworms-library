  <h2 class="EB04MainHeadClosedTitle">布尔本山下（节选）</h2>

  <p class="center">Ⅵ</p>

  <p class="EB03BodyTextIndented">在光秃秃的布尔本山顶下，</p>

  <p class="EB03BodyTextIndented">叶芝躺在德拉姆克利夫墓地里。</p>

  <p class="EB03BodyTextIndented">很多年前，他的祖先</p>

  <p class="EB03BodyTextIndented">曾是附近一座教堂的牧师，</p>

  <p class="EB03BodyTextIndented">路旁还有古老的十字架。</p>

  <p class="EB03BodyTextIndented">不用大理石，不用惯用的措辞；</p>

  <p class="EB03BodyTextIndented">在附近采石场的石灰岩上</p>

  <p class="EB03BodyTextIndented">按他的要求刻下这些话：</p>

  <blockquote>
    <p class="EB03BodyTextIndented">投下冷眼，</p>

    <p class="EB03BodyTextIndented">看着生和死，</p>

    <p class="EB03BodyTextIndented">骑手，路过！</p>

    <p class="right">1938年9月4日</p>
  </blockquote>
</body></html>
