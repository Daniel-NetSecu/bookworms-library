  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">狼和鹤</h1>

  <p>有一只狼喉咙里面卡了一根骨头，便去找鹤，求她把长长的喙伸进他的喉咙里帮他把骨头拔出来。“我会报答你的。”他说。鹤照办了，轻而易举就把骨头拔了出来。狼很热情地道谢，然后转身就走，鹤叫道：“我的酬劳呢？”“呃，什么？”狼厉声说着，露出了牙齿，“你可以去吹嘘说你把头伸进了狼嘴里却毫发无伤没有被咬，你还想要什么？”</p>
