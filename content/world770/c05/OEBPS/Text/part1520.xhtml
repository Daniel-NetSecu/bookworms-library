  <h2 class="kindle-cn-heading2">77　我如何爱你，让我诉诉衷肠<span class="math-super"><a id="noteBack_1" href="part1520.xhtml#note_1">[1]</a></span></h2>

  <p class="kindle-cn-signature">勃朗宁夫人</p>

  <p class="kindle-cn-poem-left">我如何爱你，让我诉诉衷肠：<br/>
  我爱你至深至沉，已达我的灵魂<br/>
  能达的极致，一旦你不在身边，<br/>
  我便觉末日来临，主的恩慈已绝。<br/>
  我爱你，就像对待阳光和烛火，<br/>
  那是生活的必需，片刻不可分离。<br/>
  我要倾情爱你，就像人追求自身权利；<br/>
  我要虔诚爱你，一如教徒走出教堂。<br/>
  我爱你，充满激情和童年的向往，<br/>
  那激情曾伴随我度过往日的忧悒。<br/>
  我爱你，充满眷恋，生怕它转眼消失，<br/>
  连同我的天使——我爱你永生永世，<br/>
  凭我的呼吸、微笑和泪水——如果上帝愿意，<br/>
  等我死后，我还要加倍爱你。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1520.xhtml#noteBack_1">[1]</a>此诗为《葡萄牙人十四行诗》第43首。</p>
