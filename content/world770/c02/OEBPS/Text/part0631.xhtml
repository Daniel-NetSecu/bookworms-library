  <h2 class="EB04MainHeadClosedTitle">猫和公鸡</h2>

  <p class="EB03BodyTextIndented">一只猫捉住了一只公鸡，想着找个好借口美餐一顿。他控诉公鸡晚上打鸣，不让人们睡觉。但公鸡却为自己辩护说，他打鸣也是为人们好，让他们能够及时起床劳作。猫回答道：“尽管你在粉饰你的过错，但我也不能饿肚子呀。”于是，猫杀了公鸡，把他给吃了。</p>
