  <title>蝇</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">蝇</h2>

  <p class="EB03BodyTextIndented">小小的蝇儿</p>

  <p class="EB03BodyTextIndented">你夏日的游戏</p>

  <p class="EB03BodyTextIndented">已被我的手</p>

  <p class="EB03BodyTextIndented">不慎拂去了。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">难道我不是</p>

  <p class="EB03BodyTextIndented">你一样的蝇吗？</p>

  <p class="EB03BodyTextIndented">你不也是</p>

  <p class="EB03BodyTextIndented">我一样的人吗？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我喝酒跳舞，</p>

  <p class="EB03BodyTextIndented">唱唱歌曲，</p>

  <p class="EB03BodyTextIndented">直到盲目的手</p>

  <p class="EB03BodyTextIndented">擦伤我羽翼。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">若思想是生命、</p>

  <p class="EB03BodyTextIndented">力量和呼吸，</p>

  <p class="EB03BodyTextIndented">而思想贫乏</p>

  <p class="EB03BodyTextIndented">就等于死去，</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">那我就是只</p>

  <p class="EB03BodyTextIndented">幸福的蝇，</p>

  <p class="EB03BodyTextIndented">不管我活着</p>

  <p class="EB03BodyTextIndented">还是死了。</p>
</body></html>
