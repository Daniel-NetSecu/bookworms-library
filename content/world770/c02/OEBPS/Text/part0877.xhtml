  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">我感觉我的心神中有一道裂缝</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我感觉我的心神中有一道裂缝</p>

  <p class="EB03BodyTextIndented">好像我的大脑已经裂开；</p>

  <p class="EB03BodyTextIndented">我试图拼起它，严丝合缝，</p>

  <p class="EB03BodyTextIndented">却不能让它们对齐。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我努力让后面的念头接上</p>

  <p class="EB03BodyTextIndented">前面的念头，</p>

  <p class="EB03BodyTextIndented">可是次序散开无法控制</p>

  <p class="EB03BodyTextIndented">就像地板上的线球。</p>
