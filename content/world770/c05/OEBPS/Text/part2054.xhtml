  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">108</h1>

  <p class="kindle-cn-poem-left1">脑里还有什么可诉诸笔墨，<br/>
  却尚未向你传达我的情意？<br/>
  又有些什么新的可记可说，<br/>
  来表达我的爱和你的美质？<br/>
  没有了，孩子；但像对神祈祷，<br/>
  我必须每天重复一个声音：<br/>
  “你属我，我属你，”——重弹着老调，<br/>
  一如唱颂歌时那般的虔诚。<br/>
  这样，永恒的爱便藏于新匣，<br/>
  免受尘埃蒙蔽或岁月摧残，<br/>
  无须担心皱纹的自然生发；<br/>
  老年则成了奴仆，听候使唤。<br/>
  　　尽管年华与外貌难免一死，<br/>
  　　初恋之情却能不断地复制。</p>
