  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">32</h1>

  <p>尘世上那些爱我的人，用尽方法拉住我。</p>

  <p>你的爱就不是那样，</p>

  <p>你的爱比他们的伟大得多，你让我自由。</p>

  <p>他们从不敢离开我，恐怕我把他们忘掉。</p>

  <p>但是你，日子一天一天地过去，你还没有露面。</p>

  <p>若是我不在祈祷中呼唤你，若是我不把你放在心上，</p>

  <p>你爱我的爱情仍在等待着我的爱。</p>
