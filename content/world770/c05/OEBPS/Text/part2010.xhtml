  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">64</h1>

  <p class="kindle-cn-poem-left1">当我看见时间的毒手毁弃<br/>
  往古时代创建的丰功伟绩，<br/>
  高楼大厦被一一夷为平地，<br/>
  不朽的青铜在浩劫中销蚀；<br/>
  当我看见建在海滨的王国，<br/>
  被那饥饿的狂涛巨浪吞占，<br/>
  坚实的土地又将水域强夺，<br/>
  真可谓世事无常，沧海桑田！<br/>
  我看见了盛衰的不断反复，<br/>
  看见了壮丽如何走向腐朽，<br/>
  断垣残壁教我这样去思索：<br/>
  时间最终会将我的爱夺走。<br/>
  　　死一般的惶恐，但别无选择，<br/>
  　　我因得而悲，只怕一旦失却。</p>
