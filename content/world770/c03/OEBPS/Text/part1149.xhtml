  <p class="zhusi"><a id="bz1" href="part1146.xhtml#z1">[1]</a>马库斯·布鲁图斯（Marcus Brutus，前85—前42）：晚期罗马共和国元老院议员，刺客组织成员，策划了对尤利乌斯·恺撒的刺杀。——译者注。本书其余注释除特殊标明外，均为译者所加。</p>

  <p class="zhusi"><a id="bz2" href="part1146.xhtml#z2">[2]</a>腓立比（Philippi）：共和派与恺撒党的决战战役发生地点，位于马其顿。</p>

  <p class="zhusi"><a id="bz3" href="part1146.xhtml#z3">[3]</a>此处的“第一章”“第二章”分别指代《利维坦》一书的第一章和第二章，本书后续提到章节序号均对应《利维坦》一书相关章节，特在此说明。——编者注</p>

  <p class="zhusi"><a id="bz4" href="part1146.xhtml#z4">[4]</a>此处指的是《利维坦》第十四、十五章，本书未收录。</p>

  <p class="zhusi"><a id="bz5" href="part1147.xhtml#z5">[5]</a>此处指《利维坦》第十四章，本书未收录。</p>

  <p class="zhusi"><a id="bz6" href="part1147.xhtml#z6">[6]</a>此处指的是《利维坦》第十八章，本书未收录。</p>
