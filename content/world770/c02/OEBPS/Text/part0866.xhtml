  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">响亮地战斗很勇敢</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">响亮地战斗很勇敢，</p>

  <p class="EB03BodyTextIndented">可是勇士，据我所知，</p>

  <p class="EB03BodyTextIndented">胸中满怀</p>

  <p class="EB03BodyTextIndented">骑士的悲痛。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">他赢了，王国看不见，</p>

  <p class="EB03BodyTextIndented">他失败，无人察觉，</p>

  <p class="EB03BodyTextIndented">没有哪个国以对爱国者的爱</p>

  <p class="EB03BodyTextIndented">瞩目他垂死的双眼。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我们相信，为这样的人</p>

  <p class="EB03BodyTextIndented">天使们身披羽翅列队，</p>

  <p class="EB03BodyTextIndented">按等级依序前行，甚至脚</p>

  <p class="EB03BodyTextIndented">和制服都是白雪。</p>
