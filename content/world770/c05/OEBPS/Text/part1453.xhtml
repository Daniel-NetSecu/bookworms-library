  <h2 class="kindle-cn-heading2">10　十四行诗第75首</h2>

  <p class="kindle-cn-signature">斯宾塞</p>

  <p class="kindle-cn-poem-left">那天我在沙滩上写她的名字，<br/>
  海浪扑来，把它冲得一干二净：<br/>
  我随后便将它重新写了一次，<br/>
  潮水又来，我的劳作化为泡影。<br/>
  “徒劳啊，”她说，“你不必那么用情，<br/>
  凡事都有定数，永恒不可企望。<br/>
  我自己就不免腐朽，归于幽冥，<br/>
  我的名字也一样会被人遗忘。”<br/>
  “不，”我回答，“得让卑贱之物消亡，<br/>
  你一定得享受那不朽的美名，<br/>
  我写下的诗将使你百世流芳，<br/>
  你的名字一定得铭刻在天庭。<br/>
  尽管死神能将这个世界征服，<br/>
  我们的爱将活着，生命将延续。”</p>
