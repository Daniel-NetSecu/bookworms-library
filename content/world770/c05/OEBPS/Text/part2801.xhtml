  <title>驴和狗</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">驴和狗</h1>

  <p>一只驴和一只狗一起旅行，路上他们发现了一个系着口的包。驴把包捡了起来，解开发现里面装着的是一些写着字的东西。他便大声读出来给狗听。那上面都是关于青草、大麦、干草等驴感兴趣的内容。狗听来听去，十分不耐烦，最后终于爆发，叫道：“跳过一些页面吧，朋友，看看有没有关于肉和骨头的内容。”驴浏览完所有内容后，发现没有，便如实告诉了狗。狗嫌弃地说：“哦，那把它扔了吧，快点，留着这样的东西又有什么用呢？”</p>
