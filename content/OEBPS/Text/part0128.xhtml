<h1 class="title1">内容简介</h1>
<p class="normaltext02">马克·迈尔斯有很多卡车。这些卡车驶遍全欧洲，将各种货物运往不同的地方。</p>
<p class="normaltext02">今天早上，马克和儿子安迪遇上了麻烦。他们有一位司机加里·斯莱特胳膊受伤，没法开车了。偏偏还有重要的事情要办——一批桌子必须从英格兰运到法国，又有一批葡萄酒必须从法国运回英格兰。不过金·帕克能帮上忙——她会开卡车。</p>
<p class="normaltext02">加里说：“1点钟左右，你们得在<span class="xx">这儿</span>的这个卡车服务站停上15分钟。”他在地图上打了个叉——他表现得<span class="xx">十分</span>热心。</p>
<p class="normaltext02">这样，金在马克儿子安迪的陪同下，驾着卡车前往法国——但同时也驶入了险境……</p>
