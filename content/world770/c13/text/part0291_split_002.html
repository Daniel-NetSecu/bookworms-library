<h2 class="heading" id="calibre_pb_1">多莉</h2>

  <p class="p">多莉是一条十分乐观、友善却又健忘的蓝唐王鱼。一天，她突然记起了她的家人，而他们有可能正在寻找她。于是，在尼莫和马林的陪伴下，她踏上了寻找家人的旅程……</p>
