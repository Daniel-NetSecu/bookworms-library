  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">颜色，地位，教派</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">颜色，地位，教派——</p>

  <p class="EB03BodyTextIndented">这些是时间的事儿，</p>

  <p class="EB03BodyTextIndented">死亡的分类划分</p>

  <p class="EB03BodyTextIndented">不知道它们是什么。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">就像在睡眠中——这儿的一切都被遗忘，</p>

  <p class="EB03BodyTextIndented">教义丢在脑后，</p>

  <p class="EB03BodyTextIndented">死亡硕大的民主的手指</p>

  <p class="EB03BodyTextIndented">抹去了名号。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">假若是茧蛹——他才不操心——</p>

  <p class="EB03BodyTextIndented">假若他收起</p>

  <p class="EB03BodyTextIndented">金色或红棕的蝶蛹，</p>

  <p class="EB03BodyTextIndented">都同样是蝴蝶</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">从死亡一清二楚的</p>

  <p class="EB03BodyTextIndented">他的昏冥中，它们浮现；</p>

  <p class="EB03BodyTextIndented">我们最细微的直觉</p>

  <p class="EB03BodyTextIndented">注定不可信。</p>
</body></html>
