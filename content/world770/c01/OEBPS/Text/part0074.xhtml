<p class="title6">are　ink　moss　this　tub　upset</p>

<p class="normaltext">The pen and the ink are on the stand. Is this a good pen?</p>
<p class="normaltext">The moss is on the rock. This duck can swim.</p>
<p class="normaltext">Ben upset the tub.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext2">讲台上放着钢笔和墨水。这是一支好钢笔吗？</p>
<p class="normaltext2">苔藓长在岩石上。这只鸭子会游泳。</p>
<p class="normaltext2">本把浴盆弄翻了。</p>
