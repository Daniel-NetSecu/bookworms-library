  <title>陷落的王权</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">陷落的王权</h2>

  <p class="EB03BodyTextIndented">尽管她过去一露面，人群就会聚集，</p>

  <p class="EB03BodyTextIndented">连老人的双眼也变蒙眬，但只有这只手，</p>

  <p class="EB03BodyTextIndented">像某位最后的臣子，在吉卜赛营地</p>

  <p class="EB03BodyTextIndented">念叨着陷落的王权，记录消逝的一切。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">这容貌，这被笑声炼制甜美的心，</p>

  <p class="EB03BodyTextIndented">这些，这些都留存着，但我记录消逝的一切。</p>

  <p class="EB03BodyTextIndented">人们还会聚集，但不会知道他们走过的街上</p>

  <p class="EB03BodyTextIndented">曾有一样事物走过，像朵燃烧的云。</p>
</body></html>
