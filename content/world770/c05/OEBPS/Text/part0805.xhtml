  <p class="kindle-cn-poem-left">我就在你身旁！夜色如此温柔……</p>

  <p class="kindle-cn-poem-left">可惜周围不见光亮，</p>

  <p class="kindle-cn-poem-left">只有一线微光来自天上，</p>

  <p class="kindle-cn-poem-left">随着轻风穿过幽暗朦胧的树丛和布满青苔的曲径。</p>

  <p class="kindle-cn-signature">——《夜莺颂》<span class="math-super"><a id="ref2" href="part0805.xhtml#annot2">[1]</a></span></p>

  <p class="kindle-cn-para-no-indent"><span class="kindle-cn-hei">注解：</span></p>

  <p class="fnote"><a id="annot2" href="part0805.xhtml#ref2">[1]</a>　《夜莺颂》的作者是英国著名浪漫主义诗人济慈（John Keats，1795—1821）。</p>
