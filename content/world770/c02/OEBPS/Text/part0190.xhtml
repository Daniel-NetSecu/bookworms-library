  <title>伦敦</title>

  <h2 class="EB04MainHeadClosedTitle">伦敦</h2>

  <p class="EB03BodyTextIndented">我走过每一条特辖大街，</p>

  <p class="EB03BodyTextIndented">附近特辖的泰晤士河在流淌，</p>

  <p class="EB03BodyTextIndented">我遇到的每一张脸上的痕迹，</p>

  <p class="EB03BodyTextIndented">都表露出虚弱，表露出哀伤。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">在每个人的每一声呼叫之中，</p>

  <p class="EB03BodyTextIndented">在每个婴儿害怕的哭声里，</p>

  <p class="EB03BodyTextIndented">在一声一响，道道禁令中，</p>

  <p class="EB03BodyTextIndented">我听到精神之枷锁的碰击：</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">扫烟囱的孩子的哭叫多么</p>

  <p class="EB03BodyTextIndented">使每一个阴森的教堂惧怕，</p>

  <p class="EB03BodyTextIndented">还有那不幸的士兵的叹息</p>

  <p class="EB03BodyTextIndented">化成了鲜血从宫墙上淌下。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">更不堪的是在夜半大街上</p>

  <p class="EB03BodyTextIndented">年轻妓女瘟疫般的诅咒，</p>

  <p class="EB03BodyTextIndented">它吞噬了新生婴儿的哭声，</p>

  <p class="EB03BodyTextIndented">将结婚喜榻变成了灵柩。</p>
</body></html>
