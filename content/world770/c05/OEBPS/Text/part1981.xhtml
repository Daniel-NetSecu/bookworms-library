  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">35</h1>

  <p class="kindle-cn-poem-left1">不必再为你做过的事悲伤，<br/>
  玫瑰有刺，银泉也会被污浊，<br/>
  云霭与亏蚀会将日月遮挡，<br/>
  讨厌的蛀虫在娇蕾中寄寓；<br/>
  无人不犯错误，包括我自己，<br/>
  刚才我就借比喻为你护短，<br/>
  我知错犯错，文饰你的不是，<br/>
  对你的罪过，给予过分偏袒。<br/>
  我强词夺理为你开脱罪责，<br/>
  偏让原告充当你的辩护人，<br/>
  打了一场起诉自己的官司，<br/>
  我的爱与恨，在内战中共存，<br/>
  　　我成了从犯，那可爱的盗贼<br/>
  　　肆意抢劫我，我却将他追随。</p>
