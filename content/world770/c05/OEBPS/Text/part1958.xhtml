  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">12</h1>

  <p class="kindle-cn-poem-left1">当我计数着时钟报出时间，<br/>
  看见灿烂的白天沉入暗夜；<br/>
  当我看见紫罗兰不再娇艳，<br/>
  乌黑的卷发染上银色霜雪；<br/>
  曾为牛羊遮挡炎热的树林，<br/>
  如今不再有绿，已叶落枝枯，<br/>
  夏日的青翠已扎成一捆捆，<br/>
  丢在灵车上，像白须的伧夫；<br/>
  我由此思忖你具有的丽质，<br/>
  想必也会走进时间的荒丘，<br/>
  因为甜美之物必然要自弃，<br/>
  见别人成长，自己匆匆仙游。<br/>
  　　时间的镰刀无人可以阻挡，<br/>
  　　你死后，唯子孙能与之对抗。</p>
