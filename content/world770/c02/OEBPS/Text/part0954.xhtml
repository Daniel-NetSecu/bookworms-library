  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">Doom is the House Without the Door —</h2>

  <p class="EB03BodyTextIndented">Doom is the House Without the Door —</p>

  <p class="EB03BodyTextIndented">’Tis entered from the sun,</p>

  <p class="EB03BodyTextIndented">And then the ladder’s thrown away</p>

  <p class="EB03BodyTextIndented">Because escape is done.</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">’Tis varied by the dream</p>

  <p class="EB03BodyTextIndented">Of what they do outside,</p>

  <p class="EB03BodyTextIndented">When squirrels play and berries die —</p>

  <p class="EB03BodyTextIndented">And hundreds bow to God.</p>
