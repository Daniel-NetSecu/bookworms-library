  <h2 class="kindle-cn-heading2">119　我为美而死</h2>

  <p class="kindle-cn-signature">狄金森</p>

  <p class="kindle-cn-poem-left">我为美而死——<br/>
  刚被安顿进坟墓，<br/>
  这时，一位为真理而死的人<br/>
  在隔壁的房间躺下——</p>

  <p class="kindle-cn-poem-left">他轻声问我“因何而亡”？<br/>
  “为了美，”我回答——<br/>
  “但我——为真理——他们是一家——<br/>
  我们是兄弟，”他说——</p>

  <p class="kindle-cn-poem-left">就这样，我们亲人般相遇在夜晚——<br/>
  我们隔着房间谈天——<br/>
  直到青苔爬上嘴唇，<br/>
  掩埋了我们的名字——</p>
