<p class="title1">内容简介</p>
<p class="normaltext">海洛因能杀人。但是，在杀人之前，海洛因首先会改变一个人。它将你的朋友变成敌人；将你的爱人变成陌生人。海洛因杀死人的躯体——但它首先摧毁人的心灵。</p>
<p class="normaltext">安娜·哈兰认为她了解自己的女儿萨拉。她知道萨拉不会贩卖海洛因。但是，爱情也能改变一个人。萨拉正在恋爱——和一个陌生人恋爱。她的包里为什么会有海洛因？是给她的男朋友带的吗？</p>
<p class="normaltext">有人要死了——但会是谁？是吸食海洛因的人？还是贩卖海洛因的人？抑或是一个从未碰过海洛因的年轻女孩？海洛因就是白色死亡。如果它能够的话，它将把这些人都杀死。</p>
