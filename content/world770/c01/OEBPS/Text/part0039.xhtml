<p class="title1" id="CHP37">LESSON 34</p>
<p class="picture"><img src="../Images/image01582.jpeg.webp" alt="alt"/></p>
<p class="normaltext">This house is on fire.</p>
<p class="normaltext">Look! the roof is in a blaze.</p>
<p class="normaltext">Run, boys, and ring the bell. Call some men to put out the fire.</p>
<p class="normaltext">We may yet save the house, if we work hard.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">这栋房子着火了。</p>
<p class="normaltext">看！屋顶上一片火光。</p>
<p class="normaltext">快跑，男孩们，按下铃。叫大人们来救火。</p>
<p class="normaltext">如果我们奋力扑救，也许能保住这栋房子。</p>
