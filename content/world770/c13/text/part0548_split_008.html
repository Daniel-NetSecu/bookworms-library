<h2 class="heading" id="calibre_pb_7">厌厌</h2>

  <p class="p4">● 厌厌一直以其高雅的品味而自豪。十年来，她的专业意见使莱莉避免碰到西兰花和小男孩。毕竟，她的工作就是让莱利身心上不受荼毒。她的同事们认为她是非常优秀的人才，但厌厌拒绝为任何人来降低自己的标准。这个世界是如此令人恶心，这么说也是她的职责。</p>
