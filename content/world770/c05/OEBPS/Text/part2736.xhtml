  <title>狮子和公牛</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">狮子和公牛</h1>

  <p>一只狮子看到一群牲口在吃草，其中有一头肥肥的公牛，他便想方设法要把公牛抓来吃掉。所以，他对外称他要献祭一只羊，问公牛是否愿意与他共进晚餐。公牛接受了邀请，但是，到了狮子的洞穴，他看到了很多炖锅和烤肉叉，却没有见到羊，所以他便什么都没说，转身离开了。狮子在他身后喊他，用受伤的口气问他为什么，公牛回头说：“我理由充分。我看到你准备的东西便恍然大悟，你要杀的是一头牛，而不是一只羊。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：鸟儿若看到了罗网，罗网便没有了意义。</p>
</body></html>
