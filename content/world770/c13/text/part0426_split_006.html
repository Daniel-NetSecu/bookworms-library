<h2 class="heading" id="calibre_pb_5">白皇后</h2>

  <p class="p">白皇后（莫安娜）是地下王国的合法统治者。她开朗乐观，十分关心疯帽子的情况。她鼓励爱丽丝回到过去，还帮助她前往“时间”的城堡。爱丽丝在她的时光之旅中，发现了莫安娜的一些往事，也明白了红白皇后姐妹宿怨的来源。</p>
