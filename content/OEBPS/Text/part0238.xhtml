<p class="title1">内容简介</p>
<p class="normaltext2">萨莉·布朗是一名学生，她想当一名教师。她利用假期时间在快乐山岗打工。很多人来快乐山岗乘坐游乐设施、看有趣的卡通人物——“开开心心过一天”。</p>
<p class="normaltext2">今天是快乐山岗令人激动的一天——著名歌手扎普要来为一个新的游乐设施揭幕。萨莉非常激动，因为她非常喜欢扎普的歌，并收集了他所有的专辑。萨莉非常想见到扎普，和他说说话，可帕里先生说：“别说话，干活儿！”</p>
<p class="normaltext2">但是有人拿走了扎普的新专辑，里面有他尚未公开的新歌……“快乐山岗”不再是个快乐的地方了。</p>
