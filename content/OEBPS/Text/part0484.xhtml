<p class="title1">简　介</p>
<p class="normaltext">一百年前的世界与现在的截然不同。大多数人生活在没有电的阴冷、潮湿的环境中。他们从不上医院，往往死得很惨。</p>
<p class="normaltext">本书讲述了一个贫穷、丑陋的人的故事。没有人喜欢他，大家都嘲笑他。人们将他放在笼子里，当作动物一样展览。直到有一天一位医生发现了他，觉得他很有趣，想研究他。象人就这样出了名，每个人都想去拜访他，甚至女王都来看望他。</p>
<p class="normaltext">为什么刚开始人们逃避他，后来又接近他呢？看了这本书，你便会明白了。</p>
<p class="normaltext"><br/></p>
<p class="normaltext">蒂姆·维克瑞是一位经验丰富的教师兼作家，生活在英格兰北部的约克郡。</p>
