  <title>一只野兔的锁骨</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">一只野兔的锁骨</h2>

  <p class="EB03BodyTextIndented">我将扬帆在水面上，</p>

  <p class="EB03BodyTextIndented">那儿众多的国王和众多</p>

  <p class="EB03BodyTextIndented">国王的女儿已去，</p>

  <p class="EB03BodyTextIndented">来到秀丽的树林和草地，</p>

  <p class="EB03BodyTextIndented">吹着笛，跳起舞，</p>

  <p class="EB03BodyTextIndented">明白最好的事情，</p>

  <p class="EB03BodyTextIndented">便是在跳舞时更换爱人，</p>

  <p class="EB03BodyTextIndented">仅用一吻换一吻。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我将在水边找到</p>

  <p class="EB03BodyTextIndented">一只野兔的锁骨，</p>

  <p class="EB03BodyTextIndented">它被海水研磨，变得透薄，</p>

  <p class="EB03BodyTextIndented">然后用锥子刺穿，凝视着</p>

  <p class="EB03BodyTextIndented">人们在教堂结婚的、那古老而悲惨的世界，</p>

  <p class="EB03BodyTextIndented">在平静的水面上方，嘲笑</p>

  <p class="EB03BodyTextIndented">所有在教堂结婚的人，</p>

  <p class="EB03BodyTextIndented">透过野兔白而薄的骨头。</p>
