  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">17</h1>

  <p class="kindle-cn-poem-left1">如果我极力称颂你的风骨，<br/>
  将来谁会相信我写下的诗？<br/>
  天知道，诗是掩埋生命的墓，<br/>
  它显示不了你一半的蕙质。<br/>
  如果我赞美你双眸的浏亮，<br/>
  用清新的诗详述你的优雅，<br/>
  后人一定会说：“诗人在说谎，<br/>
  天上画笔从不为凡人描画。”<br/>
  我那些陈旧得发黄的纸张，<br/>
  像饶舌的老人被后人奚落，<br/>
  真心话被视作诗人的玄想，<br/>
  如一首古歌，音调无比做作。<br/>
  　　如果你有孩子活在那时期，<br/>
  　　你就双重而活，人间和诗里。</p>
