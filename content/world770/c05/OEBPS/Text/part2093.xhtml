  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">147</h1>

  <p class="kindle-cn-poem-left1">我的爱犹如热病，始终期许<br/>
  这病维之久远，不断地滋长，<br/>
  为使病态的食欲得到满足，<br/>
  那致病的病毒反成了食粮。<br/>
  理性，能治愈我的爱的良医，<br/>
  就因我没有遵服他的处方，<br/>
  拂袖而去，我如今已陷绝地，<br/>
  方知情欲即死亡，医治无望。<br/>
  理性不再管我，沉疴又难治，<br/>
  我在不安中变得疯疯癫癫，<br/>
  无论思想或言语，都像疯子，<br/>
  脑子分不清是非，一片混乱。<br/>
  　　我曾赌咒说你美，说你靓丽，<br/>
  　　其实你黑如黑夜，暗如地狱。</p>
