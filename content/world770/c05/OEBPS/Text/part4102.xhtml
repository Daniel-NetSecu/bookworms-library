  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">22</h1>

  <p>在七月霪雨的浓阴中，你用秘密的脚步行走，</p>

  <p>夜一般地轻悄，躲过一切守望的人。</p>

  <p>今天，清晨闭上眼，不理连连呼喊的狂啸的东风，</p>

  <p>一张厚厚的纱幕遮住永远清醒的碧空。</p>

  <p>林野住了歌声，家家闭户。</p>

  <p>在这冷寂的街上，你是孤独的行人。</p>

  <p>啊，我唯一的朋友，我最爱的人，</p>

  <p>我的家门是开着的——</p>

  <p>不要梦一般地走过吧。</p>
