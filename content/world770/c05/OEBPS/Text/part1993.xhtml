  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">47</h1>

  <p class="kindle-cn-poem-left1">我的眼睛和心灵达成协和，<br/>
  约定相互交替着惠利对方，<br/>
  一旦眼睛因不见你而挨饿，<br/>
  或爱的心灵因窒息而悲伤，<br/>
  眼睛便呈上我爱人的倩影，<br/>
  邀请心灵来赴画中的宴席；<br/>
  有时眼睛也做客去见心灵，<br/>
  一道分享那份爱心的甜思。<br/>
  就这样，凭你的像和我的爱，<br/>
  远方的你始终与我在一起，<br/>
  你走得再远，思想都在追怀，<br/>
  我永随思想，思想永远随你。<br/>
  　　如思想入睡，我眼中的肖像<br/>
  　　会唤醒心灵，让心和眼同欢。</p>
