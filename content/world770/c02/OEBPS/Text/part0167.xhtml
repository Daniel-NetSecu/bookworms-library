  <title>春</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">春</h2>

  <p class="EB03BodyTextIndented">吹起长笛！</p>

  <p class="EB03BodyTextIndented">正当沉寂。</p>

  <p class="EB03BodyTextIndented">鸟儿嘻闹</p>

  <p class="EB03BodyTextIndented">白天夜里。</p>

  <p class="EB03BodyTextIndented">夜莺夜莺</p>

  <p class="EB03BodyTextIndented">溪谷中鸣，</p>

  <p class="EB03BodyTextIndented">云雀凌空，</p>

  <p class="EB03BodyTextIndented">欢乐地，</p>

  <p class="EB03BodyTextIndented">欢乐地，欢乐地，迎接新年。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">小男孩儿</p>

  <p class="EB03BodyTextIndented">欢天喜地，</p>

  <p class="EB03BodyTextIndented">小女孩儿</p>

  <p class="EB03BodyTextIndented">可爱伶俐，</p>

  <p class="EB03BodyTextIndented">雄鸡欢叫，</p>

  <p class="EB03BodyTextIndented">你也欢叫。</p>

  <p class="EB03BodyTextIndented">欢乐之声，</p>

  <p class="EB03BodyTextIndented">童之喧声，</p>

  <p class="EB03BodyTextIndented">欢乐地，欢乐地，迎接新年。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">小羔羊儿，</p>

  <p class="EB03BodyTextIndented">我在这儿，</p>

  <p class="EB03BodyTextIndented">过来舔舔</p>

  <p class="EB03BodyTextIndented">我雪白的脖儿，</p>

  <p class="EB03BodyTextIndented">让我拉拉</p>

  <p class="EB03BodyTextIndented">你柔软的毛儿，</p>

  <p class="EB03BodyTextIndented">让我亲亲</p>

  <p class="EB03BodyTextIndented">你柔软的脸儿，</p>

  <p class="EB03BodyTextIndented">欢乐地，欢乐地，我们迎接新年。</p>
