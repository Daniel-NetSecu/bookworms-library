  <title>THE SICK ROSE</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">THE SICK ROSE</h2>

  <p class="EB03BodyTextIndented">O Rose, thou art sick,</p>

  <p class="EB03BodyTextIndented">The invisible worm,</p>

  <p class="EB03BodyTextIndented">That flies in the night</p>

  <p class="EB03BodyTextIndented">In the howling storm:</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">Has found out thy bed</p>

  <p class="EB03BodyTextIndented">Of crimson joy:</p>

  <p class="EB03BodyTextIndented">And his dark secret love</p>

  <p class="EB03BodyTextIndented">Does thy life destroy.</p>
</body></html>
