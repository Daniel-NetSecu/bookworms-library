  <title>女巫</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">女巫</h1>

  <p>有一个女巫声称自己能够依靠一种独有的秘密魔法阻止神的愤怒，她因此而生意兴隆，赚了很多钱。但是有些人指控她使用黑魔法，把她送到法官面前，说她和魔鬼交易，要求法官将她处死。她被认定有罪，被判死刑，在她离开被告席的时候，一个法官说：“你说你可以阻止神的愤怒，为什么你却没有办法解除人类的恨意呢？”</p>
