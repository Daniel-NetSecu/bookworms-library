  <title>赫拉克勒斯和密涅瓦</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">赫拉克勒斯和密涅瓦</h1>

  <p>有一回，赫拉克勒斯走在一条窄路上，看到了眼前有一个苹果，他走过的时候脚跟踩在了苹果上。令他惊奇的是，苹果没有被踩碎，反而变得大了一倍。于是他又踩了一脚，还用手中的大棍猛击，苹果越来越大，大到把整条路都给堵住了。他吃惊地丢掉了手中的大棍子，看着这个苹果。这时密涅瓦出现了，对赫拉克勒斯说：“快走吧，朋友，你看到的可是个祸种，如果你不和它纠缠，那它还是当初那样小小的，但你暴力以对，它就变成了现在的样子。”</p>
