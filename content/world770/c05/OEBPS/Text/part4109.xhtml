  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">29</h1>

  <p>被我用我的名字囚禁起来的那个人，在监牢中哭泣。</p>

  <p>我每天不停地筑着围墙；</p>

  <p>当这道围墙高起接天的时候，</p>

  <p>我的真我便被高墙的黑影遮断不见了。</p>

  <p>我以这道高墙自豪，</p>

  <p>我用沙土把它抹严，唯恐在这名字上还留着一丝罅隙；</p>

  <p>我煞费了苦心，我也看不见了真我。</p>
