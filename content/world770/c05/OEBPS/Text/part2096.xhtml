  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">150</h1>

  <p class="kindle-cn-poem-left1">啊，你从何处获得巨大力量，<br/>
  凭借缺陷也能主宰我的心，<br/>
  并让我在真实事物前撒谎，<br/>
  硬说白天阳光带不来光明？<br/>
  你凭什么神力将丑化为美？<br/>
  你的所作所为如此的不堪，<br/>
  究竟哪来的这般异能奇慧，<br/>
  居然让我将极恶当作至善？<br/>
  据所见所闻，我本该更憎恨，<br/>
  是谁教你让我偏偏更爱你？<br/>
  虽然我爱着别人憎恨的人，<br/>
  你不该联合他人瞧我不起。<br/>
  　　既然你的缺陷提升我的爱，<br/>
  　　我就更应该获得你的青睐。</p>
