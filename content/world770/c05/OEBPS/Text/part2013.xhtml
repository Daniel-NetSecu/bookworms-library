  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">67</h1>

  <p class="kindle-cn-poem-left1">啊，他怎么生活在这污浊里，<br/>
  为那些邪恶之徒添彩增光？<br/>
  罪恶利用他，在占他的便宜，<br/>
  歹人结交他，为把丑恶伪装。<br/>
  画师为什么模仿他的容颜，<br/>
  从鲜活的色彩中偷取呆滞？<br/>
  他才是真玫瑰，可怜的俊男<br/>
  为什么绕道追寻它的影子？<br/>
  造化已破产，正为贫血所困，<br/>
  那他为什么仍活在人世间？<br/>
  只因除了他，她已不名一文，<br/>
  昔日的财主，再无别的财产。<br/>
  　　啊，她收藏着他，为的是见证：<br/>
  　　这污浊的世界，有过好风景。</p>
