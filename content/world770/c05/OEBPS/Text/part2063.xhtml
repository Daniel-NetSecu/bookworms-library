  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">117</h1>

  <p class="kindle-cn-poem-left1">责备我吧，我不该怠惰无为，<br/>
  不知回报，辜负了你的深恩，<br/>
  友情的责任每日都在紧催，<br/>
  我却忘了去拜访你的真情。<br/>
  我只跟那些无聊之徒交往，<br/>
  将你的深情厚爱抛之云霄；<br/>
  我扬起风帆，不问风的方向，<br/>
  任凭它将我吹到天涯海角。<br/>
  请你记下我的错误与任性，<br/>
  有此凭证，你尽可任意猜疑，<br/>
  并把我押进你颦眉的射程，<br/>
  你的恨将醒，但别把我射死。<br/>
  　　我这样起诉自己，意在证明：<br/>
  　　你的爱没有变，坚贞而坚定。</p>
