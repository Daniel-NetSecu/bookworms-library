  <body class="calibre">
<div id="chapter1" style="height:0pt"></div><div class="calibre4">
<h2 class="calibre8" id="calibre_pb_0">The Celtic Twilight  </h2>

    <h2 class="calibre9">凯尔特的薄暮  </h2>
  </div>

  <div class="calibre4">
    <div class="en">
      Time drops in decay 
    </div>

    <div class="en">
      时光滴滴消逝，
    </div>
  </div>

  <div class="calibre4">
    <div class="en">
      Like a candle burnt out, 
    </div>

    <div class="en">
      似蜡烛燃尽，
    </div>
  </div>

  <div class="calibre4">
    <div class="en">
      And the mountains and woods 
    </div>

    <div class="en">
      群山与林木，
    </div>
  </div>

  <div class="calibre4">
    <div class="en">
      Have their day, have their day; 
    </div>

    <div class="en">
      终有时，终有时；
    </div>
  </div>

  <div class="calibre4">
    <div class="en">
      But, kindly old rout 
    </div>

    <div class="en">
      而拥有浴火而生之情怀的
    </div>
  </div>

  <div class="calibre4">
    <div class="en">
      Of the fire-born moods, 
    </div>

    <div class="en">
      善良的古老族群，
    </div>
  </div>

  <div class="calibre4">
    <div class="en">
      You pass not away.
    </div>

    <div class="en">
      你们将万古常存。
    </div>
  </div>

  <p class="calibre10" id="calibre_pb_1"></p>
