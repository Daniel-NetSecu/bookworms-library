<p class="title1" id="CHP63">LESSON 60</p>
<p class="picture"><img src="../Images/image01607.jpeg.webp" alt="alt"/></p>
<p class="normaltext">Let me get the black hat. Now Ned has it on his head, and he is a big man.</p>
<p class="normaltext">Come, Nat, see the big man with his black hat.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">我要戴那顶黑色帽子。</p>
<p class="normaltext">内德正戴在自己的头上，成了个身材高大的人。</p>
<p class="normaltext">过来，奈特，看一下这个戴着黑色帽子的高大男人。</p>
