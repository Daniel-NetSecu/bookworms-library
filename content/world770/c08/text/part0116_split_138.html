<h1 class="calibre22" id="calibre_pb_240">第三十八节</h1>

      <p class="x5">所有商品都是其他商业标的物的代表性象征物，但是由于受到每种商品是否便于运输和保存而不发生变化等因素的影响，各种商品被使用的频率不等。</p>

      <p class="x6">商品质量的差异以及由此造成的价格差异，使得有些商品比另外一些商品更适合作为标准尺度，也不同程度地妨碍它们成为各种其他等值商品的代表性象征物。但是，至于这最后一种属性，不同种类的商品之间仍然存在本质的差异。显然（例如），一个人拥有一匹亚麻布比拥有同等价值的一桶葡萄酒更能确保他换得他所需要的一定数量的谷物：因为葡萄酒会受到各种意外因素的影响，甚至可能使人瞬间失去其全部财产。</p><a id="Section_cn_39"></a>
