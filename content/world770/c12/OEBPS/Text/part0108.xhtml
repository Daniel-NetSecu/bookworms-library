  <h1 class="onetitle" id="CHP7">杰夫·金尼 2018中国行</h1>

  <p class="text">Jeff Kinney’s Visit to China</p>

  <p class="text">2018年4月，杰夫·金尼开启新一轮的全球巡回演说，第一站就来到中国，接下来又马不停蹄地赶往新西兰、澳大利亚。距离杰夫上次来华已经过去三年，大家有没有想念他呢？</p>
