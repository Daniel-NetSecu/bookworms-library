<p class="title1" id="CHP35">LESSON 32</p>
<p class="picture"><img src="../Images/image01580.jpeg.webp" alt="alt"/></p>
<p class="normaltext">Two girls have gone out for a walk.</p>
<p class="normaltext">It is May, and the air is cool.</p>
<p class="normaltext">They hear the birds sing in the trees, and they hear the noise of the frogs in the pond.</p>
<p class="normaltext">They see men at work and boys at play.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">两个女孩出去散步。</p>
<p class="normaltext">五月天气，空气凉爽。</p>
<p class="normaltext">她们听见鸟儿在树上唱歌，听到青蛙在池塘里的叫声。</p>
<p class="normaltext">她们看见男人们在干活，男孩子们在玩耍。</p>
