<h1 class="title1">内容简介</h1>
<p class="normaltext02">肯尼正在乘公共汽车横穿美国前往旧金山。这是一段漫长的旅程，所以有时他会下车，在汽车旅馆住上一夜。</p>
<p class="normaltext02">一天晚上，他住在加利福尼亚一个小镇的汽车旅馆里——离洛杉矶不远。他从房间下楼去吃东西时，看见了一个女孩：骑着摩托车，有一头金色长发。他觉得自己认识她，她是某个名人吗？</p>
<p class="normaltext02">然后，第二天早上，他从新闻里看到在洛杉矶发生的一起超市劫案。警方正在寻找一个人：这个人骑摩托车，有一头金色长发……</p>
