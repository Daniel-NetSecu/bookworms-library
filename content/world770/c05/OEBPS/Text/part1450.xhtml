  <h2 class="kindle-cn-heading2">7　恳求你</h2>

  <p class="kindle-cn-signature">怀亚特</p>

  <p class="kindle-cn-poem-left">你就这样弃我而去？<br/>
  可耻啊可耻！说声不吧；<br/>
  以免世人把你非议，<br/>
  都说我的痛苦因你而起。<br/>
  你就这样弃我而去？<br/>
  说声不吧，说声不！</p>

  <p class="kindle-cn-poem-left">你就这样弃我而去？<br/>
  不管是祸是福，<br/>
  我对你始终一往情深；<br/>
  你的心就这么硬？<br/>
  就这样永远把我抛弃？<br/>
  说声不吧，说声不！</p>

  <p class="kindle-cn-poem-left">你就这样弃我而去？<br/>
  我已经献出我的心，<br/>
  不管天崩或地裂，<br/>
  从此与你再不分离。<br/>
  你就这样弃我而去？<br/>
  说声不吧，说声不！</p>

  <p class="kindle-cn-poem-left">你就这样弃我而去？<br/>
  从此对爱你的人<br/>
  不表一丁点儿怜悯？<br/>
  哎呀，你真残忍！<br/>
  你就这样弃我而去？<br/>
  说声不吧，说声不！</p>
