  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">64</h1>

  <p class="kindle-cn-poem-left">我在大路灼热的尘土上消磨了一天。<br/>
  现在，在晚凉中我敲着一座小庙的门。这庙已经荒废倒塌了。<br/>
  一棵愁苦的菩提树，从破墙的裂缝里伸展出饥饿的爪根。<br/>
  从前曾有过路人到这里来洗疲乏的脚。<br/>
  他们在新月的微光中在院里摊开席子，坐着谈论异地的风光。<br/>
  早起他们精神恢复了，鸟声使他们欢悦，<br/>
  友爱的花儿在道边向他们点首。<br/>
  但是当我来的时候没有灯在等待我。<br/>
  只有残留的灯烟熏污的黑迹，像盲人的眼睛，从墙上瞪视着我。<br/>
  萤虫在涸池边的草里闪烁，竹影在荒芜的小径上摇曳。<br/>
  我在一天之末做了没有主人的客人。<br/>
  在我面前的是漫漫的长夜，我疲倦了。</p>
