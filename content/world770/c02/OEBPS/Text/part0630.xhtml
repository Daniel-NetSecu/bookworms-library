  <h2 class="EB04MainHeadClosedTitle">鹰和寒鸦</h2>

  <p class="EB03BodyTextIndented">一只鹰从高耸的岩石上飞下来，猛扑向一只绵羊，用爪子牢牢地抓住了它。一只寒鸦看到了整个过程，十分嫉妒，决定效仿鹰的力道和飞行方式。</p>

  <p class="EB03BodyTextIndented">寒鸦高高地飞到空中，飞快地俯冲下来，翅膀扇动得呼呼作响，落在一只大公羊的背上。他想要抓起公羊，可是爪子却缠在了羊毛里。尽管他不停地拍打翅膀，也无济于事。</p>

  <p class="EB03BodyTextIndented">牧羊人目睹了这一切，他跑过来，捉住了寒鸦，剪掉了他的翅膀，晚上带回家给孩子们。孩子们问：“爸爸，这是什么鸟呀？”他回答道：“据我所知，他是只寒鸦，但他想要人们以为他是只鹰呀。”</p>
