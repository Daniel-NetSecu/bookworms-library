  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">边缘</h1>

  <p class="kindle-cn-poem-left">这个女子完美无缺。<br/>
  她已死的<br/>
  <br/>
  身体带着圆满的微笑，<br/>
  希腊式自然规律的错觉<br/>
  <br/>
  在托加袍的皱褶中流动，<br/>
  她赤裸的<br/>
  <br/>
  双脚似乎在说：<br/>
  我们已经走很远，一切结束。<br/>
  <br/>
  每个死去的孩子卷曲着，一条白蛇，<br/>
  孩子身边的<br/>
  <br/>
  小奶罐，现已空空。<br/>
  她已经折叠<br/>
  <br/>
  他们送回她的身体如玫瑰<br/>
  花瓣合上，花园<br/>
  <br/>
  凋零，夜间花朵的<br/>
  气味从甜蜜的花颈深处散发。<br/>
  <br/>
  月亮透过朦胧凝视着，<br/>
  无事可使她感到悲哀。<br/>
  <br/>
  她对此类事早已习以为常。<br/>
  她的黑影拖拽，噼啪作响。</p>
