  <h2 class="kindle-cn-heading2">56　约翰·安德生，我的欢乐</h2>

  <p class="kindle-cn-signature">彭斯</p>

  <p class="kindle-cn-poem-left">约翰·安德生，我的欢乐，约翰，<br/>
  当年我们初次相识，<br/>
  你的头发黑得像乌鸦，<br/>
  眉毛不溜也不斜。<br/>
  如今你的眉毛掉光了，约翰，<br/>
  头发也白得像雪花，<br/>
  只有神恩仍留在你的前额，<br/>
  约翰·安德生，我的欢乐！</p>

  <p class="kindle-cn-poem-left">约翰·安德生，我的欢乐，约翰，<br/>
  我们曾在一起爬山，<br/>
  我们相依为命，约翰，<br/>
  度过了无数岁月。<br/>
  如今我们已步履蹒跚，<br/>
  但我们要手拉着手走路，<br/>
  一起长眠在山脚下，<br/>
  约翰·安德生，我的欢乐！</p>
