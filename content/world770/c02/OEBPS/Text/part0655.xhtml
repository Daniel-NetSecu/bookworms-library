  <h2 class="EB04MainHeadClosedTitle">恶狗</h2>

  <p class="EB03BodyTextIndented">有一条狗总是悄无声息地走到每个遇到的人脚边，趁其不备张嘴就咬。于是，他的主人便在他的脖子上系了一个铃铛，以便在他出现的时候，给大家提个醒。狗将这个铃铛视为自己与众不同的标记，对此感到特别骄傲，十分得意地在市场里招摇。</p>

  <p class="EB03BodyTextIndented">一天，一条老猎狗对他说：“你为什么要如此炫耀自己？相信我，你戴着的那个铃铛不是勋章，恰恰相反，它是耻辱的象征呀。它提醒所有人你是一条恶狗，要避开你。”</p>

  <p class="EB01BodyTextLineSpace">恶名常被误认为是美誉。</p>
