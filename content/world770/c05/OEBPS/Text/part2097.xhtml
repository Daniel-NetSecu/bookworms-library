  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">151</h1>

  <p class="kindle-cn-poem-left1">爱神年纪太轻，尚不解风情，<br/>
  但谁人不知风情由爱而生？<br/>
  温柔的骗子，别再与我作梗，<br/>
  我之罪也是你犯罪的佐证。<br/>
  你背叛我，我则背叛了灵魂，<br/>
  把它出卖给了粗鄙的肉体；<br/>
  灵魂允许肉体上情场争胜，<br/>
  肉体一听说你便急于成事，<br/>
  即刻挺身而起，认你是战利。<br/>
  他因这份战利而得意扬扬，<br/>
  心甘情愿做你卑贱的奴隶，<br/>
  站着尽职守，倒下在你身旁。<br/>
  　　这就是风情，我管它叫作爱，<br/>
  　　为这爱我挺起，然后倒下来。</p>
