  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">65</h1>

  <p class="kindle-cn-poem-left1">既然金石、土地、无际的海洋<br/>
  无一不臣服于恐怖的死神，<br/>
  美的活力也不比鲜花更强，<br/>
  那么，美又如何与强暴抗争？<br/>
  哟，既然岩石并非坚不可摧，<br/>
  时间能将牢固的钢门腐蚀，<br/>
  那夏日的芬芳又如何应对<br/>
  岁月来势汹汹的追杀围击？<br/>
  啊，可怕的沉思！时间的珍异<br/>
  怎能躲避开那时间的宝箱？<br/>
  哪只巨手能拖住它的飞驰？<br/>
  谁来制止它对美艳的摧残？<br/>
  　　谁都不能！唯奇迹有此神力<br/>
  　　能叫我的爱闪耀在笔墨里。</p>
