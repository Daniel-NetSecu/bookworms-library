<h2 class="heading" id="calibre_pb_9">“时间”</h2>

  <p class="p">“时间”住在永恒城堡中。他拥有的“时空传送仪”，是主宰所有时间的大钟里一个非常重要的部分。“时空传送仪”被偷以后，“时间”千方百计想要阻止爱丽丝，因为他十分了解试图改变过去的可怕后果。</p>
