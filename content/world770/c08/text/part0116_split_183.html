<h1 class="calibre22" id="calibre_pb_285">第八十三节</h1>

      <p class="x5">扼要重述运用资本的五种不同方法。</p>

      <p class="x6">我已经列举了运用资本或合理配置资本以获得利润的五种不同方法。</p>

      <p class="x6">第一，用来购买地产，从而带来一定的收入。</p>

      <p class="x6">第二，将货币投入到农业企业；作为回报，租种土地的产出除了可以抵消耕种的花费，还可以获得垫付的利息，以及对于把财产和精力都投入到耕种当中的人所付出的劳动的补偿。</p>

      <p class="x6">第三，把资本投入到工业或制造业企业。</p>

      <p class="x6">第四，把资本投入到商业。</p>

      <p class="x6">第五，把资本按照收取年息的方式借给需要的人。</p><a id="Section_cn_84"></a>
