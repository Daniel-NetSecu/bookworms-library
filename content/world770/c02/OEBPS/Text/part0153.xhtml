  <title>序诗</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">序诗</h2>

  <p class="EB03BodyTextIndented">吹着笛儿，我走下野谷，</p>

  <p class="EB03BodyTextIndented">欢乐的笛声随风轻飘。</p>

  <p class="EB03BodyTextIndented">我看见云彩上有个小孩<a id="w1"></a><a href="part0153.xhtml#m1"><sup>[1]</sup></a>，</p>

  <p class="EB03BodyTextIndented">孩子他笑着，向我说道：</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“吹个歌唱小羊羔的歌！”</p>

  <p class="EB03BodyTextIndented">我兴高采烈地吹了一曲。</p>

  <p class="EB03BodyTextIndented">“再吹，再吹一次那歌儿！”</p>

  <p class="EB03BodyTextIndented">我又吹时他淌下了泪滴。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“放下笛儿，那快乐的笛儿，</p>

  <p class="EB03BodyTextIndented">唱吧，唱唱那快乐的小曲。”</p>

  <p class="EB03BodyTextIndented">于是我就唱，唱那首歌，</p>

  <p class="EB03BodyTextIndented">他听着，淌下了喜悦的泪滴。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“吹笛的人，坐下来写吧，</p>

  <p class="EB03BodyTextIndented">写成一本书，大家都能看。”</p>

  <p class="EB03BodyTextIndented">他刚说完，便隐去了形象，</p>

  <p class="EB03BodyTextIndented">我折下一根空心的芦管。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">做出来一支土造水笔，</p>

  <p class="EB03BodyTextIndented">在笔中注满清清河水，</p>

  <p class="EB03BodyTextIndented">我用它写下快乐的歌谣，</p>

  <p class="EB03BodyTextIndented">孩子们都能高兴地听到。</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="m1"></a><a href="part0153.xhtml#w1">[1]</a> 指耶稣。</p>
</body></html>
