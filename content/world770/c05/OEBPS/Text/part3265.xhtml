  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1" title="词语">词语<span class="math-super"><a id="noteBack_1" href="part3265.xhtml#note_1">[1]</a></span></h1>

  <p class="kindle-cn-poem-left">斧子<br/>
  砍伐后，树木呻吟，<br/>
  并回响着！<br/>
  回声从中心<br/>
  响彻似群马奔腾。<br/>
  <br/>
  树液<br/>
  似泪水汇聚，就像<br/>
  水力争<br/>
  重建它的镜子<br/>
  在岩石上方<br/>
  <br/>
  然后滴落变成，<br/>
  白色的颅骨，<br/>
  被杂草的浓绿所吞噬。<br/>
  多年之后，我<br/>
  在路上遇见它们——<br/>
  <br/>
  词语干枯，马背无人，<br/>
  只有永不怠倦的马蹄声。<br/>
  而<br/>
  不变的星辰，从水池底映出<br/>
  主宰生命。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part3265.xhtml#noteBack_1">[1]</a>此诗的汉译最初以《话语》为题发表在《译林》2015年第三期。</p>
