  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">40</h1>

  <p>在我干枯的心上，</p>

  <p>好多天没有受到雨水的滋润了，我的神。</p>

  <p>天边是可怕的赤裸——</p>

  <p>没有一片轻云的遮盖，没有一丝远雨的凉意。</p>

  <p>如果你愿意，请降下你的死黑的盛怒的风雨，以闪电震慑诸天吧。</p>

  <p>但是请你召回，我的主。</p>

  <p>召回这弥漫沉默的炎热吧，它沉重、尖锐而又残忍，</p>

  <p>用可怕的绝望焚灼人心。</p>

  <p>让慈云低垂下降，像父亲发怒的时候母亲含泪的目光。</p>
