<table class="table1">
  <tr>
    <td>Will the dog hunt a fox?</td>
    <td>狗会猎取狐狸吗？</td>
  </tr>
  <tr>
    <td>Ben lost his hat.</td>
    <td>本丢了他的帽子。</td>
  </tr>
  <tr>
    <td>Shall I shut the box?</td>
    <td>我应当盖上盒子吗？</td>
  </tr>
  <tr>
    <td>I met him on the step.</td>
    <td>我在楼梯上遇见他。</td>
  </tr>
  <tr>
    <td>Did you jump into the mud?</td>
    <td>你跳进泥里去了吗？</td>
  </tr>
  <tr>
    <td>I have a nut.</td>
    <td>我有一个坚果。</td>
  </tr>
  <tr>
    <td>I met the men.</td>
    <td>我遇见了那些男人。</td>
  </tr>
