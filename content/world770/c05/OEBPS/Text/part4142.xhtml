  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">62</h1>

  <p>当我送你彩色玩具的时候，</p>

  <p>我的孩子，我了解为什么云中水上会幻弄出这许多颜色，</p>

  <p>为什么花朵都用颜色染起——</p>

  <p>当我送你彩色玩具的时候，我的孩子。</p>

  <p>当我唱歌使你跳舞的时候，</p>

  <p>我彻底地知道为什么树叶上响出音乐，</p>

  <p>为什么波浪把它们的合唱送进静听的大地的心头——</p>

  <p>当我唱歌使你跳舞的时候。</p>

  <p>当我把糖果递到你贪婪的手中的时候，</p>

  <p>我懂得为什么花心里有蜜，为什么水果里隐藏着甜汁——</p>

  <p>当我把糖果递到你贪婪的手中的时候。</p>
