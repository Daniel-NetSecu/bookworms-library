  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">121</h1>

  <p class="kindle-cn-poem-left1">良善者与其被人诬为不善，<br/>
  不如真的去作恶，做个恶人，<br/>
  我们正当的欢乐源于情感，<br/>
  他人的偏见不该从中作梗。<br/>
  我追求快乐，凭一腔的热血，<br/>
  哪用虚伪的淫眼给我赞许？<br/>
  我视为善者他们偏当作恶，<br/>
  他们凭什么对我评头品足？<br/>
  我永远是我，他们恶意中伤，<br/>
  罗列的是他们自己的罪过，<br/>
  我是正直的，他们才是刁蛮，<br/>
  龌龊的言语不配把我评说，<br/>
  　　除非他们敢说它天经地义：<br/>
  　　人都是恶的，都在恶中生息。</p>
