<p id="filepos994778" class="calibre_4"><span class="calibre1"><span class="bold">杰克和安妮的洞穴壁画馆</span></span></p><p class="calibre_48">洞穴壁画的主题多为猎物，有野牛、马、水牛等。除此之外，洞穴壁画还描绘了猎人打猎时的英姿，甚至受伤时的情景。有些壁画的尺寸很大，在法国韦泽尔峡谷附近的拉斯科洞穴中有一幅奶牛图，长达1.5米，被称作“跳跃的奶牛”。</p><p class="calibre_"><img src="images/00187.jpg.webp" class="calibre_305"/>
