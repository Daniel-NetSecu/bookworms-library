      <title>出租车惊魂</title>

<h1 class="title1" id="CHP3">内容简介</h1>
<p class="normaltext02">“祝你好运，杰克。别忘了我们！”杰克的同事们与他告别。他们为杰克举办了一个派对，因为他找了一份新工作，要离职了。杰克收到了一张卡片和一份礼物——一部手机。杰克的同事们有些伤感，不过派对很棒，他们都跳了几个小时的舞。</p>
<p class="normaltext"><br/></p>
<p class="normaltext02">然后，杰克离开了派对。他累了，想要回家。“好冷。”他想。他想找辆出租车，可是没能找到。他步行了很长时间，整个人疲惫不堪。后来，他终于看到一辆出租车。好极了！他终于可以回家睡觉了！</p>
<p class="normaltext"><br/></p>
<p class="normaltext02">然而，漫漫长夜才刚刚拉开帷幕——杰克将在出租车中惊恐度过这漫漫长夜！</p>
