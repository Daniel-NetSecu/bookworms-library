  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">他笨拙地触弄你的精神</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">他笨拙地触弄你的精神，</p>

  <p class="EB03BodyTextIndented">就像演奏者触弄琴键，</p>

  <p class="EB03BodyTextIndented">在他们奏出完整的音乐前；</p>

  <p class="EB03BodyTextIndented">他让你一点一点地惊叹，</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">让你脆弱不堪的心性准备</p>

  <p class="EB03BodyTextIndented">迎接那飘然出尘的打击，</p>

  <p class="EB03BodyTextIndented">以那轻柔的音槌，在很远处听到，</p>

  <p class="EB03BodyTextIndented">然后近了，变得那么缓慢。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">你的呼吸有时间得以舒展，</p>

  <p class="EB03BodyTextIndented">你的大脑浮想联翩，——</p>

  <p class="EB03BodyTextIndented">发出唯一庄严的雷击</p>

  <p class="EB03BodyTextIndented">它剥去你赤裸灵魂的头皮。</p>
