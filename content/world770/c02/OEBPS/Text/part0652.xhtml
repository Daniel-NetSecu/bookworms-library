  <h2 class="EB04MainHeadClosedTitle">捉蝗虫的男孩</h2>

  <p class="EB03BodyTextIndented">一个男孩在捉蝗虫。他捉了好多。这时男孩看到一只蝎子，误以为他是蝗虫，伸手想要捉他。蝎子露出了他的刺，说道：“如果你摸了我的话，我的朋友，你不仅会失去我，你也会失去你所有的蝗虫。”</p>

  <p class="EB01BodyTextLineSpace">粗心大意，后果严重。</p>
