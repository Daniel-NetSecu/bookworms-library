  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">野猪和狐狸</h1>

  <p>有一只野猪正在林子中一棵树的树干上磨牙，这时一只狐狸走了过来，看到他在做的事情，对他说：“请问你为什么要这么做呢？今天猎人又没有出来，我可看不到有什么危险啊。”野猪回答说：“你说得没错，朋友，但是遇到危险我就立刻需要用到我的獠牙，那时候可没有工夫磨牙啊。”</p>
