  <h2 class="kindle-cn-heading2">4　无情美人回旋曲</h2>

  <p class="kindle-cn-signature">乔叟</p>

  <p class="kindle-cn-poem-left">你那双大眼睛能瞬间杀死我，<br/>
  它们的美足以夺走我的安宁；<br/>
  我的心被刺穿，伤口剧痛难忍。</p>

  <p class="kindle-cn-poem-left">若要治愈这颗伤痕累累的心，<br/>
  唯一的良药是你的妙语嘉言。<br/>
  你那双大眼睛能瞬间杀死我，<br/>
  它们的美足以夺走我的安宁。</p>

  <p class="kindle-cn-poem-left">请相信我吧，我的话句句是真：<br/>
  今生和来世，你都是我的女王；<br/>
  等我死后，天日见证我的衷肠。<br/>
  你那双大眼睛能瞬间杀死我，<br/>
  它们的美足以夺走我的安宁；<br/>
  我的心被刺穿，伤口剧痛难忍。</p>
