  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">43</h1>

  <p class="kindle-cn-poem-left1">紧闭双眼，我反能看得清晰，<br/>
  因白天只看见平凡的场景，<br/>
  而在睡梦中，我却能看见你，<br/>
  暗中的光啊，你在暗中照明。<br/>
  你的影子使黑夜光彩熠熠，<br/>
  能让闭起的眼睛闪耀金光，<br/>
  那么，在白天，你皓亮的实体<br/>
  又如何展示那快活的形象？<br/>
  既然黑夜中那虚幻的倩影<br/>
  尚能透过睡眠投射于盲眼，<br/>
  那么，我何时才能蒙受天恩<br/>
  在白天亲眼看见你的真颜？<br/>
  　　不见你，白天于我就是夜空，<br/>
  　　夜成白天，只要你在我梦中。</p>
