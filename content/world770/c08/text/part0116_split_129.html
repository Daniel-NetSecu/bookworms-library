<h1 class="calibre22" id="calibre_pb_231">第二十九节</h1>

      <p class="x5">一般资本和货币收入。</p>

      <p class="x6">另外有一种致富方式我还没有谈到，不用劳动，也无需拥有土地，我们有必要先解释一下它的起源以及它与社会财富分配系统中其他部分的关联，我刚刚已经勾勒出这个系统的大体轮廓。这种方式主要是靠所谓的货币收入，即贷款利息维持下去。</p><a id="Section_cn_30"></a>
