  <title>马和驴</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">马和驴</h1>

  <p>一匹马很为自己精美的马具而骄傲。他在路上遇到了一只驴，驴身上驮着沉重的货物，在给马让路的时候动作很慢。马便不耐烦地说自己真忍不住想要踢驴几脚，好让他动作快点。驴保持着心平气和，却没有忘记对方的傲慢无理。过了没多久，马患上了气喘病，被主人卖给了一个农夫。一天，他拉着一辆装肥料的车，再度遇到了驴。这次轮到驴嘲笑马了：“啊哈！你从来都没想过有这么一天吧，是不是？你是个多骄傲的家伙啊！你的那些漂亮装饰现在跑哪儿去了呀？”</p>
