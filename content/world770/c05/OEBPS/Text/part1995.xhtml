  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">49</h1>

  <p class="kindle-cn-poem-left1">我担心这样的日子会来临：<br/>
  那时，你对我的缺陷皱眉头，<br/>
  你的爱将最后一笔账结清，<br/>
  经过深思，你断然与我分手。<br/>
  那时，你和我变成了陌路人，<br/>
  你的眼睛，不复太阳般灿烂，<br/>
  爱已蜕变，再不见先前光景，<br/>
  你冷眼待我，理由何其充赡。<br/>
  那时，我自惭形秽，无地自容，<br/>
  深知这一切都是自作自受；<br/>
  我举起手，向自己提起诉讼，<br/>
  并为你辩护，支持你的理由。<br/>
  　　你为何爱我，我找不出依据，<br/>
  　　因此，法律允许你将我抛弃。</p>
