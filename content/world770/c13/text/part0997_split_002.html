<h2 class="heading" id="calibre_pb_1">乐佩公主</h2>

  <p class="calibre7">乐佩公主因为长着一头有魔力的金色长发，被高瑟妈妈从宫殿偷走，长期囚禁在隐蔽的高塔上。在高塔上，她有一个好朋友——名叫帕斯考的小变色龙。无意中逃入高塔的盗贼费林改变了她的命运。费林带领乐佩走出高塔寻找梦想。在一起经历种种困难和挑战后，乐佩和费林相爱了，他们成了彼此的新梦想。</p>
