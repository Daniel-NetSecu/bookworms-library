  <title>逃跑的奴隶</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">逃跑的奴隶</h1>

  <p>有一个奴隶因为不满生活待遇逃跑了。没多久，主人便发现了，立刻备马去追逐逃奴，很快就追上了。奴隶希望能够逃过一劫，便藏进了一架水车里。主人看到十分高兴：“啊呀，伙计，你躲的可真是地方！”<a id="ch1-back" href="part2864.xhtml#ch1"><sup>(1)</sup></a></p>

  <div class="empty"></div>

  <p class="kindle-cn-noindent">————————————————————</p>

  <p class="fnote"><a id="ch1" href="part2864.xhtml#ch1-back">(1)</a>&nbsp;水车都是由奴隶来操作的。</p>
