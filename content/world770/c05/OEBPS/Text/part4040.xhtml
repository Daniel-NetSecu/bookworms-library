  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">48</h1>

  <p class="kindle-cn-poem-left">把我从你甜柔的枷锁中放出来吧，我爱，<br/>
  不要再斟上亲吻的酒。<br/>
  香烟的浓雾窒塞了我的心。<br/>
  开起门来，让晨光进入吧！<br/>
  我消失在你里面，包缠在你爱抚的折痕之中。<br/>
  把我从你的诱惑中放出来吧，<br/>
  把男子气概交还我，好让我把得到自由的心贡献给你。</p>
