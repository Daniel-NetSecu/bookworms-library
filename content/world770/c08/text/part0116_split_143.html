<h1 class="calibre22" id="calibre_pb_245">第四十三节</h1>

      <p class="x5">黄金和白银是天然的货币，也是独立于所有惯例和法律的通用货币。</p>

      <p class="x6">于是，黄金和白银构成了货币，而且是通用货币，这不是人们之间的任意约定，也没有受到任何法律的干预，而只是出于事物的天性。它们并不像一些人所想象的那样，是价值的符号；既然能够成为其他价值的尺度和象征，它们本身就具有内在的价值。它们所具有的这种属性与所有其他在商业中有价值的商品的属性相同。唯一的不同之处在于它们同时还具有便于分割、不可改变和比其他商品更容易运输等特点，从而使它们更便于用来衡量和代表其他商品的价值。</p><a id="Section_cn_44"></a>
