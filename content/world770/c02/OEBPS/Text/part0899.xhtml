  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">圣经是一部古老的书</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">圣经是一部古老的书</p>

  <p class="EB03BodyTextIndented">由消逝的人们写成，</p>

  <p class="EB03BodyTextIndented">应圣灵的建议——</p>

  <p class="EB03BodyTextIndented">主题——伯利恒——</p>

  <p class="EB03BodyTextIndented">伊甸园——那古老的家园——</p>

  <p class="EB03BodyTextIndented">撒旦——敌将，</p>

  <p class="EB03BodyTextIndented">犹大——伟大的失职者，</p>

  <p class="EB03BodyTextIndented">大卫——游吟诗人。</p>

  <p class="EB03BodyTextIndented">罪恶——一个著名的绝境</p>

  <p class="EB03BodyTextIndented">其他人必须抵制，</p>

  <p class="EB03BodyTextIndented">“虔信的”男孩子们</p>

  <p class="EB03BodyTextIndented">非常孤独——</p>

  <p class="EB03BodyTextIndented">别的男孩已经“迷失”。</p>

  <p class="EB03BodyTextIndented">若故事有个巧言讲述者</p>

  <p class="EB03BodyTextIndented">所有的男孩都会来——</p>

  <p class="EB03BodyTextIndented">俄耳甫斯的布道惑人，</p>

  <p class="EB03BodyTextIndented">它并不谴责。</p>
</body></html>
