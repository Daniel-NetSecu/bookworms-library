<h1 class="calibre22" id="calibre_pb_263">第六十一节</h1>

      <p class="x5">勤劳的薪资阶级再次细分为企业资本家和普通劳动工人。</p>

      <p class="x6">这样，向社会提供种类繁多的工业品以满足不同需求的整个阶级，可以说再次细分为两个阶级。一个阶级包括企业家、制造业主，以及大量资本的所有者，他们通过为另外一个阶级提供工作来获得利益。而另外一个阶级由手工业者和除了双手一无所有的穷人组成，他们只能垫付自己每天的劳动，得不到利润，得到的只有自己的薪酬。</p><a id="Section_cn_62"></a>
