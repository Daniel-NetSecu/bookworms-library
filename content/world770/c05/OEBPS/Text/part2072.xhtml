  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">126<span class="math-super"><a id="a01" href="part2072.xhtml#b01">[1]</a></span></h1>

  <p class="kindle-cn-poem-left1">可爱的孩子啊，时间的沙漏<br/>
  和他的弯镰都握在你的手；<br/>
  岁月流逝，你的爱友在凋零，<br/>
  唯你不断成长，越长越年轻！<br/>
  如果自然——管辖兴衰的女主<br/>
  在你迈步向前时拉你回去，<br/>
  她卖弄手段的目的一定是：<br/>
  羞辱时间，并置分秒于死地。<br/>
  自然的宠儿啊，你还得小心！<br/>
  她暂留你，但不会永久保存，<br/>
  　　她的债可延期，但必须清理：<br/>
  　　待到结账日，她只有放弃你。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="b01" href="part2072.xhtml#a01">[1]</a> 这首诗只有十二行，押韵格式为英雄双行体。一般认为，关于男性爱友的描写至此为止，从第一百二十七首开始描写一位黑肤女郎。</p>
