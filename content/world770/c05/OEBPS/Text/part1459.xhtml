  <h2 class="kindle-cn-heading2">16　如果这就是爱</h2>

  <p class="kindle-cn-signature">丹尼尔</p>

  <p class="kindle-cn-poem-left">如果这就是爱，那我得疲惫地叹息；<br/>
  我把画描绘在海上，海岸也为我仰天鸣冤，<br/>
  它回首下界，只见地面上依依稀稀<br/>
  兀立着我绝望的爱的残垣。<br/>
  如果这就是爱，我的灵魂就无法安宁，<br/>
  我会倒地哀号，或起身悲歌，<br/>
  滚动那永无休止的烦恼之轮，<br/>
  一个劲地诉怨，痛苦仍无从摆脱；<br/>
  如果这就是爱，那我已身陷深渊；<br/>
  我徘徊在荒野，孤独地哀吼，<br/>
  欢乐变成恐惧，欢歌化为挽曲，<br/>
  泪珠含在眼中，悲哀深藏心头。<br/>
  如果这就是爱，我无异于一具行尸，<br/>
  虽然拥有爱，却永远疲惫地叹息。</p>
