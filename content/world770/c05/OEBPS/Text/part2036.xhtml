  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">90</h1>

  <p class="kindle-cn-poem-left1">你若仇恨我，现在就可发泄，<br/>
  趁世人巴不得我事业受挫，<br/>
  你可以串通厄运，趁火打劫，<br/>
  用不着等待那灭顶的灾祸。<br/>
  啊，别等我的心摆脱了忧郁，<br/>
  你再在愈合的旧疤上肆虐；<br/>
  别让狂风夜紧跟黎明的雨，<br/>
  到最后才给我致命的摧折。<br/>
  你想遗弃我，不必等到最后，<br/>
  别让那小悲小戚发难在先，<br/>
  我宁可顷刻间就大难临头，<br/>
  一开始就将厄运滋味尝遍。<br/>
  　　其他痛苦——现在的痛苦即是——<br/>
  　　与失去你相比，都不值一提。</p>
