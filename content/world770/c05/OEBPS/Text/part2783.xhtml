  <title>笼中鸟和蝙蝠</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">笼中鸟和蝙蝠</h1>

  <p>有一只唱歌的小鸟被关在笼子里，笼子被挂在窗户外面，当其他鸟都睡着的时候，她总是唱歌。有一天晚上，一只蝙蝠来了，抓住笼子上的条栅，问那只鸟为什么白天沉默晚上唱歌。“我这么做的理由很充分，”小鸟回答说，“我原来在白天唱歌，结果一个捕鸟人被我的声音吸引，张网抓住了我。从那以后，我便只在晚上唱歌了。”但是蝙蝠回答说：“你现在已经是笼中鸟，再这么做根本没有什么意义，如果你能在被抓前这样做，你现在还会是自由自在的。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：事后再警惕并没有用。</p>
</body></html>
