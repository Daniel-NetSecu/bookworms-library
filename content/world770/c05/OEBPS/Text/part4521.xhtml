  <p class="kindle-cn-kai1">关于可怜的维特的故事，凡是我能找到的，我都努力搜集起来，呈献在诸位面前了；我知道，诸位是会感谢我的。对于他的精神和品格，诸位定将产生钦慕与爱怜；对于他的命运，诸位都不免一洒自己的同情泪。</p>

  <p class="kindle-cn-kai">而你，正感受着与他同样烦恼的善良人呵，就从他的痛苦中汲取安慰，并让这本薄薄的小书做你的朋友吧，要是你由于命运的不济或自身的过错，已不可能有更知己的人的话。</p>
