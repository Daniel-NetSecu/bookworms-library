  <title>同情</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">同情</h2>

  <p class="EB03BodyTextIndented">你不该绝望心碎：</p>

  <p class="EB03BodyTextIndented">　　当夜空中缀满繁星；</p>

  <p class="EB03BodyTextIndented">当黄昏悄然降下露水，</p>

  <p class="EB03BodyTextIndented">　　当阳光为清晨镀金。</p>

  <p class="EB03BodyTextIndented">你不该绝望挣扎：</p>

  <p class="EB03BodyTextIndented">　　尽管眼泪可能汇成河流，</p>

  <p class="EB03BodyTextIndented">难道那些最美好的年华</p>

  <p class="EB03BodyTextIndented">　　不是永在你心头？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">它们哭泣，你也哭泣，想必应是这个道理；</p>

  <p class="EB03BodyTextIndented">　　你一感慨，风儿也随你叹息，</p>

  <p class="EB03BodyTextIndented">冬日将哀愁抖落在雪地，</p>

  <p class="EB03BodyTextIndented">　　秋日的落叶在冰雪之下堆积。</p>

  <p class="EB03BodyTextIndented">但它们终将复生，而你的命运</p>

  <p class="EB03BodyTextIndented">　　也与它们紧紧相依。</p>

  <p class="EB03BodyTextIndented">所以，继续前行吧，即使并不欢愉，</p>

  <p class="EB03BodyTextIndented">　　也永远不要心碎不已！</p>
</body></html>
