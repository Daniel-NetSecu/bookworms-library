  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">127</h1>

  <p class="kindle-cn-poem-left1">昔时，没有人称黑肤为美丽，<br/>
  即便真美，黑也不享美之名；<br/>
  如今，黑成了美的合法后裔，<br/>
  公认的美反被人视为私生。<br/>
  人人都在僭取自然的神力，<br/>
  用骗人的化妆术美化丑陋，<br/>
  从而使美丢美名，无所附丽，<br/>
  美被亵渎，只能与耻辱同俦。<br/>
  我情人的眼睛乌鸦般黑亮，<br/>
  眉毛也黑，这姿容似在哀悼<br/>
  那生来不美而装美的女郎，<br/>
  怪她们辱没造化，真假颠倒。<br/>
  　　她的姿容就在哀悼中增值，<br/>
  　　每张嘴都在说：美理应如此。</p>
