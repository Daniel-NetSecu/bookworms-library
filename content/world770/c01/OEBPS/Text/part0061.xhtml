    <td>The fat hen is on the box.</td>
    <td>这只肥母鸡在盒子上。</td>
  </tr>

    <td>The rat ran from the box.</td>
    <td>老鼠从盒子里跑了出来。</td>
  </tr>
  <tr>

    <td>母鸡会跑开吗？</td>
