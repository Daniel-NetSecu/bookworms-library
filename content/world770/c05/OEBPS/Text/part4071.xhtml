  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">79</h1>

  <p class="kindle-cn-poem-left">我常常思索，人和动物之间没有语言，<br/>
  他们心中互相认识的界线在哪里。<br/>
  在元古创世的清晨，<br/>
  通过哪一条太初乐园的单纯的小径，<br/>
  他们的心曾彼此访问过。<br/>
  他们的亲属关系早被忘却，<br/>
  他们不变的足印的符号并没有消灭。<br/>
  可是忽然在这无言的音乐中，<br/>
  那模糊的记忆清醒起来，<br/>
  动物用温柔的信任注视着人的脸，<br/>
  人也用嬉笑的感情下望着它的眼睛。<br/>
  好像两个朋友戴着面具相逢，在伪装下彼此模糊地互认着。</p>
