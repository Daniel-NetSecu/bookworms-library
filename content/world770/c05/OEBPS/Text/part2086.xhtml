  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">140</h1>

  <p class="kindle-cn-poem-left1">你残忍待我，也得学点聪明，<br/>
  我缄口的忍耐，别过分欺辱，<br/>
  不然，悲伤会借我幽怨之声，<br/>
  申诉我那需要同情的痛苦。<br/>
  爱人啊，如果让我教你机智，<br/>
  你最好说爱我，不爱装成爱，<br/>
  因为急躁的病人临近死期，<br/>
  最爱听医生说他否极泰来。<br/>
  如果我失望，我会变成疯子，<br/>
  并在疯狂中尽说你的坏话；<br/>
  这恶毒的世界已恶败至极，<br/>
  疯狂的耳朵只信疯人疯骂。<br/>
  　　为了我不发疯，你不被诽谤，<br/>
  　　请正眼看我，尽管心在远方。</p>
