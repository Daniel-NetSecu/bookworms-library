  <h2 class="kindle-cn-heading2">89　回声</h2>

  <p class="kindle-cn-signature">克里斯蒂娜·罗塞蒂</p>

  <p class="kindle-cn-poem-left">请到我这里来，趁夜深人静，<br/>
  趁我在熟睡中默默梦呓，<br/>
  回来吧，带着你那张温和的圆脸<br/>
  和那双与映照溪水的阳光一样灿烂的眼睛，<br/>
  哟，记忆、希望和往昔的爱情，<br/>
  请你们都含泪归来！</p>

  <p class="kindle-cn-poem-left">哟，甜美的，极度甜美的梦，<br/>
  如此美景本该出现在天堂，<br/>
  因为那里聚居着充满爱心的人，<br/>
  一双双渴望的眼睛<br/>
  紧盯着那扇慢慢开启的门，<br/>
  可惜那时已不再放人。</p>

  <p class="kindle-cn-poem-left">还是到我梦中来吧，以便我<br/>
  在死亡的冷酷中重温生活；<br/>
  回到我的梦中来，以便我们<br/>
  心心相印，息息相关：<br/>
  悄悄说话，紧紧依偎，<br/>
  就像很久很久以前那一对恋人。</p>
