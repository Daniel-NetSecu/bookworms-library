<p class="title1">内容简介</p>
<p class="normaltext">汤姆·索亚不喜欢上学，不喜欢劳动，也从不喜欢在早上早起。但他喜欢游泳和钓鱼，还有和小伙伴们一起去冒险。他有许许多多的冒险经历。</p>
<p class="normaltext">但是汤姆的这些经历有时危机四伏。一天晚上，他和哈克·费恩在坟场上看到三个男人。他们是谁？半夜在坟场干吗？然后这两个孩子看到其中一人是印江·乔……</p>
<p class="normaltext">汤姆和哈克永远不会忘记那个晚上。他们害怕印江·乔——他们应该害怕，因为印江·乔用刀极快……</p>
