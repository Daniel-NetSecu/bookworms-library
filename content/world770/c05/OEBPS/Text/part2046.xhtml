  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">100</h1>

  <p class="kindle-cn-poem-left1">你在哪里，缪斯？你为何遗忘<br/>
  这需要你竭尽全力的话题？<br/>
  你是否光顾了无聊的诗章，<br/>
  甘愿贬低自己，扶助于俗俚？<br/>
  回来吧，健忘的缪斯，去赎回<br/>
  虚度的光阴，用你温婉的诗！<br/>
  让歌声在爱歌者耳边徘徊，<br/>
  是他们赋予你诗艺和题旨。<br/>
  懒缪斯，起来看看我的爱人，<br/>
  时光是否在那里留下皱褶；<br/>
  如果有，就写诗将衰老嘲讽，<br/>
  并教世人藐视时间的掠劫。<br/>
  　　快扬名我的爱人，超越生命，<br/>
  　　别让时间的镰刀轻易得逞。</p>
