  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">栎树和芦苇</h1>

  <p>一棵栎树长在河岸边，遇到一场暴风，被连根拔起，抛到了河对岸。他落在了水边生长的芦苇中，对他们说：“这是怎么回事啊？你们这么脆弱，居然能够平安度过风暴，而我呢，强大有力，却被连根拔起丢到了河里。”芦苇回答说：“你是固执，和风暴对抗，而对方的力量却强过你，即便是微风我们也低头屈服，强风自然掠过我们头顶。”</p>
