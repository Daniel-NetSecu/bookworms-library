  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">99</h1>

  <p>当我放下舵盘，我知道你来接收的时候到了。</p>

  <p>当做的事立刻要做了。挣扎是无用的。</p>

  <p>那就把手拿开，静默地承认失败吧，</p>

  <p>我的心啊，要想到能在你的岗位上默坐，还算是幸运的。</p>

  <p>我的几盏灯都被一阵阵的微风吹灭了，</p>

  <p>为想把它们重新点起，我屡屡地把其他的事情都忘却了。</p>

  <p>这次我要聪明一点，把我的席子铺在地上，在暗中等候；</p>

  <p>什么时候你高兴，我的主，悄悄地走来坐下吧。</p>
