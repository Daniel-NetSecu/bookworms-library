  <h2 class="EB04MainHeadClosedTitle">渔夫和渔网</h2>

  <p class="EB03BodyTextIndented">一个贪婪的渔夫，抛出了成功的一网，捕到了一大网鱼。他熟练的拉网技巧使得所有的大鱼都留在了渔网里，他将它们成功拖上了岸。但是他无法阻止小鱼从网眼里滑落，逃回大海。</p>
