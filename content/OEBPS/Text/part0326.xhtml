<p class="title1">内容简介</p>
<p class="normaltextx">太阳火辣辣的——你开着车，行驶在澳大利亚中部一条长长的公路上。</p>
<p class="normaltextx">突然，你看到一个男子站在公路中央。他穿着高档的西服、体面的鞋子，但他不说话——一个字都不说。</p>
<p class="normaltextx">你的车里有一把枪——你要怎么办？你必须小心！但你不能把他丢在这个炎热、荒无人烟的地方——方圆几百公里之内什么都没有——没有水，也没有吃的。</p>
<p class="normaltextx">但那儿有别的东西——沃拉隆加附近的天空中有一道强烈的白光。</p>
