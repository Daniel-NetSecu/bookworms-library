  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">悬挂着的人</h1>

  <p class="kindle-cn-poem-left">某个上帝抓住了我的发根。<br/>
  我在他蓝色的雷电中嘶叫，仿佛沙漠里的先知。<br/>
  <br/>
  夜晚突然消逝好像蜥蜴的眼睑：<br/>
  无遮蔽的眼窝里，赤裸的白昼世界。<br/>
  <br/>
  一种秃鹰似的厌倦将我钉在这树上。<br/>
  若他是我，他也会做我所做的。</p>
