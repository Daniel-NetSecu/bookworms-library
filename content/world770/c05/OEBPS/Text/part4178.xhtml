  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">98</h1>

  <p>我要以胜利品——我的失败的花环来装饰你。</p>

  <p>逃避不受征服，是我永远做不到的。</p>

  <p>我知道我的骄傲会碰壁，我的生命将因极端的痛苦而炸裂，</p>

  <p>我的空虚的心将像一枝空苇呜咽出哀声，顽石也融成眼泪。</p>

  <p>我准知道莲花的百瓣不会永远闭合，深藏的花蜜定将显露。</p>

  <p>从碧空将有一只眼睛向我凝视，在默默地召唤我。</p>

  <p>我将空无所有，绝对地空无所有，我将从你脚下领受绝对的死亡。</p>
