  <title>兄妹</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">兄妹</h1>

  <p>有一个人有两个孩子，一个男孩，一个女孩。男孩长得很英俊，但是女孩相貌平平。有一天，他们一起在妈妈的房间里玩，看到了一面镜子，这是他们第一次看到自己的样子。男孩看到自己是个英俊的人，于是便向妹妹炫耀自己的好容貌；而妹妹呢，发现自己相貌平平，又羞又恼，都要哭了，更把哥哥的评价当作了对自己的羞辱。于是她跑去见爸爸，告诉他哥哥的自负，指责他乱动妈妈的东西。父亲笑着，亲了亲两个孩子，说：“孩子们，从现在起学着好好学习使用那面玻璃镜子吧。你，我的儿子，要一直努力保持良好品行，才能配上它显示出的你的美好；而你，我的女儿，要努力保持自己的美好品格，来弥补自己外表上的不足。”</p>
