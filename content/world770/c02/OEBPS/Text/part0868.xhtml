  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">我谁都不是！你是谁？</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我谁都不是！你是谁？</p>

  <p class="EB03BodyTextIndented">难道你也寂寂无名？</p>

  <p class="EB03BodyTextIndented">那我们俩就是一对——别吭声！</p>

  <p class="EB03BodyTextIndented">他们会驱逐我们，你知道。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">做个有头脸的人物多无趣！</p>

  <p class="EB03BodyTextIndented">多风光，像只青蛙</p>

  <p class="EB03BodyTextIndented">一整天对着一片爱慕的泥沼</p>

  <p class="EB03BodyTextIndented">宣扬自己的名字！</p>
