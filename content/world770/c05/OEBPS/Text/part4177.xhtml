  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">97</h1>

  <p>当我同你做游戏的时候，我从来没有问过你是谁。</p>

  <p>我不懂得羞怯和惧怕，我的生活是热闹的。</p>

  <p>清晨你就来把我唤醒，像我自己的伙伴一样，带着我跑过林野。</p>

  <p>那些日子，我从来不想了解你对我唱的歌曲的意义。</p>

  <p>我只随声附和，我的心应节跳舞。</p>

  <p>现在，游戏的时光已过，这突然来到我眼前的情景是什么呢？</p>

  <p>世界低下眼来看着你的双脚，和它的肃静的众星一同敬畏地站着。</p>
