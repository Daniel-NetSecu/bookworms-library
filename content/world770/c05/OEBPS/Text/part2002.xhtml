  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">56</h1>

  <p class="kindle-cn-poem-left1">甜美的爱啊，重聚你的威力！<br/>
  你的锋芒不应比食欲迟钝；<br/>
  食欲满足时，也只安静一时，<br/>
  隔日又胃口大开，来势更猛。<br/>
  你也该如此，你饥渴的眼睛<br/>
  即便今天饱食后昏昏欲睡，<br/>
  明天得继续巡视，爱的精神<br/>
  不该被那永恒的萎靡摧毁。<br/>
  让这不幸的间歇就像大海，<br/>
  海岸将它分开，新婚的情侣，<br/>
  每天来到岸上，见爱已归来，<br/>
  心头必将涌动百倍的欢愉。<br/>
  　　也可称间歇为多愁的冬季，<br/>
  　　它让夏天更受欢迎，更瑰奇。</p>
