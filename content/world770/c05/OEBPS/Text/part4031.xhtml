  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">39</h1>

  <p class="kindle-cn-poem-left">整个早晨我想编一个花环，但是花儿滑掉了。<br/>
  你坐在一旁偷偷地从侦伺的眼角看着我。<br/>
  问这一对沉黑的恶作剧的眼睛，这是谁的错。<br/>
  我想唱一支歌，但是唱不出来。<br/>
  一个暗笑在你唇上颤动；<br/>
  问它我失败的缘由。<br/>
  让你微笑的唇儿发一个誓，<br/>
  说我的歌声怎样地消失在沉默里，<br/>
  像一只在荷花里沉醉的蜜蜂。<br/>
  夜晚了，是花瓣合起的时候了。<br/>
  容许我坐在你的旁边，<br/>
  容许我的唇儿做那在沉默中、在星辰和微光中能做的工作吧。</p>
