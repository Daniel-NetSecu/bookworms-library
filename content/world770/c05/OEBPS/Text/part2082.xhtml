  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">136</h1>

  <p class="kindle-cn-poem-left1">如灵魂责备你跟我太缠绵，<br/>
  告诉这瞎说者：我就是情欲，<br/>
  灵魂能懂得：情欲有这特权，<br/>
  甜爱啊，请答应我爱的请托。<br/>
  威尔我将进入你爱的宝库，<br/>
  用情欲装满它，那里应有我！<br/>
  世人皆知，大仓廪储物无数，<br/>
  万物中的一物，容易被淹没；<br/>
  你的仓廪总有我一席之地，<br/>
  你不妨让威尔悄悄地入库，<br/>
  视我为无物吧，只要你愿意，<br/>
  甜爱啊，无物于你实为尤物。<br/>
  　　爱上我的名字吧，爱到永远，<br/>
  　　爱它就是爱我，因我叫威廉。</p>
