<h2 class="heading" id="calibre_pb_11">小古</h2>

  <p class="p">● 小古是一只勇敢、顽皮的小海龟。他以自己的父亲龟龟为偶像，并继承了父亲无畏和随和的态度。他喜欢在洋流里嬉戏，喜欢和父亲一起冲浪。小古性格活泼，很容易就交到朋友，他把每一天都当作是一场有趣的冒险。</p>
