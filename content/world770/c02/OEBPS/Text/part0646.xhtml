  <h2 class="EB04MainHeadClosedTitle">青蛙怨日</h2>

  <p class="EB03BodyTextIndented">很久很久以前，太阳宣布了自己想要娶个妻子的意图。青蛙们提着嗓门大声朝着天空呱呱叫。朱庇特被噪声弄烦了，便问他们呱呱叫个不停是为什么。他们回答道：“当太阳还单身的时候，就已经要烤干我们的沼泽了，迫使我们悲惨地死在干旱的家中。如果他再生下其他太阳，我们未来该怎么办呀？”</p>
