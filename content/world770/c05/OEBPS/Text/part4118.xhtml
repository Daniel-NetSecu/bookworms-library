  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">38</h1>

  <p>我需要你，只需要你——</p>

  <p>让我的心不停地重述这句话。</p>

  <p>日夜引诱我的种种欲念，都是透顶的诈伪与空虚。</p>

  <p>就像黑夜隐藏在祈求光明的朦胧里，</p>

  <p>在我潜意识的深处也响出呼声——</p>

  <p>我需要你，只需要你。</p>

  <p>正如风暴用全力来冲击平静，却寻求终止于平静，</p>

  <p>我的反抗冲击着你的爱，而它的呼声也还是——</p>

  <p>我需要你，只需要你。</p>
