<p id="filepos842414" class="calibre_4"><span class="calibre1"><span class="bold">无花果树、榕小蜂、猴子、蝙蝠和鸟类的共生</span></span></p><p class="calibre_48">1.榕小蜂钻进无花果的花朵，在里面产卵。它们也把花粉带到别的树上去，替无花果授粉。</p><p class="calibre_"><img src="images/00354.jpg.webp" class="calibre_274"/>
</p><p class="calibre_38">2.经过榕小蜂的授粉，无花果树结果。果实中长满了种子。</p><p class="calibre_"><img src="images/00067.jpg.webp" class="calibre_275"/>
</p><p class="calibre_38">3.猴子、蝙蝠和小鸟吃下无花果的果实，当它们在不同的地方排便时，无花果种子便随之散落在森林的各个角落。</p><p class="calibre_"><img src="images/00072.jpg.webp" class="calibre_276"/>
</p><p class="calibre_38">4.无花果种子在掉落的地方开始生根、发芽，最终长成一棵新的无花果树。</p><p class="calibre_"><img src="images/00078.jpg.webp" class="calibre_277"/>
</p><div class="mbp_pagebreak" id="calibre_pb_392"></div>
