  <h2 class="kindle-cn-heading2">53　风能吹向四面八方</h2>

  <p class="kindle-cn-signature">彭斯</p>

  <p class="kindle-cn-poem-left">风能吹向四面八方，<br/>
  我渴望它吹向西边，<br/>
  西边住着一位好姑娘，<br/>
  她是我最爱的美人。<br/>
  树在那里生长，河在那里流淌，<br/>
  一座山连着一座山，<br/>
  但我日夜相思相望，<br/>
  我的琼永在我身旁。</p>

  <p class="kindle-cn-poem-left">我看见她站在沾着露珠的鲜花丛中——<br/>
  她是那般的可爱、漂亮！<br/>
  我听见她跟善歌的鸟儿同唱，<br/>
  她的歌声陶醉了林莽。<br/>
  泉水边，树林间，绿地上，<br/>
  只要那里有鲜花生长，<br/>
  只要那里有鸟儿歌唱，<br/>
  我的琼总让我挂肚牵肠。</p>
