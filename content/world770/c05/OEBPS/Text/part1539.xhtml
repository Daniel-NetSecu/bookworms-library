  <h2 class="kindle-cn-heading2">96　镇上的暴风雨</h2>

  <p class="kindle-cn-signature">哈代<span class="math-super"><a id="noteBack_1" href="part1539.xhtml#note_1">[1]</a></span></p>

  <p class="kindle-cn-poem-left">她穿一件赤褐色的新衣，<br/>
  由于天空下起瓢泼大雨，<br/>
  我们继续留在马车篷里，<br/>
  尽管那马早已停下脚步。<br/>
  我们僵坐着，心中阵阵欢喜。</p>

  <p class="kindle-cn-poem-left">大雨不久停了，我感到痛苦。<br/>
  刚才挡住我们躯体的那块玻璃<br/>
  突然被掀起，她向车门跃去，<br/>
  如果这雨有一分钟的延续，<br/>
  我一定已跟她亲吻在一起。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1539.xhtml#noteBack_1">[1]</a>托马斯·哈代（Thomas Hardy，1840—1928），诗人，小说家，出生于多塞特郡的博克汉姆顿。早期的诗作无缘发表，转写小说，一举成名。后再回头从事诗歌创作。1898年出版第一部诗集《威塞克斯诗集》，而后又出版《时光的笑柄》《冬天的话》等诗集。小说代表作有《德伯家的苔丝》《还乡》等。</p>
