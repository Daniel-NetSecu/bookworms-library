  <h2 class="EB04MainHeadClosedTitle">鹧鸪和捕鸟人</h2>

  <p class="EB03BodyTextIndented">一位捕鸟人捉住了一只鹧鸪，正要杀了它。鹧鸪恳切地求捕鸟人放了它，并说道：“祈求上帝，大人，放我一条生路吧，我会骗更多的鹧鸪飞到您的网里，作为对您的报答。”</p>

  <p class="EB03BodyTextIndented">捕鸟人回答道：“杀你这事儿，我现在更是没什么可犹豫的了。你居然想靠出卖朋友和亲人来换自己的命！”</p>
