  <title>旅行者和悬铃木</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">旅行者和悬铃木</h1>

  <p>一个炎热的夏日，两个旅行者走在一条光秃秃的、沙尘滚滚的路上。不久，他们走到一棵悬铃木下面，他们很开心地到茂密枝条形成的树荫下躲避太阳。他们一边休息，一边看着树，其中一个评论道：“悬铃木是种多没用的树啊，都不结果子，对人半点用都没有。”悬铃木愤怒地打断了他：“你们这些不知感恩的家伙！你正躲在我下面躲避炽热的太阳，享受着我的枝叶形成的阴凉，居然责骂我一无是处！”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：很多付出都会遭遇忘恩负义。</p>
</body></html>
