  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">77</h1>

  <p class="kindle-cn-poem-left1">镜子告诉你，你的美在凋零，<br/>
  日晷显示，你的光阴已虚度，<br/>
  张张白纸将承载你的心灵，<br/>
  这记事册将为你留下训谕。<br/>
  镜子将如实照出你的皱纹，<br/>
  提醒你别忘记张口的坟墓；<br/>
  凭日晷缓缓移动着的阴影，<br/>
  你该懂得：时间正走向亘古。<br/>
  只要你将记忆未及的东西<br/>
  托付给这些白纸，你将发现：<br/>
  你的大脑养育出来的子嗣<br/>
  将结交你的心灵，成为良伴。<br/>
  　　如果你勤勉于这样的职守，<br/>
  　　你将受益，并使这册子富有。</p>
