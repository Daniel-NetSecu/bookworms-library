  <h2 class="kindle-cn-heading2">24　你并不美</h2>

  <p class="kindle-cn-signature">坎皮恩</p>

  <p class="kindle-cn-poem-left">你并不美，尽管你绿绿红红<br/>
  把自己打扮得娇艳几多；<br/>
  你并不可爱，尽管你生在福中。<br/>
  你不美也不可爱，除非你怜悯我。<br/>
  我不会让你的好奇心得到宽慰，<br/>
  你将懂得：没有爱就没有美。</p>

  <p class="kindle-cn-poem-left">你不必爱我，更不要拿美引诱<br/>
  我的感情，如果你的爱神圣高尚：<br/>
  你的微笑和亲吻我难以消受，<br/>
  你的双臂织不成我的罗网：<br/>
  如果你正直，就请把爱献出——<br/>
  抱我，吻我，爱我，不顾一切！</p>
