  <title>一个梦</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">一个梦</h2>

  <p class="EB03BodyTextIndented">曾有一个梦编着树荫，</p>

  <p class="EB03BodyTextIndented">在我那天使守护的床顶；</p>

  <p class="EB03BodyTextIndented">我看见一只迷路的蚂蚁，</p>

  <p class="EB03BodyTextIndented">在我所躺的那片草地。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">她苦恼，困惑，又孤凄，</p>

  <p class="EB03BodyTextIndented">夜色昏黑，她力尽精疲；</p>

  <p class="EB03BodyTextIndented">她翻过许多纠结的草茎，</p>

  <p class="EB03BodyTextIndented">我听到她心胆俱裂的声音：</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“我的孩子啊！他们在哭泣？</p>

  <p class="EB03BodyTextIndented">他们可听到父亲在叹息？</p>

  <p class="EB03BodyTextIndented">他们一定四处去找我，</p>

  <p class="EB03BodyTextIndented">然后回去，为我哭泣。”</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我流下了眼泪，为她哀恸；</p>

  <p class="EB03BodyTextIndented">但突然看到了一只萤火虫。</p>

  <p class="EB03BodyTextIndented">它应道：“是谁在哀哀地哭着，</p>

  <p class="EB03BodyTextIndented">哀哀地呼唤夜的巡察者？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">“我是被派来照亮地面的，</p>

  <p class="EB03BodyTextIndented">还有甲虫在到处巡察；</p>

  <p class="EB03BodyTextIndented">好了，循着甲虫的声音，</p>

  <p class="EB03BodyTextIndented">小小迷路者，赶紧回家。”</p>
