  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">62</h1>

  <p class="kindle-cn-poem-left">在梦境的朦胧小路上，我去寻找我前生的爱。<br/>
  她的房子是在冷静的街尾。<br/>
  在晚风中，她爱养的孔雀在架上昏睡，<br/>
  鸽子在自己的角落里沉默着。<br/>
  她把灯放在门边，站在我面前。<br/>
  她抬起一双大眼望着我的脸，无言地问道：<br/>
  “你好吗，我的朋友？”<br/>
  我想回答，但是我们的语言迷失而又忘却了。<br/>
  我想来想去，怎么也想不起我们叫什么名字。<br/>
  眼泪在她眼中闪光，她向我伸出右手。<br/>
  我握住她的手静默地站着。<br/>
  我们的灯在晚风中颤摇着熄灭了。</p>
