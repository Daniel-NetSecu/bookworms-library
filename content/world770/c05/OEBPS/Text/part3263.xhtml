  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">瘀伤</h1>

  <p class="kindle-cn-poem-left">颜色涌出斑点，暗紫色。<br/>
  身体全部被冲洗干净，<br/>
  珍珠般的颜色。<br/>
  <br/>
  岩石的凹陷处<br/>
  海水痴迷地吮吸，<br/>
  空洞，整个大海的枢轴。<br/>
  <br/>
  小小苍蝇<br/>
  死亡标记<br/>
  沿着墙往下爬。<br/>
  <br/>
  心房关闭，<br/>
  海水退潮，<br/>
  床单覆盖多重镜子。</p>
