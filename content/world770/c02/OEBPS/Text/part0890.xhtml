  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">因为我不能为死亡而停步</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">因为我不能为死亡而停步，</p>

  <p class="EB03BodyTextIndented">他亲切地为我止步；</p>

  <p class="EB03BodyTextIndented">马车只载着我们自己</p>

  <p class="EB03BodyTextIndented">还有不朽。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我们驾马缓行，他不疾不徐，</p>

  <p class="EB03BodyTextIndented">而我也放下</p>

  <p class="EB03BodyTextIndented">我的劳作，还有我的悠闲，</p>

  <p class="EB03BodyTextIndented">因为他殷勤有礼。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我们经过一个学校，孩子们在玩耍，</p>

  <p class="EB03BodyTextIndented">围成一圈扭打，</p>

  <p class="EB03BodyTextIndented">我们经过谷物凝视着的田野，</p>

  <p class="EB03BodyTextIndented">我们经过落日。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我们在一所房子面前稍歇</p>

  <p class="EB03BodyTextIndented">它像是地上隆起的肿块；</p>

  <p class="EB03BodyTextIndented">屋顶几乎看不见，</p>

  <p class="EB03BodyTextIndented">飞檐不过是个土堆。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">从那时起已是许多世纪；可每个世纪</p>

  <p class="EB03BodyTextIndented">都感觉比那一天短暂；</p>

  <p class="EB03BodyTextIndented">我初猜那天马儿的头</p>

  <p class="EB03BodyTextIndented">是朝向永生。</p>
</body></html>
