  <div class="chapter" id="chapter">
    <h1 class="kindle-cn-heading-1"><a id="page1"></a>Ancient Oath of the Krakow Trumpeter</h1>

    <p><span class="kindle-cn-italic">"I swear on my honor as a Pole, as a servant of the King of the Polish people, that I will faithfully and unto the death, if there be need, sound upon the trumpet the Heynal in honor of Our Lady each hour in the tower of the church which bears Her Name."</span></p>
