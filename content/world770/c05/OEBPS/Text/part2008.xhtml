  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">62</h1>

  <p class="kindle-cn-poem-left1">自恋的罪愆占据我的双眸，<br/>
  迷住我的心窍和整个身心，<br/>
  这沉疴深重，已经无药可救，<br/>
  因为它在我心中深深扎根。<br/>
  我觉得我的脸蛋可爱无比，<br/>
  形态最端庄，品德也最高尚，<br/>
  我如此合计着自身的价值，<br/>
  总觉得别的人都比我不上。<br/>
  但镜子却显示出我的容颜：<br/>
  苍老、憔悴，满脸密布着皱纹，<br/>
  自恋的结果正好走向反面，<br/>
  自恋自爱让我变成了罪人。<br/>
  　　我赞美你，就是赞美我自身，<br/>
  　　你的美可以掩饰我的年龄。</p>
