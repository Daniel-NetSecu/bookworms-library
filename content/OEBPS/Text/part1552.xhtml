<h1 class="title1">内容简介</h1>
<p class="normaltext">在印度南部的群山之中，一个人类的婴儿躺在山洞里，又温暖又安全。他挤在小狼崽们中间，旁边卧着狼妈妈，可是他一点儿也不害怕。洞穴外，食人虎希尔汗正愤怒地咆哮着，想要杀死那个婴儿。“没门儿！”狼妈妈说道，“这个人崽儿是我的，他会活下去，和狼群一起奔跑，并且成为我的儿子。我要叫他莫格利。”</p>
<p class="normaltext">许多年过去了，那个人崽儿莫格利和小狼们一起成长起来。在他的老师老棕熊巴鲁和黑豹巴格拉的教导下，他懂得了“森林法则”。在森林中他屡入险境，可也交到了不少动物朋友。</p>
<p class="normaltext">当然他还有个敌人。食人虎希尔汗对他耿耿于怀。老虎在等待机会，期待着有一天能够抓住这个人崽儿，然后杀死他。</p>
