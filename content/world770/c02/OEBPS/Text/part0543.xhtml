  <title>The Coming of Wisdom with Time</title>

  <h2 class="EB04MainHeadClosedTitle">The Coming of Wisdom with Time</h2>

  <p class="EB03BodyTextIndented">Though leaves are many, the root is one;</p>

  <p class="EB03BodyTextIndented">Through all the lying days of my youth</p>

  <p class="EB03BodyTextIndented">I swayed my leaves and flowers in the sun;</p>

  <p class="EB03BodyTextIndented">Now I may wither into the truth.</p>
