  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">猫和鸟</h1>

  <p>有一只猫听说有一伙群居的鸟生病了。于是他乔装打扮成医生，带着一些能证明自己身份的工具，出现在鸟的居所的门前，询问鸟儿们的健康情况。鸟儿们没有让他进门，他们说：“我们会好起来的，只要你不出现。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：坏蛋诡计多端，但无法欺骗智者。</p>
