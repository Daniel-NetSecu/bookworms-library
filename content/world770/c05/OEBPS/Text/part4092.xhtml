  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">12</h1>

  <p>我旅行的时间很长，旅途也是很长的。</p>

  <p>天刚破晓，我就驱车起行，</p>

  <p>穿遍广漠的世界，在许多星球之上，留下辙痕。</p>

  <p>离你最近的地方，路途最远。</p>

  <p>最简单的音调，需要最艰苦的练习。</p>

  <p>旅客在每一个生人门口敲叩，才能敲到自己的家门；</p>

  <p>人要在外面到处漂流，最后才能走到最深的内殿。</p>

  <p>我的眼睛向空阔处四望，</p>

  <p>最后才合上眼说：“你原来在这里！”</p>

  <p>这句问话和呼唤“啊，在哪儿呢？”</p>

  <p>融化在千股的泪泉里，</p>

  <p>和你保证的回答“我在这里！”的洪流，一同泛滥了全世界。</p>
