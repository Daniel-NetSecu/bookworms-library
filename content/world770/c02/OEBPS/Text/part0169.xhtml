  <title>童稚的欢乐</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">童稚的欢乐</h2>

  <p class="EB03BodyTextIndented">“我没有姓名，</p>

  <p class="EB03BodyTextIndented">出生只有两天。”</p>

  <p class="EB03BodyTextIndented">那我怎么叫你？</p>

  <p class="EB03BodyTextIndented">“我幸福欢欣，</p>

  <p class="EB03BodyTextIndented">欢乐是我的名。”</p>

  <p class="EB03BodyTextIndented">甜蜜的欢乐降给你！</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">美妙的欢乐！</p>

  <p class="EB03BodyTextIndented">甜蜜的欢乐才两天，</p>

  <p class="EB03BodyTextIndented">“甜蜜的欢乐”，我称你，</p>

  <p class="EB03BodyTextIndented">你甜甜地笑了，</p>

  <p class="EB03BodyTextIndented">我歌唱那一刻，</p>

  <p class="EB03BodyTextIndented">甜蜜的欢乐降给你！</p>
</body></html>
