  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">152</h1>

  <p class="kindle-cn-poem-left1">我知道，我已因爱你而背盟，<br/>
  你却因发誓爱我背盟两度：<br/>
  你不守婚约，然后对我失信，<br/>
  对你的新欢表示新的厌弃。<br/>
  你毁约两次，但我有二十次，<br/>
  为何还谴责你？我始终食言，<br/>
  我赌咒发誓，全为了吹嘘你，<br/>
  为了你，我的诚信丧失殆尽。<br/>
  我曾发重誓说你温柔无比，<br/>
  说你爱得深，爱得真，爱得久，<br/>
  为了将你抬举，我闭眼虚拟，<br/>
  或干脆颠倒黑白，混淆美丑。<br/>
  　　我发誓说你美，这个誓最假，<br/>
  　　它与事实相背，十足的谎话！</p>
