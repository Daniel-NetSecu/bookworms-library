  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">44</h1>

  <p class="kindle-cn-poem-left1">如果笨重的肉体变成思想，<br/>
  伤人的距离无法把我阻止：<br/>
  我会不顾哪怕是万水千山，<br/>
  一定振翅而飞，赶到你那里。<br/>
  即便此刻我所立足的地点<br/>
  远在天涯海角，那又有何妨！<br/>
  疾飞的思想总是即思即行，<br/>
  转眼间就穿越群山与海洋。<br/>
  但我不是那思想，这真要命！<br/>
  我飞不过相距的遥遥千里，<br/>
  我只是水和土做成的凡身，<br/>
  我只能侍候时间，徒劳叹息。<br/>
  　　笨拙的元素让我一无所有，<br/>
  　　除了悲伤的泪和无穷的愁。</p>
