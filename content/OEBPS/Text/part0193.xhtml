<p class="title1">内容简介</p>
<p class="normaltextx">你出去购物时会随身带多少钱？你会不会很小心？有时会有人当街偷钱——这时你就需要警察的帮助。</p>
<p class="normaltextx">丹、苏和吉姆是伦敦的警察。他们最近很不开心，因为有个小偷每天都从商店附近的人身上偷钱。</p>
<p class="normaltextx">他们怎样才能找到这个小偷？这个小偷长什么样——是男是女？是老是少？要弄清这些可不容易。</p>
<p class="normaltextx">他们有什么设备可以帮上忙吗？他们有对讲机——可小偷有手机。丹、苏和吉姆需要一样小偷没有的东西——他们需要监控录像！</p>
