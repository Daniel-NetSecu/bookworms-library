  <title>漫游者安格斯之歌</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">漫游者安格斯之歌</h2>

  <p class="EB03BodyTextIndented">我外出走到榛树林，</p>

  <p class="EB03BodyTextIndented">因有一团火在脑中。</p>

  <p class="EB03BodyTextIndented">我砍下榛树枝削成杆，</p>

  <p class="EB03BodyTextIndented">用线钩来一枚浆果；</p>

  <p class="EB03BodyTextIndented">当白蛾扇动翅膀，</p>

  <p class="EB03BodyTextIndented">当白蛾似的星辰闪耀而出，</p>

  <p class="EB03BodyTextIndented">我将浆果扔进溪水，</p>

  <p class="EB03BodyTextIndented">钓了条银色的小鳟鱼。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我把鱼放在地上，</p>

  <p class="EB03BodyTextIndented">又去把火吹着了，</p>

  <p class="EB03BodyTextIndented">但有某物在地上飒飒作响，</p>

  <p class="EB03BodyTextIndented">有人在以我的名字呼唤我；</p>

  <p class="EB03BodyTextIndented">它变成透着微光的女孩，</p>

  <p class="EB03BodyTextIndented">头上戴着苹果花环，</p>

  <p class="EB03BodyTextIndented">她以我的名字呼唤我，然后</p>

  <p class="EB03BodyTextIndented">跑开，消失在渐亮的空气里。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我老了，尽管漫游过</p>

  <p class="EB03BodyTextIndented">峡谷与山丘，</p>

  <p class="EB03BodyTextIndented">但我会找到她的踪迹，</p>

  <p class="EB03BodyTextIndented">亲吻她的唇，握住她的手；</p>

  <p class="EB03BodyTextIndented">沿着斑斓的草地漫步，</p>

  <p class="EB03BodyTextIndented">去采摘，直到时间终结，</p>

  <p class="EB03BodyTextIndented">那月亮的银苹果，</p>

  <p class="EB03BodyTextIndented">那太阳的金苹果。</p>
