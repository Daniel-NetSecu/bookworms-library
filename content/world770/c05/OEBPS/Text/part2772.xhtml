  <title>驴和骡子</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">驴和骡子</h1>

  <p>有一个人有一头驴和一头骡子，有一天，他让他们两个都驮上了重物出门旅行。开始的时候，路途平坦，驴表现良好，但是后来，他们来到了山边，路变得崎岖不平，而且还很陡，驴便喘不上气来了。他恳求骡子帮他分担一部分重物，但是骡子拒绝了。最后，由于体力耗尽，驴脚下踉跄，从一个陡坡上滚了下去，摔死了。主人很难过，却也只能尽力而为，他把驴身上驮的东西放到了骡子身上，然后又把驴的皮剥了下来，将那皮罩在了两份重物之上。骡子只能勉强支撑，他一路脚步蹒跚，自言自语道：“我这是活该。如果一开始同意帮助驴，我现在就不用背着他的负担和他的皮了。”</p>
