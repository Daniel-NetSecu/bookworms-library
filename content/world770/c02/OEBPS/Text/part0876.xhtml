  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">我可以为珍珠操点心</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我可以为珍珠操点心</p>

  <p class="EB03BodyTextIndented">它拥有广袤的大海；</p>

  <p class="EB03BodyTextIndented">或领针，当皇帝</p>

  <p class="EB03BodyTextIndented">把红宝石骤雨般朝我猛扔；</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">或者金子，他是矿山的王公；</p>

  <p class="EB03BodyTextIndented">或钻石，当我看见</p>

  <p class="EB03BodyTextIndented">可以配上一个穹顶的王冠</p>

  <p class="EB03BodyTextIndented">持续为我加冕。</p>
