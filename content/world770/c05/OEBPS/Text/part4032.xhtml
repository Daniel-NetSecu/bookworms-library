  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">40</h1>

  <p class="kindle-cn-poem-left">一个怀疑的微笑在你眼中闪烁，当我来向你告别的时候。<br/>
  我这样做的次数太多了，你想我很快又会回来。<br/>
  告诉你实话，我自己心里也有同样的怀疑。<br/>
  因为春天年年回来；<br/>
  满月道过别又来访问，花儿每年回来在枝上红晕着脸，<br/>
  很可能我向你告别只为要再回到你的身边。<br/>
  但是把这幻象保留一会儿吧，<br/>
  不要冷酷粗率地把它赶走。<br/>
  当我说我要永远离开你的时候，就当作真话来接受它，<br/>
  让泪雾暂时加深你眼边的黑影。<br/>
  当我再来的时候，随便你怎样地狡笑吧。</p>
