  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">61</h1>

  <p class="kindle-cn-poem-left">安静吧，我的心，让别离的时间甜柔吧。<br/>
  让它不是个死亡，而是圆满。<br/>
  让爱恋融入记忆，痛苦融入诗歌吧。<br/>
  让穿越天空的飞翔在巢上敛翼中终止。<br/>
  让你双手的最后的接触，像夜中的花朵一样温柔。<br/>
  站住一会儿吧，啊，“美丽的结局”，<br/>
  用沉默说出最后的话语吧。<br/>
  我向你鞠躬，举起我的灯来照亮你的归途。</p>
