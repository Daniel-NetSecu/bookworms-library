  <title>月亮和母亲</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">月亮和母亲</h1>

  <p>月亮恳求她的母亲给她做一件礼服。“怎么做啊？”母亲回答，“我没有办法让衣服的尺寸适合你啊。你有时候是新月，有时候是满月，还有时候既不是新月也不是满月。”</p>
