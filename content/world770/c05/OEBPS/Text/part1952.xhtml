  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">6</h1>

  <p class="kindle-cn-poem-left1">在香精没有提炼出来之时，<br/>
  别让冬天的粗手毁损盛夏，<br/>
  要让玉瓶生香，用美的珍异<br/>
  富饶沃土，趁那美尚未自杀。<br/>
  这样做不能称作放贷谋利，<br/>
  因为它让还债的还得开心：<br/>
  我是说你应生出另一个你，<br/>
  或者以一生十，十倍的欢欣。<br/>
  如有十个儿女仿你的玉颜，<br/>
  你就比现在增添十倍幸福；<br/>
  你在后代身上留下了遗产，<br/>
  即便辞世，那死神又有何惧！<br/>
  　　别任性了，你如此俊美，不该<br/>
  　　受制于死神，让蛆虫传宗接代。</p>
