  <h2 class="kindle-cn-heading2">63　爱情的火炬驱散幽暗</h2>

  <p class="kindle-cn-signature">兰多<span class="math-super"><a id="noteBack_1" href="part1506.xhtml#note_1">[1]</a></span></p>

  <p class="kindle-cn-poem-left">爱情的火炬驱散生活的幽暗，<br/>
  使坟墓活力充满。<br/>
  但千万别让它无益地照耀<br/>
  室外那些凝视天空的人，<br/>
  也千万别让它避开<br/>
  把它当作月亮和太阳的人：<br/>
  无论白天还是夜晚，<br/>
  这些人没有它就会迷失方向。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="note_1" href="part1506.xhtml#noteBack_1">[1]</a>华尔特·萨维奇·兰多（Walter Savage Landor，1775—1864），诗人、散文家，出生于富有的医师家庭。就读于牛津大学，因支持民主革命被校方勒令退学。曾参加志愿军赴西班牙作战。1795年出版第一部诗集，1798年出版史诗《格比尔》。散文集有《假想交谈》。</p>
