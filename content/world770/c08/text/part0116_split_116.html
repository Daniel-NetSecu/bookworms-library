<h1 class="calibre22" id="calibre_pb_218">第十六节</h1>

      <p class="x5">两个劳动阶级的相似之处。</p>

      <p class="x6">土地耕种者和手工业者这两个阶级，在许多方面都很相似，特别是构成这两个阶级的人群都没有任何收入，都是依靠从土地产品中付给他们的工资维持生计。二者还有一个相同的情况，那就是他们仅仅获得自身劳动和垫付的回报，而这种回报在两个阶级中几乎完全一样。土地所有者与土地耕种者达成协议，从产出中拿出尽可能少的部分支付给土地耕种者，就像他与鞋匠讨价还价，想尽可能便宜地买到鞋子一样。总而言之，不管是土地耕种者还是手工业者，他们得到的仅仅是对他们劳动的报偿。</p><a id="Section_cn_17"></a>
