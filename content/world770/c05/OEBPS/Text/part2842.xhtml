  <title>蚊子和狮子</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">蚊子和狮子</h1>

  <p>有一回，蚊子飞到狮子面前说：“我一点都不怕你，我觉得你甚至没有我的力量大。你的力量到底有多大呢？你不过是能用爪子挠用牙齿咬，就跟个发脾气的女人一样，此外就没有什么能耐了。但是我可比你强大多了，你要是不信，咱们就来比比看啊。”这么说着，蚊子嗡嗡嗡地飞向狮子，叮在他的鼻子上。狮子感觉到他的叮咬，匆忙之下抓伤了自己的鼻子，自己流了血，却没有伤到蚊子，蚊子耀武扬威地嗡嗡飞走了，因自己的胜利而得意扬扬。不过，很快，他撞上了蜘蛛网，被蜘蛛给抓住吃掉了，在击败了百兽之王后，成了一个不起眼的小虫子的猎物。</p>
