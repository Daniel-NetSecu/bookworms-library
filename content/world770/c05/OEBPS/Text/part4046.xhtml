  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">54</h1>

  <p class="kindle-cn-poem-left">市集已过，你在夜晚急急地提着篮子要到哪里去呢？<br/>
  他们都挑着担子回家去了；月亮从村树隙中下窥。<br/>
  唤船的回声从深黑的水上传到远处野鸭睡眠的泽沼。<br/>
  在市集已过的时候，你提着篮子急忙地要到哪里去呢？<br/>
  睡眠把她的手指按在大地的双眼上。<br/>
  鸦巢已静，竹叶的微语也已沉默。<br/>
  劳动的人们从田间归来，把席子展铺在院子里。<br/>
  在市集已过的时候，你提着篮子急忙地要到哪里去呢？</p>
