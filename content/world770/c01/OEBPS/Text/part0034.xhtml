<p class="title1" id="CHP32">LESSON 29</p>
<p class="picture"><img src="../Images/image01576.jpeg.webp" alt="alt"/></p>
<p class="normaltext">Look out for the cars!</p>
<p class="normaltext">How fast they come!</p>
<p class="normaltext">No horse can go as fast as the cars.</p>
<p class="normaltext">I will not try to catch them, for I should fall and be hurt.</p>
<p class="normaltext">See the horse look at the cars.</p>
<p class="normaltext">Will he not run?</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">小心那些汽车！</p>
<p class="normaltext">它们开得多快呀！</p>
<p class="normaltext">没有哪匹马能跑得像汽车一样快。</p>
<p class="normaltext">我不想追汽车，那样我会跌倒受伤的。</p>
<p class="normaltext">瞧，一匹马正看着汽车。它会想追吗？</p>
