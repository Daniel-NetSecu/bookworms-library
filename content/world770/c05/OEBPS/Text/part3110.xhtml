  <title>THE DOGS AND THE FOX</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">THE DOGS AND THE FOX</h1>

  <p>Some Dogs once found a lion's skin, and were worrying it with their teeth. Just then a Fox came by, and said, “You think yourselves very brave, no doubt; but if that were a live lion you'd find his claws a good deal sharper than your teeth.”</p>
