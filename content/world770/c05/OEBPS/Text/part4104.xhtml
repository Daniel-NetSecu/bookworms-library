  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">24</h1>

  <p>假如一天已经过去了，鸟儿也不歌唱，</p>

  <p>假如风也吹倦了，</p>

  <p>那就用黑暗的厚幕把我盖上吧，</p>

  <p>如同你在黄昏时节用睡眠的衾被裹上大地，</p>

  <p>又轻柔地将睡莲的花瓣合上。</p>

  <p>旅客的行程未达，粮袋已空，</p>

  <p>衣裳破裂污损，而又筋疲力尽，</p>

  <p>你解除了他的羞涩与困穷，</p>

  <p>使他的生命像花朵一样在仁慈的夜幕下苏醒。</p>
