<h2 class="heading" id="calibre_pb_7">蓝天博士</h2>

  <p class="p">蓝天博士是水箱温泉镇当地的医生。他曾经是大名鼎鼎的哈德森·大黄蜂，赢得过三座活塞杯。然而，他的赛车生涯因一场事故而终止。被赛场拒绝的他离开赛场，在水箱温泉小镇做了医生。在故事的最后，他作为麦坤的维修队长重回赛场。</p>
