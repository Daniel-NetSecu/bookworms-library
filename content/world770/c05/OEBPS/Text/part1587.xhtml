  <h2 class="kindle-cn-heading2">143　十月的罂粟花</h2>

  <p class="kindle-cn-signature">普拉斯</p>

  <p class="kindle-cn-poem-left">今日的朝霞也织不出这样的裙子，<br/>
  救护车里的女人也无能为力，<br/>
  她红艳艳的心透过外套，开放得令人震惊——</p>

  <p class="kindle-cn-poem-left">一件礼物，爱情的礼物，<br/>
  完全没人请求，<br/>
  便从天而降，</p>

  <p class="kindle-cn-poem-left">苍白地，火一般地，<br/>
  被圆顶礼帽下呆滞的眼睛<br/>
  点燃它的一氧化碳。</p>

  <p class="kindle-cn-poem-left">我的上帝啊，我究竟是何物，<br/>
  居然能使这些迟来的嘴巴大呼小叫，<br/>
  在凝霜的林中，在矢车菊开放的清晨？</p>
