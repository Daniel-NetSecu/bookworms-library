  <title>丢了铁锹的人</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">丢了铁锹的人</h1>

  <p>一个男人在他的葡萄园里面翻地，有一天发现他的铁锹不见了。他觉得极有可能是被他的长工偷走了，于是便严厉地审问，但所有的长工都说不知道。他并不相信，坚持认为他们应该去城里，到神庙里面发誓自己没有偷盗。他觉得村子里的神思维简单，不值得信任，认为贼人肯定通不过精明的城里的神的考验。等他们进了城里的神庙大门，就听到一个城里人正在宣布关于悬赏偷盗了庙里物品的贼人的信息。那人听了自言自语道：“算了，我还是回家吧。如果城里的神都没有办法探查到从他们的庙里偷东西的贼，让他们告诉我到底谁偷了我的铁锹，估计是不太可能的。”</p>
