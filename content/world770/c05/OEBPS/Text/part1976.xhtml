  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">30</h1>

  <p class="kindle-cn-poem-left1">当我传唤昔日旧情的记忆<br/>
  来赴沉思默想所设的公堂，<br/>
  我为未曾如愿的往事叹息，<br/>
  为年华的虚掷而再次悲伤。<br/>
  久不流泪的眼睛泪流如注，<br/>
  为悼念知友在长夜中长眠，<br/>
  为哀思已忘怀的爱情痛苦，<br/>
  为喟叹许多已消逝的美景。<br/>
  就这样，我为已逝之悲而悲，<br/>
  沉痛地计数那一件件旧事，<br/>
  将追怀过的痛苦再行追怀，<br/>
  好像旧债未了，得再还一次。<br/>
  　　但是，只要想到你，我的朋友，<br/>
  　　损失就已补偿，不复有烦忧。</p>
