  <title>小流浪者</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">小流浪者</h2>

  <p class="EB03BodyTextIndented">好妈妈，好妈妈，教堂里真冷，</p>

  <p class="EB03BodyTextIndented">酒吧里却惬意暖和又益身；</p>

  <p class="EB03BodyTextIndented">我习惯待着的还有别的地方，</p>

  <p class="EB03BodyTextIndented">那样的受用天堂里也比不上。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">但若在礼拜堂能给我们点啤酒，</p>

  <p class="EB03BodyTextIndented">给一盆好火烤起我们的精神，</p>

  <p class="EB03BodyTextIndented">我们愿一辈子天天祷告歌唱，</p>

  <p class="EB03BodyTextIndented">一次也不想跑出去漂泊流浪。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">牧师就可以讲道、喝酒和唱歌，</p>

  <p class="EB03BodyTextIndented">我们会像春天的小鸟一样快乐；</p>

  <p class="EB03BodyTextIndented">庄重的暗监夫人——她常在教堂，</p>

  <p class="EB03BodyTextIndented">就不会让罗圈腿的孩子挨打挨饿。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">上帝会像一位父亲，高高兴兴，</p>

  <p class="EB03BodyTextIndented">看到孩子们跟自己同样地幸福，</p>

  <p class="EB03BodyTextIndented">再不会跟那个魔王或酒桶争吵，</p>

  <p class="EB03BodyTextIndented">而是亲吻他，给他酒又给他衣服。</p>
