  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">A toad can die of light!</h2>

  <p class="EB03BodyTextIndented">A toad can die of light!</p>

  <p class="EB03BodyTextIndented">Deaths is the common right</p>

  <p class="EB03BodyTextIndented">Of toads and men, —</p>

  <p class="EB03BodyTextIndented">Of earl and midge</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">The privilege.</p>

  <p class="EB03BodyTextIndented">Why swagger then?</p>

  <p class="EB03BodyTextIndented">The gnat’s supremacy</p>

  <p class="EB03BodyTextIndented">Is large as thine.</p>
