  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">31</h1>

  <p class="kindle-cn-poem-left1">我以为我所爱的都已亡故，<br/>
  不想它们仍在你心中珍存；<br/>
  爱与可爱的，都在那里留驻，<br/>
  包括那些已经去世的友人。<br/>
  不知有多少圣洁、哀伤的泪<br/>
  从我眼中被追念的爱偷出，<br/>
  好像就是死者应得的资费，<br/>
  如今由你所藏，仅换了储处。<br/>
  你成了被埋的爱寄存的墓，<br/>
  那里挂满了亡友的纪念物，<br/>
  他们已将我的爱移交给你，<br/>
  如今是你独享着爱的全部。<br/>
  　　从你身上，我见到他们的影，<br/>
  　　你是代理，拥有我所有的情。</p>
