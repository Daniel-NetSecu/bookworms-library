  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">46</h1>

  <p class="kindle-cn-poem-left1">就为了瓜分探视你的权利，<br/>
  我的眼睛与心灵发生争战：<br/>
  眼睛禁止心灵视你的形体，<br/>
  心灵说眼睛无权把你独占。<br/>
  心灵争辩说，你居住在心里，<br/>
  那密室从来不为眼睛开放；<br/>
  而被告即刻驳回这一辩词，<br/>
  声言你的美在他那里滋长。<br/>
  为判决此案，那一大班思想——<br/>
  心灵的寓公，都参与了陪审；<br/>
  他们的裁决公允，并无不当，<br/>
  明眸与柔心共存，各按名分：<br/>
  　　我的眼睛获得你美的外在，<br/>
  　　我的心灵享有你内心的爱。</p>
