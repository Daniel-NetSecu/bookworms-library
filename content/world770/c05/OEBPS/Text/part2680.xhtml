  <title>船难幸存者和大海</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">船难幸存者和大海</h1>

  <p>有一个船难的幸存者奋力挣扎后终于爬上了海滩，累得睡着了。等他醒过来的时候，便厉声责备大海用平静明媚的表面迷惑众人，等人们扬帆起航后又翻脸发怒，让船和水手都葬身其中。大海以一个女人的样子显形，回答说：“水手先生，请不要责备我，要怪就怪风吧。我本来是和大地一样又平静又安全的，但是风却狂吹猛刮，让我发怒，那可不是我的本来面目啊。”</p>
