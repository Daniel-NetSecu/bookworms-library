<h1 class="title1">内容简介</h1>
<p class="normaltext">当有人用枪来得到他们想要的东西的时候，你该如何阻止他们呢？如果他们要什么，你就给什么，他们定会心花怒放——而且，更会得寸进尺，变本加厉。如果你不交出他们想要的东西，那么，就可能会惹恼他们——他们可能会杀了你。很难说到底该怎么办才好。</p>
<p class="normaltext">在这个故事中，面对这个两难境地的是首相，一位政府首脑。但首相也是和我们一样的普通人——有家庭，有孩子。</p>
<p class="normaltext">如果有人拿枪对着你的家人，你怎样才能让头脑保持清醒呢？你该怎么做呢？你采纳别人的建议，跟劫机者展开对话，搞清楚他们到底想要什么，你尽力让大家保持冷静，你慢慢地采取行动。但是，恐怖分子可不愿意等你，迟早你得决定到底该怎么办……</p>
