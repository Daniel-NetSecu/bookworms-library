  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">我的轮子在黑暗中</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我的轮子在黑暗中，——</p>

  <p class="EB03BodyTextIndented">我看不到一根轮辐，</p>

  <p class="EB03BodyTextIndented">可是知道它嘀嗒嗒的脚</p>

  <p class="EB03BodyTextIndented">绕了一圈又一圈。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我的脚踩在浪涛上——</p>

  <p class="EB03BodyTextIndented">一条人迹罕至的路，</p>

  <p class="EB03BodyTextIndented">可是所有的路</p>

  <p class="EB03BodyTextIndented">尽头都有一块空地。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">有些人放弃了织布机，</p>

  <p class="EB03BodyTextIndented">有些在忙碌的坟墓</p>

  <p class="EB03BodyTextIndented">找到稀奇的消遣，</p>

  <p class="EB03BodyTextIndented">有些用崭新、庄重的脚步</p>

  <p class="EB03BodyTextIndented">尊贵地经过大门，</p>

  <p class="EB03BodyTextIndented">把问题又抛回给你和我。</p>
