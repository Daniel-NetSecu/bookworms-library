  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">60</h1>

  <p class="kindle-cn-poem-left">在生命奔腾怒吼的中流，啊，石头雕成的“美”，<br/>
  你冷静无言，独自超绝地站立着。<br/>
  “伟大的时间”依恋地坐在你脚边低语说：<br/>
  “说话吧，对我说话吧，我爱，说话吧，我的新娘！”<br/>
  但是你的话被石头关住了，啊，“不动的美”！</p>
