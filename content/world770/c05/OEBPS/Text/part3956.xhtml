  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">51</h1>

  <p class="kindle-cn-poem-left">THEN finish the last song and let us leave.<br/>
  Forget this night when the night is no more.<br/>
  Whom do I try to clasp in my arms? Dreams can never be made captive.<br/>
  My eager hands press emptiness to my heart and it bruises my breast.</p>
