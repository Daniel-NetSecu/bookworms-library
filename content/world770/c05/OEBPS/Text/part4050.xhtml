  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">58</h1>

  <p class="kindle-cn-poem-left">有一天早晨，一个盲女来献给我一串盖在荷叶下的花环。<br/>
  我把它挂在颈上，泪水涌上我的眼睛。<br/>
  我吻了她，说：“你和花朵一样地盲目。<br/>
  你自己不知道你的礼物是多么美丽。”</p>
