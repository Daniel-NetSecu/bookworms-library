  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">14</h1>

  <p class="kindle-cn-poem-left">我在路边行走，也不知道为什么，<br/>
  时已过午，竹枝在风中簌簌作响。<br/>
  横斜的影子伸臂拖住流光的双足。<br/>
  布谷鸟都唱倦了。<br/>
  我在路边行走，也不知道为什么。<br/>
  低垂的树荫盖住水边的茅屋。<br/>
  有人正忙着工作，她的钏镯在一角放出音乐。<br/>
  我在茅屋前面站着，我不知道为什么。<br/>
  曲径穿过一片芥菜田地和几层芒果树林。<br/>
  它经过村庙的渡头的市集。<br/>
  我在这茅屋面前停住了，我不知道为什么。<br/>
  好几年前，三月风吹的一天，<br/>
  春天倦慵地低语，芒果花落在地上。<br/>
  浪花跳起掠过立在渡头阶沿上的铜瓶。<br/>
  我想着三月风吹的这一天，我不知道为什么。<br/>
  阴影更深，牛群归栏。<br/>
  冷落的牧场上日色苍白，村人在河边待渡。<br/>
  我缓步回去，我不知道为什么。</p>
