  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">80</h1>

  <p class="kindle-cn-poem-left1">多懊丧啊，当我写诗赞美你，<br/>
  却得知有高手借重你的名，<br/>
  不遗余力地为你编撰颂词，<br/>
  好让我从此只能搁笔噤声！<br/>
  但你浩荡的美德犹如海洋，<br/>
  无论小舟巨舰，你一概承载，<br/>
  我这条小舢，虽微寒而鲁莽，<br/>
  也能现身于碧水，自由自在。<br/>
  你的浅水滩就能让我漂流，<br/>
  而他得航行在无底的深渊；<br/>
  倾覆时，我所失仅一叶小舟，<br/>
  而他损失的是高桅和巨帆。<br/>
  　　如他春风得意，而我被遗忘，<br/>
  　　最坏的结果是：爱使我灭亡。</p>
