  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">141</h1>

  <p class="kindle-cn-poem-left1">说实话，我的眼睛并不爱你，<br/>
  因为眼睛发现你缺点太多；<br/>
  但眼所蔑视的，心偏生爱意，<br/>
  不管眼所见，心已被你俘获。<br/>
  我的耳不喜欢听你的嗓音，<br/>
  低俗的触觉对你兴趣索然，<br/>
  味觉和嗅觉，不稀罕受邀请，<br/>
  赴你独力承办的感官大餐。<br/>
  但是，无论五智或五种官能，<br/>
  都不能劝阻痴心为你服务，<br/>
  我的心已全然不顾我这人，<br/>
  甘愿为你傲慢的心做贱仆。<br/>
  　　但我从这瘟病中也有所得：<br/>
  　　她教我犯罪，让我忧心惨切。</p>
