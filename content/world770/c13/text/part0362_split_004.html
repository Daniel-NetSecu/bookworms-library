<h2 class="heading" id="calibre_pb_3">疯帽子</h2>

  <p class="p">爱丽丝的朋友，曾是白皇后的制帽匠。疯帽子相信爱丽丝就是那个真正的爱丽丝，尽管其他人并不完全信服。</p>

  <p class="p">他参与了对抗红皇后的地下世界抵抗组织，该组织成员还有三月兔和睡鼠。疯帽子家族在炸脖龙的一次袭击时遭到杀害。作为唯一的幸存者，他因负罪感而被逼疯。</p>
