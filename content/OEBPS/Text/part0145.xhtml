<p class="title1" id="CHP3">内容简介</p>
<p class="normaltextx">“天气真好。哦，我忘了——你出不去。哈哈哈！”监狱看守说。布朗正在坐牢——坐五年牢！他能做的只有看书。监狱看守讨厌他，给他糟糕的食物。“这不是生活。我必须从这儿逃出去。”他想。</p>
<p class="normaltext"><br/></p>
<p class="normaltextx">后来有一天，他从那扇很小的窗户往外看，看到了一只鸟。“那只鸟是自由的。”他想。突然，他有了一个主意：“我可以像那只鸟一样……”</p>
<p class="normaltext"><br/></p>
<p class="normaltextx">布朗有了什么主意？他怎么才能像鸟一样？他能逃出监狱吗？</p>
