  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">80</h1>

  <p>我像一片秋天的残云，无主地在空中飘荡。</p>

  <p>啊，我的永远光耀的太阳！</p>

  <p>你的摩触还没有蒸化我的水汽，使我与你的光明合一。</p>

  <p>因此我计算着和你分离的悠长的年月。</p>

  <p>假如这是你的愿望，假如这是你的游戏，</p>

  <p>就请把我这流逝的空虚染上颜色，</p>

  <p>镀上金辉，让它在狂风中飘浮，舒卷成种种的奇观。</p>

  <p>而且假如你愿意在夜晚结束这场游戏，</p>

  <p>我就在黑暗中，或在灿白晨光的微笑中，</p>

  <p>在净化的清凉中，融化消失。</p>
</body></html>
