  <title>橄榄树和无花果树</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">橄榄树和无花果树</h1>

  <p>橄榄树嘲笑无花果树在特定季节会落叶。“你每个秋天都要落叶，一直光秃秃的，直到下个春天。而我呢，你看，常年绿色，一直繁茂。”没多久，下了一场大雪，雪在橄榄树的叶子上积了很多，压得她都弯了，最后折断了。而雪花从无花果树光秃秃的树枝间落下，无花果树丝毫没有受到影响，活了下来，迎来了一个又一个丰收。</p>
