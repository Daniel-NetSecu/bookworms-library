<h2 class="heading" id="calibre_pb_1">瑞拉</h2>

  <p class="p3"><span class="txt-c">●</span> 瑞拉，即灰姑娘，是一位有同情心、慷慨大方的年轻女孩。她一直努力信守自己对母亲的承诺：会坚强而勇敢，仁慈而善良；会照管他们的家，尽管它已经被继母和她带过来的两个姐姐所占据了。不管遇到什么事情，遇到什么人，她都一直忠于自己。</p>
