  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">139</h1>

  <p class="kindle-cn-poem-left1">啊，别让我原谅你无义无情，<br/>
  宽恕你对我的伤害和冒犯，<br/>
  要害我就用舌头，别用眼睛，<br/>
  用你浑身的力量，而非手腕。<br/>
  爱人啊，告诉我你另有所爱，<br/>
  但在我面前，不要跟人调情；<br/>
  我势单力薄，要想将我伤害，<br/>
  你力量足够，何用诡计阴损？<br/>
  让我为你辩护：我爱人明白<br/>
  我的仇敌恰恰是她的目光，<br/>
  她便让它们从我脸上挪开，<br/>
  让那害人的毒箭射向他方。<br/>
  　　你不必这样做：我行将就木，<br/>
  　　那箭应射杀我，免我的痛苦。</p>
