  <title>狐狸和猴子</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">狐狸和猴子</h1>

  <p>狐狸和猴子一起走在路上，为了谁的出身更好争论了起来。两个人吵了一段时间，直到他们路过一片公墓，那里有很多墓碑，猴子停了下来，环顾四周，长叹一口气。狐狸问：“你为什么叹气啊？”猴子指着那些坟墓回答说：“你看看这些墓碑，全都是为了纪念我的祖辈而立，他们生前可全都是伟人啊。”狐狸先是无言以对，然后很快恢复正常，说道：“哎呀！接着扯谎吧，先生，没事的，我肯定你的那些祖先不会爬出来揭穿你的。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：吹牛的人在无法被揭穿时吹得最大。</p>
</body></html>
