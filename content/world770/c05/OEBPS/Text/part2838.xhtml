  <title>骗子</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">骗子</h1>

  <p>有一个人病了，情况很糟糕，他发誓说，如果神能令他恢复健康，他愿意献祭一百头公牛。诸神想看看他是否遵守诺言，便让他迅速康复了。可是他却连一头牛都没有，于是他用油脂做了一百头小小的牛，送到了祭坛，同时说：“诸神，我请你们来见证，我来兑现自己的诺言了。”诸神决定以眼还眼，所以他们给他托了一个梦，让他去海边，在那可以找到一百个克朗。醒来之后，他十分兴奋，匆匆忙忙赶去了海边，结果却落到了一伙强盗手里，他们抓住他，将他当作奴隶卖掉了，他们卖掉他的价钱正好是一百个克朗。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：不要空许诺言。</p>
