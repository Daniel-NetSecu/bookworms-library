  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">29</h1>

  <p class="kindle-cn-poem-left">对我说吧，我爱！用言语告诉我你唱的是什么。<br/>
  夜是深黑的，星星消失在云里，风在叶丛中叹息。<br/>
  我将披散我的头发，<br/>
  我的青蓝的披风将像黑夜一样地紧裹着我。<br/>
  我将把你的头紧抱在胸前；<br/>
  在甜柔的寂寞中在你心头低诉。<br/>
  我将闭目静听。我不会看望你的脸。<br/>
  等到你的话说完了，我们将沉默凝坐。<br/>
  只有丛树在黑暗中微语。<br/>
  夜将发白。天光将晓。<br/>
  我们将望望彼此的眼睛，然后各走各的路。<br/>
  对我说话吧，我爱！用言语告诉我你唱的是什么。</p>
