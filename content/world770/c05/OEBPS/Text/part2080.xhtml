  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">134</h1>

  <p class="kindle-cn-poem-left1">现在我得承认，他为你所有，<br/>
  我自身也押给了你的贪婪，<br/>
  我甘愿被没收，以便你放手<br/>
  另一个我，并让我得到慰安。<br/>
  但你不愿意，他也不想获释，<br/>
  因为你太贪心，而他太善良；<br/>
  他只想做保人立一份凭契，<br/>
  让你释放我，他自己进牢房。<br/>
  而你是谋高利的，唯利是图，<br/>
  你将美作为资本到处放贷，<br/>
  你控告我友因我成了债户，<br/>
  由于你的诽谤，我痛失朋辈。<br/>
  　　我失去他，你把他和我占有，<br/>
  　　他付出全部，而我仍不自由。</p>
