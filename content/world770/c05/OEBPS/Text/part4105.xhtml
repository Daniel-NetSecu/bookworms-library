  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">25</h1>

  <p>在这困倦的夜里，</p>

  <p>让我帖服地把自己交给睡眠，</p>

  <p>把信赖托付给你。</p>

  <p>让我不去勉强我萎靡的精神，</p>

  <p>来准备一个对你敷衍的礼拜。</p>

  <p>是你拉上夜幕盖上白日的倦眼，</p>

  <p>使这眼神在醒来后的清新喜悦中更新起来。</p>
