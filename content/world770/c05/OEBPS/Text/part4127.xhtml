  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">47</h1>

  <p>夜已将近，等他又落了空。</p>

  <p>我怕在清晨我正在倦睡，他忽然来到我的门前。</p>

  <p>啊，朋友们，给他开着门吧——不要拦阻他。</p>

  <p>若是他的脚步声没有把我惊醒，请不要叫醒我。</p>

  <p>我不愿意小鸟嘈杂的合唱，和庆祝晨光的狂欢的风声，</p>

  <p>把我从睡梦中吵醒。</p>

  <p>即使我的主突然来到我的门前，也让我无扰地睡着。</p>

  <p>啊，我的睡眠，宝贵的睡眠，只等着他的摩触来消散。</p>

  <p>啊，我的合着的眼，只在他微笑的光中才开睫，</p>

  <p>当他像从洞黑的睡眠里浮现的梦一般地站立在我面前。</p>

  <p>让他作为最初的光明和形象，来呈现在我的眼前。</p>

  <p>让他的眼光成为我觉醒的灵魂最初的欢跃。</p>

  <p>让我自我的返回成为向他立地的皈依。</p>
