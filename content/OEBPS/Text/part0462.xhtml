<p class="title1">简　　介</p>
<p class="normaltext">你可以许三个愿，你可以要世界上存在的三样东西，你的愿望将变为现实。你会说，“这在现实世界是不可能发生的。”那么，好好想想吧。你能要什么？你想要什么？</p>
<p class="normaltext">当你许愿的时候，这仅仅是个开始。当你改变了一样东西，接着你会改变世界上的每一样东西。一个变化引起另一个变化。谁又能知道这些变化又将在哪里结束？</p>
<p class="normaltext">在这个故事中，怀特一家可以许三个愿，但他们犯了一个小小的错误。他们的第一个愿望变成了现实。接着，顷刻间，他们的生活陷入了一场可怕的恶梦……</p>
<p class="normaltext"><br/></p>
<p class="normaltext">雅各布斯（1863—1943）是一位短篇小说作家。《猴爪》是他的最有名的小说之一。</p>
