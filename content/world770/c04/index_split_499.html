<p id="filepos1076907" class="calibre_15">亲爱的小读者：</p><p class="calibre_16">很高兴在“神奇树屋”系列图书与你们见面。这里有你们喜欢的魔法和冒险故事，还有你们感兴趣的科学、历史、地理、文化、艺术、自然和体育等知识。相信无论是刚开始阅读桥梁书的小朋友，还是有丰富阅读经验的青少年，都会通过这套书爱上阅读。</p><p class="calibre_16">学会阅读和热爱阅读是自由的“通行证”，能帮你们跨越和打破一个又一个边界和界限。你们可以从中获取知识，帮助自己克服生活中所面临的各种困难，还可以从中发现最好的自己，并用自己的才能去帮助别人。</p><p class="calibre_16">祝你们阅读愉快！</p><blockquote class="calibre_17"><blockquote class="calibre_18">玛丽·波·奥斯本</blockquote></blockquote><blockquote class="calibre_19"><blockquote class="calibre_20"><img src="images/00120.jpg.webp" class="calibre_21"/>  </blockquote></blockquote><div class="mbp_pagebreak" id="calibre_pb_499"></div>
