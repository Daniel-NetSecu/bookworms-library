<h1 class="calibre22" id="calibre_pb_229">第二十七节</h1>

      <p class="x5">最后一种方式也是最有利的一种方式，但是这种方式要以国家的富足为前提。</p>

      <p class="x6">这种保障土地的方法对土地所有者和耕种者都是最有利的。凡是存在能够垫付耕种所需费用的富足的耕种者的地方，都普遍利用这种方式。由于富足的耕种者能够对土地投入更多的劳动和肥料，因而这能够极大地提高产量和土地收入。</p>

      <p class="x6">在皮卡第、诺曼底、巴黎郊区，以及法国北部的大多数省份，土地是由农民来耕种的；在南部地区，则是由对分佃农耕种。因此，北部省份比南部省份富裕得多，土地也比南部耕种得好。</p><a id="Section_cn_28"></a>
