  <title>保姆之歌</title>

  <h2 class="EB04MainHeadClosedTitle">保姆之歌</h2>

  <p class="EB03BodyTextIndented">当孩子们的声音从草坪传来，</p>

  <p class="EB03BodyTextIndented">喁语阵阵轻飘在山谷，</p>

  <p class="EB03BodyTextIndented">我的春光就生动地浮现在脑海：</p>

  <p class="EB03BodyTextIndented">我的脸发青，一会儿又泛白。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">该回来了，我的孩子，太阳落山了，</p>

  <p class="EB03BodyTextIndented">夜间的露水也已经出来，</p>

  <p class="EB03BodyTextIndented">你们的春光和白昼在游戏中荒废了，</p>

  <p class="EB03BodyTextIndented">你们的白昼和夜晚在借口中浪费了。</p>
