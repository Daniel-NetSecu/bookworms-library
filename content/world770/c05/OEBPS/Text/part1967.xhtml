  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">21</h1>

  <p class="kindle-cn-poem-left1">我写诗有别于另一位缪斯，<br/>
  他总是歌吟那些脂粉丽人，<br/>
  整个天宇都成了她的装饰，<br/>
  人间一切尤物，为她而铺陈；<br/>
  他所作的比喻总极其轻浮，<br/>
  说她就是日月，天地的珍异，<br/>
  四月的鲜花，以及广袤天幕<br/>
  所能包容的一切稀世珠玑。<br/>
  忠于爱的我只会如实描述，<br/>
  请相信我吧，虽然我的爱人<br/>
  比不上天上那灿烂的金烛，<br/>
  但不逊于任何母亲之所生。<br/>
  　　那样的假话让他去说个够，<br/>
  　　我无须夸口，因我并不兜售。</p>
