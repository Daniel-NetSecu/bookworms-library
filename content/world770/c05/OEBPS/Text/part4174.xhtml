  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">94</h1>

  <p>在我动身的时光，祝我一路福星吧，我的朋友们！</p>

  <p>天空里晨光辉煌，我的前途是美丽的。</p>

  <p>不要问我带些什么到那边去。</p>

  <p>我只带着空空的手和企望的心。我要戴上我婚礼的花冠。</p>

  <p>我穿的不是红褐色的行装，虽然间关险阻，我心里也没有惧怕。</p>

  <p>旅途尽处，晚星将生，从王宫的门口将弹出黄昏的凄乐。</p>
