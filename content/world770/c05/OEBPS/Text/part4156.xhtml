  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">76</h1>

  <p>过了一天又是一天，啊，我生命的主，我能够和你对面站立吗？</p>

  <p>啊，全世界的主，我能合掌和你对面站立吗？</p>

  <p>在广阔的天空下，严静之中，</p>

  <p>我能够带着虔恭的心，和你对面站立吗？</p>

  <p>在你的劳碌的世界里，喧腾着劳作和奋斗，</p>

  <p>在营营扰扰的人群中，我能和你对面站立吗？</p>

  <p>当我已做完了今生的工作，</p>

  <p>啊，万王之王，我能够独自悄立在你的面前吗？</p>
