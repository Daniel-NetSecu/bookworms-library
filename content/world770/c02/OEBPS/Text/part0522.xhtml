  <title>内战时期的沉思（节选）</title>

  <h2 class="EB04MainHeadClosedTitle">内战时期的沉思（节选）</h2>

  <p class="center">Ⅵ 我窗边的欧椋鸟巢</p>

  <p class="EB03BodyTextIndented">蜂群筑巢，在松动的墙壁</p>

  <p class="EB03BodyTextIndented">缝隙里，在那儿</p>

  <p class="EB03BodyTextIndented">母鸟带来了蛴螬和蝇虫。</p>

  <p class="EB03BodyTextIndented">我的墙松了，蜜蜂，</p>

  <p class="EB03BodyTextIndented">来欧椋鸟的空房筑巢吧。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我们关在里面，钥匙转动</p>

  <p class="EB03BodyTextIndented">在我们的确定之外；某处</p>

  <p class="EB03BodyTextIndented">有人被杀，或有房子被焚，</p>

  <p class="EB03BodyTextIndented">但没有清晰的事实去确认：</p>

  <p class="EB03BodyTextIndented">来欧椋鸟的空房筑巢吧。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">石头或木头做的街垒；</p>

  <p class="EB03BodyTextIndented">内战时期的十四天；</p>

  <p class="EB03BodyTextIndented">昨夜他们沿路运送</p>

  <p class="EB03BodyTextIndented">一个浑身是血的年轻士兵：</p>

  <p class="EB03BodyTextIndented">来欧椋鸟的空房筑巢吧。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我们用幻想喂养心灵，</p>

  <p class="EB03BodyTextIndented">心因这食粮变得残忍；</p>

  <p class="EB03BodyTextIndented">相比我们的爱，我们的敌意里</p>

  <p class="EB03BodyTextIndented">有更多的实质；哦，蜜蜂，</p>

  <p class="EB03BodyTextIndented">来欧椋鸟的空房筑巢吧。</p>
