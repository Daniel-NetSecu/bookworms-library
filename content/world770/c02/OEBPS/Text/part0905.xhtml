  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">要阻挡他黄色的计划</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">要阻挡他黄色的计划，</p>

  <p class="EB03BodyTextIndented">太阳不允许</p>

  <p class="EB03BodyTextIndented">大气的反复无常；</p>

  <p class="EB03BodyTextIndented">甚至当雪</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">像恶作剧的男孩扔起雪球</p>

  <p class="EB03BodyTextIndented">到他的眼睛里，</p>

  <p class="EB03BodyTextIndented">他也不过是转过头；</p>

  <p class="EB03BodyTextIndented">正忙于崇高的事业！</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">催动大地</p>

  <p class="EB03BodyTextIndented">磁吸大海是他的事儿，</p>

  <p class="EB03BodyTextIndented">并让天象各安其所——</p>

  <p class="EB03BodyTextIndented">可每个过客</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">都认为我们更繁忙，</p>

  <p class="EB03BodyTextIndented">就像一只飘荡的微不足道的蜜蜂</p>

  <p class="EB03BodyTextIndented">支持一道闪电，</p>

  <p class="EB03BodyTextIndented">理应是颗炸弹！</p>
</body></html>
