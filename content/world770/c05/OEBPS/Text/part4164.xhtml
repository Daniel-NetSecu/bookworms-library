  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">84</h1>

  <p>离愁弥漫世界，在无际的天空中生出无数的情境。</p>

  <p>就是这离愁整夜地悄望星辰，</p>

  <p>在七月阴雨之中，萧萧的树籁变成抒情的诗歌。</p>

  <p>就是这笼压弥漫的痛苦，加深而成为爱欲，而成为人间的苦乐；</p>

  <p>就是它永远通过诗人的心灵，融化、流涌而成为诗歌。</p>
