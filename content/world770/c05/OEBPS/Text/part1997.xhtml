  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">51</h1>

  <p class="kindle-cn-poem-left1">我已渐走渐远，但是为了爱，<br/>
  仍宽恕了马驹步履的迟缓，<br/>
  既然背了道，速度岂能加快？<br/>
  如要催马扬鞭，就得往回赶。<br/>
  那时，极速在我眼里是龟行，<br/>
  可怜的畜生，我岂容它怠惰！<br/>
  它就是乘了风，我也要加鞭，<br/>
  它长了翅膀，我不会有感觉！<br/>
  马儿不能与我的欲望争胜，<br/>
  因为欲望由纯洁的美滋养，<br/>
  它一旦嘶鸣，能让万马惊魂，<br/>
  但爱为了爱，且将驽马原谅。<br/>
  　　背道时，我的马曾有意磨蹭，<br/>
  　　让它慢行吧，我要朝你狂奔。</p>
