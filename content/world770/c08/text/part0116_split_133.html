<h1 class="calibre22" id="calibre_pb_235">第三十三节</h1>

      <p class="x5">商业根据其他商品确定所有商品的现时价值；从此，所有商品都成为一定数量的其他任何商品的等值物，可以看作某种商品的代表物。</p>

      <p class="x6">谷物不仅可以兑换葡萄酒，还可以兑换谷物所有者所需的任何物品，如木材、皮革、羊毛和棉花等等。葡萄酒和其他任何物品都一样。如果一蒲式耳谷物等值于六品脱葡萄酒，而一只绵羊等值于三蒲式耳谷物，那么，同样一只绵羊就等值于十八品脱葡萄酒。拥有谷物而需要葡萄酒的人，就可以很方便地用他的谷物兑换一只绵羊，然后再用绵羊兑换自己所需的葡萄酒。</p><a id="Section_cn_34"></a>
