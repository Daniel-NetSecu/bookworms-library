<h1 class="calibre22" id="calibre_pb_257">第五十五节</h1>

      <p class="x5">另外一种流动财富和农业的必要垫付——奴隶。</p>

      <p class="x6">奴隶是另外一种个人财产，最初通过暴力获得，后来通过商业和交换获得。拥有很多奴隶的人不仅利用奴隶耕种土地，还让他们从事各种其他的劳动。由于这两种财富都很容易几乎可以毫无限制地积累，而且与土地分离后仍然可以方便地使用，从而导致土地本身被估价，并且可以用土地的价值与流动财富进行比较。</p><a id="Section_cn_56"></a>
