  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">40</h1>

  <p class="kindle-cn-poem-left1">爱友啊，我所爱的，你都拿走，<br/>
  再看看你一共收获了几许；<br/>
  真正的爱你不可能再拥有，<br/>
  因为我的爱早已归你所属。<br/>
  如你因爱我而夺走我的爱，<br/>
  我怎能谴责你消受的权利？<br/>
  如果你欺骗自己，任性胡来，<br/>
  做出违心的事，就应受责斥。<br/>
  温柔的盗贼，我仍要宽恕你，<br/>
  尽管你抢劫了我全部财产，<br/>
  但是爱懂得：爱所犯的罪戾，<br/>
  比那公然的恨更让人伤感。<br/>
  　　风流的美啊，诸恶因你而起，<br/>
  　　但即便恨死我，你我不为敌。</p>
