  <title>雅典人和底比斯人</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">雅典人和底比斯人</h1>

  <p>一个雅典人和一个底比斯人一起行路，和其他的旅行者一样，他们在路上聊天来打发时间。在谈论了很多话题之后，他们谈到了英雄，这个话题虽然没有太多教育意义，却有许多值得说的。他们都大力夸耀各自城邦的英雄，到最后，底比斯人坚持说赫拉克勒斯是世上最伟大的英雄，现在跻身于众神的前列。而雅典人则坚称忒修斯更加伟大，因为他的命运在多方面都受到了眷顾，而赫拉克勒斯却曾经被迫为奴。他证明了自己的观点，因为他像所有的雅典人一样牙尖嘴利，底比斯人在说话方面根本不是他的对手，最后厌恶地说：“好吧，随便你，我只希望，我们的英雄发怒，让雅典人尝尝赫拉克勒斯的厉害，而底比斯人则只受忒修斯的苦。”</p>
