  <h2 class="EB04MainHeadClosedTitle">母鸡和燕子</h2>

  <p class="EB03BodyTextIndented">一只母鸡发现了一窝蛇蛋，小心翼翼地为它们保温，精心地将它们孵化了出来。一只燕子发现了她的所作所为，对她说：“你这个蠢东西！你为什么要孵这些蛇呀？当他们长大之后，会危害所有生物，就从你开始！”</p>
