    <h1 class="kindle-cn-heading-1">作者简介</h1>

    <p>简·奥斯汀（1775—1817），英国女作家。生于乡村小镇斯蒂文顿一个牧师家庭。没有上过正规学校，但受到较好的家庭教育，主要教材就是父亲的文学藏书。20岁左右开始写作，共出版了6部长篇小说。奥斯汀以女性特有的细致入微的观察力，真实地描绘了她周围的小天地，尤其是绅士淑女间的婚姻和爱情。她的作品格调轻松诙谐，富有喜剧性冲突，深受读者欢迎。主要作品有《理智与情感》、《傲慢与偏见》、《曼斯菲尔德庄园》、《爱玛》等。</p>
