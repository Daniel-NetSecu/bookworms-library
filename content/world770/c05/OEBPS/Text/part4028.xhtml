  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">36</h1>

  <p class="kindle-cn-poem-left">他低声说：“我爱，抬起眼睛吧。”<br/>
  我严厉地责骂他说：<br/>
  “走！”但是他不动。<br/>
  他站在我面前拉住我的双手。我说：<br/>
  “躲开我！”但是他没有走。<br/>
  他把脸靠近我的耳边。我瞪他一眼说：<br/>
  “不要脸！”但是他没有动。<br/>
  他的嘴唇触到我的腮颊。我震颤了，说：<br/>
  “你太大胆了！”但是他不怕丑。<br/>
  他把一朵花插在我发上。我说：<br/>
  “这也没有用处！”但是他站着不动。<br/>
  他取下我颈上的花环就走开了。<br/>
  我哭了，问我的心说：<br/>
  “他为什么不回来呢？”</p>
