  <h2 class="EB04MainHeadClosedTitle">战马和磨坊主</h2>

  <p class="EB03BodyTextIndented">一匹战马年老体衰，不再征战四方，而是被送到一家磨坊工作。</p>

  <p class="EB03BodyTextIndented">不过，当他被迫拉磨而不是在战争中服役时，便哀叹起命运的变化，并联想起自己之前的境遇，他说道：“啊！磨坊主，我之前的确四处征战，但我从背到尾巴都披着华服，有专人喂我。我现在想不通是什么促使我放弃服役，选择来磨坊的。”</p>

  <p class="EB03BodyTextIndented">“忍忍吧，”磨坊主对他说，“你一味地对过去喋喋不休，但命运总是起起伏伏的呀。”</p>
