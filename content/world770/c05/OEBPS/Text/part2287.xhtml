  <div class="chapter" id="chapter">
    <h1 class="kindle-cn-heading-1">高老头（重译本）</h1>

    <p>批评家称高老头为近代的李尔王。但在社会观点上，它比莎翁的名剧意义更广深。巴尔扎克的人物不只是一个人物，而是时代的典型；悲剧的因素也不限于个人的性情气质，而尤在乎淫靡腐化的社会环境。鲍赛昂夫人代表没落的贵族，以隐遁终场；拉斯蒂涅与伏脱冷代表新兴阶级的两种作风：一个像瘟疫般钻进社会，一个像炮弹般轰进社会。野心家求名求利的挣扎，与高老头绝望的父爱交错之下，使小说内容愈显得光怪陆离，动人心魄。本书初译于一九四四年，印过四版，销达九千余部。兹因译者不满译者风格，特全部修正重译。交由本社<a id="chapter3-fn1" href="part2287.xhtml#chapter3-ft1"><sup>[1]</sup></a>出版。</p>
  </div>
