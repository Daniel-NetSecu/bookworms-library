  <div class="chapter" id="chapter">
    <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">三只小老鼠</h1>

    <p>三只小老鼠，坐下来纺纱。</p>

    <p>小猫经过了，偷偷看过来。</p>

    <p>你们在干吗，我的好伙计？</p>

    <p>我们做衣服，给绅士们穿。</p>

    <p>让我进去吧，帮你们咬线头儿。</p>

    <p>哦，不用了！猫小姐，你会咬掉我们的头！</p>
