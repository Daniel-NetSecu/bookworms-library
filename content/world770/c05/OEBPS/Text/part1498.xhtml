  <h2 class="kindle-cn-heading2">55　一朵红红的玫瑰</h2>

  <p class="kindle-cn-signature">彭斯</p>

  <p class="kindle-cn-poem-left">哦，我的爱人像一朵红红的玫瑰，<br/>
  刚刚在六月天开放；<br/>
  哦，我的爱人像一支悦耳的歌，<br/>
  伴着优美的曲调弹唱！</p>

  <p class="kindle-cn-poem-left">我的好姑娘，因为你长得美，<br/>
  我深深地将你爱慕，<br/>
  亲爱的，我将永远爱你，<br/>
  直到所有的海水干涸。</p>

  <p class="kindle-cn-poem-left">亲爱的，直到所有的海水干涸，<br/>
  直到顽石被太阳融化，<br/>
  亲爱的，我将永远爱你，<br/>
  只要我尚留生命的光华。</p>

  <p class="kindle-cn-poem-left">再见吧，我唯一的爱人，<br/>
  让我们暂时分离，<br/>
  我会回来的，我的爱人，<br/>
  哪怕相隔千里万里！</p>
