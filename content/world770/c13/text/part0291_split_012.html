<h2 class="heading" id="calibre_pb_11">贝利</h2>

  <p class="p">贝利是一头居住在海洋生物研究所的白鲸。他总觉得自己的声呐系统发生了故障。但海洋生物研究所的医生们却发现他很健康，没有任何毛病。</p>
