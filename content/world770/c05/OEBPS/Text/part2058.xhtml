  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">112</h1>

  <p class="kindle-cn-poem-left1">你的爱情与怜悯足以消除<br/>
  流言烙刻在我脸上的疤痕，<br/>
  有你护我的短，赞我的好处，<br/>
  我不在乎别人的言重言轻。<br/>
  你是我的整个世界，我必须<br/>
  努力弄清你对我的褒与贬；<br/>
  至于他人，我一概视为无物，<br/>
  铁石般的心，只为你而生变。<br/>
  别人闲言，我弃于万丈深坑，<br/>
  无论中伤恶语，或善意赞辞，<br/>
  我全然装聋作哑，充耳不闻。<br/>
  其中的缘由，请听我的解释：<br/>
  　　你滋生在我心中，深根固柢，<br/>
  　　在我的眼里，整个世界已死。</p>
