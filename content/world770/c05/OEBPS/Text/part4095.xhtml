  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">15</h1>

  <p>我来为你唱歌。</p>

  <p>在你的厅堂中，我坐在屋角。</p>

  <p>在你的世界中我无事可做；</p>

  <p>我无用的生命只能放出无目的的歌声。</p>

  <p>在你黑暗的殿中，夜半敲起默祷的钟声的时候，</p>

  <p>命令我吧，我的主人，来站在你面前歌唱。</p>

  <p>当金琴在晨光中调好的时候，</p>

  <p>宠赐我吧，命令我来到你的面前。</p>
