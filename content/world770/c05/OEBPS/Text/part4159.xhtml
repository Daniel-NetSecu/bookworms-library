  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">79</h1>

  <p>假如我今生无缘遇到你，就让我永远感到恨不相逢——</p>

  <p>让我念念不忘，让我在醒时或梦中都怀带着这悲哀的痛苦。</p>

  <p>当我的日子在世界的闹市中度过，我的双手满捧着每日的盈利的时候，让我永远觉得我是一无所获——</p>

  <p>让我念念不忘，让我在醒时或梦中都怀带着这悲哀的苦痛。</p>

  <p>当我坐在路边，疲乏喘息，当我在尘土中铺设卧具，让我永远记着前面还有悠悠的长路——</p>

  <p>让我念念不忘，让我在醒时或梦中都怀带着这悲哀的苦痛。</p>

  <p>当我的屋子装饰好了，箫笛吹起，欢笑声喧的时候，</p>

  <p>让我永远觉得我还没有请你光临——</p>

  <p>让我念念不忘，让我在醒时或梦中都怀带着这悲哀的苦痛。</p>
