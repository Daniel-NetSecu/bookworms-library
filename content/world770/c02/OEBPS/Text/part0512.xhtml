  <title>占星家们</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">占星家们<a id="w1"></a><a href="part0512.xhtml#m1"><sup>[1]</sup></a></h2>

  <p class="EB03BodyTextIndented">现在正如我心中时时所见，</p>

  <p class="EB03BodyTextIndented">苍白的不满的人，穿着他们僵硬、印花的衣服，</p>

  <p class="EB03BodyTextIndented">在天空的深蓝里显现又消失。</p>

  <p class="EB03BodyTextIndented">他们古老的面容像被雨水击打的石头，</p>

  <p class="EB03BodyTextIndented">他们的银头盔在空中来回徘徊，</p>

  <p class="EB03BodyTextIndented">各各他<a id="w2"></a><a href="part0512.xhtml#m2"><sup>[2]</sup></a>的骚乱并不让他们满意，</p>

  <p class="EB03BodyTextIndented">他们的双眼仍在凝望，希望再次找到</p>

  <p class="EB03BodyTextIndented">在兽性的土地上，那不可控的神秘。</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="m1"></a><a href="part0512.xhtml#w1">[1]</a> 占星家们（Magi），在诗中应该指的是东方三博士。</p>

  <p class="EB03BodyTextIndented"><a id="m2"></a><a href="part0512.xhtml#w2">[2]</a> 各各他（Calvary），耶稣被钉死在十字架上的地方。</p>
