<h2 class="heading2" id="calibre_pb_4">Sven　斯特</h2>

  <h3 class="heading3">Personality　性格</h3>

  <p class="p">Kristoff’s loyal reindeer companion, Sven was found as a young reindeer abandoned, injured and starving. Kristoff saved Sven’s life and the two have been inseparable ever since.</p>

  <p class="p">作为克斯托夫忠诚的伙伴，驯鹿斯特是一头被遗弃的幼鹿，浑身是伤，饥肠辘辘。克斯托夫救了斯特，从此两人再也没有分开过。</p>
