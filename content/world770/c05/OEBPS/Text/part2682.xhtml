  <title>墨丘利和雕塑家</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">墨丘利和雕塑家</h1>

  <p>墨丘利很好奇人类怎么看待自己，于是他变身成人，来到一个雕塑家的作坊，那里有一些做好的塑像正在出售。他看到了一个朱庇特的塑像，便询问那个塑像的价钱。雕塑家说：“一个克朗。”墨丘利听了大笑，道：“才这么点？”然后他指着一个朱诺的塑像问：“这个多少钱？”“半个克朗。”“那么，那一个多少钱呢？”他指着一个自己的塑像问。雕塑家回答说：“那一个？噢，如果你买了这两个，那一个就免费送给你。”</p>
