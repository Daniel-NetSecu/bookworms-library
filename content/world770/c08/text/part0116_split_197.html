<h1 class="calibre22" id="calibre_pb_299">第九十七节</h1>

      <p class="x5">反对意见。</p>

      <p class="x6">无疑会有人这样反对我的观点：资本家不会在意是把货币借出还是用于购买土地，无论在哪种情况下，他得到的只是其货币的等值物，而且不管他把货币用于哪一方面，他都得对公共费用有所贡献。</p><a id="Section_cn_98"></a>
