  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">33</h1>

  <p>白天的时候，他们来到我的房子里说：</p>

  <p>“我们只占用最小的一间房子。”</p>

  <p>他们说：</p>

  <p>“我们要帮助你礼拜你的上帝，</p>

  <p>而且只谦恭地领受我们应得的一份恩典。”</p>

  <p>他们就在屋角安静谦柔地坐下。</p>

  <p>但是在黑夜里，</p>

  <p>我发现他们强暴地冲进我的圣堂，</p>

  <p>贪婪地攫取了神坛上的祭品。</p>
