  <h2 class="EB04MainHeadClosedTitle">屋顶上的小孩</h2>

  <p class="EB03BodyTextIndented">一个小孩被长在茅草屋顶上的小草和其他东西所吸引，爬上了外屋的屋顶。当他站在那儿四处眺望时，他发现一只狼从下面经过。小孩嘲笑那只狼捉不到自己。狼只是抬头看了看他，然后说道：“我听到你了，我年轻的朋友；但是嘲笑我的并不是你，而是你脚下的屋顶呀。”</p>
