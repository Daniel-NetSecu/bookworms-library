<h2 class="heading" id="calibre_pb_5">憨憨</h2>

  <p class="p">一只长相古怪、神情木讷、两眼歪斜的公鸡，反应迟钝，喜欢乱吞东西。在莫阿娜的帮助下，它逃脱了被宰杀的命运。其后，它陪同莫阿娜一起前往特菲提岛，在途中发挥了自己的作用，成为拯救世界的功臣之一。</p>
