  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">36</h1>

  <p class="kindle-cn-poem-left1">我承认，我们必须分成两人，<br/>
  虽然这爱已融合，化为一体；<br/>
  唯如此，我身上的斑斑污痕<br/>
  才能自个承担，不用你助力。<br/>
  我们这两份爱，只有一颗心，<br/>
  我们的生活受时运的摆布，<br/>
  虽然它改变不了爱的纯真，<br/>
  但能悄悄地偷走爱的欢愉。<br/>
  我最好从此永不与你交往，<br/>
  以免我的过失会让你丢脸，<br/>
  你也不必给我公然的荣光，<br/>
  除非你甘愿名誉蒙上污点。<br/>
  　　但不能这样：我们如此相爱，<br/>
  　　你代表我，我就是你的口碑。</p>
