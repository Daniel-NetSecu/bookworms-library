  <h2 class="EB04MainHeadClosedTitle">大力神与车夫</h2>

  <p class="EB03BodyTextIndented">一个车夫驾驶着牛车在乡村小路上行驶。突然，车轮深深地陷进了车辙里。这位乡下的车夫一下子呆住了，站在那儿看着牛车，什么都不做，只是大声呼喊大力神来帮他。</p>

  <p class="EB03BodyTextIndented">大力神出现了，对他说：“这位老兄，用你的肩膀把车轮扛起来，并吆喝你的牛。在你尽力自助之前，别祈求别人帮你。否则，今后你的祈祷都是徒劳的。”</p>

  <p class="EB01BodyTextLineSpace">天助自助者。</p>
