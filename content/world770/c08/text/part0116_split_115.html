<h1 class="calibre22" id="calibre_pb_217">第十五节</h1>

      <p class="x5">社会重新划分为三个阶级。土地耕种者、手工业者和土地所有者，或者叫生产阶级、薪资阶级和可自由支配阶级。</p>

      <p class="x6">我们看到这时社会划分为三个阶级：农夫阶级，我们可以称他们为土地耕种者；手工业者及其他人，他们受雇于人而从事土地产品的生产；还有土地所有者阶级，也是唯一不用为了满足生活需要而去从事某种特定劳动的阶级，他们或许受雇从事社会中的一般性服务。至于战争和司法方面的工作，或者由个人从事，或者国家利用土地所有者收入的一部分，雇佣其他人来从事。由于这一原因，最适合这一阶层的名称就是可自由支配阶级。</p><a id="Section_cn_16"></a>
