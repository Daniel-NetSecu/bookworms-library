  <h2 class="EB04MainHeadClosedTitle">版本说明</h2>

  <p class="EB03BodyTextIndented">本书收录的诗歌全部选自珍妮特·吉扎里（Janet Gezari）编纂的《艾米莉·勃朗特诗歌全集》（<i>The Complete Poems</i>），企鹅出版社1992年第一版。其中《屡遭责难，却不断重返》一诗如今被普遍认为是夏洛蒂·勃朗特所作，但实属上乘，理当收录。</p>
