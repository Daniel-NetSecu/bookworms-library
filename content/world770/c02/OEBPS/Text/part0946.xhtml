  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">Fame is a fickle food</h2>

  <p class="EB03BodyTextIndented">Fame is a fickle food</p>

  <p class="EB03BodyTextIndented">Upon a shifting plate,</p>

  <p class="EB03BodyTextIndented">Whose table once a Guest, but not</p>

  <p class="EB03BodyTextIndented">The second time, is set.</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">Whose crumbs the crows inspect,</p>

  <p class="EB03BodyTextIndented">And with ironic caw</p>

  <p class="EB03BodyTextIndented">Flap past it to the Farmer’s corn;</p>

  <p class="EB03BodyTextIndented">Men eat of it and die.</p>
