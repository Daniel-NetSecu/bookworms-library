  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">31</h1>

  <p>“囚人，告诉我，谁把你捆起来的？”</p>

  <p>“是我的主人，”囚人说，“我以为</p>

  <p>我的财富与权力胜过世界上一切的人，</p>

  <p>我把我的国王的钱财聚敛在自己的宝库里。</p>

  <p>我昏困不过，睡在我主的床上，</p>

  <p>一觉醒来，我发现我在自己的宝库里做了囚人。”</p>

  <p>“囚人，告诉我，是谁铸的这条坚牢的锁链？”</p>

  <p>“是我，”囚人说，“是我自己用心铸造的。</p>

  <p>我以为我的无敌的权力会征服世界，使我有无碍的自由。</p>

  <p>我日夜用烈火重锤打造了这条铁链。</p>

  <p>等到工作完成，铁链坚牢完善，我发现这铁链把我捆住了。”</p>
