  <title>驴、狐狸和狮子</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">驴、狐狸和狮子</h1>

  <p>驴和狐狸交上了朋友，他们一起出发去寻找食物，没走出多远，便迎头遇上了一只狮子，他们都害怕得要命。但是，狐狸想到了一个自救的办法，于是他壮着胆子走到狮子跟前，附在他的耳边悄声说：“我可以设法帮你毫不费力地抓到那只驴，只要你能放了我。”狮子同意了，于是狐狸重新回到他的朋友身边，计划带着驴前往一个隐藏的陷坑，那是猎人挖来捕捉野生动物的陷阱。驴自然掉进了陷阱中。狮子看到驴被捉住，无路可逃了，就把注意力先放在了狐狸身上，很快便把狐狸给吞下吃光了，然后才悠闲地开始享用驴。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：背叛朋友，常常也会毁了自己。</p>
</body></html>
