<h1 class="calibre22" id="calibre_pb_213">第十一节</h1>

      <p class="x5">在雇佣的土地耕种者的帮助下，土地所有者开始能够让自己摆脱耕种劳动。</p>

      <p class="x6">同时，由于土地不仅为耕种它的所有者提供生活资料，不仅使所有者可以通过交换满足其他方面的需求，而且使他拥有大量的剩余产品；利用这些剩余产品，土地所有者可以雇佣其他人来耕种自己的土地。因为在那些依靠工资生活的人当中，愿意耕种土地的人与愿意从事其他工作的人一样多。所以，土地所有者就可能摆脱耕种劳动，而且很快他就真的不必耕种了。</p><a id="Section_cn_12"></a>
