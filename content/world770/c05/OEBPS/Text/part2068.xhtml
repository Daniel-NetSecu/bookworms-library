  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">122</h1>

  <p class="kindle-cn-poem-left1">你赠我的记事册写满文字，<br/>
  作为永久的纪念留在脑海，<br/>
  这纪念连同册子里的一切<br/>
  将超越时代，直至千秋万代，<br/>
  或至少留传到自然的极限——<br/>
  即我的心和脑临世的终期；<br/>
  在它们将你托付遗忘以前，<br/>
  关于你的记载决不会丢失。<br/>
  只是可怜的本子容量有限，<br/>
  你的爱也无法用筹码统计；<br/>
  我要斗胆将它放置在一边，<br/>
  把你交给一本更好的册子。<br/>
  　　如果我得凭记事本记住你，<br/>
  　　岂不表明我忘记你也容易！</p>
