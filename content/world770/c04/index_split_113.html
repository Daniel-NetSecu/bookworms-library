</p><p class="calibre_"><span class="calibre6">木乃伊之谜</span></p><p class="calibre_65"><span class="calibre2">神奇树屋·故事系列·基础版#3</span></p><p class="calibre_12"><span class="calibre2">[美] 玛丽·波·奥斯本/著</span></p><p class="calibre_66"><span class="calibre2">[美] 萨尔·莫多卡/绘</span></p><hr class="calibre7"/><blockquote class="calibre_67"><span class="calibre2"><span class="bold">内容简介:</span></span></blockquote><blockquote class="calibre_68"><span class="calibre2">为了查清楚刻着M字样金勋章的主人是谁，哥哥杰克和妹妹安妮又一次走进神奇树屋。这一次，他们闯入了中世纪的城堡。吊桥、鹰房、风车和一名神秘的黑夜骑士……</span></blockquote><blockquote class="calibre_68"><span class="calibre2">为了追踪黑夜骑士，杰克和安妮误入了正在举办的骑士晚宴，也因此被卫兵关进阴暗的地牢。他们能顺利逃脱吗？</span></blockquote><div class="mbp_pagebreak" id="calibre_pb_113"></div>
