  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">78</h1>

  <p class="kindle-cn-poem-left">在五月天里，闷热的正午仿佛无尽地悠长。<br/>
  干地在灼热中渴得张着口。<br/>
  当我听到河边有个声音叫道：“来吧，我的宝贝！”<br/>
  我合上书开窗外视。<br/>
  我看见一只皮毛上尽是泥土的大水牛，眼光沉着地站在河边；<br/>
  一个小伙子站在没膝的水里，在叫它去洗澡。<br/>
  我高兴而微笑了，我心里感到一阵甜柔的接触。</p>
