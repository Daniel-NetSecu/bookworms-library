  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">67</h1>

  <p>你是天空，你也是窝巢。</p>

  <p>啊，美丽的你，在窝巢里，</p>

  <p>就是你的爱，用颜色、声音和香气来围拥住灵魂。</p>

  <p>在那里，清晨来了，右手提着金筐，</p>

  <p>带着美的花环，静静地替大地加冕。</p>

  <p>在那里，黄昏来了，越过无人畜牧的荒林，</p>

  <p>穿过车马绝迹的小径，</p>

  <p>在她的金瓶里带着安靖的西方海上和平的凉飙。</p>

  <p>但是在那里，纯白的光辉统治着伸展着的、为灵魂翱翔的、无际的天空。</p>

  <p>在那里无昼无夜，无形无色，而且永远、永远无有言说。</p>
