  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">83</h1>

  <p>圣母啊，我要把我悲哀的眼泪穿成珠链，挂在你的颈上。</p>

  <p>星星把光明做成足镯，来装扮你的双足，</p>

  <p>但是我的珠链要挂在你的胸前。</p>

  <p>名利自你而来，也全凭你予取，</p>

  <p>但这悲哀却完全是我自己的。</p>

  <p>当我把它当作祭品献给你的时候，你就以你的恩慈来酬谢我。</p>
