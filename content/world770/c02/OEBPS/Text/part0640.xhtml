  <h2 class="EB04MainHeadClosedTitle">维纳斯与猫</h2>

  <p class="EB03BodyTextIndented">一只猫爱上了一位英俊的小伙子，它恳求维纳斯<sup><a id="z2" href="part0640.xhtml#bz2">[2]</a></sup>把它变成女人。维纳斯答应了，立马将它变成了一位美丽的少女。小伙子对少女一见钟情，将她娶回了家。</p>

  <p class="EB03BodyTextIndented">一天，他们俩在房里依偎着，维纳斯想知道那只猫改变了外形后，是否也改变了本性。于是，她在屋子里放了只老鼠。那只猫忘乎所以，从沙发上站起来，捉住老鼠想要吃掉它。维纳斯十分失望，将她再次变回了原来的样子。</p>

  <p class="EB01BodyTextLineSpace">江山易改，本性难移。</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="bz2" href="part0640.xhtml#z2">[2]</a>身为罗马十二主神之一的维纳斯是代表爱与美的天神，对应希腊神话中的阿佛洛狄忒。</p>
