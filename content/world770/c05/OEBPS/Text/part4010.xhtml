  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">18</h1>

  <p class="kindle-cn-poem-left">当这两个姊妹出去打水的时候，<br/>
  她们来到这地点，她们微笑了。<br/>
  她们一定觉察到，<br/>
  每次她们出来打水的时候，<br/>
  那个站在树后的人儿。<br/>
  姊妹俩相互耳语，<br/>
  当她们走过这地点的时候。<br/>
  她们一定猜到了，<br/>
  每逢她们出来打水的时候，<br/>
  那个人站在树后的秘密。<br/>
  她们的水瓶忽然倾倒，水倒出来了，<br/>
  当她们走到这地点的时候。<br/>
  她们一定发觉，每逢她们出来打水的时候，<br/>
  那个站在树后的人的心正在跳着。<br/>
  姊妹俩相互瞥了一眼又微笑了，<br/>
  当她们来到这地点的时候。<br/>
  她们飞快的脚步里带着笑声，<br/>
  使这个每逢她们出来打水的时候站在树后的人儿心魂缭乱了。</p>
