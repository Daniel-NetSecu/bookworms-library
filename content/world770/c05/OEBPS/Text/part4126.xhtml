  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">46</h1>

  <p>我不知道从久远的什么时候，</p>

  <p>我就一直走近来迎接你。</p>

  <p>你的太阳和星辰永不能把你藏起使我看不见你。</p>

  <p>在许多清晨和傍晚，我曾听见你的足音，</p>

  <p>你的使者曾秘密地到我心里来召唤。</p>

  <p>我不知道为什么今天我的生活完全激动了，</p>

  <p>一种狂欢的感觉穿过了我的心。</p>

  <p>这就像结束工作的时间已到，</p>

  <p>我感觉到在空气中有你光降的微馨。</p>
