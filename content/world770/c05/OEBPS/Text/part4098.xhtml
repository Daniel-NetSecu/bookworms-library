  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">18</h1>

  <p>云霾堆积，黑暗渐深。</p>

  <p>啊，爱，你为什么让我独在门外等候？</p>

  <p>在中午工作最忙的时候，我和大家在一起；</p>

  <p>但在这黑暗寂寞的日子里，我只企望着你。</p>

  <p>若是你不容我见面，若是你完全把我抛弃，</p>

  <p>我真不知将如何度过这悠长的雨天。</p>

  <p>我不住地凝望遥远的阴空，</p>

  <p>我的心和不宁的风一同彷徨悲叹。</p>
