  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">93</h1>

  <p class="kindle-cn-poem-left1">我可继续活着，权当你忠诚，<br/>
  就像一个受骗上当的丈夫；<br/>
  你虽已变心，脸上假装多情，<br/>
  眼睛盯着我，心却游离别处。<br/>
  你的眼里没有怨恨的表示，<br/>
  我因此觉察不出你的背叛；<br/>
  变节之徒通常藏不住秘密，<br/>
  凭情绪、皱纹，真情即可尽览。<br/>
  但上天创造你时另定规范：<br/>
  许你永远留住甜美的笑容，<br/>
  不管有什么心事，什么欲望，<br/>
  你脸上始终那般春光融融。<br/>
  　　由于你内心与外表不谐和，<br/>
  　　你的美貌可比夏娃的苹果。</p>
