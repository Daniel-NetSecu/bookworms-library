  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">听起来街道在奔跑</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">听起来街道在奔跑，</p>

  <p class="EB03BodyTextIndented">然后街道又静静站立。</p>

  <p class="EB03BodyTextIndented">日食是我们在窗口能看到的一切，</p>

  <p class="EB03BodyTextIndented">敬畏是我们能感受到的一切。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">渐渐地，最勇敢的人偷偷溜出他的隐蔽所，</p>

  <p class="EB03BodyTextIndented">去看看时间是不是还在那儿。</p>

  <p class="EB03BodyTextIndented">自然戴着它绿玉色的花冠，</p>

  <p class="EB03BodyTextIndented">搅动着更新鲜的空气。</p>
