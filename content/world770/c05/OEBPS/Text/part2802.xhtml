  <title>驮神像的驴</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">驮神像的驴</h1>

  <p>有一个人把一尊神像驮在驴背上，赶着驴去城里的一座神庙。他们走在路上，人们见了，全都向神像脱帽致敬。驴以为人们是在敬拜他，便趾高气扬起来。他自负起来，想象自己可以随心所欲，为所欲为，于是便抗议自己还要驮负重物，他停下了脚步，坚决不肯再往前走。赶驴的人发现他不服管教，便用棍子狠狠地打了他，并说道：“哎呀，你这个没脑子的白痴，你以为那都是因为人们崇拜一只驴吗？”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：依靠别人来获得赞扬的人必会遭遇狂暴的打击。</p>
</body></html>
