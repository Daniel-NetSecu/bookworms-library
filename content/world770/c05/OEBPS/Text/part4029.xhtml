  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">37</h1>

  <p class="kindle-cn-poem-left">“你愿意把你的鲜花的花环挂在我的颈上吗，佳人？”<br/>
  “但是你要晓得，我编的那个花环，是为大家的，<br/>
  为那些偶然瞥见的人，<br/>
  住在未开发的大地上的人，<br/>
  住在诗人歌曲里的人。”<br/>
  现在来请求我的心作为答赠已经太晚了。<br/>
  曾有一个时候，我的生命像一朵蓓蕾，<br/>
  它所有的芬芳都储藏在花心里。<br/>
  现在它已远远地喷溢四散。<br/>
  谁晓得有什么魅力，可以把它们收集关闭起来呢？<br/>
  我的心不容我只给一个人，它是要给予许多人的。</p>
