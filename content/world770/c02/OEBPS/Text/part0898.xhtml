  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">今天或这个正午</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">今天或这个正午，</p>

  <p class="EB03BodyTextIndented">她待得这么近，</p>

  <p class="EB03BodyTextIndented">我几乎都摸到了她；</p>

  <p class="EB03BodyTextIndented">今夜她卧着</p>

  <p class="EB03BodyTextIndented">经过街邻——</p>

  <p class="EB03BodyTextIndented">还有树干和尖塔——</p>

  <p class="EB03BodyTextIndented">此刻越过了猜想。</p>
