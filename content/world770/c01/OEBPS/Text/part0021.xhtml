<p class="title1" id="CHP19">LESSON 16</p>
<p class="picture"><img src="../Images/image01561.jpeg.webp" alt="alt"/></p>
<p class="normaltext">Sue has a doll. It has a new dress.</p>
<p class="normaltext">She will let Ann hold the doll in her hands, and Ann will fan it.</p>
<p class="normaltext">Sue is kind to Ann.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">苏有个洋娃娃。娃娃有条新裙子。</p>
<p class="normaltext">苏让安用双手抱着洋娃娃，安要为它扇风。</p>
<p class="normaltext">苏对安十分友好。</p>
