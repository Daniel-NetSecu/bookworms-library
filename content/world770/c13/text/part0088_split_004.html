<h2 class="heading2" id="calibre_pb_3">Kristoff　克斯托夫</h2>

  <h3 class="heading3">Personality　性格</h3>

  <p class="p">Kristoff is a lone mountain man — gruff, rough around edges, strong, silent type who doesn’t connect with others. His only and constant companion is his mangy reindeer, Sven.</p>

  <p class="p">克斯托夫是一位孤独的山地人：粗鲁、不修边幅、强壮、安静，他不喜欢跟人沟通。他唯一忠实的伙伴是驯鹿斯特。</p>
