  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">61</h1>

  <p class="kindle-cn-poem-left1">你是否有意派出你的倩影<br/>
  造访长夜中我沉重的眼皮？<br/>
  你是否存心骚扰我的安寝，<br/>
  让你的幻影嘲弄我的视力？<br/>
  抑或是你的魂灵不辞遥远<br/>
  从家乡赶来，监视我的行止，<br/>
  只为迎合忌妒的险恶用心，<br/>
  好刺探我的闲暇，让我蒙耻？<br/>
  噢，不，你的爱没有如此深沉，<br/>
  使我长夜无眠的是我自身！<br/>
  是我的真让我合不上眼睛，<br/>
  为了你，我甘愿做守夜人。<br/>
  　　我为你守夜，你在别处求欢，<br/>
  　　我离你很远，别人在你身边。</p>
