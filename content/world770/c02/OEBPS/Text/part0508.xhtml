  <title>致一位朋友，其工作已没有意义</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">致一位朋友，其工作已没有意义</h2>

  <p class="EB03BodyTextIndented">如今所有真相显现，</p>

  <p class="EB03BodyTextIndented">面对任何无耻的喉舌，</p>

  <p class="EB03BodyTextIndented">保持沉默，接受失败吧，</p>

  <p class="EB03BodyTextIndented">因你生就高贵，怎能</p>

  <p class="EB03BodyTextIndented">与那样的人相比？</p>

  <p class="EB03BodyTextIndented">即使谎言被证实，</p>

  <p class="EB03BodyTextIndented">他也不会感到羞愧，</p>

  <p class="EB03BodyTextIndented">更不在意邻人的眼光。</p>

  <p class="EB03BodyTextIndented">生来就要做比胜利</p>

  <p class="EB03BodyTextIndented">更困难的事，转身离去，</p>

  <p class="EB03BodyTextIndented">像大笑的琴弦</p>

  <p class="EB03BodyTextIndented">被疯狂的手指弹奏</p>

  <p class="EB03BodyTextIndented">在一堆石头之中。</p>

  <p class="EB03BodyTextIndented">保持沉默，狂喜吧，</p>

  <p class="EB03BodyTextIndented">因在所有已知的事中，</p>

  <p class="EB03BodyTextIndented">那是最困难的。</p>
</body></html>
