  <h2 class="EB04MainHeadClosedTitle">农夫与蛇</h2>

  <p class="EB03BodyTextIndented">一年冬天，一位农夫发现了一条冻僵的蛇。出于同情，他捡起了蛇，把它放进怀里。蛇很快暖和了过来，便露出本来面目，冲着恩人的胸口就咬上致命的一口。“哦，”农夫用最后一口气哭喊道，“怜悯一个恶棍，我真是活该。”</p>

  <p class="EB01BodyTextLineSpace">最好的善意不会改变忘恩负义之人。</p>
