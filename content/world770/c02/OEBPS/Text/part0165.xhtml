  <title>升天节</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">升天节</h2>

  <p class="EB03BodyTextIndented">升天节到了，天真的脸蛋洗得干干净净，</p>

  <p class="EB03BodyTextIndented">孩子们一对对走着，穿着红黄绿各色衣裙，</p>

  <p class="EB03BodyTextIndented">灰发的助理牧师在前，执着雪一样白的手杖，</p>

  <p class="EB03BodyTextIndented">像泰晤士河水一样，他们流进了圣保罗大厅<a id="w1"></a><a href="part0165.xhtml#m1"><sup>[1]</sup></a>。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">这么一大群孩子啊！这些伦敦市的花朵！</p>

  <p class="EB03BodyTextIndented">他们神采奕奕，自动地结伴坐在一起，</p>

  <p class="EB03BodyTextIndented">一大群响着嗡嗡的声音，只是一大群羔羊哦，</p>

  <p class="EB03BodyTextIndented">无数男孩和女孩，举起了天真的手臂。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">他们向天国扬起的歌声，就像劲风一样，</p>

  <p class="EB03BodyTextIndented">宛若天国的席位间悦耳的雷声飞驰。</p>

  <p class="EB03BodyTextIndented">他们后面是成年人——穷人贤明的保护者，</p>

  <p class="EB03BodyTextIndented">此刻你要心怀怜悯，免得从门前赶走天使。</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="m1"></a><a href="part0165.xhtml#w1">[1]</a> 指圣保罗大教堂。</p>
