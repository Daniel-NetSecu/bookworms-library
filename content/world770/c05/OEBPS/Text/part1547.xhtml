  <h2 class="kindle-cn-heading2">104　赛莱公园附近</h2>

  <p class="kindle-cn-signature">叶芝</p>

  <p class="kindle-cn-poem-left">我与情人相遇在赛莱公园附近，<br/>
  她那双雪白而修长的腿刚踏出草坪，<br/>
  她嘱我对爱情要宽容，让它像树上的叶子自由生长，<br/>
  但我当时太年轻，太愚昧，不愿附和她的主张。</p>

  <p class="kindle-cn-poem-left">我与爱人伫立在河边的田野上，<br/>
  她那雪白的手搁在我微倾的肩膀，<br/>
  她嘱我对生活要宽容，让它像堤坝上的草自由生长，<br/>
  但我当时太年轻，太愚昧，如今只有泪眼汪汪。</p>
