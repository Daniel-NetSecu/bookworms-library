  <title>猴子和骆驼</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">猴子和骆驼</h1>

  <p>在一次百兽集会上，猴子表演了舞蹈，大家都很喜欢。表演结束时掌声雷动，这激起了骆驼的嫉妒，他也想要通过相同的方法赢得大家的喜爱。所以他站起来，也开始跳舞，他全心投入，但动作滑稽古怪，其他动物便对他一顿奚落，将他赶走了。</p>
