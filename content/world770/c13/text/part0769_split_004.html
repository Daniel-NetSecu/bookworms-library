<h2 class="heading" id="calibre_pb_3">小不点</h2>

  <p class="p">小不点是一个穴居人类小男孩，自小失去双亲。他很勇敢，帮助阿乐喝退毒蛇；他很善良，帮助阿乐找到可口的果子；他嗅觉灵敏，帮助布奇一家找到丢失的长角牛群。</p>
