  <title>乌龟和鹰</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">乌龟和鹰</h1>

  <p>有一只乌龟对自己卑微的生活很不满，他看到鸟在空中翱翔嬉戏非常嫉妒，于是乞求一只鹰教他飞行。鹰不同意，认为既然大自然没有给乌龟翅膀，那他就不应该飞行。而乌龟却百般恳求，还许诺重金答谢，坚持要学会飞行于天空的技艺。最后，老鹰终于答应尽自己所能帮助乌龟，他把乌龟抓在自己的爪子中，带着乌龟飞上了高高的天空，然后他松开了爪子，可怜的乌龟一路向下，掉到石头上摔成了碎片。</p>
