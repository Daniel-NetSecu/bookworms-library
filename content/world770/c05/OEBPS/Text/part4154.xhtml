  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">74</h1>

  <p>白日已过，暗影笼罩大地。是我到河边汲水的时候了。</p>

  <p>晚空凭着水的凄音流露着切望。</p>

  <p>啊，它呼唤我出到暮色中来，荒径上断绝人行，</p>

  <p>风起了，波浪在河里翻腾。</p>

  <p>我不知道是否应该回家去。</p>

  <p>我不知道我会遇到什么人。</p>

  <p>浅滩的小舟上有个不相识的人正在弹着琵琶。</p>
