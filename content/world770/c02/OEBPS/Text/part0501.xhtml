  <title>听人劝慰的愚蠢</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">听人劝慰的愚蠢</h2>

  <p class="EB03BodyTextIndented">昨日有位良善的人说：</p>

  <p class="EB03BodyTextIndented">“你挚爱的人发间已有了银丝，</p>

  <p class="EB03BodyTextIndented">小小的阴影已爬上她的双眼，</p>

  <p class="EB03BodyTextIndented">时间只能让人更容易明智，</p>

  <p class="EB03BodyTextIndented">尽管现在似乎不可能，因此</p>

  <p class="EB03BodyTextIndented">你所需要的，就是耐心。”</p>

  <p class="EB03BodyTextIndented">　　　　　　　我的心喊道：“不，</p>

  <p class="EB03BodyTextIndented">我没有得到一丝安慰，一粒也没有，</p>

  <p class="EB03BodyTextIndented">时间只会使她再次美丽，</p>

  <p class="EB03BodyTextIndented">因她那伟大的高贵，</p>

  <p class="EB03BodyTextIndented">那身上跳动的火，在她移动时</p>

  <p class="EB03BodyTextIndented">只会燃烧得更为明净。哦，她不会那样，</p>

  <p class="EB03BodyTextIndented">当整个狂野的夏日都在她的眼中。”</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">哦，心！哦，心！只要她一回头，</p>

  <p class="EB03BodyTextIndented">你就明白听人劝慰的愚蠢。</p>
