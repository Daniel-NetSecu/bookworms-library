  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">18</h1>

  <p class="kindle-cn-poem-left1">我是否可把你与夏天媲美？<br/>
  你比夏天更可爱亦更温和：<br/>
  狂风吹落五月艳丽的花蕾，<br/>
  夏日的赁期总是匆匆而过。<br/>
  天上的巨眼有时照得太热，<br/>
  它那金彩的脸庞常被遮挡；<br/>
  美的事物总不免美颜凋谢，<br/>
  机缘与自然使美渐次消亡；<br/>
  但你永恒的夏天永不沉沦，<br/>
  你拥有的美决不与你分开。<br/>
  死神不能夸你身陷其阴影，<br/>
  永恒的诗行使你与时同在。<br/>
  　　只要人在呼吸，眼睛看得清，<br/>
  　　这诗便活着，并赋予你生命。</p>
