<h1 class="calibre22" id="calibre_pb_216">第十四节</h1>

      <p class="x5">耕种者和土地所有者之间的产品分配。净产品或收入。</p>

      <p class="x6">通过这种新的安排，土地产品分为了两部分。一部分包括生活资料和农民的利润，作为他的劳动报酬，也是他同意耕种土地所有者土地的条件；剩下的另一部分是独立的、可以自由支配的部分，是土地生产出来作为礼物无偿给予土地所有者的、超出他垫付的部分。正是由于土地所有者的这一部分产品，或者称为“收入”，使他能够不用劳动就可以生活，而且他可以带这笔收入去他想去的任何地方。</p><a id="Section_cn_15"></a>
