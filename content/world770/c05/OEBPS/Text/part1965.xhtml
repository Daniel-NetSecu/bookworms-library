  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">19</h1>

  <p class="kindle-cn-poem-left1">饕餮的时间，请去磨钝狮爪，<br/>
  让大地吞噬她自己的子孙，<br/>
  从猛虎嘴里拔下它的钢牙，<br/>
  让长寿的凤凰在血中自焚；<br/>
  你飞行时，让季节哭笑不得，<br/>
  捷足的时间，任你为所欲为，<br/>
  摆布这世界和可爱的过客，<br/>
  但我要禁止你犯一桩大罪：<br/>
  别用时辰刀剐我爱人的脸，<br/>
  别用你的旧笔画什么条纹，<br/>
  允许他在你那里一成不变，<br/>
  以便为后人留下美的范本。<br/>
  　　时间老人，我不怕你的恶行，<br/>
  　　在诗中，我的爱将永远年轻。</p>
