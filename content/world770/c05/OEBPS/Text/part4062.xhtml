  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">70</h1>

  <p class="kindle-cn-poem-left">我记得在童年时代，有一天我在水沟里漂一只纸船。<br/>
  那是七月的一个阴湿的天，我独自快乐地嬉戏。<br/>
  我在沟里漂一只纸船。<br/>
  忽然间阴云密布，狂风怒号，大雨倾注。<br/>
  浑水像小河般流溢，把我的船冲没了。<br/>
  我心里难过地想：这风暴是故意来破坏我的快乐的，<br/>
  它的一切恶意都是对着我的。<br/>
  今天，七月的阴天是漫长的，<br/>
  我在默忆我生命中以我为失败者的一切游戏。<br/>
  我抱怨命运，因为它屡次戏弄了我，<br/>
  当我忽然忆起我的沉在沟里的纸船的时候。</p>
