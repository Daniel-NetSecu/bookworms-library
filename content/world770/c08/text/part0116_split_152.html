<h1 class="calibre22" id="calibre_pb_254">第五十二节</h1>

      <p class="x5">农业中垫付的必要性。</p>

      <p class="x6">每一种劳动，无论是农业、工业，还是商业，都需要垫付。人们耕种土地时，必须先播种才能收割；而且在收获之前他们也要养活自己。农业发展越成熟、越有活力，需要垫付的数量就越大。耕畜、农具、圈养牲畜和储存产品的场所，还要根据所承担劳动的程度，在收获前给一部分工人支付工资和提供生活资料。只有通过相当数量垫付的方式，人们才能获得丰收，土地才能带来巨大的收入。不管从事什么行业，工人必须拥有工具，必须拥有足够数量的其劳动所需的原料；而且在售出自己的货物之前他必须要养活自己。</p><a id="Section_cn_53"></a>
