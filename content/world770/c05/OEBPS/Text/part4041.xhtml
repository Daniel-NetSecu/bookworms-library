  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">49</h1>

  <p class="kindle-cn-poem-left">我握住她的手把她抱紧在胸前。<br/>
  我想以她的爱娇来填满我的怀抱，<br/>
  用亲吻来偷劫她的甜笑，<br/>
  用我的眼睛来吸饮她的深黑的一瞥。<br/>
  啊，但是，它在哪里呢？<br/>
  谁能从天空滤出蔚蓝呢？<br/>
  我想去把握美；<br/>
  它躲开我，只有躯体留在我的手里。<br/>
  失望而困乏地，我回来了。<br/>
  躯体哪能触到那只有精神才能触到的花朵呢？</p>
