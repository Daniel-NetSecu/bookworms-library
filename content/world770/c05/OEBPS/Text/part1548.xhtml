  <h2 class="kindle-cn-heading2">105　当你老了</h2>

  <p class="kindle-cn-signature">叶芝</p>

  <p class="kindle-cn-poem-left">当你老了，头发白了，经常犯困，<br/>
  总在炉旁打盹儿，请取下这部书，<br/>
  慢慢读，追忆往昔温柔的注目，<br/>
  回想你目光中那浓重的阴影；</p>

  <p class="kindle-cn-poem-left">多少人将你青春的优雅爱慕，<br/>
  恋着你的美，不管假意与真心，<br/>
  但只有一人爱你虔诚的魂灵，<br/>
  爱你衰老时写在脸上的愁苦。</p>

  <p class="kindle-cn-poem-left">低下头来吧，在通红的炉栅边，<br/>
  悄悄地倾诉，带着一丝的忧伤，<br/>
  说说爱神如何逃遁到高山之上，<br/>
  在那里踱步，隐身于星星中间。</p>
