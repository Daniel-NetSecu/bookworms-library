<p class="title1" id="CHP22">LESSON 19</p>
<p class="picture"><img src="../Images/image01564.jpeg.webp" alt="alt"/></p>
<p class="normaltext">Do you see the boys at play?</p>
<p class="normaltext">Yes, I see them; there are five of them.</p>
<p class="normaltext">Tom is too fat to run fast.</p>
<p class="normaltext">Nat can catch him.</p>
<p class="normaltext">I like to see boys play.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">你看见那些男孩们在玩耍吗？</p>
<p class="normaltext">是的，我看见了，他们有五个人。</p>
<p class="normaltext">汤姆太胖跑不快。</p>
<p class="normaltext">奈特能追上他。</p>
<p class="normaltext">我喜欢看男孩们玩耍。</p>
