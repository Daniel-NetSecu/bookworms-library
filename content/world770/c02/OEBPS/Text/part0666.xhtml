  <h2 class="EB04MainHeadClosedTitle">墨丘利和被蚂蚁咬的人</h2>

  <p class="EB03BodyTextIndented">一个人曾经目睹了一艘船和它上面全体船员沉没的场景。他严厉地斥责着众神的不公。</p>

  <p class="EB03BodyTextIndented">“他们根本不关心一个人的品性，”他说道，“只会让好人和坏人一起赴死。”</p>

  <p class="EB03BodyTextIndented">他站立的地方附近有一个蚁丘，在他说话时，一只蚂蚁咬了他的脚。他把脾气发在了蚁丘上且一脚踩上了蚁丘，数百只无辜的蚂蚁命丧黄泉。</p>

  <p class="EB03BodyTextIndented">突然，墨丘利出现了，他用他的手杖痛打这个人，并说道：“你这个恶棍，现在你那伟大的正义感哪去了呢？”</p>
