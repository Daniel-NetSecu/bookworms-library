  <h2 class="EB04MainHeadClosedTitle">猴子和骆驼</h2>

  <p class="EB03BodyTextIndented">猴子站起身，跳起了舞，逗得森林里的动物们哈哈大笑。博得大家的欢心后，他在经久不息的掌声中坐了下来。</p>

  <p class="EB03BodyTextIndented">骆驼对猴子获得的赞赏感到十分嫉妒，也想要以同样的方式得到来宾们的喜爱。轮到他时，他决定也站起身，跳舞为大家助兴。他走动的方式非常滑稽，以至于所有动物一怒之下棍棒交加地把他赶出了集会。</p>

  <p class="EB01BodyTextLineSpace">模仿比我们更胜一筹的人总是荒谬可笑的。</p>
