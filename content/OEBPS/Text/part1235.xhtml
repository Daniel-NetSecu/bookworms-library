<h1 class="title1">内容简介</h1>
<p class="normaltext">大海有很多面。有时它平静温和——如同游泳池般安宁。有时它狂野、暴躁而危险。我们筑堤抵挡大海，大海却把它们冲走。我们造船在海上航行，大海却把它们劈成两截，如同孩子折断玩具。当大海露出其狰狞的一面时，它就像一头野兽，一心只想着杀戮。</p>
<p class="normaltext">当然，你并不害怕大海。你在陆地上很安全，温暖而干燥。但若你是在怒海中的一条小船上，脸上是飞溅而来的海水，耳畔是咆哮不停的海风，那情况就不一样了。对我们来说，要做到不害怕很容易；这只是一本书而已。但对于格雷丝·达林，这不是故事。这是非常真实、寒冷而狂野的夜晚，那一夜她和大海抗争，毫无畏惧。</p>
