  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">59</h1>

  <p>是的，我知道，这只是你的爱，</p>

  <p>啊，我心爱的人——这在树叶上跳舞的金光，</p>

  <p>这些驶过天空的闲云，这使我头额清爽的吹过的凉风。</p>

  <p>清晨的光辉涌进我的眼睛——</p>

  <p>这是你传给我心的消息。</p>

  <p>你的面孔下俯，你的眼睛下望着我的眼睛，</p>

  <p>我的心接触到了你的双足。</p>
