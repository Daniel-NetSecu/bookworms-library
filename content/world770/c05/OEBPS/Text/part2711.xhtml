  <title>龟兔赛跑</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">龟兔赛跑</h1>

  <p>有一天，一只兔子嘲笑乌龟走路速度慢。“等等，”乌龟说，“我要跟你比赛，我打赌我能赢。”“啊，好啊！”兔子回答，他觉得这主意实在很可笑，“咱们比比看。”他们达成协议，由狐狸为他们设定比赛规则，担任裁判。比赛开始，龟兔两个同时出发，但是兔子很快就领先了，他觉得自己可以休息一下，于是便躺在路边睡着了。而乌龟却一直缓缓前行，及时到达了终点。等到兔子猛地惊醒，以最快的速度飞奔到终点，却发现乌龟早就赢得了比赛。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：稳扎稳打，坚持不懈才能胜利。</p>
</body></html>
