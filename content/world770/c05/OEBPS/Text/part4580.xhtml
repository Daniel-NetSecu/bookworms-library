  <title>交换</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">交换</h1>

  <p>一次，穷诗人与愚富翁相遇在交叉路口。二人之间有一长段谈话，所说的话无不流露着愤怒、厌恶情绪。</p>

  <p>这时路神经过，手往二人肩上一搭，奇迹发生了：各自的财产转入了对方的手中。</p>

  <p>二人各自离去。更奇异的是：诗人睁眼一看，发现自己手里抓的是流动的干沙子；而富翁一合眼，便觉得自己的心里尽是流动的乌云！</p>
