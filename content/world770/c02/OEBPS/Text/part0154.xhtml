  <title>牧羊人</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">牧羊人</h2>

  <p class="EB03BodyTextIndented">牧人的好运多么美妙！</p>

  <p class="EB03BodyTextIndented">从早到晚他到处游荡；</p>

  <p class="EB03BodyTextIndented">他须整天跟随着羊群，</p>

  <p class="EB03BodyTextIndented">他的口中要充满颂扬——</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">他听到羔羊天真地叫，</p>

  <p class="EB03BodyTextIndented">他听到母羊纤柔地嚷；</p>

  <p class="EB03BodyTextIndented">他警觉着：它们安然无忧——</p>

  <p class="EB03BodyTextIndented">因为知道牧人就在近旁。</p>
</body></html>
