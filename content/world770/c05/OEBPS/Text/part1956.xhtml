  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">10</h1>

  <p class="kindle-cn-poem-left1">羞愧呀，你对自己如此漠视，<br/>
  还谈什么你也爱恋着别人！<br/>
  不错，爱恋你的人难以数计，<br/>
  但你不爱别人，这可以肯定；<br/>
  因为你确实怀有谋杀之心，<br/>
  肆无忌惮地算计着你自己，<br/>
  一心想摧毁那美丽的屋顶，<br/>
  按理，你应尽全力将它修葺。<br/>
  改变主意吧，我也改变看法：<br/>
  恨心的居屋哪有爱心舒适！<br/>
  你待人温雅，表里不该分家，<br/>
  至少你得对自己多点仁慈。<br/>
  　　为了我，你就再造一个自身，<br/>
  　　使美在你或后代身上长存。</p>
