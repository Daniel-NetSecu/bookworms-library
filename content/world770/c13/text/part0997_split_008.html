<h2 class="heading" id="calibre_pb_7">捍马</h2>

  <p class="calibre7">捍马是一匹高大的白马，他长着一身金色的鬃毛，棕色的眼睛。作为皇家卫队队长的坐骑，捍马把追捕逃犯费林·雷德当成自己的使命。他在追捕费林的过程中，与乐佩相遇之后，变成了费林和乐佩的好朋友。他帮助费林救出了乐佩公主。</p>
