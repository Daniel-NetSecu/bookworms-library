  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">57</h1>

  <p class="kindle-cn-poem-left1">我是你的奴隶，我能做什么，<br/>
  除了时时刻刻听你的吩咐？<br/>
  我没有宝贵的时间可消磨，<br/>
  除了供你驱使，我无事可做。<br/>
  君主啊，我为你守望着时间，<br/>
  却不敢斥责它的无尽无止，<br/>
  当你对你的仆人说了再见，<br/>
  更不敢思量那别离的凄楚。<br/>
  我妒忌心重，但我没有胆量<br/>
  问你去了何处，做什么事情，<br/>
  我这可怜虫只能冥思遐想：<br/>
  你让你周围的人多么开心。<br/>
  　　爱真是傻瓜，只知道服从你，<br/>
  　　无论做什么，不说你的不是。</p>
