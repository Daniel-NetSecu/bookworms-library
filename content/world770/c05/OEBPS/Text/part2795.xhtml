  <title>驮驴、野驴和狮子</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">驮驴、野驴和狮子</h1>

  <p>一只野驴看到一只驮驴驮着沉重的货物慢慢走在路上，便嘲笑他被奴役的处境。“和我一比，你的命可真惨啊！我像空气一样自由，从来都不需要劳作。要吃草，我就上山，那儿应有尽有。但是你呢，你依靠主人给你食物，他让你每天都驮运沉重的货物，还无情地打你。”就在这时，出现了一只狮子，因为有赶驴的人在，他没有去攻击驮驴，而是扑向了野驴，野驴毫无依靠，立刻落入了狮口。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：无法自立时，自立没有什么意义。</p>
