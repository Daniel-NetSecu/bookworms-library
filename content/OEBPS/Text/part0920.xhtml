<h1 class="title1" id="CHP5">内容简介</h1>
<p class="normaltext02">夏日里，在一个英国的度假小镇上。一具年轻女子的尸体躺在沙滩上。谁杀了她？是那晚在迪斯科舞厅遇见她并和她跳舞的那两个年轻人西蒙和丹吗？他们有时会偷车，可他们是杀人犯吗？</p>
<p class="normaltext02">那晚在迪斯科舞厅到底发生了什么？有目击者说当时有人打架。玛丽走的时候是谁跟着她？她是一个人吗？那玛丽的男朋友吉姆呢？他真的爱她吗？或许他有点儿嫉妒和生气……</p>
<p class="normaltext02">法庭需要找到所有这些问题的答案，因为谋杀是重罪，杀人犯往往要被终身监禁。</p>
