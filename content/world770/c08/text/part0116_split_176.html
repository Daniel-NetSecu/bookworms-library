<h1 class="calibre22" id="calibre_pb_278">第七十六节</h1>

      <p class="x5">利率，像其他商品的价格一样，应仅仅根据交易过程而决定。</p>

      <p class="x6">我已经说过，所借货币的价格，像其他商品的价格一样，是由市场上货币数量与货币需求量的比例来调节的：这样，如果需要货币的借款人很多，货币的利息就会上升；如果有许多货币所有者都准备借出货币，利息就会下降。所以，如果认为商业中的货币利息应该由国君制定的法律来决定，那就是一种错误的认识。像所有其他商品一样，货币利息也有固定的现时价格。这一价格会根据出借人收回本金的安全性的大小而略有变动；但在安全性相同的情况下，他应该根据需求的大小提高或降低自己的价格，而法律不应该决定货币的利息，就像它不应该调节商业中流通的任何其他商品的价格一样。</p><a id="Section_cn_77"></a>
