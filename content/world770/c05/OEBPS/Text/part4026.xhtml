  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">34</h1>

  <p class="kindle-cn-poem-left">不要不辞而别，我爱。<br/>
  我看望了一夜，现在我脸上睡意重重。<br/>
  只恐我在睡中把你丢失了。<br/>
  不要不辞而别，我爱。<br/>
  我惊起伸出双手去摸触你，我问自己说：<br/>
  “这是一个梦吗？”<br/>
  但愿我能用我的心系住你的双足，紧抱在胸前！<br/>
  不要不辞而别，我爱。</p>
