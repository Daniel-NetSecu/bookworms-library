<p class="title1" id="CHP20">LESSON 17</p>
<p class="picture"><img src="../Images/image01562.jpeg.webp" alt="alt"/></p>
<p class="normaltext">A bird is in the tree. It has a nest there.</p>
<p class="normaltext">The nest has five eggs in it.</p>
<p class="normaltext">Do not rob the nest.</p>
<p class="normaltext">Will the bird let the cat get her five eggs?</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">树上有只鸟，那里有它的窝。</p>
<p class="normaltext">窝里有五个鸟蛋。</p>
<p class="normaltext">不要毁坏这个鸟窝。</p>
<p class="normaltext">鸟会让猫弄走它的五个鸟蛋吗？</p>
