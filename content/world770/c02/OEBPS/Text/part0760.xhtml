  <h2 class="EB04MainHeadClosedTitle">小站</h2>

  <p class="EB03BodyTextIndented">一位驿站站长对一位驾着两匹马正向他的驿站驶来的犹太人说：“从这儿开始您必须得有三匹马！因为前面是上坡路，而且路面柔软，这样的话，您得花三小时才能赶到那儿。”</p>

  <p class="EB03BodyTextIndented">犹太人问：“如果我驾着四匹马，多长时间能赶到那儿？”</p>

  <p class="EB03BodyTextIndented">——“两小时。”</p>

  <p class="EB03BodyTextIndented">“驾着六匹马呢？”</p>

  <p class="EB03BodyTextIndented">——“一小时。”</p>

  <p class="EB03BodyTextIndented">“您知道的，”犹太人最后说，“给我套上八匹马吧，这样我不用赶路就直接到了！”</p>

  <p class="EB03BodyTextIndented-2">（1813年）</p>
