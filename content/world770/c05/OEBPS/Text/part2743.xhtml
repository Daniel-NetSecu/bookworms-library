  <title>一只眼的雄鹿</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">一只眼的雄鹿</h1>

  <p>有一只雄鹿瞎了一只眼，他在海滩附近吃草，一直用那只好眼对着陆地，以防有猎犬靠近，而瞎了的那只眼则对着大海，他从来都不觉得那个方向会有什么危险。结果，几个水手沿着海滩航行，看到了他，便向他射了一箭，鹿因此而受了致命伤。躺在地上奄奄一息的时候，他自言自语道：“我可真可怜！我总以为陆地上会有危险，结果那里无人攻击我，我从来没有担心过海上会有灾祸，结果我却被杀了。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：不幸往往来自我们想不到的地方。</p>
</body></html>
