  <title>两个士兵和劫匪</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">两个士兵和劫匪</h1>

  <p>有两个士兵结伴旅行，路上遇到了劫匪。一个士兵撒腿就跑，但是另一个站在原地，拔出自己的剑，英姿勃发地指着劫匪，劫匪不得不逃走。等事情平息之后，那个胆小鬼回来了，挥动着自己的武器，口里说着威胁的话语：“他在哪儿？让我来对付他，我很快就能让他见识到他要打劫的是谁！”但另一个士兵回答说：“太晚了，我的朋友，我真希望刚才你能够支持我，哪怕只是动动嘴而已，那样我也会受到鼓励，相信你说的话是真的。而现在，你还是安静下来，把剑收起来吧，这已经没有什么用了。你也许能让别人以为你像狮子一样勇敢，但是我知道，一遇到危险，你会像兔子一样逃命。”</p>
