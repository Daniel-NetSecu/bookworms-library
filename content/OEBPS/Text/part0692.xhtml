<p class="subtitle1">内容简介</p>
<p class="normaltext">在美国的堪萨斯州，没有巫婆或巫师，可是那里<span class="xx">有</span>龙卷风。有一天，一阵龙卷风把多萝西和她的狗托托连同她的房子一起卷到了一个叫奥兹的国度。在奥兹住着四个巫婆和一个非常有名的巫师——奥兹魔法师。</p>
<p class="normaltext">多萝西想重新回到家乡堪萨斯，但是她不知怎样才能回去。她需要帮助。北方巫婆对她说：“去绿宝石城吧，请求奥兹魔法师帮助你。”</p>
<p class="normaltext">其后多萝西先后遇见了稻草人、锡人和胆小鬼狮子，而他们也都需要帮助。因此，多萝西和他们一起踏上了通向绿宝石城的黄砖路。可是他们去那里找什么呢？这个大名鼎鼎的奥兹魔法师是谁？他<span class="xx">是</span>怎样一个人呢？</p>
