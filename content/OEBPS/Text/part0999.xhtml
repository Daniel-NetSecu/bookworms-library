<h1 class="title1">简　介</h1>
<p class="normaltext">“你得知道，这儿人人都是疯子。”切舍猫说，“我是疯子，你也是疯子。”</p>
<p class="normaltext">“你怎么知道我疯了？”爱丽丝问。</p>
<p class="normaltext">“你当然是疯子，”切舍猫说，“到这儿来的人都疯了。”</p>
<p class="normaltext">这是爱丽丝在很早以前一个夏日里的梦。在这梦的奇境里，白兔戴着白手套，毛虫吸着烟斗……疯了的制帽人和三月兔总是在喝茶，而红桃王后要砍掉每一个人的头……这故事很奇怪，可是，在梦境里什么都会发生。</p>
<p class="normaltext"><br/></p>
<p class="normaltext">刘易斯·卡洛尔（他的真名叫查尔斯·道森）生于1832年，死于1898年。他在牛津大学教数学。《爱丽丝漫游奇境记》是写给一个名叫爱丽丝·利得尔的小女孩的。后来他又写了一本《透过镜子》，这两部爱丽丝的故事都是最著名的儿童读物。</p>
