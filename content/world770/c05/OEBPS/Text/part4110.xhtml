  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">30</h1>

  <p>我独自去赴幽会。</p>

  <p>是谁在暗寂中跟着我呢？</p>

  <p>我走开躲他，但是我逃不掉。</p>

  <p>他昂首阔步，使地上尘土飞扬；</p>

  <p>我说出的每一个字里，都掺杂着他的喊叫。</p>

  <p>他就是我的小我，我的主，他恬不知耻；</p>

  <p>但和他一同到你门前，我却感到羞愧。</p>
