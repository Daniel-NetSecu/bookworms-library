<p class="title1" id="CHP34">LESSON 31</p>
<p class="picture"><img src="../Images/image01579.jpeg.webp" alt="alt"/></p>
<p class="normaltext">Ned and John are hard at work.</p>
<p class="normaltext">John has a saw, and Ned has an ax.</p>
<p class="normaltext">They will try to cut all of the wood which you see in the pile.</p>
<p class="normaltext">Do you think they can do this in one day?</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">内德和约翰干活很努力。</p>
<p class="normaltext">约翰拿着一把锯，内德拿着一把斧子。</p>
<p class="normaltext">他们想劈开你看到的那一堆木头。</p>
<p class="normaltext">你认为他们能在一天之内完成吗？</p>
