  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">一条隐没的路</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">一条隐没的路；</p>

  <p class="EB03BodyTextIndented">有一只旋转的轮子；</p>

  <p class="EB03BodyTextIndented">绿宝石的振鸣，</p>

  <p class="EB03BodyTextIndented">胭脂虫的急奔；</p>

  <p class="EB03BodyTextIndented">树丛上的每一朵花</p>

  <p class="EB03BodyTextIndented">调整乱转的头，——</p>

  <p class="EB03BodyTextIndented">突尼斯来的信，或许，</p>

  <p class="EB03BodyTextIndented">早晨一趟轻松的出行。</p>
