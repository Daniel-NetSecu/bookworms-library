<h1 class="calibre22" id="calibre_pb_241">第三十九节</h1>

      <p class="x5">所有商品都具有货币的两个本质属性，即衡量和代表所有价值：从这种意义上说，所有商品都是货币。</p>

      <p class="x6">作为衡量所有价值的标准尺度和所有其他等值商品的代表性象征物，这两种属性包含了所谓货币的本质和使用的所有构成成分；从我刚刚讨论过的细节来看，所有商品在某种程度上都是货币；而且根据它们各自的具体性质，都或多或少具有这两种本质属性。根据被使用的普遍程度、质量的相似程度以及是否容易分割成等值的部分，它们都或多或少适合作为标准尺度。根据是否容易腐烂，或者数量和质量发生变化的程度，它们都或多或少适合作为交换活动中的通用象征物。</p><a id="Section_cn_40"></a>
