  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">大脑在它的沟槽中</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">大脑在它的沟槽中</p>

  <p class="EB03BodyTextIndented">均衡并且真实地运动；</p>

  <p class="EB03BodyTextIndented">可要是让一个碎片骤然偏转，</p>

  <p class="EB03BodyTextIndented">对你来说那样</p>

  <p class="EB03BodyTextIndented">更易让水回流；</p>

  <p class="EB03BodyTextIndented">当洪水已裂开山峦，</p>

  <p class="EB03BodyTextIndented">并为自己挖出一道迂回之路，</p>

  <p class="EB03BodyTextIndented">还毁掉了磨坊！</p>
