  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">92</h1>

  <p>我知道这日子将要来到，当我眼中的人世渐渐消失，</p>

  <p>生命默默地向我道别，把最后的帘幕拉过我的眼前。</p>

  <p>但是星辰将在夜中守望，晨曦仍旧升起，</p>

  <p>时间像海波的汹涌，激荡着欢乐与哀伤。</p>

  <p>当我想到我的时间的终点，时间的隔栏便破裂了。</p>

  <p>在死的光明中，我看见了你的世界和世界里弃置的珍宝。</p>

  <p>最低的座位是极其珍奇的，</p>

  <p>最小的生物也是世间少有的。</p>

  <p>我追求而未得到和我已经得到的东西——</p>

  <p>让它们过去吧。只让我真正地据有那些我所轻视和忽略的东西。</p>
