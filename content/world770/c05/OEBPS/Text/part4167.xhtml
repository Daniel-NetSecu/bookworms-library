  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">87</h1>

  <p>在无望的希望中，我在房里的每一个角落找她；</p>

  <p>我找不到她。</p>

  <p>我的房子很小，一旦丢了东西就永远找不回来。</p>

  <p>但是你的房子是无边无际的，我的主，</p>

  <p>为着找她，我来到了你的面前。</p>

  <p>我站在你薄暮金色的天穹下，向你抬起渴望的眼。</p>

  <p>我来到了永恒的边涯，在这里万物不灭——</p>

  <p>无论是希望，是幸福，或是从泪眼中望见的人面。</p>

  <p>啊，我把空虚的生命浸到这海洋里吧，</p>

  <p>跳进这最深的完满里吧。</p>

  <p>让我在宇宙的完整里，感觉一次那失去的温馨的接触吧。</p>
