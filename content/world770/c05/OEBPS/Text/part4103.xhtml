  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">23</h1>

  <p>在这暴风雨的夜晚你还在外面做爱的旅行吗，我的朋友？</p>

  <p>天空像失望者在哀号。</p>

  <p>我今夜无眠。</p>

  <p>我不断地开门向黑暗中瞭望，我的朋友！</p>

  <p>我什么也看不见。</p>

  <p>我不知道你要走哪一条路！</p>

  <p>是从墨黑的河岸上，</p>

  <p>是从远远的愁惨的树林边，</p>

  <p>是穿过昏暗迂回的曲径，</p>

  <p>你摸索着来到我这里吗，我的朋友？</p>
