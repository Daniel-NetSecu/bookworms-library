  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">4</h1>

  <p class="kindle-cn-poem-left1">美的遗产，奢侈铺张的可人，<br/>
  你为何如此挥霍，不知珍惜；<br/>
  造化从不赠送，她只知租赁，<br/>
  她所眷顾的是那慷慨之士。<br/>
  美的悭吝人，你为何要作践<br/>
  造化让你转交的一份厚礼？<br/>
  不图利的债主，你为何暴殄<br/>
  如许资财，生活却难以为继？<br/>
  因为你只跟自己洽谈生意，<br/>
  你在自欺欺人，伤害了自身：<br/>
  当来日造化让你与世长辞，<br/>
  你能给后人留下什么账本？<br/>
  　　未经启用的美随你而入土，<br/>
  　　启用过的，活着将前缘衍续。</p>
