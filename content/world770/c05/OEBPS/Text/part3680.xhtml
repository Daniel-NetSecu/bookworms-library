  <div class="chapter" id="chapter">
    <h1 class="kindle-cn-heading-2"><a id="page69"></a>第三场</h1>

    <div class="kindle-cn-para-2em-indent1">
      <p><span class="kaiti">宰相和伍尔穆。</span><br/>
      <br/></p>
    </div>

    <p class="kindle-cn-para-hang"><span class="kindle-cn-bold">伍尔穆</span>　提琴师和他老婆给逮起来了，非常顺利，一点没有声张。信，大人现在要过目吗？</p>

    <p class="kindle-cn-para-hang"><span class="kindle-cn-bold">宰相</span>　<span class="kaiti">（念完了信）</span>妙极了！妙极了，秘书先生！还有侍卫长也上了钩！——像这样的毒药，足以使健康本身变成腐烂化脓的麻风病！——喏，立刻去对那位父亲提出条件，然后趁热打铁再找他女儿去。<span class="kaiti">（两人从不同的方向下）</span></p>
  </div>
