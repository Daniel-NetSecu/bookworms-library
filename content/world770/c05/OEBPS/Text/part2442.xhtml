  <div class="chapter" id="chapter">
    <h1 class="kindle-cn-heading-1">金钥匙</h1>

    <p>冬日里的一天，积雪很深，一个贫穷的男孩得出门驾雪橇去运木柴。他捡齐了柴火，搬到雪橇上，因他冻得厉害，想先烧一堆火暖和暖和再回家。扒开积雪，要清理出一块干净地面时，他发现了一把小金钥匙。他想，哪里有钥匙，哪里就会有和钥匙匹配的锁，就从地上挖下去，发现了一个小铁箱。“要是小钥匙能开这口箱子就好了！”他想，小箱子里面一定有珍贵的东西。他找锁眼，但小箱上没有。终于，他发现了一个小得几乎没法让人看见的小锁眼。他试了试，好运气，钥匙正合适。他转一下钥匙，现在我们得等他完全打开锁，掀开箱盖，才能知道箱子里面有什么奇妙的东西。</p>
