  <h1 class="bodycontent-first-title">自豪</h1>

  <p class="bodycontent-text">西塞罗在一封信中亲切地和他朋友谈道：“告诉我你想让我把高卢人交给谁。”在另一封信中，他又抱怨已厌倦了王子们写信感谢他把他们的行省提升为王国，而且补充道，他甚至不知道这些所谓的王国在哪。</p>

  <p class="bodycontent-text">事实也许是这样，备受古罗马人民的称赞和遵从、也曾受到不相识的国王感谢的西塞罗有获得自豪和虚荣的冲动。</p>

  <p class="bodycontent-text">尽管这种感觉对于人类这种渺小的动物未必合适，然而我们也许可以原谅西塞罗、恺撒、西庇阿这样的伟大人物有这样的感受。但是，如果在半原始地方的遥远角落，一个人给自己置办了一件小办公室、印出一些平庸的诗句就深感自豪，这就足以贻笑大方了。</p>
