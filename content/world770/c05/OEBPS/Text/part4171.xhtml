  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">91</h1>

  <p>啊，你这生命最后的完成，死亡，我的死亡，来对我低语吧！</p>

  <p>我天天在守望着你；</p>

  <p>为你，我忍受着生命中的苦乐。</p>

  <p>我的一切存在，一切所有，一切希望和一切的爱，</p>

  <p>总在深深的秘密中向你奔流。</p>

  <p>你的眼睛向我最后一盼，我的生命就永远是你的。</p>

  <p>花环已为新郎编好。</p>

  <p>婚礼行过，新娘就要离家，</p>

  <p>在静夜里和她的主人独对了。</p>
