  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">37</h1>

  <p>我以为我的精力已竭，旅程已终——</p>

  <p>前路已绝，储粮已尽，</p>

  <p>退隐在静默鸿蒙中的时间已经到来。</p>

  <p>但是我发现你的意志在我的身上不知有终点。</p>

  <p>旧的语言刚在舌尖上死去，新的音乐又从心上进来；</p>

  <p>旧辙方迷，新的田野又在面前奇妙地展开。</p>
