  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">115</h1>

  <p class="kindle-cn-poem-left1">我曾说过爱你爱到了极点，<br/>
  这样的诗句其实是在说谎：<br/>
  当时我确实缺乏先见之明，<br/>
  不知爱情之火会越燃越旺。<br/>
  好事的时间最爱制造事故，<br/>
  千百次毁约，改变帝王指令，<br/>
  让美颜失色，挫败壮志宏图，<br/>
  使强悍者难逃无常的命运。<br/>
  哎呀，既然害怕时间的霸道，<br/>
  既然已从不确中获得确实，<br/>
  并因忧惧来日而借重今朝，<br/>
  我当时为何不说“我最爱你”？<br/>
  　　爱是婴儿：说“极点”确实不妥，<br/>
  　　因为婴儿要成长，来日甚多。</p>
