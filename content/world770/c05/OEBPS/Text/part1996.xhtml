  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">50</h1>

  <p class="kindle-cn-poem-left1">旅途中，我的内心何其愁苦，<br/>
  我渴望疲惫之旅早日终止，<br/>
  但歇脚时，应得的安宁声诉：<br/>
  “你与朋友的距离又增数里。”<br/>
  胯下坐骑，也因惆怅而萎靡，<br/>
  它缓缓而行，载着我的伤感，<br/>
  可怜的畜生似从天性得知，<br/>
  骑手担心越快离朋友越远。<br/>
  沾血的马刺无法催马飞奔，<br/>
  一怒之下，我猛刺它的腹肌，<br/>
  马儿报以一声低沉的呻吟，<br/>
  它受了伤，但我比它更悲戚。<br/>
  　　因为这一声呻吟向我启示：<br/>
  　　前方是痛苦，欢乐已成过去。</p>
