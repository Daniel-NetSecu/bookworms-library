<h2 class="heading" id="calibre_pb_3">毛伊</h2>

  <p class="p">手持神奇的鱼钩法杖主宰风和海的半神，精通变形。看似傲慢、狂妄的外表下实则深藏着一颗热情、无畏的心。他出生便遭父母抛弃，但神救了他并赐予其灵力，造福人类。他同莫阿娜一起踏上拯救特菲提之旅，在各种艰难险阻中逐渐找回了自我。</p>
