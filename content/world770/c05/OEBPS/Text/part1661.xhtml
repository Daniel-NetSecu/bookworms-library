  <h2 class="kindle-cn-heading2">70. To——</h2>

  <p class="kindle-cn-signature">——P. B. Shelley</p>

  <p class="kindle-cn-poem-left">Music, when soft voices die,<br/>
  Vibrates in the memory——<br/>
  Odours, when sweet violets sicken,<br/>
  Live within the sense they quicken.</p>

  <p class="kindle-cn-poem-left">Rose leaves, when the rose is dead,<br/>
  Are heaped for the beloved's bed;<br/>
  And so thy thoughts, when thou art gone,<br/>
  Love itself shall slumber on.</p>
