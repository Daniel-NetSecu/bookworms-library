  <title>老鼠和黄鼠狼</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">老鼠和黄鼠狼</h1>

  <p>老鼠和黄鼠狼之间爆发了一场战争，老鼠伤亡惨重，很多都被黄鼠狼给吃掉了。于是他们召集成立了一个战争委员会，会上，一只老鼠发言：“我们总是失败这并不奇怪，因为我们没有将军指挥战斗和行动。”为了响应他的建议，老鼠们选举出体形最大的一批老鼠担任首领。而为了让这些将军老鼠区别于其他普通老鼠，老鼠们给他们提供了用很多草编成的厚头盔。这些将军带着老鼠去战斗，自信满满，却还是落败。老鼠们全都惊慌失措地跑向自己的洞，大家都成功逃脱，只有那些将军们，被头上的等级标志妨碍，全都没有办法进入洞中，被追捕者轻而易举逮到，成了受害者。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：大者有时无当，反受其害。</p>
