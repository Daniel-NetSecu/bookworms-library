  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">47</h1>

  <p class="kindle-cn-poem-left">如果你要这样，我就停了歌唱。<br/>
  如果它使你心震颤，我就把眼光从你脸上挪开。<br/>
  如果使你在行走时忽然惊跃，我就躲开另走别路。<br/>
  如果在你编串花环时，使你烦乱，我就避开你寂寞的花园。<br/>
  如果我使水花飞溅，我就不在你的河边划船。</p>
