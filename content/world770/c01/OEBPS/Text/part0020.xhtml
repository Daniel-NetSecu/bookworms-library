<p class="title1" id="CHP18">LESSON 15 复习</p>
<p class="normaltext">I see ducks on the pond; Tom will feed them.</p>
<p class="normaltext">Tom is blind; he holds a box in his hand.</p>
<p class="normaltext">Nell is kind to him.</p>
<p class="normaltext">This old hen has a nest.</p>
<p class="normaltext">Mary will run and get the eggs.</p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">我看见池塘里有鸭子。汤姆要喂它们。</p>
<p class="normaltext">汤姆是位盲人；他手里拎着一只箱子。</p>
<p class="normaltext">内尔对他非常友好。</p>
<p class="normaltext">这只老母鸡有一个窝。</p>
<p class="normaltext">玛丽要跑过去捡鸡蛋。</p>
