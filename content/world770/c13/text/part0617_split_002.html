<h2 class="heading" id="calibre_pb_1">胡迪</h2>

  <p class="p4">● 虽然小主人安弟现在已经长大，牛仔玩偶胡迪却一直坚定地认为，安弟仍然十分关心他的玩具们。其他的玩具觉得，胡迪对安弟坚信不疑实在是有点自欺欺人，而胡迪却固执己见，直到最终这一切得到证实——尽管证实方式有点出乎他的意料。</p>
