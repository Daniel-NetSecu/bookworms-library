  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">55</h1>

  <p class="kindle-cn-poem-left1">大理石和王侯镀金的碑碣，<br/>
  论寿命都无法与这诗相比，<br/>
  你就活在诗行里，光芒四射，<br/>
  碑碣则被尘封，被时间污蚀。<br/>
  毁灭性的战争将塑像推倒，<br/>
  暴乱把高楼大厦连根拔起，<br/>
  但战神的剑和战火，抹不掉<br/>
  你镂刻在人们心头的记忆。<br/>
  那时你昂首向前，藐视死神，<br/>
  拒绝遗忘和它的目空一切；<br/>
  后代子孙称颂着你的美名，<br/>
  直至千秋万代，世界的终结。<br/>
  　　直至末日审判你复活之时，<br/>
  　　你都活在这诗中，恋人眼里。</p>
