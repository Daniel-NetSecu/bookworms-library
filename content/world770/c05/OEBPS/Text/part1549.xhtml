  <h2 class="kindle-cn-heading2">106　千万别献出你的整颗心</h2>

  <p class="kindle-cn-signature">叶芝</p>

  <p class="kindle-cn-poem-left">千万别献出你的整颗心，<br/>
  爱情其实不值得你太用情。<br/>
  如果有多情的少女自以为是，<br/>
  她自己一定始料未及：<br/>
  爱情就在一次次亲吻中消弭。<br/>
  一切美好的东西都是过眼烟云，<br/>
  梦中幻影，暂时的祥和与欢愉。<br/>
  哟，千万别即刻把整颗心献出，<br/>
  那些懂得变通的人都这么说：<br/>
  他们的日子都在游戏中度过。<br/>
  如果对爱情装聋作哑，视而不见，<br/>
  谁还能把这戏演得精彩纷呈？<br/>
  说这话的人吃过爱情的苦头，<br/>
  他献出过整颗心，结果一无所有。</p>
