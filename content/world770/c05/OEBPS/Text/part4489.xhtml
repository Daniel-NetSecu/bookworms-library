  <p class="kindle-cn-poem-left">多少人爱你青春欢畅的时辰，<br/>
  爱慕你的美丽，假意或真心，<br/>
  只有一个人爱你那朝圣者的灵魂，<br/>
  爱你衰老了的脸上痛苦的皱纹。<a id="ch1-back" href="part4489.xhtml#ch1"><sup>(1)</sup></a></p>

  <p class="kindle-cn-signature kindle-cn-kai">——叶芝</p>

  <div class="empty"></div>

  <p class="fnote"><a id="ch1" href="part4489.xhtml#ch1-back">(1)</a>&nbsp;引自叶芝的诗《当你老了》，袁可嘉译本。</p>
