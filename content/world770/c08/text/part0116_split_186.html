<h1 class="calibre22" id="calibre_pb_288">第八十六节</h1>

      <p class="x5">将货币用于贷款取息所带来的收入应该高于用同样的资本购买土地所获得的收入。</p>

      <p class="x6">放贷取息者可以比土地所有者更加安闲、自由地享受货币带来的好处。但是，如果债务人破产，他就有失去本金的风险。所以，他不会满足于收取与使用同样资本购买土地所能获得的收入相等的利息。因此，借出货币的利息必须高于使用同样资本购买地产所能获得的收入；因为，如果货币所有者发现购买一块地产能够获得同等的收入，他肯定会优先考虑购买地产。</p><a id="Section_cn_87"></a>
