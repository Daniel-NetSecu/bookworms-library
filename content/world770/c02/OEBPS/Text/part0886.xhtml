  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">紫色的船只轻轻摇荡</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">紫色的船只轻轻摇荡</p>

  <p class="EB03BodyTextIndented">在黄水仙的大海之上，</p>

  <p class="EB03BodyTextIndented">奇妙的水手融入其中，</p>

  <p class="EB03BodyTextIndented">而后——码头寂然。</p>
