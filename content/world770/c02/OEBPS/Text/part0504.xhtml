  <title>对困难之事的迷恋</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">对困难之事的迷恋</h2>

  <p class="EB03BodyTextIndented">对困难之事的迷恋，</p>

  <p class="EB03BodyTextIndented">已榨干我血管里的汁液，收取</p>

  <p class="EB03BodyTextIndented">我内心自发的愉悦，和天然的</p>

  <p class="EB03BodyTextIndented">满足。我们的马驹苦恼，</p>

  <p class="EB03BodyTextIndented">它似乎没有神圣的血统，</p>

  <p class="EB03BodyTextIndented">不能在奥林匹斯山的云朵间跳跃，</p>

  <p class="EB03BodyTextIndented">必须在鞭子下战栗、挣扎、流汗、摇晃，</p>

  <p class="EB03BodyTextIndented">仿佛在拖拽铺路的石子。我诅咒</p>

  <p class="EB03BodyTextIndented">那些得以五十种方式排演的剧目，</p>

  <p class="EB03BodyTextIndented">在白日与每个无赖和笨蛋争斗，</p>

  <p class="EB03BodyTextIndented">剧场事务，人事安排。</p>

  <p class="EB03BodyTextIndented">我发誓黎明再次来临之前，</p>

  <p class="EB03BodyTextIndented">我将找到马厩，拔出门闩。</p>
