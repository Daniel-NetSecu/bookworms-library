  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">74</h1>

  <p class="kindle-cn-poem-left">在世界的谒见堂里，一根朴素的草叶，<br/>
  和阳光与夜半的星辰坐在<br/>
  同一条毡褥上。<br/>
  我的诗歌，也这样地和云彩与森林的音乐，<br/>
  在世界的心中平分席次。<br/>
  但是，你这富有的人，你的财富，<br/>
  在太阳的喜悦的金光和沉思的月亮的柔光这种单纯的光彩里，<br/>
  却占不了一份。<br/>
  包罗万象的天空的祝福，没有洒在它的上面。<br/>
  等到死亡出现的时候，它就苍白枯萎，碎成尘土了。</p>
