  <h2 class="kindle-cn-heading2">34　女人是男人的影子</h2>

  <p class="kindle-cn-signature">琼生</p>

  <p class="kindle-cn-poem-left">你跟踪影子，它竭力逃避，<br/>
  想要摆脱它，它又追随你：<br/>
  同样，向女人求爱，她总是摇头，<br/>
  你不理睬她，她又把你来追求。<br/>
  那么，我们是否可以这样称呼：<br/>
  女人只是男人的影子？<br/>
  早上与晚上影子最长，<br/>
  正午影子缩短甚至消失。<br/>
  同样，男人最弱时她们最强；<br/>
  而当我们完美，她们就湮没不见。<br/>
  那么，我们是否可以这样称呼：<br/>
  女人只是男人的影子？</p>
