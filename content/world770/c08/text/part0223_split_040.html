<h2 class="calibre25" id="calibre_pb_85">第一章 论财富</h2>

      <p class="calibre3">土地是一切财富产生的源泉或物质基础。人类劳动是财富的产生形式：财富本身只不过是用来维持生活、方便生活和享受生活的物质。</p>

      <p class="calibre3">土地上能生长草本植物、块根植物、谷物、亚麻、棉花、大麻、灌木以及长有各种果实、树皮和叶子的树木，如桑蚕树之类；土地还蕴含矿藏和矿物质，而人类劳动使这一切变成了财富。</p>

      <p class="calibre3">河流和海洋提供鱼类供人食用，同时也提供许多别的东西供人享用，但这些海洋和河流为毗连的几块土地所共有，或者属于全人类，人只是通过劳动从中获取鱼类和其他利益。</p><a id="chapter_cn_2"></a>
