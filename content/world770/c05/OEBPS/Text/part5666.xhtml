  <h1 class="bodycontent-first-title">十二</h1>

  <p class="bodycontent-text">下一个星球上，住着一个酒鬼。这次访问时间很短，却使小王子深深感到悲哀。</p>

  <p class="bodycontent-text">“你在干什么？”他问酒鬼。只见那人坐在那里一声不吭，面前堆着一些空酒瓶，还有一些装满了酒的酒瓶。</p>

  <p class="bodycontent-text">“我喝酒呀！”酒鬼答道，一副委靡不振的样子。</p>

  <p class="bodycontent-text">“你为什么要这么喝呀？”小王子问道。</p>

  <p class="bodycontent-text">“为了忘记。”酒鬼答道。</p>

  <p class="bodycontent-text">“忘记什么呀？”小王子又问，他已经开始怜悯这个人了。</p>

  <p class="bodycontent-text">“为了忘记我已经感到羞愧了。”酒鬼垂下头来招认说。</p>

  <p class="bodycontent-text">“你为什么感到羞愧？”小王子又问，他想帮助这人振作起来。</p>

  <div class="tupian"><img alt="" class="image-alone" src="../Images/image24308.jpeg.webp"/></div>

  <p class="bodycontent-text">“我为喝酒而感到羞愧！”酒鬼说完，再也不吭声了。</p>

  <p class="bodycontent-text">“成年人都是古里古怪，无奇不有。”小王子在星际旅行之中这么想。</p>
