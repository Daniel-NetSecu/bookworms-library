  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">143</h1>

  <p class="kindle-cn-poem-left1">看哪，就像一个贫穷的农妇<br/>
  跑着追赶一只逃跑的母鸡，<br/>
  她放下孩子不管，放开脚步<br/>
  紧紧追逐，想把它抓在手里；<br/>
  被忽视的孩子在大声哭喊，<br/>
  追赶在她身后；但她的心思<br/>
  全在那只飞蹿的母鸡身上，<br/>
  可怜的孩子，她已无暇顾及。<br/>
  你也如此，追逐离开你的人，<br/>
  而我是那孩子，就在你身后；<br/>
  如果你追逐得手，请回转身，<br/>
  尽人母之职：吻我，给我温柔。<br/>
  　　我祝福你实现你心中目标，<br/>
  　　只要你回转，我就不再哭叫。</p>
