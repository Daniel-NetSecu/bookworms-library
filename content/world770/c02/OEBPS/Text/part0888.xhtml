  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">有一个词</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">有一个词</p>

  <p class="EB03BodyTextIndented">它带着一把剑</p>

  <p class="EB03BodyTextIndented">能刺穿一个全副武装的人。</p>

  <p class="EB03BodyTextIndented">它掷出它带刺的音节，——</p>

  <p class="EB03BodyTextIndented">马上又变得沉默。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">可在它落下的地方</p>

  <p class="EB03BodyTextIndented">被拯救的人</p>

  <p class="EB03BodyTextIndented">会在爱国日告诉，</p>

  <p class="EB03BodyTextIndented">某个佩戴肩章的兄弟</p>

  <p class="EB03BodyTextIndented">尽情呼吸。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">不管那气喘吁吁的太阳在哪儿奔跑，</p>

  <p class="EB03BodyTextIndented">不管白天在哪儿浪游，</p>

  <p class="EB03BodyTextIndented">有它无声的进攻，</p>

  <p class="EB03BodyTextIndented">有它的胜利！</p>

  <p class="EB03BodyTextIndented">看那最精准的神枪手！</p>

  <p class="EB03BodyTextIndented">最成功的射击！</p>

  <p class="EB03BodyTextIndented">时间最崇高的目标</p>

  <p class="EB03BodyTextIndented">是一个灵魂“被忘记”！</p>
</body></html>
