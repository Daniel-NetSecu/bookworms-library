  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">33</h1>

  <p class="kindle-cn-poem-left">我爱你，我的爱人。请饶恕我的爱。<br/>
  像一只迷路的鸟，我被捉住了。<br/>
  当我的心抖颤的时候，<br/>
  它丢了围纱，变成赤裸。<br/>
  用怜悯遮住它吧。<br/>
  爱人，请饶恕我的爱。<br/>
  如果你不能爱我，爱人，请饶恕我的痛苦。<br/>
  不要远远地斜视我。<br/>
  我将偷偷地回到我的角落里去，在黑暗中坐地。<br/>
  我将用双手掩起我赤裸的羞惭。<br/>
  回过脸去吧，我的爱人，请饶恕我的痛苦。<br/>
  如果你爱我，爱人，请饶恕我的欢乐。<br/>
  当我的心被快乐的洪水卷走的时候，<br/>
  不要笑我的汹涌的退却。<br/>
  当我坐在宝座上，用我暴虐的爱来统治你的时候，<br/>
  当我像女神一样向你施恩的时候，<br/>
  饶恕我的骄傲吧，爱人，也饶恕我的欢乐。</p>
