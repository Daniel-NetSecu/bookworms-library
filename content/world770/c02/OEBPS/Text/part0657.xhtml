  <h2 class="EB04MainHeadClosedTitle">小羊和狼</h2>

  <p class="EB03BodyTextIndented">一只狼在追赶着一只小羊。小羊在一座庙里避难。狼要求小羊从里面出来，并说道：“如果你不出来的话，牧师就会捉住你，把你供奉在祭坛上。”小羊如是说：“谢谢，我想我就待在这儿了，我宁愿被拿去祭祀，也不要被你吃掉。”</p>

  <p class="EB01BodyTextLineSpace">因此，一些在学校里似乎有点才能的演说家，一旦进入政治舞台便暴露出了他们的无能。</p>
