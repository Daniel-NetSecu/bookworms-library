  <h1 class="bodycontent-first-title">尾声</h1>

  <p class="bodycontent-text">本故事就此结束。严格地说，这个故事说的是一个儿童的故事，该由此搁笔了，再写下去不就成了大人故事了吗？写成人小说的人都知道该在哪里结束——就是说，写到结婚为止。可要是写的是少年故事，那就得适可而止。</p>

  <p class="bodycontent-text">本书的大多数人物现在仍活着，活得舒心而快活。也许有一天继续提笔写写这些年轻人的故事，看看他们（她们）到底会成为什么样的人物，倒不失为件有意义的事。所以，最明智的做法是，他们这一阶段的生活现在还是不披露的好。</p>
