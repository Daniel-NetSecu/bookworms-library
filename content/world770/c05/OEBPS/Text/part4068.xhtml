  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">76</h1>

  <p class="kindle-cn-poem-left">庙前的集会正在进行。<br/>
  从一早起就下雨，<br/>
  这一天快过尽了。<br/>
  比一切群众的欢乐还光辉的，<br/>
  是一个花一文钱买到一个棕叶哨子的小女孩的光辉的微笑。<br/>
  哨子的尖脆欢乐的声音，在一切笑语喧哗之上飘浮。<br/>
  无尽的人流挤在一起，路上泥泞，河水在涨，<br/>
  雨在不停地下着，田地都没在水里。<br/>
  比一切群众的烦恼更深的，是一个小男孩的烦恼——<br/>
  他连买那根带颜色的小棍的一文钱都没有。<br/>
  他苦闷的眼睛望着那间小店，<br/>
  使得这整个人类的集会变成可悲悯的。</p>
