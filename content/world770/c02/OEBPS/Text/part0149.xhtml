  <title>《弥尔顿》序诗</title>

  <h2 class="EB04MainHeadClosedTitle">《弥尔顿》序诗</h2>

  <p class="EB03BodyTextIndented">要是远古时那些圣足</p>

  <p class="EB03BodyTextIndented">曾在英格兰的群山上徜徉；</p>

  <p class="EB03BodyTextIndented">要是那神圣的上帝的羊羔</p>

  <p class="EB03BodyTextIndented">到过英格兰的快乐的牧场！</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">那张神圣的脸庞可曾</p>

  <p class="EB03BodyTextIndented">照亮我们阴云中的山峦？</p>

  <p class="EB03BodyTextIndented">耶路撒冷可曾建起，在这些</p>

  <p class="EB03BodyTextIndented">昏暗的撒旦的磨坊<a id="w1"></a><a href="part0149.xhtml#m1"><sup>[1]</sup></a>之间？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">把我那灼亮的金弓带给我，</p>

  <p class="EB03BodyTextIndented">把我那愿望的箭矢带给我，</p>

  <p class="EB03BodyTextIndented">带给我长矛，招展的云彩呀！</p>

  <p class="EB03BodyTextIndented">把我那烈火的战车带给我！</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我不会停止内心的战斗，</p>

  <p class="EB03BodyTextIndented">我的剑也不会在手中安眠，</p>

  <p class="EB03BodyTextIndented">直到我们建立起耶路撒冷，</p>

  <p class="EB03BodyTextIndented">在英格兰青翠而快乐的地面。</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="m1"></a><a href="part0149.xhtml#w1">[1]</a> “磨坊”一语双关，原文mill也指工厂。（说明：书中脚注除特别标明的之外均为译者注。）</p>
