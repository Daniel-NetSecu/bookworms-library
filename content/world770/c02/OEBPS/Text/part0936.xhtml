  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">The rat is the concisest tenant.</h2>

  <p class="EB03BodyTextIndented">The rat is the concisest tenant.</p>

  <p class="EB03BodyTextIndented">He pays no rent, —</p>

  <p class="EB03BodyTextIndented">Repudiates the obligation,</p>

  <p class="EB03BodyTextIndented">On schemes intent.</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">Balking our wit</p>

  <p class="EB03BodyTextIndented">To sound or circumvent,</p>

  <p class="EB03BodyTextIndented">Hate cannot harm</p>

  <p class="EB03BodyTextIndented">A foe so reticent.</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">Neither decree</p>

  <p class="EB03BodyTextIndented">Prohibits him,</p>

  <p class="EB03BodyTextIndented">Lawful as</p>

  <p class="EB03BodyTextIndented">Equilibrium.</p>
