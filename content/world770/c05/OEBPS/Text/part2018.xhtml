  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">72</h1>

  <p class="kindle-cn-poem-left1">啊，把我忘了吧，我的爱友，<br/>
  我怕世人追问：我何德何才<br/>
  让你依然爱着我——在我死后？<br/>
  你无法证明我的蕙质何在，<br/>
  除非你编造出善意的谎言，<br/>
  对我的好处加以胡捧瞎吹，<br/>
  给予你的亡友过分的夸赞，<br/>
  远远超出事实许可的范围。<br/>
  啊，我怕人家会说你不真诚，<br/>
  因为你把我赞美，言过其实；<br/>
  愿我的名与身同埋一个坟，<br/>
  免得这名活着，让你我蒙耻。<br/>
  　　我为自己写的诗而感汗颜，<br/>
  　　你爱不该爱的人，也该羞惭。</p>
