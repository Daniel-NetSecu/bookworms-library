<p class="title3">内容简介</p>
<p class="normaltext">是不是所有的自行车轮胎都一样？有多少种不同的自行车轮胎？当有人骑过松软潮湿的地面，轮胎会在地面上留下车辙——但是有一只轮胎会留下更深的车辙。这是前轮的轮胎还是后轮的轮胎？</p>
<p class="normaltext">当公爵的儿子被从赫克斯特伯博士的学校绑架的时候，了解这些问题的答案意义重大。歇洛克·福尔摩斯和他的老朋友华生大夫花了数小时查看低峡谷沼泽里的泥土。他们发现了自行车轮胎的车辙、羊和牛的蹄印——他们还发现了一具尸体。现在有了更多的问题，而且华生大夫认为不可能找到答案。“得啦，得啦，华生，”福尔摩斯说，“每个秘密都有它的答案。”</p>
<p class="normaltext">但是甚至连歇洛克·福尔摩斯对这起神秘事件的答案也大感意外……</p>
