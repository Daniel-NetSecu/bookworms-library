  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">18</h1>

  <p>依赛格林很骄傲地走到国王面前，很凶恶地骂着列那。国王听了大怒，下令把狼与熊都缚了起来。他们被捆缚得极紧，整个晚上，他们的足与手都丝毫不能转动。现在看狐怎么办！他恨他们。他设法向王后说，他动身时要用一尺长一尺宽的熊皮做背囊，还有，他要四只坚固的靴，以便走远路。他对王后道：“我后，我现在是你的朝陵使了。我的叔父依赛格林有四只靴，恰好合我用。我要他给我两只靴，还有他的妻，我的婶母，也要给我两只，她不大出门，没有靴也不要紧。”</p>

  <p>王后道：“列那，这些靴你必定要的，因为你要爬山过岭。依赛格林及他的妻的靴，正合你用，又好又坚固。我叫他们每人给你两只。取下来虽痛，也无法，因为朝陵是要事。”</p>
