  <h1 class="heading1" id="calibre_pb_0">第 28 章</h1>

  <p class="calibre7">尼克问朱迪：“所有的兔子开车技术都这么烂吗？还是只有你？”</p>

  <p class="calibre7">朱迪猛踩刹车，尼克的身子不由往前一倾，手里的梅花掌棒冰拍在了脸上。</p>

  <p class="calibre7">她说：“啊，对不起哦！”</p>

  <p class="calibre7">“狡猾的兔子！”尼克边说边擦脸。</p>

  <p class="calibre7">“笨狐狸！”</p>

  <p class="calibre7">尼克说：“别这样，你知道我爱你！”</p>

  <p class="calibre7">“我知道吗？是的，是的，我知道！”</p>

  <p class="calibre7">朱迪和尼克相视一笑。突然一辆伪装的红色赛车从他们眼前疾驰而过，速度超过100英里每小时。他们笑得更开心了，尼克拉响了警笛。呜！呜！朱迪一脚踩下油门，车子便飞驰了起来，紧追着赛车扬长而去。</p>
