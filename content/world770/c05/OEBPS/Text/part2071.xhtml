  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">125</h1>

  <p class="kindle-cn-poem-left1">如果我高擎华盖给人捧场，<br/>
  这礼敬徒有其表，于我何益？<br/>
  雄伟的基石本为百世流芳，<br/>
  其寿命能长过洪荒或毁灭？<br/>
  为仪表不惜支付高昂租金，<br/>
  这样的败家子我见过许多；<br/>
  可怜的富主，求繁丽弃清纯，<br/>
  万贯资财在养目之际挥霍。<br/>
  噢，让我把忠诚投在你心坎，<br/>
  请收下吧，礼虽轻，情义洋溢，<br/>
  那里没有掺假，没有设机关，<br/>
  仅仅是回敬，只限于我和你。<br/>
  　　滚开吧，诬陷者！忠诚的灵魂<br/>
  　　你愈诽谤，愈凸现他的真诚！</p>
