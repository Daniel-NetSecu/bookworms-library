  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">88</h1>

  <p class="kindle-cn-poem-left1">如果有一天你想将我轻视，<br/>
  让我蒙受世人的嘲讽、诽谤，<br/>
  我一定支持你，打击我自己，<br/>
  证明你有德，无视你的背叛。<br/>
  我有哪些弱点，自己最清楚，<br/>
  为了你，我要坦陈我的人生，<br/>
  将不名誉的过失一一披露，<br/>
  让你因失去我而声名倍增。<br/>
  我这样做，于自己也有所得：<br/>
  既然我把爱全倾注你身上，<br/>
  我对自己的伤害，即意味着<br/>
  你获得利益，同时我也沾光。<br/>
  　　我深爱着你，就完全属于你，<br/>
  　　为了你，我要承揽一切过失。</p>
