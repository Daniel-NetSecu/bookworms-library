  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">75</h1>

  <p class="kindle-cn-poem-left1">我的思想需要你，犹如生命<br/>
  需要食物，旱地渴望及时雨，<br/>
  你带给我安宁，但我又担心，<br/>
  就像一个守财奴害怕露富：<br/>
  他有时因富有而托大高傲，<br/>
  有时担忧衰老会盗走宝藏；<br/>
  刚才还觉得与你独处最好，<br/>
  旋即又想在世人面前张扬；<br/>
  不久前还饱餐了你的秀色，<br/>
  过一会又想看，饥饿得发慌；<br/>
  除了从你那里获得的欢乐，<br/>
  我别无所求，再无其他念想。<br/>
  　　我的生活就这样饥饱无常，<br/>
  　　要么享盛宴，要么辘辘饥肠。</p>
