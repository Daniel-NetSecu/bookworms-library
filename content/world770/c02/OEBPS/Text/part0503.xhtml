  <title>没有第二个特洛伊</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">没有第二个特洛伊</h2>

  <p class="EB03BodyTextIndented">我为何要责备她让我的时日</p>

  <p class="EB03BodyTextIndented">充满痛苦，或者说她最近</p>

  <p class="EB03BodyTextIndented">教无知的人以最大的暴行，</p>

  <p class="EB03BodyTextIndented">或让小人物攻击伟人，</p>

  <p class="EB03BodyTextIndented">只要他们勇气与欲望相当？</p>

  <p class="EB03BodyTextIndented">有什么能使她平静，既然心智</p>

  <p class="EB03BodyTextIndented">因其高贵练就得如火一般纯粹，</p>

  <p class="EB03BodyTextIndented">她的美似绷紧的弓，既然她有种</p>

  <p class="EB03BodyTextIndented">与时代并非协调的品质，诸如</p>

  <p class="EB03BodyTextIndented">高贵、孤独和坚定？</p>

  <p class="EB03BodyTextIndented">哦，她得做什么，让她成为这样？</p>

  <p class="EB03BodyTextIndented">还有第二个特洛伊为她焚毁吗？</p>
</body></html>
