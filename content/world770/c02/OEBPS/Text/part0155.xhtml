  <title>回音草坪</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">回音草坪</h2>

  <p class="EB03BodyTextIndented">太阳升起，</p>

  <p class="EB03BodyTextIndented">使天空欢喜；</p>

  <p class="EB03BodyTextIndented">钟声欢鸣，</p>

  <p class="EB03BodyTextIndented">将春天欢迎；</p>

  <p class="EB03BodyTextIndented">云雀和鸫鸟，</p>

  <p class="EB03BodyTextIndented">灌木林中的小鸟，</p>

  <p class="EB03BodyTextIndented">到处高声唱——</p>

  <p class="EB03BodyTextIndented">和着欢欣的钟鸣；</p>

  <p class="EB03BodyTextIndented">我们就开始游戏</p>

  <p class="EB03BodyTextIndented">在那回音草坪。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">满头白发的老约翰</p>

  <p class="EB03BodyTextIndented">无忧无虑地笑着，</p>

  <p class="EB03BodyTextIndented">坐在橡树下面，</p>

  <p class="EB03BodyTextIndented">坐在老人们中间；</p>

  <p class="EB03BodyTextIndented">他们笑我们嬉闹，</p>

  <p class="EB03BodyTextIndented">不久他们都说道：</p>

  <p class="EB03BodyTextIndented">“这样，这样作乐还是</p>

  <p class="EB03BodyTextIndented">当我们，全都年纪轻轻，</p>

  <p class="EB03BodyTextIndented">还是孩子时干的事，</p>

  <p class="EB03BodyTextIndented">在这回音草坪。”</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">直到小家伙们倦了，</p>

  <p class="EB03BodyTextIndented">再也提不起兴致；</p>

  <p class="EB03BodyTextIndented">太阳也落山了，</p>

  <p class="EB03BodyTextIndented">游戏才跟着完事。</p>

  <p class="EB03BodyTextIndented">妈妈们的裙兜周围，</p>

  <p class="EB03BodyTextIndented">围满了兄弟姐妹；</p>

  <p class="EB03BodyTextIndented">像鸟儿回到了窝里，</p>

  <p class="EB03BodyTextIndented">即将进入梦境；</p>

  <p class="EB03BodyTextIndented">看不到还有人游戏</p>

  <p class="EB03BodyTextIndented">在那渐黑的草坪。</p>
</body></html>
