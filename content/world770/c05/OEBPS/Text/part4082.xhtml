  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">2</h1>

  <p>当你命令我歌唱的时候，我的心似乎要因着骄傲而炸裂；</p>

  <p>我仰望着你的脸，眼泪涌上我的眶里。</p>

  <p>我生命中一切的凝涩与矛盾融化成一片甜柔的谐音——</p>

  <p>我的赞颂像一只欢乐的鸟，振翼飞越海洋。</p>

  <p>我知道你喜欢我的歌唱。</p>

  <p>我知道只因为我是一个歌者，才能走到你的面前。</p>

  <p>我用我的歌曲的远伸的翅梢，触到了你的双脚，</p>

  <p>那是我从来不敢想望触到的。</p>

  <p>在歌唱中陶醉，我忘了自己，</p>

  <p>你本是我的主人，我却称你为朋友。</p>
