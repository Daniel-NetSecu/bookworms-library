  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">13</h1>

  <p>我要唱的歌，直到今天还没有唱出。</p>

  <p>每天我总在乐器上调理弦索。</p>

  <p>时间还没有到来，歌词也未曾填好，</p>

  <p>只有愿望的痛苦在我心中。</p>

  <p>花蕊还未开放，只有风从旁叹息走过。</p>

  <p>我没有看见过他的脸，也没有听见过他的声音；</p>

  <p>我只听见他轻蹑的足音，从我房前路上走过。</p>

  <p>悠长的一天消磨在为他在地上铺设座位；</p>

  <p>但是灯火还未点上，我不能请他进来。</p>

  <p>我生活在和他相会的希望中，</p>

  <p>但这相会的日子还没有来到。</p>
</body></html>
