  <h2 class="EB04MainHeadClosedTitle">骆驼</h2>

  <p class="EB03BodyTextIndented">当一个人第一次看到骆驼时，他被骆驼庞大的体型吓得跑开了。</p>

  <p class="EB03BodyTextIndented">过了一段时间，这个人察觉到骆驼的温驯，便鼓起勇气走近他。</p>

  <p class="EB03BodyTextIndented">不久之后，这个人观察到骆驼完全没脾气时，便大胆地用缰绳套住了他的嘴，让一个小孩去驱赶他。</p>

  <p class="EB01BodyTextLineSpace">加以使用可以克服恐惧。</p>
