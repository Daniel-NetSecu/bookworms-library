  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">23</h1>

  <p class="kindle-cn-poem-left">你为什么悠闲地坐在那里，把镯子玩得叮当作响呢？<br/>
  把你的水瓶灌满了吧。<br/>
  是你应当回家的时候了。<br/>
  你为什么悠闲地拨弄着水玩，偷偷地瞥视路上的行人呢？<br/>
  灌满你的水瓶回家去吧。<br/>
  早晨的时间过去了——<br/>
  沉黑的水不住地流逝。<br/>
  波浪相互低语嬉笑闲玩着。<br/>
  流荡的云片聚集在远野高地的天边。<br/>
  它们流连着悠闲地看着你的脸微笑着。<br/>
  灌满你的水瓶回家去吧。</p>
