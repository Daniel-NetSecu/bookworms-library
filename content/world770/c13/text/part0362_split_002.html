<h2 class="heading" id="calibre_pb_1">爱丽丝·金斯利</h2>

  <p class="p">一位具有冒险精神的19岁的姑娘，思维举止有些怪异不寻常。她看待世界的方式和大多数人都不同。</p>

  <p class="p">爱丽丝觉得没有人能够理解自己，除了她已经过世的父亲。她觉得和任何人相处都会给她带来压力，也不甘心自己的命运由他人书写和掌控。</p>

  <p class="p">在兔子洞的历险过程中，她始终坚信所有的一切都是一场梦。最后她终于想起自己曾经来过这里，并掌控了自己的命运。</p>
