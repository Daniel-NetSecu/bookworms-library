<h1 class="calibre22" id="calibre_pb_203">第一节</h1>

      <p class="x5">假设平均分配土地，每个人拥有的土地仅仅能够维持生存，那么，商业是不可能存在的。</p>

      <p class="x6">如果将土地在全国居民中进行分配，使每个人恰好拥有维持生存所必需的土地，不多不少；显而易见，既然人人平等了，就没有人会去为别人工作，也没有人拥有可以偿付他人劳动的东西，因为每个人拥有的土地的产出仅仅能够维持生存，人们必然会消耗掉自己的全部所得，所以没有额外的东西用来交换他人的劳动。</p><a id="Section_cn_2"></a>
