  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">104</h1>

  <p class="kindle-cn-poem-left1">爱友，你在我眼里永不衰老，<br/>
  你的美与我们初逢时一样；<br/>
  但在时序的更替中，我看到：<br/>
  冬的寒飚三度肆虐于林莽，<br/>
  三度吹落了那夏季的苍翠，<br/>
  将春的瑰丽变成秋的干枯；<br/>
  六月的骄阳也已三度烧毁<br/>
  四月的花香；唯你依然青绿！<br/>
  哎呀，美就像日晷上的指针<br/>
  偷偷行走，让人难察其变迁；<br/>
  你的美也如此，我当它站定，<br/>
  其实在动，我的眼睛受了骗。<br/>
  　　为此我要对后来者说一声：<br/>
  　　你们未生时，美的夏天已殒。</p>
