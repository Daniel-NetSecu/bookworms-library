<h2 class="heading" id="calibre_pb_11">路霸</h2>

  <p class="p">路霸是麦坤在赛场上的对手。他的整个赛车生涯一直被车王压制，路霸对此耿耿于怀。路霸身上的数字86暗示了他要破坏并征服对手。在加利福尼亚的殊死赛上，他将车王撞伤并因此赢得活塞杯。然而车迷们对他的胜利表示不满。</p>
