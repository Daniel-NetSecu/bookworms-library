  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">90</h1>

  <p>当死神来叩你的门时，你将以什么贡献他呢？</p>

  <p>啊，我要在我客人面前，摆上我的满斟的生命之杯——</p>

  <p>我决不让他空手回去。</p>

  <p>我一切的秋日和夏夜的丰美的收获，</p>

  <p>我匆促的生命中的一切获得和收藏，</p>

  <p>在我临终，死神来叩我的门的时候，我都要摆在他的面前。</p>
