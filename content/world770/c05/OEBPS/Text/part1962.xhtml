  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">16</h1>

  <p class="kindle-cn-poem-left1">你为何不用更强硬的措施<br/>
  跟那嗜血的暴君──时间宣战？<br/>
  你为何不用比这几行瘦诗<br/>
  更美妙的手段让自身强健？<br/>
  你现在处在幸福的山巅上，<br/>
  许多尚未栽过鲜花的园地<br/>
  无不乐意将你的花朵培养，<br/>
  让它们比你的肖像更像你，<br/>
  如是，生命之线使生命重现。<br/>
  无论时间之笔或我的秃笔<br/>
  都描绘不了你外在的美艳<br/>
  和灵质，使你永活在人眼里。<br/>
  　　交出你自己，就是自我保存，<br/>
  　　你须活着，凭巧手绘出生命。</p>
