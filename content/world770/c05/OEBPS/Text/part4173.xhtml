  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">93</h1>

  <p>我已经请了假。</p>

  <p>兄弟们，祝我一路平安吧！</p>

  <p>我向你们大家鞠了躬就启程了。</p>

  <p>我把我门上的钥匙交还——</p>

  <p>我把房子的所有权都放弃了。</p>

  <p>我只请求听你们最后的几句好话。</p>

  <p>我们做过很久的邻居，但是我接受的多，给予的少。</p>

  <p>现在天已破晓，我黑暗屋角的灯光已灭，</p>

  <p>召命已来，我就准备启行了。</p>
