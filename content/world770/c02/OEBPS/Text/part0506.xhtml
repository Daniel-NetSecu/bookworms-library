  <title>在戈尔韦赛马会</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">在戈尔韦赛马会</h2>

  <p class="EB03BodyTextIndented">那里就是赛马场，</p>

  <p class="EB03BodyTextIndented">欢乐使众人心意一致，</p>

  <p class="EB03BodyTextIndented">骑手在奔驰的马背上，</p>

  <p class="EB03BodyTextIndented">人群紧随其后：</p>

  <p class="EB03BodyTextIndented">我们，也曾有很好的宾客，</p>

  <p class="EB03BodyTextIndented">作品的聆听者和激励者；</p>

  <p class="EB03BodyTextIndented">是啊，将骑手当成同伴，</p>

  <p class="EB03BodyTextIndented">在商人和店员用怯弱的气息</p>

  <p class="EB03BodyTextIndented">呼吸这个世界之前。</p>

  <p class="EB03BodyTextIndented">唱吧：为某地的新月,</p>

  <p class="EB03BodyTextIndented">我们将认识到睡眠不是死亡，</p>

  <p class="EB03BodyTextIndented">听见整个大地变换了音调，</p>

  <p class="EB03BodyTextIndented">它的肌肉狂野，再次</p>

  <p class="EB03BodyTextIndented">大声呼喊，像这赛马场一样，</p>

  <p class="EB03BodyTextIndented">而我们找到了激励的人，</p>

  <p class="EB03BodyTextIndented">在这骑马的人群中间。</p>
</body></html>
