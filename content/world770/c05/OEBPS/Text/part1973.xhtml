  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">27</h1>

  <p class="kindle-cn-poem-left1">由于旅途劳顿，我赶紧上床，<br/>
  想让疲乏的四肢得到休息，<br/>
  但是，大脑的旅程随即开航，<br/>
  力役刚告竣，接着就是心役：<br/>
  我的思想像热忱的朝圣者，<br/>
  不惧路途遥远，飞至你身边，<br/>
  我昏昏欲睡的双眸睁开着，<br/>
  凝视只有盲人能见的黑暗。<br/>
  在我的灵魂想象的视野中，<br/>
  虽肉眼无睹，却有你的倩影，<br/>
  它像宝石悬在可怕的夜空，<br/>
  使黑暗变得亮丽，旧颜换新。<br/>
  　　看吧，我白天劳力，晚上劳神，<br/>
  　　为你为我，一刻也不得安宁。</p>
