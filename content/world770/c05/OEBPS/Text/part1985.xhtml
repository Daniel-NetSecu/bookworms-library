  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">39</h1>

  <p class="kindle-cn-poem-left1">当你是我的一半，那一大半，<br/>
  我得如何把握歌颂的尺度？<br/>
  这岂不是自己将自己礼赞？<br/>
  歌颂你岂不就是自夸自诩？<br/>
  为这个缘故，我们应该分离，<br/>
  让我们的爱不再同一名分，<br/>
  通过分离，我才能将你赞誉，<br/>
  以便你获得你应得的美称。<br/>
  分离啊，若非你讨厌的悠闲<br/>
  用甜美的思想来消磨时光，<br/>
  并将光阴与思念一起欺骗，<br/>
  若非你教我如何变单为双，<br/>
  　　让我在这里赞美那里的你，<br/>
  　　分离啊，你将造成多大痛苦！</p>
