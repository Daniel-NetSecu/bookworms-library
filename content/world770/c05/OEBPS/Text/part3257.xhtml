  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">雾中羊</h1>

  <p class="kindle-cn-poem-left">丘陵消失在白色中。<br/>
  人们或星星<br/>
  悲哀地望着我，我使他们失望。<br/>
  <br/>
  火车喷出一缕烟雾。<br/>
  啊，缓慢的<br/>
  马蹄声，铁锈色<br/>
  <br/>
  忧伤的钟声——<br/>
  整个上午<br/>
  上午变得黑乎乎，<br/>
  <br/>
  一朵花被人遗漏。<br/>
  我的身子骨支撑一片宁静，远处的<br/>
  田野融化了我的心。<br/>
  <br/>
  它们威胁我<br/>
  让我穿越去天堂<br/>
  没有星星，没有父亲，一潭黑水。</p>
