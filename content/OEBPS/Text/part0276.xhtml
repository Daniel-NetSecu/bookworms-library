<h1 class="title1">内容简介</h1>
<p class="normaltext02">马克非常喜欢他在梅森百货商店的工作。他观察众人，并提出问题。那个男人把什么放进了自己的包里？为什么那个女人穿了两件外套？那两个男孩为何总是东张西望？马克提出问题，接着找出答案。</p>
<p class="normaltext02">然后有一天，马克看见了一位红发姑娘，从此无法忘怀。现在他有几个不同的问题了：这个红发姑娘是谁？那个小男孩是她的孩子吗？那个穿着黑色夹克的英俊男人是谁？问题有很多，而马克不是每次都能找到正确的答案。</p>
<p class="normaltext02">但是他想再次看到那双美丽的绿眼睛……</p>
