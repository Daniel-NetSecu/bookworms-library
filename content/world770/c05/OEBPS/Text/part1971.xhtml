  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">25</h1>

  <p class="kindle-cn-poem-left1">那些受宠幸、吉星高照的人<br/>
  总爱夸耀他们的高衔虚誉；<br/>
  我命中注定没有他们幸运，<br/>
  却意外地得到无价的宏福。<br/>
  帝王的宠臣们犹如金盏花，<br/>
  在阳光下开放得艳丽无比，<br/>
  但只要帝王一皱眉，那荣华<br/>
  连同他们的骄傲湮没尘泥。<br/>
  忠勇的战士因善战而著称，<br/>
  胜仗千回，但只要败阵一次，<br/>
  便从荣誉簿除名，他的功勋，<br/>
  一切的劳绩，都将被人忘记。<br/>
  　　我能爱人并被爱，这是福气，<br/>
  　　我不朝三暮四，不会被遗弃。</p>
