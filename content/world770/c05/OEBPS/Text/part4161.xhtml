  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">81</h1>

  <p>在许多闲散的日子，我悼惜着虚度了的光阴。</p>

  <p>但是光阴并没有虚度，我的主。</p>

  <p>你掌握了我生命里寸寸的光阴。</p>

  <p>你潜藏在万物的心里，培育着种子发芽，</p>

  <p>蓓蕾绽红，花落结实。</p>

  <p>我困乏了，在闲榻上睡眠，想象一切工作都已停歇。</p>

  <p>早晨醒来，我发现我的园里，却开遍了异蕊奇花。</p>
