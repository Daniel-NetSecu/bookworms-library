  <title>A DIVINE IMAGE</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">A DIVINE IMAGE</h2>

  <p class="EB03BodyTextIndented">　　Cruelty has a Human Heart</p>

  <p class="EB03BodyTextIndented">And Jealousy a Human Face,</p>

  <p class="EB03BodyTextIndented">Terror the Human Form Divine</p>

  <p class="EB03BodyTextIndented">And Secrecy the Human Dress.</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">The Human Dress is forged Iron,</p>

  <p class="EB03BodyTextIndented">The Human Form a fiery Forge,</p>

  <p class="EB03BodyTextIndented">The Human Face a Furnace seal’d,</p>

  <p class="EB03BodyTextIndented">The Human Heart its hungry Gorge.</p>
</body></html>
