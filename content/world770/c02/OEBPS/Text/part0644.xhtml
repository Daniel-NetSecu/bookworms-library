  <h2 class="EB04MainHeadClosedTitle">水池里的牡鹿</h2>

  <p class="EB03BodyTextIndented">一只热得受不了的牡鹿到水池边喝水。当他俯下身子，看到自己在水里的倒影时，他对自己犄角的尺寸和多样的形状十分满意。但同时，他又嫌自己的腿太瘦弱、太纤细了。</p>

  <p class="EB03BodyTextIndented">当他在自我欣赏的时候，一只狮子出现在水池边，盯上了他，并发动攻击。牡鹿立刻跑了起来，并加速到最快。在开阔的空地上，他始终保持着领先优势。但当他来到一片森林时，他的角被树枝挂住了。狮子飞快地赶上并捉住了他。</p>

  <p class="EB03BodyTextIndented">眼见为时已晚，牡鹿自责道：“我好悲哀啊！我是如何骗自己的！我鄙视我的腿，但它们可以挽救我的生命；我赞叹我的角，它们却见证了我的毁灭。”</p>

  <p class="EB01BodyTextLineSpace">最有价值的东西往往被低估。</p>
