  <title>马和骑手</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">马和骑手</h1>

  <p>一个年轻人总以为自己是个了不起的骑手，有一天他骑上了一匹马，那匹马并没有被好好地训练过，很难驾驭。马一感受到骑手的重量，就猛冲出去，怎么也拦不住。骑手的一个朋友看到他一直朝前冲，就喊道：“你这么着急是去哪儿啊？”骑手指着马，回答说：“我不知道。你问他。”</p>
