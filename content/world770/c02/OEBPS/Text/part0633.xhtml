  <h2 class="EB04MainHeadClosedTitle">斗鸡和鹰</h2>

  <p class="EB03BodyTextIndented">两只斗鸡正激烈地为农场的统治权而战。一只最终战胜了另一只。</p>

  <p class="EB03BodyTextIndented">被打败的那只逃走了，躲进了一个安静的角落；而胜利的那只飞上了高墙，扑腾着翅膀，用尽他浑身力气得意地鸣叫。一只鹰在高空飞翔，突然袭击了他，用爪子把他抓走了。</p>

  <p class="EB03BodyTextIndented">被打败的那只公鸡立即从角落里走了出来，无可争辩地成为农场的统治者。</p>

  <p class="EB01BodyTextLineSpace">骄兵必败。</p>
