  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">146</h1>

  <p class="kindle-cn-poem-left1">我的灵魂——罪恶之躯的内核，<br/>
  被抬举你的叛逆者所蒙蔽，<br/>
  你在营垒中憔悴，忍饥挨饿，<br/>
  为何偏将外墙粉饰得富丽？<br/>
  这危楼租期短暂，倒塌在即，<br/>
  你为什么要为它挥霍无度？<br/>
  一切奢侈品都由蛆虫承继，<br/>
  这不正是肉体最后的归宿？<br/>
  灵魂啊，你应该凭毁灭而生，<br/>
  肉体的憔悴即是你的财富；<br/>
  你应兜售时间以换取永恒，<br/>
  让营内享富裕，营外受穷苦。<br/>
  　　这样，你就吃掉吃人的死神，<br/>
  　　死神一死，死亡就不会发生。</p>
