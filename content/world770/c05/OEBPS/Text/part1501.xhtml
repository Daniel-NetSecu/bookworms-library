  <h2 class="kindle-cn-heading2">58　爱的花园</h2>

  <p class="kindle-cn-signature">布莱克</p>

  <p class="kindle-cn-poem-left">我前往爱的花园，<br/>
  见到的事真够新鲜：<br/>
  一座教堂建在花园中央，<br/>
  那里原先是草地，供人游玩。</p>

  <p class="kindle-cn-poem-left">教堂的大门关着，<br/>
  门口写着“不许入内”；<br/>
  我只好转悠到别处，<br/>
  观看各式各样的花卉。</p>

  <p class="kindle-cn-poem-left">但在本该开遍鲜花的地方，<br/>
  我发现到处是坟茔和墓碑：<br/>
  黑袍教士轮番在那里巡逻，<br/>
  用石楠捆起我寻欢的欲望。</p>
