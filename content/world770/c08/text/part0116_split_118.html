<h1 class="calibre22" id="calibre_pb_220">第十八节</h1>

      <p class="x5">这种区别导致了另一种区分方式，即生产阶级和不生产阶级的区分。</p>

      <p class="x6">于是，我们可以把可自由支配阶级之外的两个阶级划分为生产阶级，即土地耕种者，和不生产阶级，包括社会成员中所有其他薪资人员。</p><a id="Section_cn_19"></a>
