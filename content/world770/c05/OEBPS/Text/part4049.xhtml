  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">57</h1>

  <p class="kindle-cn-poem-left">我采了你的花，啊，世界！<br/>
  我把它压在胸前，花刺伤了我。<br/>
  日光渐暗，我发现花儿凋谢了，痛苦却存留着。<br/>
  许多有香有色的花又将来到你这里，啊，世界！<br/>
  但是我采花的时代过去了，<br/>
  黑夜悠悠，我没有了玫瑰，只有痛苦存留着。</p>
