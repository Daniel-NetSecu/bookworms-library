<h1 class="calibre22" id="calibre_pb_279">第七十七节</h1>

      <p class="x5">货币在商业中有两种不同的估价。一种表明我们获得各种商品所付出的货币或白银的数量；另一种表明一定数量的货币与其在交易过程中所得利息的关系。</p>

      <p class="x6">通过对于售出或借出货币来获取年息的方式的说明来看，在商业中有两种方式可以对货币进行估价。在买卖过程中，一定重量的白银代表一定数量的劳动，或者一定数量不同种类的商品；例如，一盎司白银等于一定数量的谷物，或者等于一个人一定天数的劳动。在借贷过程中和在货币商业中，一笔本金是数量相当于这笔本金一定比例的租金的等值物；反过来说，年租金代表一笔本金，而这笔本金等于这笔租金根据利率高低连续缴纳若干次的总和。</p><a id="Section_cn_78"></a>
