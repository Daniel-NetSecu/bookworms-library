  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">维纳斯和猫</h1>

  <p>有一只猫爱上了一个英俊的年轻人，便去祈求维纳斯将她变成一个女人。维纳斯非常和蔼可亲，她将猫变成了一个美丽的少女，那年轻人对其一见钟情，很快两个人就结婚了。一天，维纳斯想要去看看猫是否因为改变了形态而改变了习惯，于是便派出一只老鼠去了他们住的地方。一看到老鼠，那年轻女人立刻忘了一切，直接跳起来，像箭一样冲出去追老鼠。女神很讨厌她这样的表现，又将她变回了猫。</p>
