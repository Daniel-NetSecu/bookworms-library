  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">8</h1>

  <p>那穿起王子的衣袍和挂起珠宝项链的孩子，</p>

  <p>在游戏中他失去了一切的快乐；</p>

  <p>他的衣服绊着他的步履。</p>

  <p>为怕衣饰的破裂和污损，</p>

  <p>他不敢走进世界，甚至不敢挪动。</p>

  <p>母亲，这是毫无好处的，</p>

  <p>假如你的华美的约束，使人和大地健康的尘土隔断，</p>

  <p>把人进入日常生活的盛大集会的权利剥夺去了。</p>
