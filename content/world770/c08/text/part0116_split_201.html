<h1 class="calibre22" id="calibre_pb_303">第一百零一节</h1>

      <p class="x5">尽管货币是储存的直接对象，而且是资本的首要基础，如果我们可以这样说的话，但是货币只是资本总量中无足轻重的一部分。</p>

      <p class="x6">我们已经看到货币在现存资本总量中是多么微不足道的一部分，但是它对于资本的形成却起到了重要作用。实际上，几乎所有储蓄都是以货币形式存在的；收入是以货币的形式支付给土地所有者的，垫付和利润也都是以货币的形式被各种企业家接收的；他们存储的正是他们的货币，每年的资本增长也是以货币形式产生的；但是，所有企业家并没有把货币用于其他方面，而是立刻把它转化成企业所需要的各种动产；于是，货币重新回到流通当中，只有资本中占份额较大的部分以不同性质的动产存在，像我们已经说明的那样。</p>
