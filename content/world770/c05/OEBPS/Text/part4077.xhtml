  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">85</h1>

  <p class="kindle-cn-poem-left">你是什么人，读者，百年后读着我的诗？<br/>
  我不能从春天的财富里送你一朵花，<br/>
  从天边的云彩里送你一片金影。<br/>
  开起门来四望吧。<br/>
  从你的群花盛开的园子里，<br/>
  采取百年前消逝了的花儿的芬芳记忆。<br/>
  在你心的欢乐里，愿你感到一个春晨吟唱的活的欢乐，<br/>
  把它快乐的声音，传过一百年的时间。</p>
