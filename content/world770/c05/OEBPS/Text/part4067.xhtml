  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">75</h1>

  <p class="kindle-cn-poem-left">夜半，那个自称的苦行人宣告说：<br/>
  “弃家求神的时候到了。<br/>
  啊，谁把我牵住在妄想里这么久呢？”<br/>
  神低声说：“是我。”<br/>
  但是这个人的耳朵是塞住的。<br/>
  他的妻子和吃奶的孩子一同躺着，安静地睡在床的那边。<br/>
  这个人说：“什么人把我骗了这么久呢？”<br/>
  声音又说：“是神。”但是他听不见。<br/>
  婴儿在梦中哭了，挨向他的母亲。<br/>
  神命令说：“别走，傻子，不要离开你的家。”<br/>
  但是他还是听不见。<br/>
  神叹息又委屈地说：<br/>
  “为什么我的仆人要把我丢下，而到处去找我呢？”</p>
