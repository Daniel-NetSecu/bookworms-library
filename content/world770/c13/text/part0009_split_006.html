<h2 class="heading" id="calibre_pb_5">闪电</h2>

  <p class="p">闪电是动物车辆管理局里动作最迅速的树懒——当然，这并不能说明问题。作为一只树懒，闪电尽心尽力——像说话一样——按照自己的节奏办事。他非常乐于助人，当他的朋友需要处理一件紧急任务时，闪电踊跃承担了这项工作。</p>
