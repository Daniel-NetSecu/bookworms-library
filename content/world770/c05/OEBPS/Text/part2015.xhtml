  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">69</h1>

  <p class="kindle-cn-poem-left1">你天生丽质，世人有目共睹，<br/>
  尽善尽美的容颜无可非议，<br/>
  每个人都给你应有的赞许，<br/>
  说出了实情，仇人也会同意。<br/>
  你的外表赢得表面的颂扬，<br/>
  然而，同是这些奉承你的人<br/>
  会窥视眼睛看不见的地方，<br/>
  用恶言将先前的赞美否定。<br/>
  他们留意审察你内心的美，<br/>
  凭猜度衡量你的所作所为，<br/>
  目光虽然温和，心胸却狭隘，<br/>
  硬要给你这香花泼上污秽。<br/>
  　　为什么你的香与色不相配？<br/>
  　　问题是：你活在世俗的氛围。</p>
