  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">142</h1>

  <p class="kindle-cn-poem-left1">爱是我的罪，恨是你的德行，<br/>
  你恨我的罪，这罪扎根于爱；<br/>
  倘设身处地比较你我处境，<br/>
  你就能发现：你恨得不应该。<br/>
  若要恨，也不该出于你嘴唇，<br/>
  你已经玷污了鲜红的装饰，<br/>
  与我一样，屡次盖印于伪盟，<br/>
  掠夺他人床笫的正当收益。<br/>
  接受我的爱吧，如你爱别人；<br/>
  我追求你，如你向别人献媚，<br/>
  植怜悯于你心底，让它滋生，<br/>
  来日这怜悯定会让你受惠。<br/>
  　　如果你一边藏爱一边求爱，<br/>
  　　当你被人拒绝，那也是活该！</p>
