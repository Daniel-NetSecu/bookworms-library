  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">卖神像的人</h1>

  <p>有一个人做了一个木头的墨丘利神像，带到市场上去卖，可是没有人买。他想，如果能够宣传一下这尊神像的好处，应该就能吸引来购买者了。所以，他在市场中来来回回地走着喊道：“卖神像啦！卖神像啦！可以给你带来好运，可以帮你守住好运！”立刻就有一个看热闹的人拦住他问：“要是你的神像如你说的那样，你怎么不留着他，给你自己谋到最大好处呢？”“是这样的，”那人回答说，“他的确能够带来益处，但却需要时间，而我现在就需要用钱。”</p>
