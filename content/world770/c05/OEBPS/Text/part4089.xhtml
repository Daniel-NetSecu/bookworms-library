  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">9</h1>

  <p>啊，傻子，想把自己背在肩上！</p>

  <p>啊，乞人，来到你自己门口求乞！</p>

  <p>把你的负担卸在那双能担当一切的手中吧，</p>

  <p>永远不要惋惜地回顾。</p>

  <p>你的欲望的气息，会立刻把它接触到的灯火吹灭。</p>

  <p>它是不圣洁的——不要从它不洁的手中接受礼物。</p>

  <p>只领受神圣的爱所付予的东西。</p>
