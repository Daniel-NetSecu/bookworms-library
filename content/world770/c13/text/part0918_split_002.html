<h2 class="heading" id="calibre_pb_1">麦克·华斯基（大眼仔）</h2>

  <p class="p">麦克是一只鲜绿色的球形怪兽，长着一只硕大的眼睛，头顶有一对小角，四肢纤细。麦克幽默风趣，聪明勇敢，但有时会对显而易见的境况失去判断。他有着强大的内心。</p>
