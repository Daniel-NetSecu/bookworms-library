  <title>虎</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">虎</h2>

  <p class="EB03BodyTextIndented">虎，虎，光焰灼灼</p>

  <p class="EB03BodyTextIndented">燃烧在黑夜之林，</p>

  <p class="EB03BodyTextIndented">什么样的神手和神眼</p>

  <p class="EB03BodyTextIndented">构造出你可畏的匀称？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">在海与天多深的地方，</p>

  <p class="EB03BodyTextIndented">燃着造你眼睛的火？</p>

  <p class="EB03BodyTextIndented">凭什么翅膀他敢追它，</p>

  <p class="EB03BodyTextIndented">凭什么手他敢捕捉？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">凭什么肩膀，什么技艺，</p>

  <p class="EB03BodyTextIndented">才能拧成你的心肌？</p>

  <p class="EB03BodyTextIndented">何等可怖的手与脚才能</p>

  <p class="EB03BodyTextIndented">让你的心开始搏击？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">用什么锤子，什么铁链，</p>

  <p class="EB03BodyTextIndented">在什么炉中将你的脑冶炼？</p>

  <p class="EB03BodyTextIndented">用什么砧子，何等铁手，</p>

  <p class="EB03BodyTextIndented">敢抓那令凡人致命的物件？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">当天上的群星投下长矛，</p>

  <p class="EB03BodyTextIndented">用泪水浸湿了天空，</p>

  <p class="EB03BodyTextIndented">他在看着他的成果微笑？</p>

  <p class="EB03BodyTextIndented">是造耶稣的他将你创造？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">虎，虎，光焰灼灼</p>

  <p class="EB03BodyTextIndented">燃烧在黑夜之林，</p>

  <p class="EB03BodyTextIndented">什么样的神手和神眼</p>

  <p class="EB03BodyTextIndented">构造出你可畏的匀称？</p>
</body></html>
