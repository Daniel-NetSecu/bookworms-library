  <h1 class="heading1" id="calibre_pb_0">第 22 章</h1>

  <p class="calibre7">阳光笼罩着冰雪覆盖的爪牙山山顶，阿乐家的筒仓威严地矗立在农舍前面。第五个印有泥脚印的石头矗立在其他四个之间，这一家子的脚印终于凑齐了。阿乐在那里赢得了自己的位置，就在家人的旁边。他终于完成了超出自己能力的重要事情。因为这一点，他留下了属于自己的印记。</p>
