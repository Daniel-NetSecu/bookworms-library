  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">69</h1>

  <p>就是这股生命的泉水，日夜流穿我的血管，</p>

  <p>也流穿过世界，又应节地跳舞。</p>

  <p>就是这同一的生命，</p>

  <p>从大地的尘土里快乐地伸放出无数片的芳草，</p>

  <p>迸发出繁花密叶的波纹。</p>

  <p>就是这同一的生命，在潮汐里摇动着生和死的大海的摇篮。</p>

  <p>我觉得我的四肢因受着生命世界的爱抚而光荣。</p>

  <p>我的骄傲，是因为时代的脉搏此刻在我血液中跳动。</p>
