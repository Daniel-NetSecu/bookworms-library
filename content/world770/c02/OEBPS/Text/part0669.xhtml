  <h2 class="EB04MainHeadClosedTitle">蛇与朱庇特</h2>

  <p class="EB03BodyTextIndented">一条蛇时不时地就会被人和野兽踩到，遭了不少的罪。一方面由于他身体太长，另一方面由于他不能够离开地面站立起来。于是，他向朱庇特抱怨他所要面临的风险。但是朱庇特一点儿都不同情他。“我敢说，”朱庇特说，“如果你第一次被踩时，就咬他的话，其他人就会费点劲儿，看看该把脚放在哪儿了。”</p>
