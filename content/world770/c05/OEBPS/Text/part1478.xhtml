  <h2 class="kindle-cn-heading2">35　总是衣冠楚楚</h2>

  <p class="kindle-cn-signature">琼生</p>

  <p class="kindle-cn-poem-left">总是衣冠楚楚，总是打扮齐整，<br/>
  好像你要出门，赴人的宴请，<br/>
  总是涂脂抹粉，总是香水洒身，<br/>
  女士啊，我的话也许值得一听：<br/>
  艺术背后的原因尚不为人知，<br/>
  但它不是一概迷人，一概秀丽。</p>

  <p class="kindle-cn-poem-left">看着我，示我一张平常的面孔，<br/>
  美其实就在这朴实无华之中；<br/>
  衣衫轻轻飘动，头发自由披散，<br/>
  如此的不经意反让我更加喜欢，<br/>
  远胜过来自艺术的刻意装点，<br/>
  因为艺术不能养心，只能养眼。</p>
