  <h2 class="EB04MainHeadClosedTitle">女人和母鸡</h2>

  <p class="EB03BodyTextIndented">女人有一只母鸡，它每天都会为她下一颗蛋。她经常思索，如果一天想得到两个蛋该怎么做。最后，为了达成她的目的，她决定喂母鸡双份的大麦。从那天起，母鸡就长得又胖又圆，从此一个蛋也下不了了。</p>
