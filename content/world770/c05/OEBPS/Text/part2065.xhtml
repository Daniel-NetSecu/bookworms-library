  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">119</h1>

  <p class="kindle-cn-poem-left1">我喝过女妖那有毒的泪珠，<br/>
  它从丑陋的地狱蒸馏而成，<br/>
  使恐惧变希望，希望成恐惧，<br/>
  让胜券在握者倏忽间败阵。<br/>
  我的心犯下过可恨的错误，<br/>
  就在它以为最幸福的时刻！<br/>
  我的眼珠差点要夺眶而出，<br/>
  就因疯狂的热病令人惶惑。<br/>
  啊，我知道这就是恶的好处：<br/>
  因为有恶，善才能变得更善。<br/>
  受损的爱，一旦被重新构筑，<br/>
  比原先更美、更宏大、更坚强。<br/>
  　　尽管受责备，我仍满意而归，<br/>
  　　恶使我获益，比损失大三倍。</p>
