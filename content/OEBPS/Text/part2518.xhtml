<h1 class="title1">内容简介</h1>
<p class="normaltext">胸前佩戴着红字的这个女人是个没有任何朋友的罪人。人们对她指指点点，那些受人尊重的人都唾弃她，牧师们用尖锐的言辞抨击她。耻辱不分日夜地追随着她。</p>
<p class="normaltext">故事发生在17世纪的新英格兰。当时，清教徒们飘洋过海来到美洲，建立了新的城镇，同时也带来了自己国家的宗教和习俗。在早期马萨诸塞州的波士顿，教会的势力非常强大——非常冷酷无情。任何违背教会和上帝训诫的人都会受到惩罚。</p>
<p class="normaltext">但是对于赫斯特·普林，这个生下私生子的女人来说，她并不是唯一的罪人。那谁是孩子的父亲呢？他为什么不大胆地公开自己的身份？为什么赫斯特要承受胸佩红字的耻辱，而她的情人却可以逃脱惩罚？他不是也同样有罪吗？</p>
