  <h2 class="EB04MainHeadClosedTitle">海豚、鲸鱼和小海鱼</h2>

  <p class="EB03BodyTextIndented">海豚和鲸鱼在激烈地交战。当战斗进入高潮时，一只小海鱼从海浪中伸出头来说，如果他们愿意接受他做裁判，他可以来劝和。一只海豚回答道：“我们宁愿战斗至死，也不愿让你干涉我们的纠纷！”</p>
