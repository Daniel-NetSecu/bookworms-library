  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">100</h1>

  <p>我跳进形象海洋的深处，</p>

  <p>希望能得到那无形象的完美的珍珠。</p>

  <p>我不再以我的旧船去走遍海港，</p>

  <p>我乐于弄潮的日子早已过去了。</p>

  <p>现在我渴望死于不死之中。</p>

  <p>我要拿起我的生命的弦琴，进入无底深渊旁边，</p>

  <p>那座涌出无调的乐音的广厅。</p>

  <p>我要调拨我的琴弦，和永恒的乐音合拍，</p>

  <p>当它呜咽出最后的声音时，就把我静默的琴儿放在静默的脚边。</p>
