  <h2 class="EB04MainHeadClosedTitle">山羊和驴</h2>

  <p class="EB03BodyTextIndented">有个男人曾经养了一只山羊和一头驴。</p>

  <p class="EB03BodyTextIndented">山羊很嫉妒驴丰盛的伙食，于是他对驴说：“你这样被使唤真是可怜呀：有时你要去磨坊里拉磨，有时你又要驮很多重物。”紧接着，他建议驴假装患了癫痫，掉进一个沟里，这样就能够休息一会儿了。驴听从了山羊的建议，掉到了一个沟里，摔得遍体鳞伤。</p>

  <p class="EB03BodyTextIndented">驴的主人派人去请兽医，寻求他的意见。兽医吩咐他把山羊的肺敷在驴的伤口上。他们立即杀了山羊，然后医好了驴。</p>
