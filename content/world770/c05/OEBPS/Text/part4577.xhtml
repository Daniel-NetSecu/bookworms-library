  <title>舞女</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">舞女</h1>

  <p>一次，一位舞女及其乐队来到拜尔卡沙国王子的宫廷，侍卫们热情迎接。舞女和着四弦琴、芦笛、洋琴的乐声，在王子面前翩跹起舞。</p>

  <p>舞女先后跳了火焰舞、剑矛舞、星星舞、太空舞，最后又跳了风中之花舞。</p>

  <p>其后，舞女在王子面前停下舞步，向王子躬身施礼。王子令其走近自己，对她说：“美丽的女子，幸福与欢乐的女儿，你的舞艺是从哪儿学来的？你怎么能够把大自然的各种因素融汇在你的舞蹈及其节奏韵律当中去呢？”</p>

  <p>女子再次向王子行躬身礼，然后答道：“我不知道如何回答殿下的问话。我只知道一点，那就是：哲学家的灵魂居其头脑，诗人的灵魂居其心中，歌手的灵魂居其喉咙，而舞女的灵魂则宿其周身。”</p>
