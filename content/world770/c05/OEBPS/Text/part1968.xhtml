  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">22</h1>

  <p class="kindle-cn-poem-left1">只要你年轻，保持你的青春，<br/>
  镜子就不能说我已经苍老；<br/>
  当我看见时间犁出的深痕，<br/>
  我才能相信我的死期已到。<br/>
  那裹着你全身的娇美婀娜，<br/>
  就是我的心所穿戴的盛装，<br/>
  我心居你胸中，互换了住所，<br/>
  如此，怎么能说我比你年长？<br/>
  我的爱哟，务必看好你自身，<br/>
  就像我那样为你牵肠挂肚；<br/>
  你的那颗心，我要尽心看承，<br/>
  就像保姆将病孩细心照顾。<br/>
  　　我心一死，你的心必受连累，<br/>
  　　它已归我所有，你再难收回。</p>
