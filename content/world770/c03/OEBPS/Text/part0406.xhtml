  <p class="zhusi"><a id="bz1" href="part0404.xhtml#z1">[1]</a>《奥义书》：一组有关形而上学的论述。它包括大约二百篇散文和诗歌，写作年代可追溯到公元前400年左右。</p>

  <p class="zhusi"><a id="bz2" href="part0405.xhtml#z2">[2]</a>那纳克：Nanak（1469-1533），卡比尔：Kabir（1440-1518），柴塔尼亚：Chaitanya（1485-1533）。</p>

  <p class="zhusi"><a id="bz3" href="part0405.xhtml#z3">[3]</a>印度国民大会党（The Indian National Congress）创建于1885年。</p>

  <p class="zhusi"><a id="bz4" href="part0405.xhtml#z4">[4]</a>分裂出现在1907年，在苏拉特（Surat）举行的印度国大党的年会上。</p>
