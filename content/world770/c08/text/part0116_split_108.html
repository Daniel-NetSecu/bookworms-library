<h1 class="calibre22" id="calibre_pb_210">第八节</h1>

      <p class="x5">社会第一次被划分为两个阶级，一个是生产阶级，即土地耕种者们，另一个是薪资阶级，即工匠们。</p>

      <p class="x6">这时，由于事物发展的必然规律，整个社会被划分为两个阶级，二者都很勤劳。其中一个阶级通过自己的劳动从土地里生产出，或者更恰当地说，从土地里抽取财富；这些财富不断增长，为整个社会提供生活资料，为它的一切需求提供原料；而另一个阶级则被雇佣来对这些原料进行加工制作，做成适合人们使用的产品，将他的劳动力出售给第一个阶级，换取生存所必需的生活资料。第一个阶级可以称为生产阶级，第二个阶级可以称为薪资阶级。</p><a id="Section_cn_9"></a>
