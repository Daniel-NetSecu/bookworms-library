  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">4</h1>

  <p>我生命的生命，我要保持我的躯体永远纯洁，</p>

  <p>因为我知道你的生命的摩抚，接触着我的四肢。</p>

  <p>我要永远从我的思想中摒除虚伪，</p>

  <p>因为我知道你就是那在我心中燃起理智之火的真理。</p>

  <p>我要从我心中驱走一切的丑恶，</p>

  <p>使我的爱开花，因为我知道你在我的心宫深处安设了座位。</p>

  <p>我要努力在我的行为上表现你，</p>

  <p>因为我知道是你的威力，给我力量来行动。</p>
