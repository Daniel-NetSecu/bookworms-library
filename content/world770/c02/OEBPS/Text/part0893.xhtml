  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">丧失了一切，我出国远游</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">丧失了一切，我出国远游，</p>

  <p class="EB03BodyTextIndented">并未减少丧失感</p>

  <p class="EB03BodyTextIndented">在一座新的半岛上，——</p>

  <p class="EB03BodyTextIndented">坟墓先我而行，</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">很快我也找到我的寄居处，</p>

  <p class="EB03BodyTextIndented">而当我寻找我的床，</p>

  <p class="EB03BodyTextIndented">它却是一座坟墓，在枕头上</p>

  <p class="EB03BodyTextIndented">安放下我的头。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我醒来，发现它比我先醒，</p>

  <p class="EB03BodyTextIndented">我起来，——它跟着我；</p>

  <p class="EB03BodyTextIndented">我想把它扔在人群中，</p>

  <p class="EB03BodyTextIndented">把它丢进大海，</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">在一杯杯人工安眠剂中</p>

  <p class="EB03BodyTextIndented">把它的形影睡去，——</p>

  <p class="EB03BodyTextIndented">坟墓消失了，可是铲子</p>

  <p class="EB03BodyTextIndented">还保留在记忆中。</p>
</body></html>
