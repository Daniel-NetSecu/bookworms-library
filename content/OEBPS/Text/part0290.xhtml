<p class="title1">内容简介</p>
<p class="normaltextx">“出去找点儿新闻，”弗兰克先生对迈克说，“这是你最后一次机会。”</p>
<p class="normaltextx">迈克是一名优秀的摄影师，可是他在SFX新闻部的老板弗兰克先生却不这么认为。迈克生活得很不错，他需要这份工作。他能做些什么呢？</p>
<p class="normaltextx">夏威夷有一座火山正在喷发——这是发掘好新闻的良机。迈克去那里拍摄，然而火山非常危险，于是他明白了有些事情比他的工作或者他的摄像机更为重要。</p>
<p class="normaltextx">这的确是他的最后一次机会……</p>
