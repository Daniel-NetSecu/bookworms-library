    <h1 class="kindle-cn-heading-1"><a id="page5"></a>克拉科夫吹号手的古老誓言</h1>

    <p><span class="kaiti">我以波兰人和波兰国王的忠实仆从的荣誉宣誓：我将忠实履行职责，至死不渝，如果有需要，我会时刻在担负圣母之名的教堂塔楼吹响《海那圣歌》，以颂扬圣母之荣誉。</span></p>
