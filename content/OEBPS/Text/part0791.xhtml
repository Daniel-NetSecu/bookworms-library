<h1 class="title1" id="CHP4">内容简介</h1>
<p class="normaltext1">世事难预料，乌龙免不了。在这六个短剧中，总有或大或小的麻烦来给剧中人的生活加点儿料。</p>
<p class="normaltext"><br/></p>
<p class="normaltext1">管家詹姆斯对“先生”总是唯命是从。他总是说：“好的，先生。”这一点使他成为一个好管家。可是有一天，“先生”吩咐詹姆斯做一件很不寻常的事，詹姆斯有没有遵命照办呢？</p>
<p class="normaltext"><br/></p>
<p class="normaltext1">大多数办事员对上司也是唯命是从。他们知道有什么事情是该做的，有什么事情是不该做的。他们说：“得照章办事。”这可害苦了到办证处给宠物猴子办许可证的老兄！</p>
<p class="normaltext"><br/></p>
<p class="normaltext1">罗杰的问题是没什么钱，他富有的女朋友却为他迟迟不求婚而烦恼。事情似乎很容易解决，不过就像书中其他短剧一样，问题可要复杂得多，也有趣得多。</p>
