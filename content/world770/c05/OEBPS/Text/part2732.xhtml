  <title>三个工匠</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">三个工匠</h1>

  <p>有一个城市要建筑护卫城市安全的防御工事，人们纷纷争论用什么材料最好。一个木匠站起来，提议用木头，他说木头容易获取，容易使用。一个石匠反对用木头，因为木头容易起火，推荐用石头代替。而皮革工人站起来说：“在我看来，什么东西都比不上皮革。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：人人为己。</p>
</body></html>
