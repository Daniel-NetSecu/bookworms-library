  <h2 class="EB04MainHeadClosedTitle">披着狮皮的驴</h2>

  <p class="EB03BodyTextIndented">一头驴穿上了狮皮，在森林里巡游，以吓唬那些愚蠢的动物为乐。后来，驴遇见了狐狸，也想要吓吓他。但是狐狸一听到他的声音就大声说道：“如果我没听见你的驴叫，或许会真的害怕呢！”</p>
