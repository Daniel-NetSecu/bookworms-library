<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h1 class="bodycontent-first-title">快来吧，涡堤孩！</h1>

  <p class="bodycontent-text_right">徐志摩</p>

  <p class="bodycontent-text">涡堤孩，快来吧，涡堤孩！</p>

  <p class="bodycontent-text">清水是一片闪亮的明辉，</p>

  <p class="bodycontent-text">满天的星星，</p>

  <p class="bodycontent-text">黑夜的清虚，</p>

  <p class="bodycontent-text">水灵儿到青草地来小舞纡徊。</p>

  <p class="bodycontent-text">没有一棵草上不带露珠，</p>

  <p class="bodycontent-text">替你编一身鲜艳的绣帽，</p>

  <p class="bodycontent-text">小灵儿欢欣，</p>

  <p class="bodycontent-text">月丝儿织成，</p>

  <p class="bodycontent-text">明霞似的天锦，</p>

  <p class="bodycontent-text">彩虹般的流苏。</p>

  <p class="bodycontent-text">涡堤孩，快来吧，涡堤孩！</p>

  <p class="bodycontent-text">你披一件闪亮的线衫在青草地上舞蹈，</p>

  <p class="bodycontent-text">手挽手儿欢噪，</p>

  <p class="bodycontent-text">直到东方放晓，</p>

  <p class="bodycontent-text">白云里流出金丹。</p>
</body></html>
