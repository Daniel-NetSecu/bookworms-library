  <title>蝙蝠和黄鼠狼</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">蝙蝠和黄鼠狼</h1>

  <p>有一只蝙蝠落到了地上，被一只黄鼠狼抓住了。蝙蝠马上就要被黄鼠狼杀死吃掉了，于是他向黄鼠狼求饶。黄鼠狼说他不能放了蝙蝠，因为他视所有的鸟类为仇敌。“啊呀，”蝙蝠说，“我根本不是鸟啊，我是老鼠。”“是这样啊，”黄鼠狼说，“那以后我会关照你的。”然后便将蝙蝠放走了。过了一段日子，蝙蝠又被另一只黄鼠狼抓住了，他又一次求饶。这只黄鼠狼说：“不行，我绝对不会放过任何老鼠的。”“但我不是老鼠啊，”蝙蝠说，“我是一只鸟。”“啊呀，还真是。”于是这只黄鼠狼也把蝙蝠放走了。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：要会见机行事。</p>
