<h1 class="title1" id="CHP9">内容简介</h1>
<p class="normaltext02a">要想在生活中取得成功，需要哪些条件？聪明、好看、善良、勤奋、诚实？或者仅仅只是运气好？</p>
<p class="normaltext02a">邓瑞·梅钦是个乐天派。当他遇到麻烦时，决不会认输言败，哭天抹泪。他会主动去寻找机会，一旦发现机会，便会牢牢把握。当然，幸运之神也很眷顾着他。幸运的是伯爵夫人打算办场舞会，可邓瑞是如何弄到请柬的呢？幸运的是科多林夫人跟邓瑞的老板起了争执，可邓瑞是如何成为科多林太太的收租人的呢？更幸运的是“亚尔马号”在兰迪德诺附近海域沉没——可邓瑞是如何从这件事上赚得1000英镑的？</p>
<p class="normaltext02a">邓瑞生活的小镇叫伯斯利。镇上的人们喜欢能让他们欢笑的年轻人。“他真是个传奇。”他们说。他们迫不及待地想知道他下一次的奇遇……</p>
