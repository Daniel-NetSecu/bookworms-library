  <p class="EB14CopyrightText">*此中文译本译自意大利语原文</p>

  <p class="EB14CopyrightText">*书名翻译说明：</p>

  <p class="EB14CopyrightText">意大利语原文中，女主角的名字Belcolore，音译为贝尔科洛蕾，意为“漂亮的颜色”。在本书的英文译本中，想要保留这层意思，于是选择用Rosie Hues来表达。Rosie本身有“多彩的，玫瑰花般的”意思，而Hues是颜色的意思。本蒂韦尼亚·德尔·马佐的名字Bentivegna del Mazzo直译过来的意思是“欢迎疯男人”，英文版译为Willy Welcome，Willy是William（威廉姆）的简称，这个名字本身带着一些疯癫和幽默的味道，姓氏则直接选择了Welcome（欢迎）这个词，组成一个完整的名字。</p>
