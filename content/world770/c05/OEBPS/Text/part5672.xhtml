  <h1 class="bodycontent-first-title">十八</h1>

  <p class="bodycontent-text">小王子徒步穿过沙漠，途中只遇见一株花儿。那是一朵只有三片花瓣的花儿，普普通通，平淡无奇……</p>

  <p class="bodycontent-text">“你好。”小王子向她致意。</p>

  <p class="bodycontent-text">“你好。”花儿答礼说。</p>

  <p class="bodycontent-text">小王子彬彬有礼地向她打听：</p>

  <div class="tupian"><img alt="" class="image-alone" src="../Images/image24314.jpeg.webp"/></div>

  <p class="bodycontent-text">“地球人在什么地方呀？”</p>

  <p class="bodycontent-text">花儿曾经有一天见过一支商队经过，她答道：</p>

  <p class="bodycontent-text">“人吗？的确有，我想，有那么六七个吧，好些年前我见过他们。但现在谁也不知道在什么地方可以找到他们。他们随风漂泊。他们没有根，这对他们很不利。”</p>

  <p class="bodycontent-text">小王子说：“永别啦！”</p>

  <p class="bodycontent-text">花儿答道：“永别啦！”</p>
