<h2 class="heading" id="calibre_pb_1">玛琳菲森</h2>

    <p class="p">她是一位力量强大的精灵，生活在摩尔森林。这片充满魔力的森林与一个腐朽的人类王国接壤。在遭到斯戴芬国王的背叛后，她意欲报仇雪恨，于是对国王和皇后之女—爱洛施下了魔咒。</p>
