  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">45</h1>

  <p class="kindle-cn-poem-left1">还有两元素，即轻气与净火，<br/>
  无论在何处，它们都跟随你。<br/>
  气是我的思，那火是我的欲，<br/>
  它们若即若离，来去无踪迹。<br/>
  当这两个轻灵的元素登程，<br/>
  作为爱的使者前往你那里，<br/>
  我这由四元素组成的生命<br/>
  就剩两个，会因忧伤而沉寂；<br/>
  只有疾飞的使者平安归营，<br/>
  生命的结构才能重获平衡；<br/>
  它俩说回就回，在向我报信，<br/>
  说你身康体健，我不必担心。<br/>
  　　我听后喜不自胜，但没多久，<br/>
  　　我又派出它俩，为你而担忧。</p>
