  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">69</h1>

  <p class="kindle-cn-poem-left">我要追逐金鹿。<br/>
  你也许会讪笑，我的朋友，但是我追求那逃避我的幻象。<br/>
  我翻山越谷，我游遍许多无名的土地，<br/>
  因为我要追逐金鹿。<br/>
  你到市场采买，满载着回家，<br/>
  但不知从何时何地一阵无家之风吹到我身上。<br/>
  我心中无牵无挂；我把一切所有都撇在后面。<br/>
  我翻山越谷，我游遍许多无名的土地——<br/>
  因为我在追逐金鹿。</p>
