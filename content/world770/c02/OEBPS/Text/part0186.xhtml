  <title>太阳花</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">太阳花</h2>

  <p class="EB03BodyTextIndented">太阳花啊！厌倦了时间，</p>

  <p class="EB03BodyTextIndented">竟然数点起太阳的脚步，</p>

  <p class="EB03BodyTextIndented">寻找那美妙的金色所在，</p>

  <p class="EB03BodyTextIndented">漫游者结束旅程之处：</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">那里，因情欲而憔悴的青年，</p>

  <p class="EB03BodyTextIndented">和裹着冰雪的苍白的处女</p>

  <p class="EB03BodyTextIndented">却都从墓中起来，向往</p>

  <p class="EB03BodyTextIndented">我的太阳花想去的地方。</p>
</body></html>
