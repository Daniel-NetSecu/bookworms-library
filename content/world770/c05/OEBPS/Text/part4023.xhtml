  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">31</h1>

  <p class="kindle-cn-poem-left">我的心，这只野鸟，在你的双眼中找到了天空。<br/>
  它们是清晓的摇篮，它们是星辰的王国。<br/>
  我的诗歌在它们的深处消失。<br/>
  只让我在这天空中高飞，翱翔在静寂的无限空间里。<br/>
  只让我冲破它的云层，在它的阳光中展翅吧。</p>
