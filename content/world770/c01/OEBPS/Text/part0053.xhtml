<p class="title1" id="CHP51">LESSON 48</p>
<table class="table1">
  <tr>
    <td>James</td>
    <td>asks</td>
    <td>warm</td>
    <td>town</td>
  </tr>
  <tr>
    <td>then</td>
    <td>drives</td>
    <td>been</td>
    <td>show</td>
  </tr>
</table>
<p class="normaltext">James has been to the mill.</p>
<p class="normaltext">The day is warm, and he lets his horse stand in the shade.</p>
<p class="normaltext">A girl asks him to show her the way to the town. He tells her the way, and then drives on.</p>
<p class="picture"><img src="../Images/image01595.jpeg.webp" alt="alt"/></p>
<p class="subtitle">【中文阅读】</p>
<p class="normaltext">詹姆斯来到磨坊。</p>
<p class="normaltext">天很暖和，他把马拴在树阴下。</p>
<p class="normaltext">一个女孩问他去小镇的路。他告诉了她怎么走，然后驱车赶路。</p>
