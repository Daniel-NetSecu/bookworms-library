  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">24</h1>

  <p class="kindle-cn-poem-left1">我的一双眼睛充当了画家，<br/>
  将你的美画在我的心版上；<br/>
  我的躯体便是镶画的框架，<br/>
  那透视法是绘画者的专长。<br/>
  通过画师，我才能领悟画艺，<br/>
  找到你的真像珍藏在何处：<br/>
  那肖像就挂在我的心店里，<br/>
  你闪亮的双眸就是那窗户；<br/>
  眼睛对眼睛，好处可谓多多：<br/>
  我的眼睛画出了你的形体，<br/>
  你的眼睛为我开出了窗豁，<br/>
  阳光从此能进入，将你窥视。<br/>
  　　但我的眼睛尚缺一项技能，<br/>
  　　它只能画所见，不能探心灵。</p>
