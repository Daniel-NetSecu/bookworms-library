  <title>致特拉</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">致特拉<a id="w1"></a><a href="part0196.xhtml#m1"><sup>[1]</sup></a></h2>

  <p class="EB03BodyTextIndented">出身于凡胎的芸芸众生，</p>

  <p class="EB03BodyTextIndented">都将毁灭，消失躯体。</p>

  <p class="EB03BodyTextIndented">摆脱生殖而自由地复活：</p>

  <p class="EB03BodyTextIndented">那我何必和你在一起？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">男女们出生于羞耻和骄傲，</p>

  <p class="EB03BodyTextIndented">在早晨开花，在黄昏死去；</p>

  <p class="EB03BodyTextIndented">但仁慈令死亡变成了安眠，</p>

  <p class="EB03BodyTextIndented">男女们复活了，激动哭泣。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">你，我的凡体的母亲，</p>

  <p class="EB03BodyTextIndented">用残忍套住了我的心灵，</p>

  <p class="EB03BodyTextIndented">用那欺人又自欺的眼泪，</p>

  <p class="EB03BodyTextIndented">裹住我的鼻耳和眼睛：</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">用无知的泥土堵住我嘴，</p>

  <p class="EB03BodyTextIndented">使我背叛了尘世的生命；</p>

  <p class="EB03BodyTextIndented">耶稣之死使我无羁：<a id="w2"></a><a href="part0196.xhtml#m2"><sup>[2]</sup></a></p>

  <p class="EB03BodyTextIndented">那我何必和你在一起？</p>
  <hr/>

  <p class="EB03BodyTextIndented"><a id="m1"></a><a href="part0196.xhtml#w1">[1]</a> 不详。可能指下文“我的凡体的母亲”。</p>

  <p class="EB03BodyTextIndented"><a id="m2"></a><a href="part0196.xhtml#w2">[2]</a> 这是一个灵魂的复活。——原注</p>
</body></html>
