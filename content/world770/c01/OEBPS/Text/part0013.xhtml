<p class="title1" id="CHP11">LESSON 8</p>
<p class="picture"><img src="../Images/image01551.jpeg.webp" alt="alt"/></p>
<table class="table1">
  <tr>
    <td>See the lamp!</td>
    <td>瞧，这盏灯！</td>
  </tr>
  <tr>
    <td>It is on a mat.</td>
    <td>它放在小垫子上。</td>
  </tr>
  <tr>
    <td>The mat is on the stand.</td>
    <td>小垫子放在架子上。</td>
  </tr>
  <tr>
    <td>The lamp is Nat's,</td>
    <td>这盏灯是奈特的，</td>
  </tr>
  <tr>
    <td>and the mat is Ann's.</td>
    <td>小垫子是安的。</td>
  </tr>
</table>
