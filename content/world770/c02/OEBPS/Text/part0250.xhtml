  <h2 class="EB04MainHeadClosedTitle">INFANT SORROW</h2>

  <p class="EB03BodyTextIndented">My mother groand! My father wept.</p>

  <p class="EB03BodyTextIndented">Into the dangerous world I leapt:</p>

  <p class="EB03BodyTextIndented">Helpless, naked, piping loud:</p>

  <p class="EB03BodyTextIndented">Like a fiend hid in a cloud.</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">Struggling in my father’s hands:</p>

  <p class="EB03BodyTextIndented">Striving against my swadling bands:</p>

  <p class="EB03BodyTextIndented">Bound and weary I thought best</p>

  <p class="EB03BodyTextIndented">To sulk upon my mother’s breast.</p>
