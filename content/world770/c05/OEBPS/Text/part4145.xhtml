  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">65</h1>

  <p>我的上帝，从我满溢的生命之杯中，</p>

  <p>你要饮什么样的圣酒呢？</p>

  <p>通过我的眼睛，来观看你自己的创造物，</p>

  <p>站在我的耳门上，来静听你自己的永恒的谐音，</p>

  <p>我的诗人，这是你的快乐吗？</p>

  <p>你的世界在我的心灵里织上字句，</p>

  <p>你的快乐又给他们加上音乐。</p>

  <p>你把自己在梦中交给了我，</p>

  <p>又通过我来感觉你自己的完满的甜柔。</p>
