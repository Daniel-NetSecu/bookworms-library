  <title>先知</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">先知</h1>

  <p>一个先知坐在集市当中，给那些愿意光顾的人算命。突然间，有一个人跑过来告诉他他家进了贼，把能拿的都拿走了。先知一下子站起来，匆匆地往家跑，一边跑一边扯着头发，大声詈骂那些贼。路人全都笑了，其中一个说：“我们的朋友知道别人的命运，但看上去却不能预知自己的命运。”</p>
