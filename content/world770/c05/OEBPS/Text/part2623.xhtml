  <title>挤奶女工和奶桶</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">挤奶女工和奶桶</h1>

  <p>一个农夫的女儿挤完了牛奶，把奶桶顶在头顶上往回走。她一边走一边开心地想：“这桶里的奶可以用来做奶油，我可以做成黄油拿到市场上去卖，有了钱我就可以买些鸡蛋回来，然后孵出小鸡来，鸡生蛋，蛋生鸡，我就能有一个很大的家禽场。然后我就可以卖掉一些鸡，拿卖鸡的钱来给自己买条新裙子。我穿着新裙子去市场，所有的年轻人都会眼前一亮，跑来向我求爱，我会高傲地甩开头，不理他们。”她一直想着这些，忘了头顶上的奶桶，想着想着就做出了相应的动作，甩了一下头，于是奶桶从她头上滚落，所有的奶都洒了出来，她刚才空想出来的一切，全都一瞬间消失了。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：不要过早乐观。</p>
</body></html>
