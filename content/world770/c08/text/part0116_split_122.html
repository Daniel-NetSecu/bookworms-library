<h1 class="calibre22" id="calibre_pb_224">第二十二节</h1>

      <p class="x5">大型社会中不可能存在用奴隶进行耕种的方式。</p>

      <p class="x6">因此，当人类形成大型社会时，所能征募的奴隶数量不足以满足耕种的需要。尽管劳动力不足可以由牲畜来补充，但是总有一天，土地不再由奴隶来耕种。于是，只有家务劳动继续由奴隶来完成，直到最后奴隶制被完全废除；因为，随着各个国家成为文明国家，他们形成了交换战俘的惯例。这些惯例很容易形成，因为每个人都想摆脱沦为奴隶的危险境地。</p><a id="Section_cn_23"></a>
