  <h2 class="EB04MainHeadClosedTitle">驴、公鸡和狮子</h2>

  <p class="EB03BodyTextIndented">驴和公鸡一起待在牛栏里。这时，一只几天没吃饭的狮子出现了，正准备攻击驴并吃掉他时，公鸡跳了起来，用力地扑棱着翅膀，发出惊人的鸣叫。</p>

  <p class="EB03BodyTextIndented">这种情境下，要是有什么还能吓到一只狮子的话，那也就是公鸡的鸣叫了：狮子刚一听见公鸡的叫声，就飞快地逃走了。</p>

  <p class="EB03BodyTextIndented">驴看到这个场景十分高兴，他想着，如果狮子连公鸡都怕的话，那么他肯定也不可能打得过驴。于是驴跑出去追赶狮子。但是当他们到达公鸡看不到也听不到的地方时，狮子径直扑向驴，把他给吃了。</p>

  <p class="EB01BodyTextLineSpace">盲目自信通常导致灾难。</p>
