  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">95</h1>

  <p class="kindle-cn-poem-left1">你将耻辱装扮得楚楚动人，<br/>
  让它像玫瑰花中一条尺蠖，<br/>
  蹂躏你寓于蓓蕾中的美名！<br/>
  咳，你用何等香料粉饰罪过？<br/>
  你的那条谈论人生的舌头<br/>
  津津乐道偷香窃玉的游戏，<br/>
  应受谴责的，你却赞不绝口，<br/>
  提起你的名，噩耗也成喜事。<br/>
  哟，罪恶选中你作为栖息地，<br/>
  它们的寝宫何其富丽堂皇：<br/>
  美的面纱盖住所有的污迹，<br/>
  凡肉眼所及，都闪耀着金光！<br/>
  　　亲爱的，此等特权你得小心；<br/>
  　　再好的刀，用不当也会卷刃。</p>
