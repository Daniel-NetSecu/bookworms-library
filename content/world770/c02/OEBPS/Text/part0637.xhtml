  <h2 class="EB04MainHeadClosedTitle">熊和狐狸</h2>

  <p class="EB03BodyTextIndented">一只熊在吹嘘自己博爱。他说，在所有动物中，他对人类最温柔，因为他对人类如此尊重，以至于都不愿去触碰死尸。一只狐狸听见他的话，面露微笑地对熊说道：“哦！所以你宁可吃死尸也不吃活人呗。”</p>
