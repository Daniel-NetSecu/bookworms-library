  <div class="chapter" id="chapter">
    <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">第二十七章</h1>

    <p>她回到家里的时候，沃尔特也在家。她本来想直接回自己的房间，但他正在楼下的大厅里，向一个男仆人布置着任务。她觉得自己那么不幸，准备硬着头皮面对来自他的羞辱。</p>

    <p>“我跟你一起去那个地方。”她说道。</p>

    <p>“哦，好的。”</p>

    <p>“你什么时候让我准备妥当？”</p>

    <p>“明天晚上。”</p>

    <p>他的冷漠就像一把利矛刺痛了她，她也不知道从哪儿冒出了勇气，说了一句让她自己也感到吃惊的话。</p>

    <p>“我想也不需要准备太多的东西了，只需要一些夏天的衣物和一套寿衣就好了，不是吗？”</p>

    <p>她直视他的脸，知道她无礼的言辞激怒了他。</p>

    <p>“你需要什么东西我已经跟你的女仆说过了。”</p>

    <p>她点了点头，走上楼进了她的房间，面色像死人一样白。</p>
