  <h2 class="kindle-cn-heading2">135　小谣曲</h2>

  <p class="kindle-cn-signature">庞德</p>

  <p class="kindle-cn-poem-left">光配合着她的优雅，留驻在<br/>
  状如人类的盲眼中，阴影里；<br/>
  你瞧！这光已化为一支歌：</p>

  <p class="kindle-cn-poem-left">点点阳光化为头饰戴她头上，<br/>
  我的那颗心已经归她来管。<br/>
  白晃晃的树林没有鹿的踪迹。<br/>
  多宁静的光！林间找不到蛛网。<br/>
  她是那么的柔弱娇气，当太阳<br/>
  清除起草叶上晶莹剔透的祖母绿，<br/>
  她担心珠子太快消失，便悄然离去。</p>
