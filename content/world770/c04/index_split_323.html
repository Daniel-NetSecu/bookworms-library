</p><p class="calibre_"><span class="calibre6">亚马逊探险</span></p><p class="calibre_65"><span class="calibre2">神奇树屋·故事系列·基础版#6</span></p><p class="calibre_12"><span class="calibre2">[美] 玛丽·波·奥斯本/著</span></p><p class="calibre_66"><span class="calibre2">[美] 萨尔·莫多卡/绘</span></p><hr class="calibre7"/><blockquote class="calibre_67"><span class="calibre2"><span class="bold">内容简介:</span></span></blockquote><blockquote class="calibre_68"><span class="calibre2">经历了神奇树屋的几次冒险，杰克和安妮发现树屋的主人名叫摩根，是一名会魔法的图书管理员。这一次，仙女摩根遇到了大麻烦，需要兄妹俩找到四样特别的东西才能破除她身上的咒语。于是，他们乘着神奇树屋来到古代日本，在两名忍者的帮助下找到了第一样东西……</span></blockquote><div class="mbp_pagebreak" id="calibre_pb_323"></div>
