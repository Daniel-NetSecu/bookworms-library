  <h2 class="EB04MainHeadClosedTitle">蝙蝠、荆棘和海鸥</h2>

  <p class="EB03BodyTextIndented">蝙蝠、荆棘和海鸥决定结伴一起出海贸易。蝙蝠为他的冒险活动借了一大笔钱；荆棘储存了各种各样的服饰；海鸥带了一些铅。就这样，他们出发上路了。</p>

  <p class="EB03BodyTextIndented">没过多久，一阵猛烈的暴风雨突然来袭。他们的船和所有货物都沉入海底。但这三个旅行者都设法回到了陆地上。从那时起，海鸥就在海面上来来回回地飞，不时地把头扎进海里，找寻他丢失的铅。而蝙蝠害怕见到他的债主，于是就在白天躲藏起来，晚上才出来觅食。荆棘则钩住每个过路人的衣服，梦想着有一天能够找回他丢失的服装。</p>

  <p class="EB01BodyTextLineSpace">所有人都更关心找回他们丢失的东西，而不是得到他们缺少的东西。</p>
