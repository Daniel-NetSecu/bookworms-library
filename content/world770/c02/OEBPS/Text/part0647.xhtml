  <h2 class="EB04MainHeadClosedTitle">骡子</h2>

  <p class="EB03BodyTextIndented">一天早晨，一只骡子玉米棒吃多了，因为无事可做，便开始肆意地奔过来跑过去，还自言自语：“我的父亲一定是一匹精力充沛的赛马，我的速度和精气神完全随了他。”</p>

  <p class="EB03BodyTextIndented">第二天，因为经历了一段长途跋涉，骡子感到十分疲惫，于是用沮丧的腔调说道：“我一定搞错了，我的父亲可能终究只是个毛驴罢了。”</p>
