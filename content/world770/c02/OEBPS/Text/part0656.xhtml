  <h2 class="EB04MainHeadClosedTitle">狼和小羊</h2>

  <p class="EB03BodyTextIndented">一只狼遇见了一只从羊群中走失的小羊，他决定不急着下毒手，而是想找个证明他有权利吃小羊的借口。他对小羊说：“先生，去年你狠狠地侮辱了我。”</p>

  <p class="EB03BodyTextIndented">“事实上，”小羊用悲哀的语调咩咩叫道，“我那时还没出生。”</p>

  <p class="EB03BodyTextIndented">狼又说道：“那你在我的牧场上吃过草。”</p>

  <p class="EB03BodyTextIndented">“不，好先生，”小羊回答道，“我还从未吃过草呢。”</p>

  <p class="EB03BodyTextIndented">狼再次说道：“你喝了我的井水。”</p>

  <p class="EB03BodyTextIndented">“不，”小羊呼喊道，“我从未喝过水，因为我妈妈的奶对我来说，既是饭也是水。”</p>

  <p class="EB03BodyTextIndented">狼捉住了他，把他给吃了，说道：“好吧！我是不会饿着肚子的，即使你推翻了我的每一种推论。”</p>

  <p class="EB01BodyTextLineSpace">暴君总会为他的暴政找借口。</p>
