  <title>狼和马</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">狼和马</h1>

  <p>一只狼溜达到了一片燕麦地，他却没有办法吃燕麦，他继续向前走，碰上了一匹马。狼说：“你看，那边有片很好的燕麦。为了照顾你，我一点都没有碰，我很喜欢听你的牙齿咀嚼成熟的粮食的声音。”但是马回答说：“我亲爱的朋友，如果狼能吃燕麦的话，你肯定不会让肚子空空的，去满足耳朵的需求了。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：将自己不要的东西给别人，并不是什么美德。</p>
