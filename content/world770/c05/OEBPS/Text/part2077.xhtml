  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">131</h1>

  <p class="kindle-cn-poem-left1">有的人长得美，就跋扈专横，<br/>
  你凭你的姿容也如此高傲，<br/>
  因你知道，我对你一片痴情，<br/>
  把你当作至美至珍的瑰宝。<br/>
  说实话，有些见过你的人说：<br/>
  你的脸不值得情人去思慕；<br/>
  我不敢直言他们此说有错，<br/>
  但私下赌咒：他们有眼无珠。<br/>
  我担保我的赌咒有据有凭：<br/>
  每当我想到你，千万个叹息<br/>
  便接踵而至，它们足以证明：<br/>
  在我眼里，你的黑就是绝色。<br/>
  　　其实，你的黑只在你的行止，<br/>
  　　就因这缘故，人们才非议你。</p>
