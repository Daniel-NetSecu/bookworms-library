  <p class="zhusi"><a id="bz1" href="part0586.xhtml#z1">[1]</a>即John Locke。——译者注</p>

  <p class="zhusi"><a id="bz2" href="part0586.xhtml#z2">[2]</a>即Thomas Mun。——译者注</p>

  <p class="zhusi"><a id="bz3" href="part0586.xhtml#z3">[3]</a>英国在1663年到1813年间发行的金币，价值相当于1磅1先令。——译者注</p>

  <p class="zhusi"><a id="bz4" href="part0586.xhtml#z4">[4]</a>古斯巴达法典的制定者。——译者注</p>

  <p class="zhusi"><a id="bz5" href="part0586.xhtml#z5">[5]</a>即斯巴达。——译者注</p>

  <p class="zhusi"><a id="bz6" href="part0587.xhtml#z6">[6]</a>长度单位，在陆地上时，1里格相当于3法定英里（4.8千米）。——译者注</p>

  <p class="zhusi"><a id="bz7" href="part0588.xhtml#z7">[7]</a>位于丹麦东部，是丹麦境内最大的岛屿。——译者注</p>

  <p class="zhusi"><a id="bz8" href="part0588.xhtml#z8">[8]</a>此处的近代实指18世纪70年代的中国，即闭关锁国的清朝时期。</p>
