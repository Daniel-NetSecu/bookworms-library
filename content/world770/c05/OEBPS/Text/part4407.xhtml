  <h2 class="kindle-cn-heading2">西翁伊狼群的猎歌</h2>

  <p class="poem-left">天就要亮啦，大雄鹿叫啦，<br/>
  　　一回，两回，好多回呀！<br/>
  一只雌鹿跳起来，一只雌鹿跳起来，<br/>
  　　在那野鹿进食的林泉外。<br/>
  我独自跟踪，这情景我见啦，<br/>
  　　一回，两回，好多回呀！</p>

  <p class="poem-left">天就要亮啦，大雄鹿叫啦，<br/>
  　　一回，两回，好多回呀！<br/>
  一只狼偷偷地跑回来，一只狼偷偷地跑回来，<br/>
  　　给等候的狼群捎个信儿来。<br/>
  我们在搜索，我们已发现，跟着他的足迹叫起来，<br/>
  　　一回，两回，好多回呀！</p>

  <p class="poem-left">天就要亮啦，狼群都叫啦，<br/>
  　　一回，两回，好多回呀！<br/>
  脚步在丛林中不留痕迹！<br/>
  眼睛在黑暗中看得清晰！<br/>
  喉咙——放开喉咙叫吧！听哪！听哪！<br/>
  　　一回，两回，好多回呀！</p>
