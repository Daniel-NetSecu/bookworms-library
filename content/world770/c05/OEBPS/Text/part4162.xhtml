  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">82</h1>

  <p>你手里的光明是无限的，我的主，你的分秒是无法计算的。</p>

  <p>夜去明来，时代像花开花落。</p>

  <p>你晓得怎样来等待。</p>

  <p>你的世纪，一个接着一个，来完成一朵小小的野花。</p>

  <p>我们的光阴不能浪费，因为没有时间，我们必须争取机缘。</p>

  <p>我们太穷苦了，决不可迟到。</p>

  <p>因此，在我把时间让给每一个急性的、向我索要时间的人时，</p>

  <p>我的时间就虚度了，最后你的神坛上就没有一点祭品。</p>

  <p>一天过去，我赶忙前来，怕你的门已经关闭；</p>

  <p>但是我发现时间还有余裕。</p>
