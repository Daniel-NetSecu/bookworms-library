  <title>升天节</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">升天节</h2>

  <p class="EB03BodyTextIndented">难道这能算是至善，</p>

  <p class="EB03BodyTextIndented">在富饶多产的土地上——</p>

  <p class="EB03BodyTextIndented">婴儿的境遇悲惨，</p>

  <p class="EB03BodyTextIndented">被冰冷的放债的手喂养？</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">那嘶哭能算是歌声？</p>

  <p class="EB03BodyTextIndented">能算是欢乐的歌曲？</p>

  <p class="EB03BodyTextIndented">那么多孩子不幸啊，</p>

  <p class="EB03BodyTextIndented">那是块贫瘠的土地！——</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">那里见不着阳光，</p>

  <p class="EB03BodyTextIndented">土地荒芜不毛，</p>

  <p class="EB03BodyTextIndented">道路为荆棘所网，</p>

  <p class="EB03BodyTextIndented">冰雪四季不消。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">哪里有了阳光，</p>

  <p class="EB03BodyTextIndented">哪里有雨露滋润，</p>

  <p class="EB03BodyTextIndented">婴儿就不会挨饿，</p>

  <p class="EB03BodyTextIndented">不会有令人心悸的贫困。</p>
</body></html>
