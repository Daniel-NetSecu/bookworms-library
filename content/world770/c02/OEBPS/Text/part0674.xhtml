  <h2 class="EB04MainHeadClosedTitle">狗和狼</h2>

  <p class="EB03BodyTextIndented">一条狗躺在农场门前的阳光下。这时，一只狼突袭了他，正要吃掉他。但他乞求狼饶他一命，并说道：“你看我多瘦呀，现在的我只能给你塞塞牙缝。但是你再等几天的话，我的主人将要摆宴席。那时，所有丰盛的残羹剩饭都会落入我的腹中，我将变得又胖又美味，那才是你该吃我的时候。”</p>

  <p class="EB03BodyTextIndented">狼觉得这个主意不错，便走开了。不久之后，他又来到了农场，发现狗躺在马厩的屋顶上。“你下来，”他喊道，“该我吃你了，你记得我们的约定吗？”</p>

  <p class="EB03BodyTextIndented">但是狗冷酷地说：“我的朋友，如果你再看见我躺在门口的话，可别再等什么盛宴了。”</p>

  <p class="EB01BodyTextLineSpace">一回上当两回乖。</p>
