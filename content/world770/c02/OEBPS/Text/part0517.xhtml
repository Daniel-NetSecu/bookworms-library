  <title>对她的赞美</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">对她的赞美</h2>

  <p class="EB03BodyTextIndented">我愿在听到的那些赞美里，她排首位。</p>

  <p class="EB03BodyTextIndented">我在屋里四处走动，上下来回</p>

  <p class="EB03BodyTextIndented">像一个人出版了一本新书，</p>

  <p class="EB03BodyTextIndented">或一个年轻的姑娘穿上了新衣，</p>

  <p class="EB03BodyTextIndented">尽管我竭力转变话题</p>

  <p class="EB03BodyTextIndented">让对她的赞美成为最高的主题，</p>

  <p class="EB03BodyTextIndented">一个女人仍在讲述她读过的新书，</p>

  <p class="EB03BodyTextIndented">一个男人仍在半梦中困惑着，</p>

  <p class="EB03BodyTextIndented">仿佛别的名字跑进了他的脑海。</p>

  <p class="EB03BodyTextIndented">我愿在听到的那些赞美里，她排首位。</p>

  <p class="EB03BodyTextIndented">我将不再谈论书或漫长的战争，</p>

  <p class="EB03BodyTextIndented">只是在干枯的荆棘旁走着，</p>

  <p class="EB03BodyTextIndented">直到发现有个乞丐在避风，</p>

  <p class="EB03BodyTextIndented">她的名字出现在主导的谈话里。</p>

  <p class="EB03BodyTextIndented">即使衣衫褴褛，他仍会知道她的名字</p>

  <p class="EB03BodyTextIndented">并且愉快地记得，在旧时</p>

  <p class="EB03BodyTextIndented">尽管她受年轻人赞美，老年人责难，</p>

  <p class="EB03BodyTextIndented">但在穷人间，无论老少都对她称赞不已。</p>
