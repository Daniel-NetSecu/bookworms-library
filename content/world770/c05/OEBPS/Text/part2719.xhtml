  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">两个罐子</h1>

  <p>有两个罐子，一个是陶的，一个是黄铜的，发洪水的时候，他们被水流冲到了河下游。黄铜罐子要求同伴紧紧跟在他身边，说他会保护他的。另一个罐子表示感谢，却恳求他无论如何不要接近自己。“因为那正是我害怕的。只要碰到你，我就会四分五裂。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：彼此平等才能成为良友。</p>
