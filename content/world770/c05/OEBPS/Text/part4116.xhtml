  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">36</h1>

  <p>这是我对你的祈求，我的主——</p>

  <p>请你铲除，铲除我心里贫乏的根源。</p>

  <p>赐给我力量，使我能轻闲地承受欢乐与忧伤。</p>

  <p>赐给我力量，使我的爱在服务中得到果实。</p>

  <p>赐给我力量，使我永远不抛弃穷人，也永不向淫威屈膝。</p>

  <p>赐给我力量，使我的心灵超越于日常琐事之上。</p>

  <p>再赐给我力量，使我满怀爱意地叫我的力量服从你意志的指挥。</p>
