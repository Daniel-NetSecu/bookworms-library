  <p class="p">● Crush is a sea turtle who loves and cares for his son, Squirt. He helps Marlin and Dory get to Sydney Harbour to rescue Nemo. His nickname for Marlin and Dory is “The Jellyman” and “Little Blue,” respectively.</p>
