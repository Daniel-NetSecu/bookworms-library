  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">28</h1>

  <p>罗网是坚韧的，但是要撕破它的时候我又心痛。</p>

  <p>我只要自由，为希望自由我却觉得羞愧。</p>

  <p>我确知那无价之宝是在你那里，</p>

  <p>而且你是我最好的朋友，但我却舍不得清除我满屋的俗物。</p>

  <p>我身上披的是尘灰与死亡之衣；</p>

  <p>我恨它，却又热爱地把它抱紧。</p>

  <p>我的负债很多，我的失败很大，我的耻辱秘密而又深重；</p>

  <p>但当我来求福的时候，我又战栗，唯恐我的祈求得到允诺。</p>
