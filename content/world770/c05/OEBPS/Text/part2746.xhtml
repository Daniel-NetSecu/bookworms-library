  <title>狼和牧羊人</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">狼和牧羊人</h1>

  <p>一只狼在一个羊群附近徘徊了很长时间，却没有去骚扰他们。</p>

  <p class="page-break"></p><div style="page-break-after:always"></div>

  <div class="kindle-cn-bodycontent-div-alone100">
    <img alt="" class="kindle-cn-bodycontent-image-alone80-withnote" src="../Images/image24015.jpeg.webp"/>

    <p class="kindle-cn-picture-txt-withfewcharactors">公鸡和宝石</p>
  </div>

  <p>牧羊人自然将其视为祸害，起初紧紧盯着他，但过了一段时间，狼没有表现出攻击羊群的迹象，牧羊人便开始将狼当作了羊群的保护者，而不是敌人。有一天，他因为一些事情去了城里，放心地把狼留在了羊群里。但他刚一走，狼便袭击了羊群，杀死了大部分羊。牧羊人回来看到他自己造成的惨剧，哭着说：“我将羊群交托给一只狼，落得这样的下场罪有应得。”</p>
