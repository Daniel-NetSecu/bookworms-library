<h1 class="title1" id="CHP3">内容简介</h1>
<p class="normaltextx">史蒂夫住在卡多，他爸爸是《卡多之星》报的编辑。可今天《卡多之星》的记者生病了，史蒂夫的爸爸想为本期周报寻找一些令人感兴趣的内容。“或许你可以帮我找一些。”他对史蒂夫说。史蒂夫能找到些什么呢？这周卡多有什么新鲜事？</p>
<p class="normaltextx">史蒂夫的朋友乔说：“城里新来了一个女孩！她个子高挑，有着红色的头发和亲切的微笑……她叫玛丽埃塔。”</p>
<p class="normaltextx">玛丽埃塔是谁？或许这可以成为史蒂夫为本期报纸提供的报道。但是他必须先遇到她——这可不太容易。</p>
