  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">124</h1>

  <p class="kindle-cn-poem-left1">如果我的爱只是出于势利，<br/>
  那它一定是时运的私生子，<br/>
  得听便时间的爱憎所摆布，<br/>
  如野草闲花，任凭世人采刈。<br/>
  不，我的爱绝不是逢场作戏，<br/>
  它不会因荣华而趾高气扬，<br/>
  也不会因失意而垂头丧气，<br/>
  尽管这个时代只追求时尚。<br/>
  我的爱不畏惧异端的权术，<br/>
  任何奸计只能得逞于一时；<br/>
  我的爱巍然而立，深谋远虑，<br/>
  骄阳下不疯长，淫雨中不溺。<br/>
  　　势利的小人们可为我作证：<br/>
  　　他们作恶一世，死时求超升。</p>
