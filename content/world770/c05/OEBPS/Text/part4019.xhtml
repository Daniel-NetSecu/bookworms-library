  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">27</h1>

  <p class="kindle-cn-poem-left">“即使爱只给你带来了哀愁，也信任它。<br/>
  不要把你的心关起。”<br/>
  “啊，不，我的朋友，你的话语太隐晦了，我不懂得。”<br/>
  “心是应该和一滴眼泪、一首诗歌一起送给人的，我爱。”<br/>
  “啊，不，我的朋友，你的话语太隐晦了，我不懂得。”<br/>
  “喜乐像露珠一样地脆弱，它在欢笑中死去。<br/>
  哀愁却是坚强而耐久。<br/>
  让含愁的爱在你眼中醒起吧。”<br/>
  “啊，不，我的朋友，你的话语太隐晦了，我不懂得。”<br/>
  “荷花在日中开放，丢掉了自己的所有。<br/>
  在永生的冬雾，它将不再含苞。”<br/>
  “啊，不，我的朋友，你的话语太隐晦了，我不懂得。”</p>
