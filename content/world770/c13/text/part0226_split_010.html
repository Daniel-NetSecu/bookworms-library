<h2 class="heading" id="calibre_pb_9">龟龟</h2>

  <p class="p">● 龟龟是一只海龟，他深爱着自己的儿子小古。他帮助马林和多莉到达了悉尼港以营救尼莫。他给马林和尼莫起的昵称分别为“水母游侠”和“小蓝点”。</p>
