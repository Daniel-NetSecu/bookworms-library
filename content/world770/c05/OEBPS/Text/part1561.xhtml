  <h2 class="kindle-cn-heading2">117　有时我跟所爱的人在一起</h2>

  <p class="kindle-cn-signature">惠特曼</p>

  <p class="kindle-cn-poem-left">有时我跟所爱的人在一起，心里充满怒火，生怕我付出的爱得不到回报。<br/>
  但如今我知道没有得不到回报的爱情，这回报肯定有，不是以这种方式，就是以那种方式。<br/>
  （我热烈地爱过一个女人，我的爱没有得到回报，但从那次爱我写出这些歌。）</p>
