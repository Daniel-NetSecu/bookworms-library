  <title>天鹅</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">天鹅</h1>

  <p>据说，天鹅一生只能唱一次歌，就是在它知道自己要死的时候。有一个人曾经听到过天鹅之歌，后来有一天，在集市上看到有卖天鹅的，就买了一只回家。过了些天，他请客人吃饭，便推出了天鹅，让它唱歌哄客人们开心。但是天鹅沉默无声。日子一天天过去，天鹅越来越老，它意识到自己的生命到了尽头，于是唱出了一支甜美而悲伤的歌。主人听到了，十分愤怒地说：“这个鬼东西，只有要死了才唱歌！那天我想听它唱歌是多蠢啊！我当时应该扭断它的脖子，而不是恳求它唱歌。”</p>
