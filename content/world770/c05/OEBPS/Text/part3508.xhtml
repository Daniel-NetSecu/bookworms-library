  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">2</h1>

  <p>依赛格林（Esegrim）狼同他的亲族与朋友们到来，站在国王面前，说道：“高贵有力的王，我的主，我恳求你，以你的威力、正直与仁慈，你要对于列那狐所给予我及我的妻子的种种侵害及无理的胡闹，加以怜惘。他不管我妻子的不愿，强行侵入我的屋里。我的儿子们睡在那里，他撒尿在他们头上，因此他们从此成了瞎眼。亲爱的王，这件事，现在到你宫廷这里来的禽兽，有许多都是知道的。他还有许多侵害的事，我也不便细说，现在只好不提。但他对于我妻的羞辱，这是我万不能不报仇的，必须叫他给我以赔偿。”</p>
