  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">23</h1>

  <p class="kindle-cn-poem-left1">好比生疏的演员登上舞台，<br/>
  因怯场忘记了自己的角色；<br/>
  又像一头猛兽，正暴跳如雷，<br/>
  因发威过猛反使心脏衰竭；<br/>
  我也如此，因缺自信而惶恐，<br/>
  竟忘了爱情那完美的仪式；<br/>
  我所负荷的爱情过于沉重，<br/>
  爱情的力量似乎正在消失。<br/>
  哦，但愿我这诗卷妙辞滔滔，<br/>
  无声的陈述者能畅表胸襟，<br/>
  为爱辩护，并期望得到酬报，<br/>
  胜过喋喋不休者的好嗓门。<br/>
  　　哦，读一读沉默的爱写的诗，<br/>
  　　用眼睛去倾听爱情的睿智。</p>
