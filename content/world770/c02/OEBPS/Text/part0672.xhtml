  <h2 class="EB04MainHeadClosedTitle">驴和货物</h2>

  <p class="EB03BodyTextIndented">一个小贩有头驴。有一天他买了一些盐，并且尽可能多地装在了驴背上。在回家的路上，驴在渡过一条小溪时，蹄子滑了一下，跌入了水中。</p>

  <p class="EB03BodyTextIndented">盐全都湿透了，许多都溶解流走了。因此，当驴站起来时，他发现身上的负担轻了许多。他的主人赶着他回了集市，买了更多的盐放进了他的驮篮里。他们再一次出发了。</p>

  <p class="EB03BodyTextIndented">当他们刚到小溪时，驴立马跌坐在水里，然后像之前一样站起来，身上的负担又轻了许多。他的主人识破了他的诡计，又一次地回到集市，买了许多海绵，把它们堆在了驴背上。</p>

  <p class="EB03BodyTextIndented">当他们来到小溪时，驴故技重施，但是这一次，海绵吸了大量的水。当他站起来时，发现身上的负担变得前所未有地重。</p>

  <p class="EB01BodyTextLineSpace">好牌不能频繁地打。</p>
