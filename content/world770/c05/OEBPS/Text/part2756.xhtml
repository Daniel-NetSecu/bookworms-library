  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">秃子和苍蝇</h1>

  <p>有一只苍蝇落在了一个秃头男人的头上，不断地咬他。秃子想把苍蝇杀死，他狠狠打了自己一巴掌。苍蝇逃脱了，嘲弄地对他说：“你因为这么一小口就想杀死我，那现在呢，你打了自己那么重一下，你又该怎么对付你自己呢？”男人回答：“哦，对那一下我可没有什么怨恨，因为我从来都没想给我自己造成任何伤害，但是你这个卑鄙的害虫，以吸食人血为生，只要能把你赶出我的生活，我付出再多也是值得的。”</p>
