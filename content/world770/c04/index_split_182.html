</p><p class="calibre_"><span class="calibre6">寻宝加勒比</span></p><p class="calibre_65"><span class="calibre2">神奇树屋·故事系列·基础版#4</span></p><p class="calibre_12"><span class="calibre2">[美] 玛丽·波·奥斯本/著</span></p><p class="calibre_66"><span class="calibre2">[美] 萨尔·莫多卡/绘</span></p><hr class="calibre7"/><blockquote class="calibre_67"><span class="calibre2"><span class="bold">内容简介:</span></span></blockquote><blockquote class="calibre_68"><span class="calibre2">在经历了恐龙谷历险和古堡惊魂夜之后，神奇树屋将杰克和安妮带到了古埃及。金字塔的深处，兄妹俩撞见一位千年前的幽灵女王。在经历层层历险之后，杰克和安妮能帮助幽灵女王找到了解救她的亡灵书、成功离开了困住两人的金字塔吗？</span></blockquote><div class="mbp_pagebreak" id="calibre_pb_182"></div>
