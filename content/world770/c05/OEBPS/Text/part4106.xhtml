  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">26</h1>

  <p>他来坐在我的身边。而我没有醒起。</p>

  <p>多么可恨的睡眠，唉，不幸的我啊！</p>

  <p>他在静夜中来到；</p>

  <p>手里拿着琴，我的梦魂和他的音乐起了共鸣。</p>

  <p>唉，为什么每夜就这样地虚度了？</p>

  <p>啊，他的气息接触了我的睡眠，为什么我总看不见他的面？</p>
