  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">132</h1>

  <p class="kindle-cn-poem-left1">我爱你的眼，它们懂得同情，<br/>
  知道你的心对我颇为鄙夷，<br/>
  便披上一袭黑服前来悼念，<br/>
  对我的痛苦表示由衷怜惜。<br/>
  早晨的太阳给青灰的东方<br/>
  捎上绚烂，长庚星引领黄昏，<br/>
  给阴沉的西天梳妆出辉煌，<br/>
  说真的，它们如此相辅相成，<br/>
  也难比你眼与脸间的谐和。<br/>
  哟，既然悲哀为你带来优雅，<br/>
  就让你的心也一样同情我，<br/>
  让怜悯在你每一部位驻扎！<br/>
  　　美本身就是黑，这我敢赌咒，<br/>
  　　而你肤色以外的，一切皆丑。</p>
