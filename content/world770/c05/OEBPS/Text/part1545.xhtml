  <h2 class="kindle-cn-heading2">102　我的心里充满忧伤</h2>

  <p class="kindle-cn-signature">豪斯曼</p>

  <p class="kindle-cn-poem-left">我的心里充满忧伤，<br/>
  为那些金子般的友朋，<br/>
  为许多红唇的女郎，<br/>
  许多脚步轻盈的后生。</p>

  <p class="kindle-cn-poem-left">小溪太宽难以跨越，<br/>
  后生们就躺在溪流旁；<br/>
  红唇姑娘入睡在田间，<br/>
  一旁的玫瑰已经凋亡。</p>
