  <title>羊和狗</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">羊和狗</h1>

  <p>从前，羊向牧羊人抱怨他把他们和狗区别对待。他们说：“我们觉得，你的安排非常奇怪，很不公平。我们给你提供羊毛，生产小羊，产羊奶，你却只给我们草吃，别的都不给我们，而且即便是草，也是我们自己去找的。但是对狗呢，你从他那里什么都得不到，却会把餐桌上的美味喂给他。”他们的议论被狗听到了，狗立刻发声：“是的，的确是这样，但是如果没有我，你们又在哪里呢？贼会把你们偷走！狼会把你们吃掉！实际上，如果不是我一直看着你们，你们会害怕得连草也不敢去吃。”羊不得不承认狗说的是对的，再也没有因为主人对狗的偏心而不满。</p>
