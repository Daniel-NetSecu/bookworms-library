  <title>THE FOX AND THE LEOPARD</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">THE FOX AND THE LEOPARD</h1>

  <p>A Fox and a Leopard were disputing about their looks, and each claimed to be the more handsome of the two. The Leopard said, “Look at my smart coat; you have nothing to match that.” But the Fox replied, “Your coat may be smart, but my wits are smarter still.”</p>
