  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">107</h1>

  <p class="kindle-cn-poem-left1">无论我自身对未来的忧惧，<br/>
  还是预言家对世界的预想，<br/>
  都不能为我的爱规定限期，<br/>
  并让它在宿命中走向死亡。<br/>
  人间之月<span class="math-super"><a id="a01" href="part2053.xhtml#b01">[1]</a></span>已安度月蚀之难，<br/>
  星象家的预言都成了笑柄，<br/>
  不安的一切都转化为安然，<br/>
  橄榄枝宣告了永久的和平。<br/>
  有这芬芳时代的甘露滋润，<br/>
  我鲜活的爱，连死神也退避：<br/>
  尽管她常侮辱下贱的愚民，<br/>
  我不理她，独自活在这诗里。<br/>
  　　当暴君的饰章、铜墓化成灰，<br/>
  　　诗篇里仍立着你的纪念碑。</p>
  <hr/>

  <p class="kindle-cn-kai"><a id="b01" href="part2053.xhtml#a01">[1]</a> “人间之月”喻指女王伊丽莎白一世。</p>
