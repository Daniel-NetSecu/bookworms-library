  <div class="calibre4">
    <div class="en">
      Give me no light, great Heaven, but such as turns To energy of human fellowship; No powers beyond the growing heritage That makes completer manhood.
    </div>

    <div class="en">
      万能的主，请勿赐我光明，但要赐我，人类情谊之力量；唯有渐增之遗产，才能让人类更完整。
    </div>
  </div>
