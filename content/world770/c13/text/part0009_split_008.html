<h2 class="heading" id="calibre_pb_7">犀利哥</h2>

  <p class="p">犀利哥因为在神秘泉绿洲表现突出，而被公认为动物城里最开明、最踏实的动物。不管是在冰川镇还是撒哈拉广场，他都是“沉稳”的代名词。</p>
