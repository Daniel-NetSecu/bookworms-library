  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">118</h1>

  <p class="kindle-cn-poem-left1">我们为了让自己食欲大增，<br/>
  常用辛辣的佐料烹制食物；<br/>
  为了防范隐而未见的疾病，<br/>
  还会恶心地先将泻药吞服。<br/>
  我也是：你的甘美百吃不厌，<br/>
  但我饱餐后偏要吞饮苦汁；<br/>
  餍足了健康，便将病痛品尝，<br/>
  尽管这病痛于我有害无益。<br/>
  爱的策略本为防患于未然，<br/>
  结果弄巧成拙，假病成真疾，<br/>
  健康的身心反而变成病患，<br/>
  善而生忧，反得让恶来医治。<br/>
  　　但我也因此获得一个教训：<br/>
  　　谁因你而成疾，药物也害人。</p>
