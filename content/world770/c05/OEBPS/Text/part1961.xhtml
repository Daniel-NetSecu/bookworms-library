  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">15</h1>

  <p class="kindle-cn-poem-left1">有时我这样思量，人间万物<br/>
  拥有完美的时光极其有限，<br/>
  世界这座大舞台演出节目<br/>
  无不受天上星斗暗中调遣；<br/>
  有时我还看到，人犹如草木，<br/>
  也受这天体的激励和抑制，<br/>
  繁茂在青春，随即盛极而枯，<br/>
  韶华美景最终被记忆摒弃。<br/>
  我因此想，正是人生的无常<br/>
  使你在我面前暂现出秀色，<br/>
  那毁灭一切的时间和衰亡<br/>
  必然将你的皓日变成暗夜。<br/>
  　　为了爱你，我要与时间抗争，<br/>
  　　它夺走你时，我要为你赎身。</p>
