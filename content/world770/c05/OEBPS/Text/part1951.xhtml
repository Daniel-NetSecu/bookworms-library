  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">5</h1>

  <p class="kindle-cn-poem-left1">一刻刻时辰，以灵巧的工程<br/>
  打造迷人的凝盼留在眼底，<br/>
  随后便对美目实施了暴政，<br/>
  使美变为丑，美质失却附依。<br/>
  永不歇足的时间引领夏天<br/>
  进入寒冬，并把它肆意摧毁，<br/>
  树液被冰霜冻结，茂叶枯干，<br/>
  美掩在雪中，到处一片衰微。<br/>
  如果没有夏日提炼的香精<br/>
  囚徒般被封存在玻璃瓶里，<br/>
  美的结晶会随美一起消泯，<br/>
  美将无存，连同对美的记忆。<br/>
  　　鲜花一经提炼，即使在冬日，<br/>
  　　丢失的是外表，留存着美质。</p>
