<h2 class="heading" id="calibre_pb_4">Malin</h2>

  <p class="p">Marlin is a clownfish who makes his home inside a sea anemone in the Great Barrier Reef. He once had a wife Coral who died in a barracuda attack, along with almost all of his children. Also as a result of the attack, he has one son, Nemo.</p>
