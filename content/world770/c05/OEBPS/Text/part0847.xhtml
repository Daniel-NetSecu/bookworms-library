  <h1 class="bodycontent-first-title">致露西·巴菲尔德</h1>

  <p class="bodycontent-text_noindent">亲爱的露西，</p>

  <p class="bodycontent-text">我为你写下这个故事，只是提笔时未曾想，你成长的速度超过我写故事的速度，你现在甚至已经过了读童话的年纪。等到此书付梓装订，你年岁愈增。但是他日某天，你会长到重新翻看童话的年龄。到那时，你可以将本书从高阁取下，掸去灰尘，告诉我你的读后感想。可能那时我年事已高，耳聋到听不清你说话，也不明白你讲的任何一个字，但我一直都是</p>

  <p class="bodycontent-text_right">深爱你的教父，</p>

  <p class="bodycontent-text_right">C. S.刘易斯</p>
</body></html>
