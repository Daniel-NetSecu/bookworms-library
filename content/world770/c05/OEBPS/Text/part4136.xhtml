  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">56</h1>

  <p>只因你的快乐是这样地充满了我的心，只因你曾这样地俯就我。</p>

  <p>啊，你这诸天之王，假如没有我，你还爱谁呢？</p>

  <p>你使我做了你这一切财富的共享者。</p>

  <p>在我心里你的欢乐不住地遨游。</p>

  <p>在我生命中你的意志永远实现。</p>

  <p>因此，你这万王之王曾把自己修饰了来赢取我的心。</p>

  <p>因此你的爱也消融在你情人的爱里。</p>

  <p>在那里，你又以我俩完全合一的形象显现。</p>
