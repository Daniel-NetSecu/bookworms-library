  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">37</h1>

  <p class="kindle-cn-poem-left1">正像衰老的父亲喜出望外<br/>
  看见活泼的孩子奋发有为，<br/>
  虽然我遭受命运恶意残害，<br/>
  但你的德与真给我以安慰。<br/>
  无论美或出身，财富或才智，<br/>
  或其一，或全部，或比这更多，<br/>
  都在你身上得到完美显示，<br/>
  这一切已是我的爱的依托。<br/>
  从此我不残、不穷、不被轻视，<br/>
  因为你的形象丰满而充裕，<br/>
  为这富足，我感到满心欢喜，<br/>
  我活着，就在你荣耀的一隅。<br/>
  　　完美的一切，我希望全归你，<br/>
  　　希望一实现，我十倍的欣喜。</p>
