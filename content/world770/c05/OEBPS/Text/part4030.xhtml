  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">38</h1>

  <p class="kindle-cn-poem-left">我爱，从前有一天，你的诗人把一首伟大史诗投进他心里。<br/>
  啊，我不小心，<br/>
  它打到你的叮当的脚镯上而引起悲愁。<br/>
  它裂成诗歌的碎片散撒在你的脚边。<br/>
  我满载的一切古代战争的货物，<br/>
  都被笑浪颠簸。被眼泪浸透而下沉。<br/>
  你必须使这损失成为我的收获，我爱。<br/>
  如果我的死后不朽的荣名的希望都破灭了，<br/>
  那就在生前使我不朽吧。<br/>
  我将不为这损失伤心，也不责怪你。</p>
