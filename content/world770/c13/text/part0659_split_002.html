<h2 class="heading" id="calibre_pb_1">卡尔·费迪逊</h2>

  <p class="p">一位退休的氦气球售卖员。他把成千上万只彩色气球系到自家的房子上，让它们带着自己飞到了南美洲的丛林。一名叫小罗的小男孩一路上都跟着他，他还遇到了一只神秘大鸟和一条呆萌的金毛猎犬。一场奇妙的探险这就开始了。</p>
