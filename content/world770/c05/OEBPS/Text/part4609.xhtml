  <title>寻找上帝</title>

  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">寻找上帝</h1>

  <p>一次，两个人漫步在山谷之中。其中一个人指着山上说：“你看见那座禅房了吗？那里住着一个人，弃绝世间红尘已久。地上的东西，他一概不要，一心想找到上帝。”</p>

  <p>另一个人说：“他是找不到上帝的，除非他离开禅房，放弃孤独隐居，回到世间，与我们同乐共悲，在婚宴上与狂欢者一道起舞，在死者的灵柩旁随悲痛者一起挥泪。”</p>

  <p>前者从内心里相信此话有理，但他回答说：“我同意你的说法。但我相信那位修道士是个好人。一个好人离群索居的善举，不是比这些表面善良者的作为更有益得多吗？”</p>
