  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">To‑day or this noon</h2>

  <p class="EB03BodyTextIndented">To‑day or this noon</p>

  <p class="EB03BodyTextIndented">She dwelt so close,</p>

  <p class="EB03BodyTextIndented">I almost touched her;</p>

  <p class="EB03BodyTextIndented">Tonight she lies</p>

  <p class="EB03BodyTextIndented">Past neighborhood —</p>

  <p class="EB03BodyTextIndented">And bough and steeple —</p>

  <p class="EB03BodyTextIndented">Now past surmise.</p>
