  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">21</h1>

  <p class="kindle-cn-poem-left">他为什么特地来到我的门前，<br/>
  这年轻的游子，当天色黎明的时候？<br/>
  每次我进出经过他的身旁，我的眼睛总被他的面庞吸引。<br/>
  我不知道我是应该同他说话还是保持沉默。<br/>
  他为什么特地到我门前来呢？<br/>
  七月的阴夜是黑沉的；秋日的天空是浅蓝的；<br/>
  南风把春天吹得骀荡不宁。<br/>
  他每次用新调编着新歌。<br/>
  我放下活计眼里充满雾水。<br/>
  他为什么特地到我门前来呢？</p>
