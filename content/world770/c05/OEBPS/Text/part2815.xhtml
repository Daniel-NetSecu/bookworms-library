  <title>狗和狼</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">狗和狼</h1>

  <p>狗躺在农场大门口晒太阳，这时有一只狼扑过来，想要把狗吃掉。狗求狼饶他一命，说：“你看我现在多瘦啊，根本不够一餐饭，如果你愿意等几天，主人到时候会举办一个宴会，那些剩饭都会给我吃，等我长胖了，你再吃我多合适啊。”狼觉得这是个好主意，便同意了。过了些天，他又来到农场，看到狗在马厩的屋顶上，他根本够不着。他喊道：“下来让我把你吃掉吧，还记得我们的协议吗？”但是狗冷冷地说：“朋友，如果你下次再抓住我躺在大门边，千万不要再等什么宴会了。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：第一次被咬，第二次就会避开。</p>
</body></html>
