  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">148</h1>

  <p class="kindle-cn-poem-left1">哎呀，爱神赋予我什么眼力，<br/>
  竟让它反映不出真实景物？<br/>
  如果有，我的判断为何逃逸，<br/>
  总对所见的事物感知有误？<br/>
  如果我昏眼所见真具丰采，<br/>
  为何世人皆说它丑陋无伦？<br/>
  如果真丑，爱情显然在告白：<br/>
  爱神的眼光不如芸芸众生。<br/>
  哎呀，苦恼的爱眼彻夜无眠，<br/>
  经常流泪，又怎能观照真面？<br/>
  太阳自己况且天晴才开眼，<br/>
  就怪不得我总是李戴张冠。<br/>
  　　狡诈的爱用泪将我眼蒙蔽，<br/>
  　　就怕明眼将你的丑恶揭示。</p>
