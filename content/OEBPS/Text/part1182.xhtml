<h1 class="title1">内容简介</h1>
<p class="normaltext">音乐是从哪儿来的？是可以学会的吗？还是说，它仅仅是被赐予的才能，没有人知道它来自哪里？</p>
<p class="normaltext">这个故事里的小男孩在学校成绩不好，无论是语文还是数学他都不擅长。他喜欢和其他孩子一起唱歌，但是唱得并不出色。他第一次找工作就碰了壁。他是个好孩子，但没有什么特殊的才能。</p>
<p class="normaltext">然而有一天，他发现了一架钢琴。他还发现自己会弹钢琴。所以，或许我们可以说，不是他发现了音乐，而是音乐找到了他。</p>
