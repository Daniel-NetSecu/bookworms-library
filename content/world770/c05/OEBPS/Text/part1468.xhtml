  <h2 class="kindle-cn-heading2">25　千万别恋爱</h2>

  <p class="kindle-cn-signature">坎皮恩</p>

  <p class="kindle-cn-poem-left">千万别恋爱，除非<br/>
  你能忍受男人的坏。<br/>
  男人有时会十分忌妒，<br/>
  他的理由却难以立足。<br/>
  他不满时就把头翘得高高，<br/>
  将心中的悔恨直言相告。</p>

  <p class="kindle-cn-poem-left">男人只崇拜一位圣人，<br/>
  偏说自己爱着所有苍生。<br/>
  任何人都不可以轻视美，<br/>
  尽管美只为一人而存在。<br/>
  男人求婚不外乎逢场作戏，<br/>
  如意郎君说不定就是伪君子。</p>

  <p class="kindle-cn-poem-left">男人一旦有事要处理，<br/>
  一定会说告辞就告辞。<br/>
  有时去打猎，有时去放鹰，<br/>
  永远不会坐下与你谈心。<br/>
  如果这一切你都能忍受，<br/>
  就去恋爱吧，用不着发愁。</p>
