  <title>驴和货品</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">驴和货品</h1>

  <p>有一个小贩，他有一头驴。有一天他购进了一些盐，依据驴的负担能力，将最大量的盐放在了驴背上。回家路上，他们要涉过一条小溪，驴脚下不稳，摔进了水里。盐整个儿被水浸湿，大部分都溶化掉了，所以，驴重新站稳的时候，发现负担轻了好多。不过他的主人赶着他回了城里，又买了一些盐。小贩把盐放入箩筐，再度出发。他们一到小溪，驴就故意躺进溪水中，等起来时，和上次一样，负担又轻了许多。主人察觉到了他的把戏，于是赶着驴又回到了城里，这次买了好多海绵，放在了驴的背上。等他们第三次来到小溪，驴又故意躺下，而这次，海绵吸收了大量的水分，等驴站起来的时候，发现背上的负重增加了很多。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：便宜不要多占。</p>
</body></html>
