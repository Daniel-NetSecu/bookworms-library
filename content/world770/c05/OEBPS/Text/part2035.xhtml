  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">89</h1>

  <p class="kindle-cn-poem-left1">若说你离弃我，因我的罪尤，<br/>
  我愿意将此事交代个清楚；<br/>
  说我跛足，我即刻瘸着行走，<br/>
  你提出的理由，我决不辩护。<br/>
  我的爱啊，我明白你的用心：<br/>
  为变故找托词，你将我羞辱，<br/>
  此情难堪，不如我自辱其身！<br/>
  从今往后，你我将形同陌路，<br/>
  你去过的地方，我不会再去，<br/>
  你甜美的名字，不再挂嘴边，<br/>
  怕的是说多了会对它不利，<br/>
  无意间泄露了我们的旧情。<br/>
  　　为了你，我发誓向自己开战，<br/>
  　　你厌恨的人，都是我的敌顽。</p>
