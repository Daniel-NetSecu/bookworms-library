  <p class="p">最亲爱的读者：</p>

  <p class="calibre7">请允许我给你讲一个故事。故事发生已经有好多年了，但我却历历在目。不过，这也真没什么好奇怪的。因为我是一位仙女教母，仙女教母都有强大的记忆力(还有无与伦比的时尚品位)。多年来，我帮助过很多年轻人认识到梦想是可以实现的。我目睹过爱情之花盛开、成长；看到过英雄获得力量，铁石心肠的人找到灵魂。但这个故事比任何一个都能打动我的心。</p>

  <p class="calibre7">这个故事，像所有的好故事一样，开头是“很久以前……”</p>
