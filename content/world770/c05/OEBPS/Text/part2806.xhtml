  <title>牧羊人和狼</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">牧羊人和狼</h1>

  <p>一个牧羊人在草场中发现一只迷路的小狼，于是便将其带回家，和狗养在了一起。狼崽长大后，如果有狼来偷羊，他便和狗一起去攻击狼。有时候，狗追不上偷羊的贼，便放弃追逐回家。而那狼会自己继续追逐，等他追到偷羊贼，便会将其拦住，一起把偷到的羊分吃掉，然后再回去牧羊人的家。但是有时候，会有一段时间没有狼偷走羊，他便会自己偷上一只，和狗一起分吃。牧羊人渐渐起疑，有一天将狼当场抓住，用一根绳子拴住他的脖子，在离家最近的一棵树上吊死了他。</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：本性难移。</p>
</body></html>
