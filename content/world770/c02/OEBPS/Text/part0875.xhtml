  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">我知道他存在</h2>

  <p class="EB03BodyTextIndented">❧</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">我知道他存在</p>

  <p class="EB03BodyTextIndented">在某处，在沉默中。</p>

  <p class="EB03BodyTextIndented">从我们粗俗的眼前</p>

  <p class="EB03BodyTextIndented">他藏起了他珍稀的生命。</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">这片刻间的游戏，</p>

  <p class="EB03BodyTextIndented">这愚蠢的埋伏，</p>

  <p class="EB03BodyTextIndented">只是为了让喜乐</p>

  <p class="EB03BodyTextIndented">自己赢得惊讶！</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">可倘若这游戏</p>

  <p class="EB03BodyTextIndented">证实刺穿了最诚挚的心，</p>

  <p class="EB03BodyTextIndented">倘若欢喜在死亡</p>

  <p class="EB03BodyTextIndented">僵硬的凝视中呆滞，</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">难道那乐子</p>

  <p class="EB03BodyTextIndented">不是看来太过奢侈？</p>

  <p class="EB03BodyTextIndented">难道那玩笑</p>

  <p class="EB03BodyTextIndented">不是伸得太远？</p>
</body></html>
