  <title>熊和旅行者</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">熊和旅行者</h1>

  <p>有两个旅行者一起旅行，这时突然冒出来一只熊。熊还没有注意到他们，其中一个人就爬上了路边的树，钻进树枝里藏了起来。另一个人没有同伴那么敏捷，没有办法逃脱，便躺在地上装死。熊走了过来，在他身边闻来闻去，他一动不动，屏住呼吸，因为他听人说熊不会碰死尸。熊真的把他当成了尸体，于是就走开了。当危险解除后，树上藏着的那个人下来了，问同伴熊把嘴凑到他耳朵边到底跟他说了什么悄悄话。他的同伴回答说：“他告诉我，永远不要和一遇到危险就把你丢下的人一起上路。”</p>

  <p class="kindle-cn-para-2em-indent kindle-cn-kai">训诫：患难见真情。</p>
</body></html>
