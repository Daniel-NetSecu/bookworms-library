  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">73</h1>

  <p>在断念摒欲之中，我不需要拯救。</p>

  <p>在万千欢愉的约束里，我感到了自由的拥抱。</p>

  <p>你不断地在我的瓦罐里满满地斟上不同颜色、不同芬芳的新酒。</p>

  <p>我的世界，将以你的火焰点上他的万盏不同的明灯，</p>

  <p>安放在你庙宇的坛前。</p>

  <p>不，我永不会关上我感觉的门户。</p>

  <p>视、听、触的快乐会含带着你的快乐。</p>

  <p>是的，我的一切幻想会燃烧成快乐的光明，</p>

  <p>我的一切愿望将结成爱的果实。</p>
