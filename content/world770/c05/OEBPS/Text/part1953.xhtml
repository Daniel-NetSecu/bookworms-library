  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">7</h1>

  <p class="kindle-cn-poem-left1">看，高贵优雅的太阳在东方<br/>
  抬起火红的头颅，人间万民<br/>
  都膜拜这初生的万丈光芒，<br/>
  向这神圣的君主注目致敬。<br/>
  他像风华正茂的健硕少年<br/>
  登上高耸入云的险峻山峰；<br/>
  世人始终仰慕他的美，甘愿<br/>
  在金色的旅途中为之侍奉。<br/>
  但他驾着车也会衰老、疲倦，<br/>
  从最高处跌落，并退出白昼；<br/>
  那时人的眼睛会转移视线，<br/>
  向他处将目击的标靶寻求。<br/>
  　　你如今犹如那当空的丽日，<br/>
  　　死时无人顾，除非留下后裔。</p>
