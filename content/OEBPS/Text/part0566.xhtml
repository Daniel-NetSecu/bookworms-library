<p class="title1">8．甜蜜的微笑</p>
<p class="normaltext">尼克乘当晚的渡轮回温哥华。他又累又饿，于是去渡轮的餐厅吃晚餐。</p>
<p class="picture"><img src="../Images/image07136.jpeg" alt="alt"/></p>
<p class="normaltext">餐厅里人很多，只有一张餐桌空着。尼克马上坐下，吃起东西来。“我明天必须重新开始工作了，”他想，“别去想什么百万富翁的女儿还有带枪的男子了。”</p>
<p class="normaltext">“对不起，”有人说话，“可以坐在你这儿吗？”</p>
<p class="normaltext">尼克抬起头。餐桌旁边站着一个漂亮的女孩儿。他站起身来。</p>
<p class="normaltext">“可——可以，”他答道，“你可以用这张桌子，我不用了。”他说着就准备离开。</p>
<p class="normaltext">“请不要走呀，”女孩儿说，“在这儿吃完你的晚餐呀。”她冲她微笑着。一个很甜蜜的微笑。</p>
<p class="normaltext">可尼克对甜蜜的微笑太了解了。</p>
<p class="normaltext">“我不饿了。”他说道。</p>
<p class="normaltext">接着他便迅速离开了餐厅。</p>
