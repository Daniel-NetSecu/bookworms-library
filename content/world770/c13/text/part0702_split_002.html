<h2 class="heading" id="calibre_pb_1">闪电麦坤</h2>

  <p class="p">闪电麦坤是一辆由保险杠除锈灵赞助的红色赛车。故事开始，麦坤对周围的人很不友好，不受同伴们欢迎。在去往加利福尼亚参加殊死赛的途中，麦坤却意外迷路，他闯入水箱温泉镇，无意把小镇的主干道破坏了。小镇的警长拘留了他，并罚他修好路才能离开。在小镇的这段时间，他和小镇居民成为好朋友，开始学会关心他人。重回比赛后，麦坤放弃了夺得活塞杯的机会，帮助受伤的车王完成了比赛。</p>
