  <h2 class="kindle-cn-heading2">126　新英格兰</h2>

  <p class="kindle-cn-signature">罗宾逊</p>

  <p class="kindle-cn-poem-left">这里总吹着北风或东北风，<br/>
  小孩迈着冻僵的脚蹒跚学步，<br/>
  奇迹的创造总受人妒忌，<br/>
  他们吵吵嚷嚷，张扬爱的激情，<br/>
  宴席上听到的只有他们的声音，<br/>
  连魔鬼也得求他们保持安静，<br/>
  但他们我行我素，根本静不下来，<br/>
  喝得微醉的那几位吵得最厉害。</p>

  <p class="kindle-cn-poem-left">热情在这里是智慧的污点，<br/>
  我们听说，爱情是他们的十字架，<br/>
  欢乐在她的编织处瑟瑟发抖，<br/>
  天良一直坐在一把安乐椅里，<br/>
  折磨得晕厥，依然欢天喜地，<br/>
  她是第一只猫，被忧愁杀死。</p>
