<p class="title1">内容简介</p>
<p class="normaltext">他们生活中的变化发生得异常突然。此刻，他们还生活在一个幸福的家庭里，要什么有什么。瞬间之后，爸爸就被迫离开——“出差去了”，妈妈是这么讲的。但是她脸色苍白，孩子们明白这是个坏消息。他们不得不离开了他们在伦敦的那个舒适的家，住到了乡下的一座小房子里。现在他们是穷人了，妈妈说。虽然她竭力想让自己的声音听起来高兴一些，无奈双眼中却充满了伤感与忧虑。</p>
<p class="normaltext">罗伯塔、彼得和菲利斯也为他们的爸爸担心，但谁都不能一直那么伤感。新生活开始了，处处都充满新奇的冒险。从他们的新家往山下走，有一条铁路，耀眼明亮的铁轨通向伦敦；还有穿山隧道那黑洞洞的大口，在那里火车从黑暗中呼啸而出，就像体型庞大的野兽……</p>
