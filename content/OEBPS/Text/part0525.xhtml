<p class="title1">内容简介</p>
<p class="normaltext">阿拉丁是一个懒惰的孩子。他不喜欢劳动，成天和朋友们在市场上玩耍。他和母亲都很穷，经常挨饿。但阿拉丁从来都不工作，也不帮助他的母亲。</p>
<p class="normaltext">有一天，阿拉丁的叔叔阿巴那扎尔来到这个城市。“我很有钱。”他跟阿拉丁和他母亲说。他给了他们一些金子，给阿拉丁买了一件漂亮的新外套，还说想继续帮助他们。阿拉丁非常高兴。</p>
<p class="normaltext">但其实阿巴那扎尔并不是阿拉丁的叔叔。他是来自摩洛哥的一位魔法师，他想找到一盏神灯。他知道那盏灯在一个阿拉伯城市附近的一座神奇的地下花园里，只有这个城市里的一个穷孩子能进入花园找到那盏神灯，这个男孩的名字叫阿拉丁。</p>
