  <title>他想要天国的衣裳</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">他想要天国的衣裳</h2>

  <p class="EB03BodyTextIndented">如果我有天国的绣衣，</p>

  <p class="EB03BodyTextIndented">织着金色和银色的光，</p>

  <p class="EB03BodyTextIndented">这蓝色、灰色和黑色的衣服</p>

  <p class="EB03BodyTextIndented">属于夜、白昼和黄昏，</p>

  <p class="EB03BodyTextIndented">我会将这衣裳铺展在你脚下。</p>

  <p class="EB03BodyTextIndented">但我，贫穷，只拥有我的梦；</p>

  <p class="EB03BodyTextIndented">我把我的梦铺展在你脚下；</p>

  <p class="EB03BodyTextIndented">要轻柔地踩，因为你踩在我的梦上。</p>
</body></html>
