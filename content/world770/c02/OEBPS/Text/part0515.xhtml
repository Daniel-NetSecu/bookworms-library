  <title>爱尔兰飞行员预见他的死亡</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <h2 class="EB04MainHeadClosedTitle">爱尔兰飞行员预见他的死亡</h2>

  <p class="EB03BodyTextIndented">我知道我将遇见我的命运</p>

  <p class="EB03BodyTextIndented">在这上方的云朵之间；</p>

  <p class="EB03BodyTextIndented">我所对抗的，我并不憎恨，</p>

  <p class="EB03BodyTextIndented">我所守卫的，我并不爱；</p>

  <p class="EB03BodyTextIndented">我的故乡是基尔塔坦岔口，</p>

  <p class="EB03BodyTextIndented">我的乡亲是基尔塔坦的穷人，</p>

  <p class="EB03BodyTextIndented">任何结局都不会让他们失去什么，</p>

  <p class="EB03BodyTextIndented">或者，让他们比以往更幸福。</p>

  <p class="EB03BodyTextIndented">不是法律也不是职责令我战斗，</p>

  <p class="EB03BodyTextIndented">不是公众人物，也不是欢呼的民众，</p>

  <p class="EB03BodyTextIndented">而是孤独的愉悦的冲动</p>

  <p class="EB03BodyTextIndented">驱使我进入这云间的骚乱；</p>

  <p class="EB03BodyTextIndented">我权衡一切，思考所有，</p>

  <p class="EB03BodyTextIndented">未来的年岁似乎是浪费生命，</p>

  <p class="EB03BodyTextIndented">而身后的年岁也是浪费生命，</p>

  <p class="EB03BodyTextIndented">就在这生与死的平衡里。</p>
</body></html>
