  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">94</h1>

  <p class="kindle-cn-poem-left1">有些人能害人，但不去害人，<br/>
  得心应手的事，他们偏不做；<br/>
  感化别人，自己磐石般坚定，<br/>
  沉稳、冷峻，从不轻易受诱惑。<br/>
  他们真正得到上天的隆恩，<br/>
  知道节俭享用造化的厚礼，<br/>
  他们是自己的容貌的主人；<br/>
  其他人只配做才德的奴隶。<br/>
  夏日的鲜花向着太阳争艳，<br/>
  它的一枯一荣，全凭着天意，<br/>
  一旦这鲜花遭受恶疾感染，<br/>
  最低贱的野草也比它优异。<br/>
  　　不端的行为，让香花也变臭，<br/>
  　　腐烂的百合花，比野草更丑。</p>
