  <h1 class="bodycontent-first-title">二十三</h1>

  <p class="bodycontent-text">“你好！”小王子问候说。</p>

  <p class="bodycontent-text">“你好！”商人答道。</p>

  <p class="bodycontent-text">这个商人专门出售一种生津解渴的改良药丸。每个星期吞服一粒，就不会感到口渴。</p>

  <div class="tupian"><img alt="" class="image-alone" src="../Images/image24320.jpeg.webp"/></div>

  <p class="bodycontent-text">“你卖这东西干什么呢？”小王子问。</p>

  <p class="bodycontent-text">“服用这种药，可以大大地节省时间，”商人说，“据专家测算，每个星期可以省出五十三分钟。”</p>

  <p class="bodycontent-text">“那么，拿这五十三分钟干什么呀？”</p>

  <p class="bodycontent-text">“干自己想干的事呗……”</p>

  <p class="bodycontent-text">“要是我呀，”小王子自言自语说，“我如果有五十三分钟可以随意支配，那我一定慢慢地朝一口水井走去……”</p>
