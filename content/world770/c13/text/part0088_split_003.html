  <h3 class="heading3">Personality　性格</h3>

  <p class="p">Olaf is the first snowman Elsa ever created. He is all about embracing life — a curious and trusting misfit with a big heart.</p>

  <p class="p">雪宝是艾莎创造的第一个雪人。他尽情拥抱生活，对凡事都很好奇，轻信他人，心胸宽广，是个行为怪异的人。</p>
