  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">26</h1>

  <p class="kindle-cn-poem-left1">我的爱情之主啊，你的美德<br/>
  值得我对你效忠，尽心尽力，<br/>
  我因此派出这书写的使者，<br/>
  为见证忠诚，不为炫耀才智。<br/>
  忠诚如此强大，我孤陋寡闻，<br/>
  文笔拙劣，使忠诚不能彰显，<br/>
  但我仍希望你怀一片善心，<br/>
  凭赤诚的灵魂收下这诗篇，<br/>
  直到有星宿引导我的命数，<br/>
  为我慷慨昭示吉祥的面颜，<br/>
  并给我褴褛的爱披上华服，<br/>
  使我配受你那甜美的礼赞。<br/>
  　　那时我才敢夸口我多么爱你，<br/>
  　　并接受你的考验，肝脑涂地。</p>
