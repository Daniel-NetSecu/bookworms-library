  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">53</h1>

  <p>你的手镯真是美丽，镶着星辰，精巧地嵌着五光十色的珠宝。</p>

  <p>但是依我看来你的宝剑是更美的，</p>

  <p>那弯弯的闪光像毗湿奴的神鸟展开的翅翼，</p>

  <p>完美地平悬在落日怒发的红光里。</p>

  <p>它颤抖着，像生命受死亡的最后一击时，</p>

  <p>在痛苦的昏迷中的最后反应；</p>

  <p>它炫耀着，像将尽的世情的纯焰，最后猛烈地一闪。</p>

  <p>你的手镯真是美丽，镶着星辰般的珠宝；</p>

  <p>但是你的宝剑，</p>

  <p>啊，雷霆的主，是铸得绝顶美丽，</p>

  <p>看到想到都是可畏的。</p>
