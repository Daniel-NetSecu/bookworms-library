<h2 class="heading" id="calibre_pb_1">阿乐</h2>

  <p class="p">阿乐是雷龙一家最小的孩子，性格胆小。父亲的离去让他很是自责，他想证明自己。一天，他开启了一段惊心动魄的冒险历程，结识了穴居人类小男孩，与他成为朋友。最终，他克服了心中的恐惧，完成了自我的蜕变。</p>
