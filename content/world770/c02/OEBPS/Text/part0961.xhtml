  <h2 class="EB04MainHeadClosedTitle-1" data-AmznRemoved-M8="true" data-AmznRemoved="mobi7">Longing is like the seed</h2>

  <p class="EB03BodyTextIndented">Longing is like the seed</p>

  <p class="EB03BodyTextIndented">That wrestles in the ground,</p>

  <p class="EB03BodyTextIndented">Believing if it intercede</p>

  <p class="EB03BodyTextIndented">It shall at length be found.</p>

  <p class="EB03BodyTextIndented"><br/></p>

  <p class="EB03BodyTextIndented">The hour and the zone</p>

  <p class="EB03BodyTextIndented">Each circumstance unknown,</p>

  <p class="EB03BodyTextIndented">What constancy must be achieved</p>

  <p class="EB03BodyTextIndented">Before it see the sun!</p>
