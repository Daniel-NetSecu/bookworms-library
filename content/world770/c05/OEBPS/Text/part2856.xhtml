  <title>吝啬鬼</title>
<style type="text/css">html{background:#fffcf5!important}body{max-width:850px!important;margin:24px auto!important;padding:0 18px 50px!important;line-height:1.9!important;color:#242e2b!important;font-size:19px!important}img,svg{max-width:100%!important;height:auto!important}table{max-width:100%!important}*{overflow-wrap:break-word}</style></head><body>
  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">吝啬鬼</h1>

  <p>有一个吝啬鬼，把他的东西都给卖掉了，把囤积起来的金子铸成了一大块，偷偷地埋在了一块地里。每天，他都要过去看看，有时候会在自己的财产边一待老半天。他的一个仆人注意到他经常去那个地方，有一天便偷偷地跟踪他，发现了这个秘密。他等待时机，一天晚上过去挖出了金子偷走了。第二天，吝啬鬼又去了，却发现自己的财宝不见了，他跪在地上扯着头发，哀号不止。他的一个邻居看到了，问他到底怎么了。吝啬鬼把遭遇告诉了邻居，邻居却回答说：“别太放在心上，我的朋友，在那洞里放块砖，每天过来看看，你的日子就和过去一样了，金子在你手里，你也没有什么用处的。”</p>
