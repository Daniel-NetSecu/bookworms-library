<h1 class="calibre22" id="calibre_pb_287">第八十五节</h1>

      <p class="x5">投资于土地的货币，其产出必然是最少的。</p>

      <p class="x6">一个人如果用货币购买土地并把土地租给一个有偿付能力的佃农，他就可以毫不费力地获得一份收入，而且可以随心所欲地花掉它。购买这类财产比购买其他财产有更大的好处，因为拥有土地能更好地预防意外情况的发生。所以，我们必须用更高的价格获得一份土地收入，并且必须对于同等资本所获得的较少的收入感到满足。</p><a id="Section_cn_86"></a>
