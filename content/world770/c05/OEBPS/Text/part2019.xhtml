  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">73</h1>

  <p class="kindle-cn-poem-left1">你从我身上能见到这秋色：<br/>
  枯黄的树叶只剩寥寥数片，<br/>
  顶着寒风，在枝头抖抖瑟瑟，<br/>
  鸟儿的唱诗班已一片寂然。<br/>
  你从我身上能见到这黄昏：<br/>
  夕阳已经沉入西边的天际，<br/>
  黑夜——死亡的化身随即降临，<br/>
  将万物一一封存，归于沉寂。<br/>
  你从我身上能见到这火光：<br/>
  它就躺卧在青春的灰烬上，<br/>
  已经奄奄一息，苟喘于灵床，<br/>
  必将与它的燃料一起消亡。<br/>
  　　认清这一切，你的爱更坚定，<br/>
  　　你会更爱不久人世的爱人。</p>
