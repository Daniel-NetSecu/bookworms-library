  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">32</h1>

  <p class="kindle-cn-poem-left1">如果我一如所愿，先你而亡，<br/>
  死神用黄土埋起我的骸骨，<br/>
  如果你偶尔重读这些诗行——<br/>
  你已故的知友留下的微著，<br/>
  请拿它与当代的雄文比较：<br/>
  尽管每支笔都写得更精彩，<br/>
  比我幸福的人，诗艺更高超，<br/>
  但你得保存我的诗，为了爱。<br/>
  哦，请你为了我这样去思量：<br/>
  “只要我爱友与时代同呼吸，<br/>
  他一样能写出华美的诗章，<br/>
  从而与诗界英才走在一起。<br/>
  　　如今他已死，诗艺不断精进，<br/>
  　　我读别人的文，读他的爱心。”</p>
