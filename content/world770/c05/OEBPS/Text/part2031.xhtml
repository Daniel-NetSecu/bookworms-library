  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">85</h1>

  <p class="kindle-cn-poem-left1">我的缪斯有礼貌，缄口无语，<br/>
  其他的诗人无不搜索枯肠<br/>
  用尽华美的词语将你赞许，<br/>
  他们的缪斯都在一旁帮腔。<br/>
  我有好思想，他们有好言词；<br/>
  生花的妙笔写出篇篇颂文<br/>
  闪耀着金光，而我像傻牧师，<br/>
  只懂得附和，一口一个“阿门！”<br/>
  见别人称赞你，我连连称是，<br/>
  并不断为你喝彩，为你叫好——<br/>
  但这都是我的思想，它爱你，<br/>
  虽然言之为迟，思之却最早。<br/>
  　　对别人，请留意他们的言辞，<br/>
  　　对于我，得审察无言的沉思。</p>
