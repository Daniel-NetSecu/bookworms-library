  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-2">第二十四章　回到家乡</h1>

  <p>艾姆婶婶这时恰好走出房子，来给卷心菜浇水，她抬头看见多萝西朝自己跑来。</p>

  <p>“我亲爱的孩子！”她叫喊着，把小姑娘搂在怀中一个劲儿地亲吻，“你到底去哪儿了？”</p>

  <p>“去奥兹国了，”多萝西郑重地说，“还有托托。噢，艾姆婶婶！回到家里，我真是太高兴了！”</p>
