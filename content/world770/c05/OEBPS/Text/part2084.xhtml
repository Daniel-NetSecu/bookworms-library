  <div style="page-break-after:always"></div><h1 class="kindle-cn-heading-1">138</h1>

  <p class="kindle-cn-poem-left1">当我的爱人发誓说她忠贞，<br/>
  我相信她，虽然明知她说谎，<br/>
  她也许当我是青涩的后生，<br/>
  对人间的虚伪全不知设防。<br/>
  我也将错就错，当自己年轻，<br/>
  对她说谎的舌根表示信任，<br/>
  虽然她清楚：我早过了盛春；<br/>
  就这样，双方都隐瞒着真情。<br/>
  为什么她不说她虚情假意？<br/>
  为什么我不说我业已老迈？<br/>
  哟，爱的惯例就是逢场作戏，<br/>
  恋爱的人都不愿年纪公开。<br/>
  　　就这样，我欺骗她，她欺骗我，<br/>
  　　我们的缺陷在奉承中瞒过。</p>
